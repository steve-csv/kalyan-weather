# Runs the forecasting agent in the cloud and publishes the result.
#
# WHY THIS EXISTS
# ---------------
# The 06:15 scheduled task on the laptop only fires when the laptop is awake.
# This runs on GitHub's machines instead, so the public page keeps updating
# whether the laptop is on, asleep, or in another country.
#
# It also gives the website an Update button that actually does something: the
# `workflow_dispatch` trigger below is what the button on the page links to.
# A button on a static host cannot run Python, but it can send you to the one
# screen where you press Run - which works fine from a phone.
#
# No secrets are needed. Every number comes from Open-Meteo, which is keyless,
# and the Windy map key is deliberately stripped from the public build.

name: Forecast update

on:
  # 00:45 UTC = 06:15 IST, matching the local scheduled task it replaces.
  schedule:
    - cron: "45 0 * * *"
  # This is the Update button's target.
  workflow_dispatch:
  # Rebuild when the agent itself changes, so a code change reaches the public
  # page without waiting for tomorrow morning. Deliberately scoped: pushes that
  # only touch docs/ must not retrigger this, or the job's own commit would
  # start the next run. (GitHub already suppresses that loop for commits made
  # with the default token, but the path filter makes it true by construction
  # rather than by relying on that behaviour.)
  push:
    paths:
      - "wxagent/**"
      - ".github/workflows/forecast.yml"

# The job commits the rebuilt pages back to the repository, so it needs write
# access to contents. Nothing else.
permissions:
  contents: write

concurrency:
  # A second run started while one is mid-publish would race on the same
  # commit. Queue instead, and never cancel a run that may already have
  # committed.
  group: forecast-publish
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    # Generous, because the FIRST run on a cold cache has to download ten
    # years of ERA5 climate normals for every thermal site. Once the cache
    # below is populated a normal run is a couple of minutes; the per-step
    # limits further down are what catch a genuine hang.
    timeout-minutes: 30
    env:
      # Bulletins are stamped in local time; without this the runner would
      # write UTC and every timestamp on the page would read 5.5 hours early.
      TZ: Asia/Kolkata

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # The agent is standard library only - there is nothing to install.

      # .cache/ holds the ERA5 climate normals (ten years per site, fetched
      # from the slow archive API) and the oscillation downloads. On the
      # laptop these accumulate and every run after the first is quick. A
      # fresh runner starts empty, so the weekly outlook was re-downloading
      # normals for every thermal site and running past the job timeout -
      # which is why the first three runs were cancelled while the daily step
      # beside them, needing only one site's normals, passed fine.
      - name: Restore the climate-normals cache
        uses: actions/cache@v4
        with:
          path: .cache
          key: wx-cache-${{ github.run_id }}
          restore-keys: |
            wx-cache-

      # Progress output is left on: when a step does hang, the log has to show
      # which fetch it hung on, and --quiet would hide exactly that.
      - name: Build the Kalyan West daily bulletin
        timeout-minutes: 8
        run: python -u -m wxagent daily --no-notify

      - name: Build the Mumbai MMR weekly outlook
        timeout-minutes: 12
        run: python -u -m wxagent weekly

      - name: Publish to GitHub Pages
        timeout-minutes: 4
        run: |
          git config user.name  "kalyan-weather bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          python -m wxagent gh-publish

      - name: Report what happened
        if: always()
        run: |
          # No unquoted globs inside [ ]: with several matching bulletins the
          # test expands to `[ -f a b c ]`, which is a syntax error and would
          # fail the job at the very last step, after a successful publish.
          {
            echo "### Forecast update"
            echo ""
            latest=$(ls -1t forecasts/*_kalyan_west.md 2>/dev/null | head -1 || true)
            if [ -n "$latest" ]; then
              echo "Bulletin: \`$latest\`"
            else
              echo "No bulletin file was produced."
            fi
            echo ""
            git log -1 --format='Published: %s (%ci)'
          } >> "$GITHUB_STEP_SUMMARY"
