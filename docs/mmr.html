<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mumbai MMR — week ahead</title>
<style>
:root{
  color-scheme: light;
  /* Neutrals are cool with a slate-green cast rather than the warm sand this
     page used to carry. The subject is a monsoon instrument, so the ground
     reads like wet slate and the accents each do one job: marine for rain,
     fern for dry-and-correct, ochre for sun-and-caution, brick for severe.
     Nothing here is a decorative colour - if a mark is coloured, the colour
     means something. */
  --marine:#1e6fa8; --fern:#2f7d57; --ochre:#b5860b; --brick:#a83e2c;
  --ease:cubic-bezier(.22,.61,.36,1);
  --surface-1:#fbfcfc; --plane:#f1f4f3;
  --text-primary:#0e1518; --text-secondary:#42545a;
  /* Measured, not eyeballed: at #75868b this failed WCAG AA against the
     card (3.3:1) and it is used for real label text, not just rules. */
  --muted:#5e7176;
  --grid:#dde5e3; --axis:#b7c5c4; --border:rgba(14,21,24,0.11);
  --series-1:#1e6fa8;
  /* Ordinal ramp, light surface: progressively DARKER as the value grows.
     All five steps are declared - a missing custom property resolves to
     nothing and the mark renders black, which is how two donut slices came
     out solid black on the first build. */
  --seq-100:#d6e7f2; --seq-250:#a3c9e0; --seq-350:#74abd0;
  --seq-400:#4f92c1; --seq-450:#2f7fb2; --seq-550:#1e6fa8; --seq-650:#124d78;
  --good:#2f7d57; --warning:#b5860b; --serious:#c2662f; --critical:#a83e2c;
  --radius:13px;
}
@media (prefers-color-scheme: dark){
  :root:where(:not([data-theme="light"])){
    color-scheme: dark;
    --marine:#5aa6db; --fern:#57b183; --ochre:#d8ab41; --brick:#d4705c;
    --surface-1:#151d20; --plane:#0c1315;
    --text-primary:#e8efee; --text-secondary:#a6b8bb; --muted:#7c9095;
    --grid:#222e32; --axis:#33434a; --border:rgba(232,239,238,0.13);
    --series-1:#5aa6db;
    --good:#57b183; --warning:#d8ab41; --serious:#dc8b57; --critical:#d4705c;
    /* Same ramp stepped for the dark surface: progressively LIGHTER as the
       value grows, so magnitude still reads as "more ink against the page". */
    --seq-100:#123f63; --seq-250:#1a5480; --seq-350:#236c9f;
    --seq-400:#2e85bd; --seq-450:#469cd2; --seq-550:#6db4e0; --seq-650:#9dcdec;
  }
}
:root[data-theme="dark"]{
  color-scheme: dark;
  --marine:#5aa6db; --fern:#57b183; --ochre:#d8ab41; --brick:#d4705c;
  --surface-1:#151d20; --plane:#0c1315;
  --text-primary:#e8efee; --text-secondary:#a6b8bb; --muted:#7c9095;
  --grid:#222e32; --axis:#33434a; --border:rgba(232,239,238,0.13);
  --series-1:#5aa6db;
  --good:#57b183; --warning:#d8ab41; --serious:#dc8b57; --critical:#d4705c;
  --seq-100:#123f63; --seq-250:#1a5480; --seq-350:#236c9f;
  --seq-400:#2e85bd; --seq-450:#469cd2; --seq-550:#6db4e0; --seq-650:#9dcdec;
}

/* Motion: one easing curve for the whole page, and a single global stop.
   Scattered durations and mismatched curves are most of what makes a page
   feel improvised rather than made. */
@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{
    animation-duration:.001ms !important; animation-iteration-count:1 !important;
    transition-duration:.001ms !important; scroll-behavior:auto !important;
  }
}

/* ---- weather mood -------------------------------------------------------
   The page takes a tint from the day being forecast: warm and bright when it
   is dry, progressively cooler and greyer as the rain gets heavier.

   The tint is applied to the PAGE PLANE only - never to the chart surface or
   to any mark. Charts keep their validated palette against an unchanged
   surface, so tinting the page cannot quietly break a contrast ratio. It is
   also kept low-saturation: this is a forecast people read in a hurry, not a
   mood board, and a strong wash would fight the data. */
/* A restrained slate-blue range rather than saturated weather colours. The
   page plane shifts through cool greys as the rain gets heavier, and --mood
   (the accent used on headings, the hero figure and the sky) is a muted
   steel blue rather than a vivid one. --sky tints the animated layer.
   Saturation is kept low deliberately: this sits behind a page of numbers,
   and a strong wash competes with the data it is meant to frame. */
/* Weather-reactive colour. The page is a GRADIENT sky rather than a flat
   fill - that is what makes it read as weather instead of a tinted document.
   Cards keep their own near-neutral surface on top, so the colour underneath
   can be bold without touching the contrast of any text or chart. */
:root[data-wx="sunny"]  { --plane:#f6f1e2; --g1:#faf6ec; --g2:#eee2c6;
                          --mood:#d98416; --sky:#ffb545; }
:root[data-wx="light"]  { --plane:#e6eef3; --g1:#f0f5f8; --g2:#d3e2ec;
                          --mood:#1f79c9; --sky:#5fb0ea; }
:root[data-wx="wet"]    { --plane:#dde8f0; --g1:#e9f0f5; --g2:#c6d9e6;
                          --mood:#15629f; --sky:#3d8fcc; }
:root[data-wx="heavy"]  { --plane:#d0dce7; --g1:#dde6ee; --g2:#b4c6d7;
                          --mood:#0f4b86; --sky:#2f6ba6; }
:root[data-wx="severe"] { --plane:#d5cfd6; --g1:#e1dce2; --g2:#bfb5c4;
                          --mood:#8c2f4a; --sky:#6a4470; }

@media (prefers-color-scheme: dark){
  :root:where(:not([data-theme="light"]))[data-wx="sunny"]  { --plane:#20180a; --g1:#2c2110; --g2:#120d05; --mood:#e8a33c; --sky:#c07d22; }
  :root:where(:not([data-theme="light"]))[data-wx="light"]  { --plane:#0d1c2e; --g1:#12283f; --g2:#07111c; --mood:#4aa3e8; --sky:#2f7cb8; }
  :root:where(:not([data-theme="light"]))[data-wx="wet"]    { --plane:#0a1e33; --g1:#0f2b47; --g2:#050f1a; --mood:#3f97dd; --sky:#2a6f9f; }
  :root:where(:not([data-theme="light"]))[data-wx="heavy"]  { --plane:#0b1c33; --g1:#13294a; --g2:#040b16; --mood:#5b9ede; --sky:#2b5f96; }
  :root:where(:not([data-theme="light"]))[data-wx="severe"] { --plane:#241026; --g1:#33163a; --g2:#120612; --mood:#e05c7e; --sky:#8a4a86; }
}
:root[data-theme="dark"][data-wx="sunny"]  { --plane:#20180a; --g1:#2c2110; --g2:#120d05; --mood:#e8a33c; --sky:#c07d22; }
:root[data-theme="dark"][data-wx="light"]  { --plane:#0d1c2e; --g1:#12283f; --g2:#07111c; --mood:#4aa3e8; --sky:#2f7cb8; }
:root[data-theme="dark"][data-wx="wet"]    { --plane:#0a1e33; --g1:#0f2b47; --g2:#050f1a; --mood:#3f97dd; --sky:#2a6f9f; }
:root[data-theme="dark"][data-wx="heavy"]  { --plane:#0b1c33; --g1:#13294a; --g2:#040b16; --mood:#5b9ede; --sky:#2b5f96; }
:root[data-theme="dark"][data-wx="severe"] { --plane:#241026; --g1:#33163a; --g2:#120612; --mood:#e05c7e; --sky:#8a4a86; }

*{box-sizing:border-box}
body{
  margin:0; color:var(--text-primary);
  font:15px/1.62 ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,
       "Helvetica Neue",Arial,sans-serif;
  -webkit-font-smoothing:antialiased; text-rendering:optimizeLegibility;
  padding:0 0 72px;
  /* Sky gradient: light at the horizon, deeper overhead. `fixed` keeps it
     still while the content scrolls, so it behaves like a sky rather than a
     long painted strip. --plane remains the flat fallback and is what the
     translucent header mixes against. */
  background:var(--plane);
  background-image:linear-gradient(180deg,var(--g2) 0%,var(--g1) 46%,var(--plane) 100%);
  background-attachment:fixed;
  transition:background-color .7s var(--ease);
}
.wrap{max-width:1080px;margin:0 auto;padding:0 16px}

/* Keyboard focus. Every interactive thing on this page was reachable by tab
   and invisible while focused, which makes it unusable without a mouse. One
   ring, in the accent, on the token system so it works on both grounds. */
:where(a,button,[tabindex]):focus-visible{
  outline:2px solid var(--series-1); outline-offset:2px; border-radius:8px;
}
.navbtn,.tabs button,.sk-chip{transition:color .18s var(--ease),
  background-color .18s var(--ease),border-color .18s var(--ease)}

/* ---- animated weather scene ------------------------------------------
   Drawn in CSS against the page, behind the content, so it costs no network
   request and cannot be blocked by a CSP. It sits at low opacity and never
   takes pointer events - the forecast has to stay readable over it.
   Everything here is disabled under prefers-reduced-motion: a full-screen
   field of falling streaks is a genuine vestibular problem for some readers,
   and the page must work without it. */
.sky{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}
.sky>*{position:absolute}

/* Sun: a disc with a slowly turning ray corona, not a blurred blob. */
.sunwrap{top:-60px;right:-30px;width:330px;height:330px;opacity:.95}
.sunwrap .glow{position:absolute;inset:-40%;border-radius:50%;
  background:radial-gradient(circle,var(--sky) 0%,transparent 58%);
  opacity:.55;animation:sunpulse 11s ease-in-out infinite}
.sunwrap svg{position:absolute;inset:0;width:100%;height:100%;
  color:var(--sky);animation:spin 140s linear infinite}
@keyframes sunpulse{0%,100%{transform:scale(1);opacity:.55}
                    50%{transform:scale(1.06);opacity:.75}}
@keyframes spin{to{transform:rotate(360deg)}}

/* Clouds: actual silhouettes, drawn as overlapping lobes in SVG. */
.cloud{animation:drift linear infinite;color:var(--sky)}
.cloud svg{display:block;width:100%;height:auto}
@keyframes drift{from{transform:translateX(-38vw)}to{transform:translateX(138vw)}}

.rainlayer{inset:0;opacity:0}
.rainlayer i{position:absolute;top:-14%;width:1.4px;border-radius:1px;
  background:linear-gradient(to bottom,transparent,var(--sky));
  animation:fall linear infinite}
@keyframes fall{to{transform:translateY(118vh)}}

.flash{inset:0;background:#fff;opacity:0}
.flash.on{animation:zap 1.5s ease-out}
@keyframes zap{0%{opacity:0}4%{opacity:.30}9%{opacity:0}
               14%{opacity:.18}20%{opacity:0}100%{opacity:0}}

@media (prefers-reduced-motion: reduce){
  .sun,.cloud,.rainlayer i,.flash{animation:none!important}
  .rainlayer{display:none}
}

/* ---- app shell -------------------------------------------------------- */
header{
  position:sticky;top:0;z-index:20;
  background:color-mix(in srgb,var(--plane) 88%,transparent);
  backdrop-filter:saturate(1.4) blur(12px);
  -webkit-backdrop-filter:saturate(1.4) blur(12px);
  border-bottom:2px solid var(--mood);
  padding:14px 16px;margin:0 0 18px;
  display:flex;justify-content:space-between;align-items:center;gap:14px;
  flex-wrap:wrap;
}
.hero .fig{color:var(--mood)}

/* Cards float above the coloured sky. A slightly translucent surface lets a
   hint of the weather colour through while keeping text on a near-neutral
   background, so contrast never depends on the mood. */
.card,.skoda,.rbar{position:relative;z-index:1}
.card,.skoda{
  box-shadow:0 1px 2px rgba(0,0,0,.06),0 14px 34px -22px rgba(0,0,0,.5);
}
.skoda{background:color-mix(in srgb, var(--surface-1) 92%, var(--mood))}
.card>h2:first-child{
  display:flex;align-items:center;gap:9px;
}
.card>h2:first-child::before{
  content:'';width:3px;height:16px;border-radius:2px;background:var(--mood);
  flex:none;
}
.wrap{max-width:1080px;margin:0 auto}
/* One type scale, used everywhere: 11.5 / 12.5 / 13.5 / 15 / 17 / 22 / 27.
   Display sizes get negative tracking because system grotesques set loose at
   large sizes; small labels get positive tracking for the opposite reason. */
h1{font-size:26px;margin:0 0 3px;font-weight:660;letter-spacing:-0.022em;
   line-height:1.16;text-wrap:balance}
h2{font-size:17px;margin:0 0 14px;font-weight:640;letter-spacing:-0.014em;
   line-height:1.3;text-wrap:balance}
h3{font-size:13.5px;margin:0 0 9px;font-weight:660;letter-spacing:-0.004em}
p{text-wrap:pretty}
.sub{color:var(--text-secondary);font-size:13px;margin:0;line-height:1.55}

/* Figures line up in columns all over this page - totals, rain rates, scores.
   Proportional digits make those columns ragged, so every numeric surface
   gets tabular figures. */
.tile .val,.dval,.tstat b,.sval,.uval,.tlab,.hero .fig,td,th,
.belt .bsent,.rcard li,.tick{font-variant-numeric:tabular-nums}

/* Small caps-style labels need air between letters to stay legible. */
.dname,.tkey,.rname span{font-feature-settings:"cv05" 1}
.muted{color:var(--muted)}
.card{
  /* Mixed with a trace of the weather colour so cards sit in the scene rather
     than on top of it. The proportion is small on purpose: text and charts
     must keep a near-neutral background whatever the mood. */
  background:color-mix(in srgb, var(--surface-1) 92%, var(--mood));
  border:1px solid var(--border);
  border-radius:var(--radius); padding:20px; margin-bottom:16px;
}
.grid{display:grid;gap:16px}
@media(min-width:820px){ .g2{grid-template-columns:1fr 1fr} .g3{grid-template-columns:repeat(3,1fr)} }

/* header */
header{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;margin-bottom:18px;flex-wrap:wrap}
.navbtn{
  background:var(--surface-1);color:var(--text-secondary);border:1px solid var(--border);
  border-radius:999px;padding:7px 14px;cursor:pointer;font:inherit;font-size:13px;
  text-decoration:none;display:inline-block;
}
.navbtn:hover{color:var(--text-primary)}
.nav{display:flex;gap:8px}
.tabs{display:inline-flex;gap:4px;background:var(--surface-1);border:1px solid var(--border);
  border-radius:999px;padding:4px}
.tabs button{
  background:transparent;color:var(--text-secondary);border:0;border-radius:999px;
  padding:7px 16px;cursor:pointer;font:inherit;font-size:13px;font-weight:550;
}
.tabs button[aria-selected="true"]{background:var(--series-1);color:#fff}
.tabs button:hover:not([aria-selected="true"]){color:var(--text-primary)}

/* hero */
.hero{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap}
.hero .fig{font-size:56px;font-weight:670;line-height:1;letter-spacing:-0.02em}
.hero .cap{color:var(--text-secondary);font-size:14px;max-width:34ch}
.headline{margin:14px 0 0;font-size:17px;font-weight:600;line-height:1.45}

/* status pill: color NEVER alone - always icon + text */
.pill{
  display:inline-flex;align-items:center;gap:7px;border-radius:999px;
  padding:5px 13px;font-size:13px;font-weight:600;
  border:1px solid var(--border);background:var(--plane);color:var(--text-primary);
}
.pill .dot{width:9px;height:9px;border-radius:50%;flex:none}
.s-none .dot{background:var(--muted)} .s-good .dot{background:var(--good)}
.s-warning .dot{background:var(--warning)} .s-serious .dot{background:var(--serious)}
.s-critical .dot{background:var(--critical)}

/* stat tiles */
.tiles{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
.tile{background:var(--plane);border:1px solid var(--border);border-radius:11px;padding:13px 15px}
.tile .lab{font-size:12px;color:var(--muted);margin-bottom:5px}
.tile .val{font-size:24px;font-weight:640;line-height:1.15;letter-spacing:-0.01em}
.tile .note{font-size:12px;color:var(--text-secondary);margin-top:3px}

/* meter (confidence) */
.meter{display:flex;gap:3px;margin-top:7px}
.meter i{height:6px;flex:1;border-radius:2px;background:var(--grid)}
.meter i.on{background:var(--series-1)}

svg{display:block;width:100%;height:auto;overflow:visible}
.tick{font-size:11px;fill:var(--muted);font-variant-numeric:tabular-nums}
.vlab{font-size:11px;fill:var(--text-secondary);font-weight:600}
.gl{stroke:var(--grid);stroke-width:1}
.base{stroke:var(--axis);stroke-width:1}

table{width:100%;border-collapse:collapse;font-size:13.5px}
th{text-align:left;font-weight:600;color:var(--muted);font-size:12px;padding:7px 9px;border-bottom:1px solid var(--border)}
td{padding:8px 9px;border-bottom:1px solid var(--border);vertical-align:top}
tr:last-child td{border-bottom:none}
td.num{text-align:right;font-variant-numeric:tabular-nums}
.scroll{overflow-x:auto}

a{color:var(--series-1)}
.lk{display:block;padding:11px 0;border-bottom:1px solid var(--border);text-decoration:none;color:inherit}
.lk:last-child{border-bottom:none}
.lk b{color:var(--series-1);font-weight:600;font-size:14px}
.lk span{display:block;color:var(--text-secondary);font-size:12.5px;margin-top:3px;line-height:1.5}
.lk:hover b{text-decoration:underline}

.quote{
  border-left:2px solid var(--axis); padding:2px 0 2px 14px; margin:14px 0 0;
  color:var(--text-secondary); font-size:13px; line-height:1.6;
}
.warn{
  border-left:2px solid var(--warning); padding:10px 0 10px 14px; margin:14px 0 0;
  color:var(--text-secondary); font-size:13px; line-height:1.6;
}
footer{color:var(--muted);font-size:12px;line-height:1.65;margin-top:26px;text-align:center}

/* windy embed */
.windybox{background:var(--plane);border:1px solid var(--border);border-radius:11px;
  padding:18px;text-align:center}
.wmsg{font-size:13px;color:var(--text-secondary);margin-top:10px;line-height:1.6}
#windy{width:100%;height:420px;border-radius:10px;overflow:hidden;margin-top:12px}
@media(max-width:640px){#windy{height:320px}}

/* climate driver tiles */
.dgrid{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
.dtile{text-align:left;background:var(--plane);border:1px solid var(--border);
  border-left:3px solid var(--muted);border-radius:11px;padding:12px 13px;
  cursor:pointer;font:inherit;color:var(--text-primary);min-height:44px}
.dtile:hover{border-color:var(--series-1)}
.dtile.sel{outline:2px solid var(--series-1);outline-offset:-2px}
.dtile.d-good{border-left-color:var(--good)}
.dtile.d-bad{border-left-color:var(--critical)}
.dtile.d-neu{border-left-color:var(--muted)}
.dname{font-size:11px;letter-spacing:.06em;color:var(--muted);font-weight:700}
.dval{font-size:19px;font-weight:650;margin:3px 0 1px;letter-spacing:-.01em}
.dsub{font-size:11.5px;color:var(--text-secondary);line-height:1.4}
.dspark{width:100%;height:22px;margin-top:7px;color:var(--series-1)}
.dtext{margin-top:12px;padding:12px 14px;background:var(--plane);
  border:1px solid var(--border);border-radius:10px;
  font-size:13.5px;line-height:1.65;color:var(--text-secondary);min-height:46px}

/* convective burst warning */
.burst{margin:14px 0 4px;padding:12px 14px;border-radius:11px;
  border:1px solid var(--warning);
  background:color-mix(in srgb,var(--warning) 12%,var(--surface-1));
  font-size:13px;line-height:1.62}
.burst.b-likely{border-left:3px solid var(--warning)}
.burst.b-possible{opacity:.92}

/* next-three-hours strip inside a belt card */
.hstrip{display:flex;align-items:center;gap:5px;margin-top:9px;flex-wrap:wrap}
.hcell{min-width:44px;text-align:center;border-radius:7px;padding:5px 6px;
  border:1px solid var(--border);background:var(--surface-1)}
.hval{font-size:13px;font-weight:650;font-variant-numeric:tabular-nums;
  line-height:1.15}
.hlab{font-size:9.5px;color:var(--muted);letter-spacing:.03em;margin-top:1px}
.harrow{color:var(--muted);font-size:12px}
.hunit{font-size:10px;color:var(--muted);margin-left:2px}
/* Rain-rate tint, on the same thresholds the sentences use. */
.hcell.hz{opacity:.6}
.hcell.h0{border-color:color-mix(in srgb,var(--series-1) 35%,var(--border))}
.hcell.h1{background:color-mix(in srgb,var(--series-1) 12%,var(--surface-1));
  border-color:color-mix(in srgb,var(--series-1) 45%,var(--border))}
.hcell.h2{background:color-mix(in srgb,var(--series-1) 24%,var(--surface-1));
  border-color:var(--series-1)}
.hcell.h3{background:color-mix(in srgb,var(--warning) 26%,var(--surface-1));
  border-color:var(--warning)}
.hcell.h4{background:color-mix(in srgb,var(--critical) 28%,var(--surface-1));
  border-color:var(--critical)}

/* basin outlook */
.bas{display:grid;gap:12px}
@media(min-width:820px){ .bas{grid-template-columns:1fr 1fr} }
.basin{background:var(--plane);border:1px solid var(--border);
  border-left:3px solid var(--muted);border-radius:11px;padding:13px 14px}
.basin.s-active{border-left-color:var(--critical)}
.basin.s-developing{border-left-color:var(--warning)}
.basin.s-watch{border-left-color:var(--series-1)}
.basin.s-quiet{border-left-color:var(--good)}
.bhead{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.bpin{display:inline-flex;align-items:center;justify-content:center;
  width:20px;height:20px;border-radius:50%;background:var(--series-1);
  color:#fff;font-size:11px;font-weight:700}
.bname2{font-weight:700;font-size:13.5px;letter-spacing:-.01em}
.bstat{margin-left:auto;font-size:11px;text-transform:uppercase;
  letter-spacing:.06em;color:var(--muted);font-weight:700}
.bline{font-size:13.5px;line-height:1.5;margin-bottom:6px}
.bdet{font-size:12.5px;line-height:1.62;color:var(--text-secondary)}
.bfacts{display:flex;gap:14px;flex-wrap:wrap;margin-top:9px;font-size:12px;
  color:var(--text-secondary);font-variant-numeric:tabular-nums}
.bfacts b{color:var(--muted);font-weight:600}
.blinks{margin-top:9px}

/* track record */
.tkey{display:flex;gap:15px;font-size:11.5px;color:var(--muted);margin-bottom:8px}
.tkey i{display:inline-block;width:10px;height:10px;border-radius:3px;
  margin-right:5px;vertical-align:-1px}
.tkey .k-f{background:var(--series-1)}
.tkey .k-o{background:var(--good)}
.tkey .k-p{background:var(--muted);opacity:.5}
.tstrip{display:flex;gap:5px;align-items:flex-end;margin:4px 0 10px;
  overflow-x:auto;padding-bottom:4px}
.tday{flex:1 0 26px;text-align:center;min-width:26px}
.tbars{height:58px;display:flex;align-items:flex-end;justify-content:center;gap:2px}
.tb{width:8px;border-radius:3px 3px 0 0}
.tb.tf{background:var(--series-1)}
.tb.to{background:var(--good)}
.tb.to.tp{background:var(--muted);opacity:.45}
.tday.bad .tb.to{background:var(--critical)}
.tlab{font-size:10px;color:var(--muted);margin-top:5px}
.tstats{display:flex;gap:10px;flex-wrap:wrap;margin:2px 0 12px}
.tstat{background:var(--plane);border:1px solid var(--border);border-radius:9px;
  padding:8px 11px;flex:1 1 100px}
.tstat b{display:block;font-size:17px;font-weight:650;letter-spacing:-.01em}
.tstat span{font-size:11px;color:var(--muted)}

/* radar explainer + belts + animation */
.rexp{margin-top:16px;border-top:1px solid var(--border);padding-top:16px}
.rexp h3{font-size:14px;margin:0 0 10px;letter-spacing:-.01em}
.rexp h3~h3{margin-top:22px}
.rgrid{display:grid;gap:12px}
@media(min-width:700px){ .rgrid{grid-template-columns:1fr 1fr} }
.rcard{background:var(--plane);border:1px solid var(--border);border-radius:11px;
  padding:13px 14px}
.rname{font-weight:700;font-size:13.5px;margin-bottom:7px}
.rname span{font-weight:500;color:var(--muted);font-size:11.5px;
  letter-spacing:.04em;text-transform:uppercase;margin-left:5px}
.rcard p{margin:0 0 8px;font-size:13px;line-height:1.6;color:var(--text-secondary)}
.rcard ul{margin:0 0 8px;padding-left:17px;font-size:12.5px;line-height:1.75;
  color:var(--text-secondary)}
.rwarn{font-size:12.5px;line-height:1.6;color:var(--text-secondary);
  border-left:2px solid var(--muted);padding-left:9px;margin:0}
.rhow{margin:12px 0 0;font-size:13px;line-height:1.65;color:var(--text-secondary)}
.rhead{font-size:13.5px;line-height:1.6;margin:0 0 11px}
.belts{display:grid;gap:8px}
@media(min-width:620px){ .belts{grid-template-columns:1fr 1fr} }
.belt{background:var(--plane);border:1px solid var(--border);
  border-left:3px solid var(--muted);border-radius:9px;padding:9px 11px}
.belt.b-raining{border-left-color:var(--critical)}
.belt.b-arriving{border-left-color:var(--warning)}
.belt.b-drizzling{border-left-color:var(--series-1)}
.belt.b-later{border-left-color:var(--series-1);opacity:.9}
.belt.b-dry{border-left-color:var(--good);opacity:.75}
.bname{font-size:12px;font-weight:700;letter-spacing:.01em;margin-bottom:2px}
.bsent{font-size:12.5px;line-height:1.55;color:var(--text-secondary)}
.ranim{margin:10px 0 0}
.ranim svg{width:100%;height:auto;max-width:100%;color:var(--text-primary)}
.ranim figcaption{font-size:12px;color:var(--text-secondary);margin-top:7px;
  line-height:1.55}
/* Label size is in SVG user units, so its on-screen size depends on how far
   the drawing has been scaled. At 720 units wide rendered into a 300px phone
   column, an 11-unit label lands at ~4.6 real pixels - invisible. These two
   sizes both land near 11 real px at their respective render widths. */
.ral{font-size:13px;fill:currentColor;opacity:.7}
@media(max-width:700px){ .ral{font-size:26px} }
.rbelt{opacity:.55}
.rbelt.lit{opacity:1}
.rbelt.lit text{font-weight:700}
.rcell ellipse{fill:var(--series-1);opacity:.55}
.rcell{animation-name:rdrift;animation-timing-function:linear;
  animation-iteration-count:infinite;
  /* Without these, transform-origin on an SVG group defaults to the canvas
     origin (0 0), so scaleY grows the cell downward from the top of the
     drawing and the blobs sink straight through the ground line at their
     tallest. fill-box scales each cell about its own centre instead. */
  transform-box:fill-box;transform-origin:50% 50%}
.rcell.rc2{animation-delay:-2.4s}
.rcell.rc2 ellipse{fill:var(--critical);opacity:.42}
.rcell.rc3{animation-delay:-4.9s}
@keyframes rdrift{
  0%   {transform:translateX(20px) scaleY(.75); opacity:0}
  12%  {opacity:.95}
  62%  {transform:translateX(430px) scaleY(1.05); opacity:.95}
  86%  {transform:translateX(560px) scaleY(1.7); opacity:.8}
  100% {transform:translateX(650px) scaleY(.5); opacity:0}
}
@media (prefers-reduced-motion: reduce){
  .rcell{animation:none;transform:translateX(300px)}
}

/* upstream driver strip */
.ustrip{display:flex;gap:6px;align-items:flex-end;margin:14px 0 2px}
.uday{flex:1;text-align:center;min-width:0}
.ubar{width:100%;max-width:30px;margin:0 auto;border-radius:5px 5px 0 0;
  background:var(--series-1)}
.ubar.u-good{background:var(--good)}
.ubar.u-bad{background:var(--critical)}
.ubar.u-neu{background:var(--muted)}
.uval{font-size:11.5px;font-weight:600;margin-top:4px;font-variant-numeric:tabular-nums}
.ulab{font-size:10.5px;color:var(--muted);white-space:nowrap;overflow:hidden;
  text-overflow:ellipsis}

/* week summary */
.summary .sbig{font-size:17px;font-weight:620;margin:0 0 6px;line-height:1.45}
.sstrip{display:flex;gap:6px;align-items:flex-end;margin:16px 0 8px}
.sday{flex:1;text-align:center;min-width:0}
.sbarwrap{height:78px;display:flex;align-items:flex-end;justify-content:center}
.sbar{width:100%;max-width:34px;border-radius:5px 5px 0 0;background:var(--series-1)}
.sday.obs .sbar{background:var(--muted)}
.sval{font-size:12px;font-weight:600;margin-top:5px;font-variant-numeric:tabular-nums}
.slab{font-size:10.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.skey{display:flex;gap:16px;font-size:11.5px;color:var(--muted);margin-bottom:6px}
.skey i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.skey .kobs{background:var(--muted)} .skey .kfc{background:var(--series-1)}
.sdet{border-top:1px solid var(--border);padding-top:10px;margin-top:12px}
.sdet>summary{cursor:pointer;font-weight:620;font-size:14px;padding:4px 0;list-style:none}
.sdet>summary::-webkit-details-marker{display:none}
.sdet>summary::before{content:'▸ ';color:var(--muted)}
.sdet[open]>summary::before{content:'▾ '}
.sdet p{color:var(--text-secondary);font-size:13.5px;line-height:1.65;margin:8px 0}

/* Sam - the forecast assistant */
.skoda{background:var(--surface-1);border:1px solid var(--border);
  border-radius:var(--radius);padding:20px;margin-bottom:16px}
.sk-head{display:flex;align-items:center;gap:11px;margin-bottom:4px}
.sk-av{width:38px;height:38px;border-radius:50%;background:var(--series-1);
  color:#fff;display:grid;place-items:center;font-size:19px;flex:none}
.sk-name{font-weight:650;font-size:15px}
.sk-role{font-size:12px;color:var(--muted)}
.sk-log{max-height:340px;overflow-y:auto;margin:14px 0 12px;
  display:flex;flex-direction:column;gap:10px;scroll-behavior:smooth}
.sk-msg{max-width:88%;padding:10px 13px;border-radius:13px;font-size:13.5px;
  line-height:1.6;white-space:pre-wrap;overflow-wrap:anywhere}
.sk-q{align-self:flex-end;background:var(--series-1);color:#fff;
  border-bottom-right-radius:4px}
.sk-a{align-self:flex-start;background:var(--plane);
  border:1px solid var(--border);border-bottom-left-radius:4px}
.sk-a b{font-weight:640}
.sk-form{display:flex;gap:8px}
.sk-in{flex:1;background:var(--plane);color:var(--text-primary);
  border:1px solid var(--border);border-radius:999px;padding:12px 16px;
  font:inherit;font-size:14px;min-height:44px}
.sk-in:focus{outline:2px solid var(--series-1);outline-offset:-1px}
.sk-send{background:var(--series-1);color:#fff;border:0;border-radius:999px;
  padding:0 20px;font:inherit;font-size:14px;font-weight:600;cursor:pointer;
  min-height:44px}
.sk-chips{display:flex;gap:7px;flex-wrap:wrap;margin-top:11px}
.sk-chip{background:var(--plane);border:1px solid var(--border);
  color:var(--text-secondary);border-radius:999px;padding:7px 13px;
  font:inherit;font-size:12.5px;cursor:pointer}
.sk-chip:hover{color:var(--text-primary);border-color:var(--series-1)}

/* refresh bar - only rendered when served over http, never in the file build */
.rbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;
  background:var(--surface-1);border:1px solid var(--border);
  border-radius:var(--radius);padding:12px 16px;margin-bottom:16px}
.rbtn,a.rbtn{text-decoration:none;display:inline-flex;align-items:center;justify-content:center;background:var(--series-1);color:#fff;border:0;border-radius:999px;
  padding:10px 20px;font:inherit;font-size:14px;font-weight:600;cursor:pointer;
  min-height:44px}
.rbtn:disabled{opacity:.5;cursor:default}
.rbtn:active{transform:scale(.98)}
.rmsg{font-size:13px;color:var(--text-secondary);flex:1;min-width:180px}

/* alerts */
:root{ --alert-edge:rgba(11,11,11,0.18) }
:root[data-theme="dark"]{ --alert-edge:rgba(255,255,255,0.18) }
@media (prefers-color-scheme: dark){ :root:where(:not([data-theme="light"])){ --alert-edge:rgba(255,255,255,0.18) } }
.alert{display:flex;gap:12px;padding:13px 0;border-bottom:1px solid var(--border)}
.alert:last-child{border-bottom:none}
.ai{font-size:20px;line-height:1.2;flex:none}
.at{font-weight:620;font-size:14.5px;margin-bottom:4px}
.ab{color:var(--text-secondary);font-size:13.5px;line-height:1.6}
.tag{display:inline-block;font-size:10.5px;font-weight:700;letter-spacing:.05em;
  padding:2px 7px;border-radius:5px;vertical-align:2px;margin-right:6px;
  background:var(--plane);border:1px solid var(--border);color:var(--text-secondary)}
.a-critical .tag,.t-critical{background:var(--critical);color:#fff;border-color:transparent}
.a-warning  .tag,.t-warning {background:var(--serious); color:#111;border-color:transparent}
.a-watch    .tag,.t-watch   {background:var(--warning); color:#111;border-color:transparent}
.t-high{background:var(--critical);color:#fff;border-color:transparent}
.t-moderate{background:var(--warning);color:#111;border-color:transparent}

/* plain day */
.pday{display:flex;gap:13px;padding:13px 0;border-bottom:1px solid var(--border)}
.pday:last-child{border-bottom:none}
.pic{font-size:22px;flex:none;line-height:1.1}
.pd{font-size:12px;color:var(--muted);margin-bottom:2px}
.ph{font-weight:620;font-size:15px;margin-bottom:3px}
.pt{color:var(--text-secondary);font-size:13.5px;line-height:1.6}
.pa{font-size:13px;color:var(--text-primary);margin-top:4px;font-style:italic}
.pc{font-size:12px;color:var(--muted);margin-top:4px}

/* radar */
.radarbar{display:flex;align-items:center;gap:10px;margin-top:16px;
  font-size:12.5px;color:var(--text-secondary);flex-wrap:wrap}
.rdot{width:8px;height:8px;border-radius:50%;background:var(--muted);flex:none}
.rdot.live{background:var(--good);animation:rpulse 2.4s ease-in-out infinite}
.rdot.dead{background:var(--critical);animation:none}
@keyframes rpulse{0%,100%{opacity:1}50%{opacity:.35}}
.radar-fallback{background:var(--plane);border:1px solid var(--border);
  border-radius:10px;padding:16px;font-size:13px;color:var(--text-secondary);
  line-height:1.6}
.radar{display:grid;gap:14px;margin-top:14px}
@media(min-width:700px){ .radar{grid-template-columns:1fr 1fr} }
.radar figure{margin:0}
.radar img{width:100%;border-radius:10px;border:1px solid var(--border);background:#000}
.radar figcaption{font-size:12px;color:var(--text-secondary);margin-top:6px;line-height:1.5}
.qs{margin:0 0 4px;padding-left:20px;color:var(--text-secondary);font-size:13.5px;line-height:1.8}
.qs.qa{line-height:1.5}
.qs.qa>li{margin-bottom:12px;color:var(--text-primary)}
.qaa{color:var(--text-secondary);font-size:13.5px;line-height:1.65;margin-top:3px}
.sysrow{padding:12px 0;border-bottom:1px solid var(--border)}
.sysrow:last-child{border-bottom:none}

#tip{
  position:fixed;pointer-events:none;opacity:0;transition:opacity .1s;
  background:var(--text-primary);color:var(--surface-1);border-radius:8px;
  padding:7px 10px;font-size:12.5px;line-height:1.45;z-index:50;white-space:nowrap;
  box-shadow:0 4px 14px rgba(0,0,0,.18);
}
.hit{fill:transparent;cursor:pointer}

/* ---------- theme ---------- */
/* localStorage throws outright on an opaque origin (data: URLs, some file://
   setups, private browsing). Unguarded, that exception kills the whole script
   before anything renders and the page comes up blank - so every access is
   wrapped and the theme simply falls back to the OS setting. */
function storeGet(k){ try { return localStorage.getItem(k); } catch (e) { return null; } }
function storeSet(k, v){ try { localStorage.setItem(k, v); } catch (e) { /* no-op */ } }

const saved = storeGet('wx-theme');
if (saved) document.documentElement.setAttribute('data-theme', saved);

/* Tint the page from the day being shown. Derived from the IMD band, so it
   tracks the actual forecast rather than a guess at "nice weather". */
function applyMood(){
  const days = (DAILY && DAILY.plainWeek) || (WEEKLY && WEEKLY.plainWeek) || [];
  const head = (days[0] && days[0].headline || '').toLowerCase();
  let mood = 'light';
  if (/^(dry|mostly dry)/.test(head)) mood = 'sunny';
  else if (/very heavy|extremely heavy/.test(head)) mood = 'severe';
  else if (/heavy/.test(head)) mood = 'heavy';
  else if (/moderate/.test(head)) mood = 'wet';
  else if (/light/.test(head)) mood = 'light';
  document.documentElement.setAttribute('data-wx', mood);
}
function toggleTheme(){
  const cur = document.documentElement.getAttribute('data-theme')
    || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
  const next = cur === 'dark' ? 'light' : 'dark';
  document.documentElement.setAttribute('data-theme', next);
  storeSet('wx-theme', next);
}

/* ---------- column chart (magnitude over time, single series) ---------- */
function columns(rows, opts){
  const W = 980, H = 190, PT = 22, PB = 26, PL = 34, PR = 8;
  const max = Math.max(opts.max || 0, ...rows.map(r => r.v), 0.1);
  const n = rows.length;
  const band = (W - PL - PR) / n;
  // Bars capped at 24px, with a 2px surface gap between neighbours.
  const bw = Math.max(3, Math.min(24, band - 2));
  const y = v => H - PB - (v / max) * (H - PT - PB);

  let g = '';
  // recessive gridlines + ticks
  const steps = 4;
  for (let i = 0; i <= steps; i++){
    const v = max * i / steps, yy = y(v);
    g += `<line class="gl" x1="${PL}" x2="${W-PR}" y1="${yy}" y2="${yy}"/>`;
    g += `<text class="tick" x="${PL-7}" y="${yy+3.5}" text-anchor="end">${
      v >= 10 ? v.toFixed(0) : v.toFixed(1)}</text>`;
  }
  g += `<line class="base" x1="${PL}" x2="${W-PR}" y1="${H-PB}" y2="${H-PB}"/>`;

  rows.forEach((r, i) => {
    const cx = PL + band * i + band / 2;
    const x = cx - bw / 2;
    const hh = Math.max(0, H - PB - y(r.v));
    if (r.v > 0){
      // 4px rounded data-end, square at the baseline
      const rr = Math.min(4, bw / 2, hh);
      const fill = r.fill || 'var(--series-1)';
      g += `<path d="M${x},${H-PB} L${x},${H-PB-hh+rr} Q${x},${H-PB-hh} ${x+rr},${H-PB-hh}
        L${x+bw-rr},${H-PB-hh} Q${x+bw},${H-PB-hh} ${x+bw},${H-PB-hh+rr}
        L${x+bw},${H-PB} Z" fill="${fill}"/>`;
    }
    if (r.label) g += `<text class="tick" x="${cx}" y="${H-PB+15}" text-anchor="middle">${esc(r.label)}</text>`;
    g += `<rect class="hit" x="${PL+band*i}" y="${PT-10}" width="${band}" height="${H-PT-PB+20}"
      data-tip="${esc(r.tip)}"/>`;
  });

  // label only the extreme, never every bar
  const peak = rows.reduce((a,b) => b.v > a.v ? b : a, rows[0] || {v:0});
  if (peak && peak.v > 0){
    const pi = rows.indexOf(peak);
    const cx = PL + band * pi + band / 2;
    g += `<text class="vlab" x="${cx}" y="${y(peak.v)-7}" text-anchor="middle">${
      peak.v >= 10 ? peak.v.toFixed(0) : peak.v.toFixed(1)}${opts.unit||''}</text>`;
  }
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(opts.aria||'')}">${g}</svg>`;
}

/* ---------- donut: share of a day's rain by time of day ----------------
   A pie/donut is only defensible for part-to-whole, at a glance, with few
   segments - which is exactly this: five ordered slices of one day's rain.
   It is NOT used for the nine-area comparison, where the values are close and
   numerous and a bar chart reads far better.
   The slices are an ORDERED ramp (dawn -> night), not categorical hues, and
   every value is repeated in the table beneath so nothing is gated behind
   colour or a hover. */
function donut(rows, opts){
  const W = 460, H = 260, cx = 130, cy = 130, r = 96, inner = 58;
  const total = rows.reduce((a, b) => a + b.v, 0);
  if (total <= 0){
    return `<p class="sub">No rain to break down for this day.</p>`;
  }

  let a0 = -Math.PI / 2, g = '';
  const GAP = 0.016;                       // surface gap between slices, in rad

  rows.forEach((r0, i) => {
    const frac = r0.v / total;
    if (frac <= 0) return;
    const a1 = a0 + frac * Math.PI * 2;
    const s = a0 + GAP / 2, e = Math.max(s, a1 - GAP / 2);
    const large = (e - s) > Math.PI ? 1 : 0;
    const p = (rad, radius) => [cx + radius * Math.cos(rad), cy + radius * Math.sin(rad)];
    const [x1, y1] = p(s, r), [x2, y2] = p(e, r);
    const [x3, y3] = p(e, inner), [x4, y4] = p(s, inner);
    g += `<path d="M${x1},${y1} A${r},${r} 0 ${large} 1 ${x2},${y2}
      L${x3},${y3} A${inner},${inner} 0 ${large} 0 ${x4},${y4} Z"
      fill="${r0.fill}"/>`;
    g += `<rect class="hit" x="0" y="0" width="${W}" height="${H}"
      style="pointer-events:none"/>`;
    a0 = a1;
  });

  // Hero figure in the hole - the number the chart is actually about.
  g += `<text x="${cx}" y="${cy - 4}" text-anchor="middle"
     style="font-size:26px;font-weight:660;fill:var(--text-primary)">${total.toFixed(0)}</text>`;
  g += `<text x="${cx}" y="${cy + 15}" text-anchor="middle"
     style="font-size:11px;fill:var(--muted)">mm total</text>`;

  // Legend: identity never rests on colour alone.
  rows.forEach((r0, i) => {
    const y = 26 + i * 21;
    const pct = total ? (r0.v / total * 100) : 0;
    g += `<rect x="266" y="${y - 9}" width="11" height="11" rx="3" fill="${r0.fill}"/>`;
    g += `<text x="284" y="${y}" style="font-size:12px;fill:var(--text-primary)">${esc(r0.label)}</text>`;
    g += `<text x="${W - 6}" y="${y}" text-anchor="end"
       style="font-size:12px;fill:var(--text-secondary);font-variant-numeric:tabular-nums">${r0.v.toFixed(1)} mm · ${pct.toFixed(0)}%</text>`;
  });

  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(opts.aria || '')}">${g}</svg>`;
}

/* ---------- heatmap: week x time of day -------------------------------- */
function heatmap(days, parts, cells, opts){
  const W = 980, LEFT = 96, TOP = 26, CH = 34, PAD = 4;
  const H = TOP + parts.length * CH + 16;
  const colW = (W - LEFT - 8) / days.length;
  const max = Math.max(...cells.flat(), 0.1);
  let g = '';

  days.forEach((d, i) => {
    g += `<text class="tick" x="${LEFT + colW * i + colW / 2}" y="${TOP - 10}"
       text-anchor="middle">${esc(d)}</text>`;
  });

  parts.forEach((p, r) => {
    const y = TOP + r * CH;
    g += `<text class="tick" x="${LEFT - 10}" y="${y + CH / 2 + 4}"
       text-anchor="end">${esc(p)}</text>`;
    days.forEach((d, c) => {
      const v = cells[r][c] || 0;
      const t = Math.min(1, v / max);
      // One hue, light->dark. Opacity carries magnitude against the surface,
      // so it reads correctly in both themes without a second palette.
      const op = v <= 0.05 ? 0 : 0.14 + t * 0.86;
      const x = LEFT + colW * c;
      g += `<rect x="${x + PAD / 2}" y="${y + PAD / 2}"
         width="${colW - PAD}" height="${CH - PAD}" rx="5"
         fill="var(--series-1)" fill-opacity="${op.toFixed(3)}"/>`;
      if (v <= 0.05){
        g += `<rect x="${x + PAD / 2}" y="${y + PAD / 2}"
           width="${colW - PAD}" height="${CH - PAD}" rx="5"
           fill="none" stroke="var(--grid)"/>`;
      }
      g += `<rect class="hit" x="${x}" y="${y}" width="${colW}" height="${CH}"
         data-tip="${esc(d + ' ' + p + ' — ' + v.toFixed(1) + ' mm')}"/>`;
    });
  });

  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(opts.aria || '')}">${g}</svg>`;
}

/* ---------- horizontal bars ---------- */
function hbars(rows, opts){
  const W = 980, RH = 34, PL = opts.labelWidth || 168, PR = 62;
  const H = rows.length * RH + 12;
  const max = Math.max(...rows.map(r => r.v), 0.1);
  let g = '';
  rows.forEach((r, i) => {
    const y = i * RH + 6;
    const bh = Math.min(24, RH - 12);
    const len = Math.max(0, (r.v / max) * (W - PL - PR));
    const rr = Math.min(4, bh / 2, len);
    g += `<text class="tick" x="0" y="${y+bh/2+4}" style="fill:var(--text-primary);font-size:12.5px">${esc(r.label)}</text>`;
    if (r.sub) g += `<text class="tick" x="${PL-10}" y="${y+bh/2+4}" text-anchor="end">${esc(r.sub)}</text>`;
    if (len > 0){
      g += `<path d="M${PL},${y} L${PL+len-rr},${y} Q${PL+len},${y} ${PL+len},${y+rr}
        L${PL+len},${y+bh-rr} Q${PL+len},${y+bh} ${PL+len-rr},${y+bh} L${PL},${y+bh} Z"
        fill="${r.fill || 'var(--series-1)'}"/>`;
    }
    g += `<text class="vlab" x="${PL+len+9}" y="${y+bh/2+4}">${esc(r.valLabel)}</text>`;
    g += `<rect class="hit" x="0" y="${y-4}" width="${W}" height="${RH}" data-tip="${esc(r.tip)}"/>`;
  });
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(opts.aria||'')}">${g}</svg>`;
}

function meter(rank){
  let s = '<div class="meter">';
  for (let i = 1; i <= 5; i++) s += `<i class="${i <= rank ? 'on' : ''}"></i>`;
  return s + '</div>';
}

/* ==========================================================================
   Sam - answers questions about this week's forecast.

   Runs entirely in the page against the forecast payload. No network call, no
   model: the artifact CSP blocks external hosts and the local file must work
   offline, so anything requiring a server would be dead in both places.

   The design rule that matters: Sam only ever states what is IN the data.
   Every answer is assembled from payload fields. When he cannot answer he says
   so and offers what he does hold, rather than improvising - a weather
   assistant that guesses is worse than no assistant.
   ========================================================================== */

const SK = (() => {
  const WD = ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];

  /* ---- voice -----------------------------------------------------------
     Sam reads aloud in the user's head, so he gets the cadence of someone
     answering a question rather than a database printing a row. The openers
     rotate on a hash of the question, not at random: asking the same thing
     twice should give the same reply, and a colleague who repeated himself
     differently every time would be unsettling rather than natural.
     Personality is in the framing only - never in the facts. */

  function seed(q){
    let h = 0;
    for (let i = 0; i < q.length; i++) h = ((h << 5) - h + q.charCodeAt(i)) | 0;
    return Math.abs(h);
  }
  function pickOne(list, q){ return list[seed(q) % list.length]; }

  const OPEN_RAIN = [
    "Right —", "So,", "Okay —", "Here's the picture:", "Looking at it:",
  ];
  const OPEN_GOOD = [
    "Good news —", "You're fine here —", "Nothing to worry about —",
  ];
  const OPEN_BAD = [
    "Heads up —", "Worth planning around this —", "This one needs care —",
  ];
  const OPEN_UNSURE = [
    "Honestly, this one's marginal —", "I'd hedge here —",
    "Not a confident call —",
  ];

  function opener(q, mood){
    const bank = mood === 'good' ? OPEN_GOOD
               : mood === 'bad' ? OPEN_BAD
               : mood === 'unsure' ? OPEN_UNSURE
               : OPEN_RAIN;
    return pickOne(bank, q);
  }

  /* Mood from the day itself, so the tone matches the content. */
  function moodOf(entry){
    const h = (entry.headline || '').toLowerCase();
    if (/very heavy|extremely heavy/.test(h)) return 'bad';
    if (/heavy/.test(h)) return 'bad';
    if (/^mostly dry|^dry/.test(h)) return 'good';
    if (/possible|unlikely/.test(h)) return 'unsure';
    return 'neutral';
  }

  /* Strip source citations. They belong in the written bulletin, which is the
     technical record; in conversation "Guide s12.1:" is just noise in front of
     the sentence that actually answers the question. */
  function deCite(s){
    let t = (s || '')
      // bracketed asides first: "(Guide s11.1)"
      .replace(/\s*\((?:Guide|Handbook)[^)]*\)/gi, '')
      // then inline references, longest form first
      .replace(/\b(?:Guide|Handbook)\s+Case Study\s+[A-F]\b/gi, '')
      .replace(/\b(?:Guide|Handbook)\s+Ch\.?\s*\d+(?:\/\d+)*\b/gi, '')
      .replace(/\b(?:Guide|Handbook)\s*(?:§|s)?\s*\d+(?:\.\d+)*\b/gi, '')
      // Removing a citation can strand the connector that introduced it -
      // "the orographic engine of ." - so drop a dangling preposition that is
      // now sitting immediately before punctuation or the end of the string.
      .replace(/\s+\b(?:of|in|per|from|see|via)\b\s*(?=[.,;:)]|$)/gi, '')
      .replace(/\s*:\s*(?=[.,;)]|$)/g, '')
      // A citation that introduced a clause ("...field. Guide s12.1: this...")
      // leaves its colon stranded after the previous sentence's full stop.
      .replace(/([.!?])\s*:\s*/g, '$1 ')
      .replace(/\s+([.,;:])/g, '$1')
      // ASCII arrows read as code in a chat bubble.
      .replace(/\s*->\s*/g, ' → ')
      .replace(/\s{2,}/g, ' ')
      .replace(/^[\s:—–-]+/, '')
      .trim();
    // A citation at the head of a sentence leaves the next word lowercase.
    t = t.replace(/(^|[.!?]\s+|\n)([a-z])/g, (m, pre, ch) => pre + ch.toUpperCase());
    return t;
  }

  /* Sam reads from BOTH payloads, never from D.
     D is whichever view is on screen, and it swaps when the reader taps a tab.
     Reading from it made his knowledge depend on the tab: on the MMR week view
     D has no plainWeek, so he answered "the weekend isn't inside the current
     seven-day window" while the daily payload held it all along. What he knows
     must not change based on what is being displayed. */
  function pick(key){
    const a = DAILY && DAILY[key];
    if (a && (!Array.isArray(a) || a.length)) return a;
    const b = WEEKLY && WEEKLY[key];
    if (b && (!Array.isArray(b) || b.length)) return b;
    return null;
  }

  function week(){ return pick('plainWeek') || []; }
  function areas(){ return pick('areas') || []; }
  function alerts(){ return pick('alerts') || []; }
  function thermal(){ return pick('thermal'); }
  function thermalRows(){ return pick('thermalRows') || []; }
  function systems(){ return pick('systems'); }
  function nowcast(){ return pick('nowcast'); }
  function issued(){ return pick('issued') || ''; }
  function weekendMeta(){ return pick('weekend'); }

  /* ---- dates ----------------------------------------------------------
     Every forecast entry is resolved to a real Date, and relative words are
     resolved against the reader's CLOCK, not against the array index. The
     naive version treated days[0] as "today", which is wrong the moment the
     page is a few hours old - open yesterday's build this morning and it
     cheerfully answers "today" with yesterday's forecast. */

  const MONTHS = ['january','february','march','april','may','june','july',
                  'august','september','october','november','december'];

  function midnight(d){ return new Date(d.getFullYear(), d.getMonth(), d.getDate()); }
  function today(){ return midnight(new Date()); }
  function addDays(d, n){ const x = new Date(d); x.setDate(x.getDate() + n); return x; }
  function sameDay(a, b){ return a.getTime() === b.getTime(); }

  /* Parse "Saturday 15 August" (the stored label) into a Date. The year is not
     in the label, so it is inferred from the issue date and corrected for a
     December-January rollover. */
  function parseLabel(label){
    if (!label) return null;
    const m = label.match(/(\d{1,2})\s+([A-Za-z]+)/);
    if (!m) return null;
    const dom = parseInt(m[1], 10);
    const mon = MONTHS.indexOf(m[2].toLowerCase());
    if (mon < 0) return null;
    let year = new Date().getFullYear();
    const issued = (D.issued || '').match(/(\d{4})/);
    if (issued) year = parseInt(issued[1], 10);
    let dt = new Date(year, mon, dom);
    // A window spanning New Year would otherwise land 12 months out.
    const ref = today();
    if (dt - ref > 300 * 864e5) dt = new Date(year - 1, mon, dom);
    if (ref - dt > 300 * 864e5) dt = new Date(year + 1, mon, dom);
    return dt;
  }

  function dated(){
    return week().map(d => ({ entry: d, date: parseLabel(d.day) }))
                 .filter(x => x.date);
  }

  function windowText(){
    const ds = dated();
    if (!ds.length) return 'the current forecast window';
    const f = ds[0].date, l = ds[ds.length - 1].date;
    const fmt = (x) => x.toLocaleDateString(undefined,
                        { weekday:'short', day:'numeric', month:'short' });
    return `${fmt(f)} to ${fmt(l)}`;
  }

  /* Resolve a target Date from the question, or null. */
  function targetDate(q){
    const ref = today();
    if (/\bday after tomorrow\b/.test(q)) return addDays(ref, 2);
    if (/\btomorrow\b|\btmrw\b|\btmr\b/.test(q)) return addDays(ref, 1);
    if (/\btoday\b|\btonight\b|\bthis evening\b|\bright now\b|\bnow\b/.test(q)) return ref;
    if (/\byesterday\b/.test(q)) return addDays(ref, -1);

    // "15 aug", "aug 15", "15th", "on the 15", "15/8"
    let m = q.match(/\b(\d{1,2})\s*(?:st|nd|rd|th)?\s+(jan|feb|mar|apr|may|jun|jul|aug|sep|oct|nov|dec)/);
    if (!m) {
      const m2 = q.match(/\b(jan|feb|mar|apr|may|jun|jul|aug|sep|oct|nov|dec)[a-z]*\s+(\d{1,2})\b/);
      if (m2) m = [m2[0], m2[2], m2[1]];
    }
    if (m){
      const dom = parseInt(m[1], 10);
      const mon = MONTHS.findIndex(x => x.startsWith(m[2]));
      if (mon >= 0){
        const hit = dated().find(x => x.date.getDate() === dom && x.date.getMonth() === mon);
        return hit ? hit.date : new Date(ref.getFullYear(), mon, dom);
      }
    }
    m = q.match(/\b(\d{1,2})\s*(?:st|nd|rd|th)\b/);
    if (m){
      const dom = parseInt(m[1], 10);
      const hit = dated().find(x => x.date.getDate() === dom);
      if (hit) return hit.date;
    }

    // Weekday name -> the occurrence inside the window.
    for (let i = 0; i < 7; i++){
      const name = WD[i].toLowerCase();
      if (new RegExp('\\b' + name + '\\b').test(q)){
        const hit = dated().find(x => x.date.getDay() === i);
        if (hit) return hit.date;
        for (let k = 1; k <= 7; k++){
          const cand = addDays(ref, k);
          if (cand.getDay() === i) return cand;
        }
      }
    }
    // Bare day-of-month as a last resort, e.g. "rain on 16".
    m = q.match(/\bon\s+(\d{1,2})\b/) || q.match(/\b(\d{1,2})\b/);
    if (m){
      const dom = parseInt(m[1], 10);
      if (dom >= 1 && dom <= 31){
        const hit = dated().find(x => x.date.getDate() === dom);
        if (hit) return hit.date;
      }
    }
    return null;
  }

  /* Entry for a date, or a structured miss explaining why. */
  function findDay(q){
    const want = targetDate(q);
    if (!want) return null;
    const ds = dated();
    const hit = ds.find(x => sameDay(x.date, want));
    if (hit) return hit.entry;
    return { _miss: true, wanted: want };
  }

  function findArea(q){
    const list = areas();
    if (!list.length) return null;
    const alias = {
      'kalyan':'kalyan_belt','dombivli':'kalyan_belt',
      'thane':'thane_belt','bhiwandi':'thane_belt',
      'colaba':'island_city','island city':'island_city','south mumbai':'island_city',
      'suburb':'suburbs','andheri':'suburbs','borivali':'suburbs','bandra':'suburbs',
      'santacruz':'suburbs','chembur':'suburbs','powai':'suburbs',
      'navi mumbai':'navi_mumbai','panvel':'navi_mumbai','vashi':'navi_mumbai',
      'badlapur':'badlapur_belt','ambernath':'badlapur_belt','karjat':'badlapur_belt',
      'vasai':'north_mmr','virar':'north_mmr','palghar':'north_mmr',
      'alibag':'south_mmr','raigad':'south_mmr',
      'matheran':'ghats','lonavala':'ghats','khandala':'ghats','ghat':'ghats',
      'trek':'ghats'
    };
    for (const k in alias){
      if (q.includes(k)){
        const hit = list.find(a => a.key === alias[k]);
        if (hit) return hit;
      }
    }
    for (const a of list){
      if (q.includes((a.name || '').toLowerCase().split('—')[0].trim().toLowerCase())) return a;
    }
    return null;
  }

  /* ---- answer builders ---- */
  function missAnswer(miss){
    const want = miss.wanted;
    const ref = today();
    const label = want.toLocaleDateString(undefined,
                    { weekday:'long', day:'numeric', month:'long' });
    if (want < ref){
      return `${label} is in the past — I only carry the forward forecast `
           + `(${windowText()}). The "what fell" table further down the page `
           + `has recent rainfall.`;
    }
    return `I don't have ${label}. This forecast covers ${windowText()} — `
         + `seven days, no further. Beyond that the honest answer is that `
         + `nobody can say much specific.`;
  }

  function staleNote(){
    // The page is a static build; if it is not from today, say so before
    // answering a question about "today".
    const ds = dated();
    if (!ds.length) return '';
    const first = ds[0].date;
    const gap = Math.round((today() - first) / 864e5);
    if (gap <= 0) return '';
    return `\n\n_Heads up: this page was built ${gap} day${gap > 1 ? 's' : ''} `
         + `ago (data from ${issued() || 'an earlier run'}). Refresh it for a `
         + `current read._`;
  }

  function dayAnswer(d, q){
    if (d && d._miss) return missAnswer(d);
    q = q || d.day || '';
    const head = (d.headline || '').replace(/\.$/, '');
    let s = `${opener(q, moodOf(d))} **${d.day}**: ${head.toLowerCase()}.`;
    if (d.detail) s += `\n\n${d.detail}`;
    if (d.advice) s += `\n\n${d.advice}`;
    if (d.confidence) s += `\n\n_${d.confidence}_`;
    return s + staleNote();
  }

  function isWeekendDay(p){
    // Prefer the flag, but fall back to the day name so this still works on a
    // page rendered before the flag existed.
    if (typeof p.isWeekend === 'boolean') return p.isWeekend;
    return /saturday|sunday/i.test(p.day || '');
  }

  function weekendAnswer(){
    const wk = week().filter(isWeekendDay);
    const meta = weekendMeta();
    if (!wk.length){
      return "The weekend isn't inside the current seven-day window. Ask me "
           + "again closer to the time.";
    }
    let s = meta ? `**${meta.verdict}** ${meta.plans}\n\n` : '';
    s += wk.map(d => {
      const head = (d.headline || '').replace(/\.$/, '');
      let t = `**${d.day}** — ${head.toLowerCase()}.`;
      if (d.detail) t += `\n${d.detail}`;
      if (d.advice) t += `\n${d.advice}`;
      return t;
    }).join('\n\n');
    return s;
  }

  function areaAnswer(a){
    let s = `**${a.name}** — ${a.accumulation || (a.weekMm ? '~' + a.weekMm.toFixed(0) + ' mm' : '')} this week.`;
    if (a.plain) s += `\n${a.plain}`;
    if (a.wettestDay) s += `\nWettest day: ${a.wettestDay}.`;
    if (a.character) s += `\n\n${a.character}`;
    return s;
  }

  function alertAnswer(){
    const list = alerts();
    if (!list.length){
      return "Nothing flagged this week, happily — the pattern just holds "
           + "steady the whole way through. Worth saying that's my own read "
           + "rather than an IMD warning, so check them for anything official.";
    }
    const lead = list.length === 1
      ? "One thing worth knowing about:"
      : `${list.length} things worth knowing about:`;
    return lead + "\n\n"
         + list.map(a => `${a.icon} **${a.title}**\n${a.body}`).join('\n\n');
  }

  function heatAnswer(){
    const t = thermal(), rows = thermalRows();
    if (!t && !rows.length) return "I don't have the heat/cold outlook on this page.";
    let s = t ? `**${t.headline}.**` : '';
    if (rows.length){
      s += '\n\n' + rows.map(r =>
        `${r.place}: warmest ${r.warmest == null ? '--' : r.warmest.toFixed(0) + '°C'}`
        + (r.peakFeels != null ? `, feels like up to ${r.peakFeels.toFixed(0)}°C` : '')
      ).join('\n');
    } else if (t && t.days && t.days.length){
      const hot = t.days.reduce((a,b) => (b.tmax||-99) > (a.tmax||-99) ? b : a);
      const feel = t.days.reduce((a,b) => (b.heatIndex||-99) > (a.heatIndex||-99) ? b : a);
      s += `\n\nWarmest ${hot.day} at ${hot.tmax.toFixed(0)}°C.`;
      if (feel.heatIndex != null)
        s += ` Peak feels-like ${feel.heatIndex.toFixed(0)}°C on ${feel.day}.`;
    }
    if (t && t.caveat) s += `\n\n_${t.caveat}_`;
    return s;
  }

  function systemAnswer(){
    const sy = systems();
    if (!sy) return "I don't have the systems analysis on this page.";
    let s = sy.trough ? sy.trough + '\n\n' : '';
    if (sy.list && sy.list.length){
      s += sy.list.map(x => `**${x.headline}**\n${x.reasoning}`).join('\n\n');
    } else {
      s += "No significant low pressure area or depression tracked within "
         + "range this week.";
    }
    if (sy.cycloneWindow){
      s += "\n\nThis month sits in an Arabian Sea cyclone window. For anything "
         + "beyond casual tracking, IMD's cyclone bulletins are the authority — "
         + "not me.";
    }
    return s;
  }

  function whyAnswer(){
    const regime = pick('regime'), mech = pick('mechanism');
    if (regime || mech){
      let s = regime ? `**${regime}**` : '';
      const note = pick('regimeNote');
      if (note) s += ` — ${note}`;
      if (mech) s += `\n\n${mech}`;
      return s;
    }
    const wr = pick('weekRegime');
    if (wr) return `**${wr.label}.** ${wr.note}`;
    return "I don't have the mechanism breakdown loaded.";
  }

  function nowAnswer(){
    const nc = nowcast();
    if (!nc || !nc.verdict)
      return "No short-range read on this page. The radar links above are the "
           + "better call for the next couple of hours anyway.";
    return `${nc.verdict}\n\nFor the next 0–3 hours radar beats every model `
         + `here — the IMD radar images are further down this page.`;
  }

  function compareAnswer(){
    const list = areas();
    if (list.length < 2){
      return "I don't have enough areas on this page to compare. The **MMR "
           + "week** page has the full nine-area breakdown.";
    }
    const w = list[0], d = list[list.length - 1];
    let s = `Wettest: **${w.name}** (${w.accumulation || w.weekMm.toFixed(0)+' mm'}).\n`
          + `Driest: **${d.name}** (${d.accumulation || d.weekMm.toFixed(0)+' mm'}).\n\n`
          + `Rain isn't uniform across the MMR — coast, transition belt and `
          + `Ghats behave differently in the same setup.`;
    // Never present a ranking from an incomplete field as the final word.
    const total = pick('areasTotal') || 9;
    if (list.length < total){
      s += `\n\n_Note: I have ${list.length} of ${total} areas loaded here. `
         + `The MMR week view carries the full ranking._`;
    }
    return s;
  }

  function helpAnswer(){
    return "I only know this week's forecast — nothing live, nothing beyond "
         + "seven days. Within that, ask me things like:\n"
         + "• how's the weekend looking\n"
         + "• will it rain on Sunday\n"
         + "• what about Thane, the Ghats, Navi Mumbai\n"
         + "• anything I should watch out for\n"
         + "• is it going to be hot\n"
         + "• any low pressure system around\n"
         + "• why is it raining\n"
         + "• which part of the MMR gets the most";
  }

  /* ---- routing ---- */
  function answer(raw){
    const q = (raw || '').toLowerCase().trim();
    if (!q) return helpAnswer();

    if (/^(hi|hello|hey|namaste|yo|good morning|good evening)\b/.test(q))
      return "Hello. What would you like to know? " + helpAnswer();

    if (/thank|thanks|cheers|great|nice work/.test(q))
      return "Any time. Shout if you want the weekend or a particular "
           + "suburb checked.";

    if (/help|what can you|how do i use/.test(q)) return helpAnswer();
    if (/weekend|saturday|sunday/.test(q) && !/only (sat|sun)/.test(q)){
      if (/weekend/.test(q)) return weekendAnswer();
    }
    if (/warn|alert|danger|risk|flood/.test(q)) return alertAnswer();
    if (/heat|hot|temperature|cold|cool|humid/.test(q)) return heatAnswer();
    if (/low pressure|lpa|depression|cyclone|system|trough|iod/.test(q))
      return systemAnswer();
    if (/^why|why is|why are|reason|because|mechanism|cause/.test(q))
      return whyAnswer();
    if (/right now|currently|at the moment|next few hours|nowcast/.test(q))
      return nowAnswer();
    if (/wettest|driest|compare|which (place|area|part)|most rain/.test(q))
      return compareAnswer();

    const day = findDay(q);
    const area = findArea(q);
    if (day && day._miss) return missAnswer(day);
    if (day && area){
      return `${dayAnswer(day, q)}\n\n_That's the Kalyan-anchored day forecast. `
           + `For ${area.name} specifically I only hold the weekly figure: `
           + `${area.accumulation || (area.weekMm ? '~'+area.weekMm.toFixed(0)+' mm' : 'n/a')}, `
           + `wettest ${area.wettestDay || 'n/a'}._`;
    }
    if (day) return dayAnswer(day, q);
    if (area) return areaAnswer(area);

    // A place was clearly meant but no area data is loaded anywhere.
    if (!areas().length && /ghat|lonavala|matheran|thane|vasai|virar|palghar|alibag|panvel|navi|badlapur|karjat|borivali|andheri|bandra|colaba|suburb|dombivli|bhiwandi|pune/.test(q)){
      const d0 = week()[0];
      return "I don't have per-area figures loaded — those come from the "
           + "weekly MMR run.\n\n"
           + (d0 ? `For Kalyan: ${d0.headline}` : '');
    }

    if (/rain|wet|shower|spell|umbrella/.test(q)){
      const days = week();
      if (days.length) return `Here's the week:\n\n`
        + days.map(d => `**${d.short || d.day}** — ${d.headline}`).join('\n');
    }

    return "Sorry — I can't match that to anything I hold. I'd rather say so "
         + "than guess at it.\n\n" + helpAnswer();
  }

  // Every answer goes through deCite, so no route can leak a citation.
  return { answer: (q) => deCite(answer(q)), help: helpAnswer };
})();

/* ---------- live Windy map (tap to load) --------------------------------
   Windy's Map Forecast API is a browser library, not a data feed - it embeds
   the real interactive map. Two consequences shape this:

   1. It pulls scripts from api.windy.com and unpkg.com, so it cannot run
      anywhere external hosts are blocked. The published artifact is exactly
      that case, so the card explains rather than showing a dead frame.
   2. Every load consumes Windy session quota. Loading on demand means a phone
      glancing at the forecast twice a day costs nothing. */
function windyMapHtml(){
  if (!D.windyMapKey) return '';
  const blocked = !!D.artifact;
  if (blocked){
    return `<div class="card"><h2>Live Windy map</h2>
      <p class="sub" style="margin:0">Can't run on this shared page — it needs
      scripts from windy.com, and claude.ai blocks external sources. Open the
      forecast from your own PC or the tunnel link and the map loads inline.</p>
      </div>`;
  }
  return `<div class="card"><h2>Live Windy map</h2>
    <p class="sub" style="margin:-6px 0 12px">The real Windy map, centred on
      Kalyan. Loads only when you ask, so it doesn't burn quota on every visit.</p>
    <div id="windyBox" class="windybox">
      <button class="rbtn" id="windyLoad" type="button">Load live map</button>
      <div class="wmsg">Wind, rain, radar, pressure and CAPE layers — scrub
        forward through time once loaded.</div>
    </div></div>`;
}

let windyLoaded = false;

function loadWindyMap(){
  if (windyLoaded) return;
  const box = document.getElementById('windyBox');
  if (!box || !D.windyMapKey) return;
  windyLoaded = true;
  box.innerHTML = '<div class="wmsg">Loading Windy…</div><div id="windy"></div>';

  const fail = (why) => {
    windyLoaded = false;
    box.innerHTML = `<div class="wmsg">Couldn't load the map: ${esc(why)}.
      <br>The layer links further down still work.</div>
      <button class="rbtn" id="windyLoad" type="button">Try again</button>`;
    bindWindy();
  };

  loadScript('https://unpkg.com/leaflet@1.4.0/dist/leaflet.js')
    .then(() => loadScript('https://api.windy.com/assets/map-forecast/libBoot.js'))
    .then(() => {
      if (typeof windyInit !== 'function') return fail('library did not initialise');
      windyInit({
        key: D.windyMapKey,
        lat: D.lat || 19.2437, lon: D.lon || 73.1305, zoom: 8,
        verbose: false, overlay: 'rain',
      }, () => {
        const m = document.querySelector('#windyBox .wmsg');
        if (m) m.remove();
      });
    })
    .catch(() => fail('network blocked or offline'));
}

function loadScript(src){
  return new Promise((res, rej) => {
    const s = document.createElement('script');
    s.src = src; s.async = true;
    s.onload = res; s.onerror = () => rej(new Error(src));
    document.head.appendChild(s);
  });
}

function bindWindy(){
  const b = document.getElementById('windyLoad');
  if (b && !b.dataset.bound){
    b.dataset.bound = '1';
    b.addEventListener('click', loadWindyMap);
  }
}

/* ---------- background climate drivers ---------------------------------- */
function driversHtml(){
  const d = (DAILY && DAILY.drivers) || (WEEKLY && WEEKLY.drivers);
  if (!d) return '';

  const tiles = [];

  if (d.enso){
    const e = d.enso;
    const tone = e.phase === 'El Nino' ? 'bad' : e.phase === 'La Nina' ? 'good' : 'neu';
    tiles.push({tone, name:'ENSO', value:`${e.phase}`,
      sub:`Niño 3.4 ${e.anomaly >= 0 ? '+' : ''}${e.anomaly.toFixed(2)}°C · ${e.when}`,
      spark:e.recent, text:e.text});
  }
  if (d.iod){
    const i = d.iod;
    const tone = i.phase === 'positive' ? 'good' : i.phase === 'negative' ? 'bad' : 'neu';
    tiles.push({tone, name:'IOD', value:i.phase,
      sub:`proxy DMI ${i.dmi >= 0 ? '+' : ''}${i.dmi.toFixed(2)}°C`,
      text:i.text});
  }
  if (d.mjo){
    const m = d.mjo;
    const tone = m.favourability === 'favourable' ? 'good'
               : m.favourability === 'unfavourable' ? 'bad' : 'neu';
    tiles.push({tone, name:'MJO', value:`Phase ${m.phase}`,
      sub:`${m.region} · ${m.lon.toFixed(0)}°E · ${m.favourability}`,
      spark:m.track, text:m.text});
  }
  if (d.miso){
    const s = d.miso;
    const near = s.lat >= 15 && s.lat < 22;
    tiles.push({tone: near ? 'good' : 'neu', name:'MISO',
      value:`${s.lat.toFixed(0)}°N`,
      sub:s.regime + (s.eta ? ` · ~${s.eta}d away` : ''),
      spark:s.track, text:s.text});
  }
  if (!tiles.length) return '';

  return `<div class="card"><h2>Background climate drivers</h2>
    <p class="sub" style="margin:-6px 0 14px">These tilt the season's odds.
      They do not forecast any single day — the week-to-week pattern does that.</p>
    <div class="dgrid">
      ${tiles.map((t, i) => `<button class="dtile d-${t.tone}" type="button"
          data-drv="${i}" aria-expanded="false">
        <div class="dname">${esc(t.name)}</div>
        <div class="dval">${esc(t.value)}</div>
        <div class="dsub">${esc(t.sub)}</div>
        ${t.spark && t.spark.length > 2 ? sparkSvg(t.spark) : ''}
      </button>`).join('')}
    </div>
    <div class="dtext" id="dtext">Tap any driver for what it means.</div>
    ${d.coherence ? `<div class="quote">${mdBold(d.coherence.replace(/^>\s*/, ''))}</div>` : ''}
  </div>`;
}

/* ---------- the track record ------------------------------------------- */
/* The point of this card is that a reader can check the agent rather than
   trust it. Each day shows what was forecast the day before against what
   actually fell, so a bad call stays visible instead of being averaged away.
   The most recent days deliberately show no verdict: ERA5 lags about five
   days, and filling that gap with the model's own analysis would be the agent
   marking its own homework. */
function trackHtml(D){
  const t = D.track;
  if (!t || !t.available || !t.days || !t.days.length) return '';
  const vals = t.days.flatMap(d => [d.fc || 0, d.obs || 0]);
  const max = Math.max(8, ...vals);
  const H = 54;
  const bar = v => Math.max(2, Math.round((v || 0) / max * H));

  const rows = t.days.map(d => {
    const pending = d.obs === null || d.obs === undefined;
    const cls = pending ? 'pend'
      : (d.verdict === 'hit' || d.verdict === 'correct_dry') ? 'ok' : 'bad';
    const tip = pending
      ? `${d.label}: forecast ${(d.fc||0).toFixed(0)} mm — not yet verified`
      : `${d.label}: forecast ${(d.fc||0).toFixed(0)} mm, actual ${(d.obs||0).toFixed(0)} mm`;
    return `<div class="tday ${cls}" title="${esc(tip)}">
      <div class="tbars">
        <div class="tb tf" style="height:${bar(d.fc)}px"></div>
        <div class="tb to${pending ? ' tp' : ''}" style="height:${pending ? 2 : bar(d.obs)}px"></div>
      </div>
      <div class="tlab">${esc(d.label.split(' ')[1] || d.label)}</div>
    </div>`;
  }).join('');

  return `<div class="card"><h2>Track record — has it actually been right?</h2>
    <p class="sub" style="margin:-6px 0 12px">Each pair of bars is one day:
      what was forecast the evening before, against what actually fell.</p>
    <p style="margin:0 0 14px">${mdBold(t.summary)}</p>
    <div class="tkey">
      <span><i class="k-f"></i>forecast</span>
      <span><i class="k-o"></i>actual</span>
      <span><i class="k-p"></i>not yet verified</span>
    </div>
    <div class="tstrip">${rows}</div>
    <div class="tstats">
      ${t.bandPct != null ? `<div class="tstat"><b>${t.bandPct}%</b><span>right rainfall band</span></div>` : ''}
      ${t.maeWet != null ? `<div class="tstat"><b>${t.maeWet} mm</b><span>average error on wet days</span></div>` : ''}
      <div class="tstat"><b>${t.verified}</b><span>days verified</span></div>
    </div>
    <div class="quote">Forecasts are the run issued the day <i>before</i> each
      date, pulled from the archive — not today's model replayed over the past,
      which would show fake skill. Truth is ERA5 reanalysis, which lags about
      five days; the last few days show their forecast with the verdict still
      pending rather than being scored against the model's own analysis.</div>
  </div>`;
}

/* ---------- reading the radar, in plain words --------------------------- */
/* The two images above are the products IMD publishes by default, and both
   are routinely misread. MAX-Z is the strongest echo anywhere in the column,
   so it flags a growing cell before anything reaches the ground - which is
   exactly why it overstates what you will feel. SRI is that reflectivity
   converted to a surface rain rate, which is closer to experience but
   inherits every assumption in the conversion. Saying so is the difference
   between a picture and a forecast. */
function radarExplainHtml(D){
  const nc = D.nowcast || {};
  const b  = D.belts;
  let h = `<div class="rexp">
    <h3>What the two pictures above actually mean</h3>
    <div class="rgrid">
      <div class="rcard">
        <div class="rname">MAX-Z <span>maximum reflectivity</span></div>
        <p>The radar looks through the whole depth of the cloud and shows you
        the <b>strongest thing it finds anywhere in that column</b> — usually
        several kilometres up.</p>
        <ul>
          <li><b>Blue / green</b> — light rain or drizzle.</li>
          <li><b>Yellow</b> — steady, proper rain.</li>
          <li><b>Orange / red</b> — heavy downpour, the kind that floods a road
            in under an hour.</li>
          <li><b>Purple / white</b> — extreme core, often with hail aloft.</li>
        </ul>
        <p class="rwarn">Because it reads the top of the cloud, a red blob does
        <b>not</b> guarantee red rain on your street — the drops still have to
        survive the fall. Use it to spot cells <i>growing</i>.</p>
      </div>
      <div class="rcard">
        <div class="rname">SRI <span>surface rainfall intensity</span></div>
        <p>The same echo, converted into <b>how hard it is raining at ground
        level</b> — millimetres per hour. This is the one closest to what you
        would feel standing outside.</p>
        <ul>
          <li><b>Under 2 mm/hr</b> — you would barely bother with an umbrella.</li>
          <li><b>2–10 mm/hr</b> — ordinary monsoon rain.</li>
          <li><b>10–20 mm/hr</b> — heavy; low roads start holding water.</li>
          <li><b>Over 20 mm/hr</b> — torrential; waterlogging within the hour.</li>
        </ul>
        <p class="rwarn">The conversion from echo to rain rate is an estimate,
        not a measurement. In a heavy monsoon burst SRI tends to <b>under-read</b>
        what the gauges catch.</p>
      </div>
    </div>
    <p class="rhow"><b>How to read them together:</b> if MAX-Z is bright but SRI
    is faint, the cell is still building aloft — the rain has not arrived yet.
    If both are bright over the same spot, that is where it is coming down hard
    right now. If MAX-Z fades while SRI stays lit, the cell is dying and the
    rain you feel is what is left falling out of it.</p>`;

  /* The burst warning goes ABOVE the numbers, not below them: its whole
     point is to change how the rates underneath are read. */
  if (D.burst && D.burst.note){
    h += `<div class="burst b-${esc(D.burst.level)}">${mdBold(D.burst.note)}</div>`;
  }

  if (b && b.available && b.list && b.list.length){
    h += `<h3>Next few hours, belt by belt</h3>
      ${b.headline ? `<p class="rhead">${mdBold(b.headline)}</p>` : ''}
      <div class="belts">` +
      b.list.map(x => `<div class="belt b-${esc(x.state)}">
        <div class="bname">${esc(x.name)}</div>
        <div class="bsent">${mdBold(x.sentence)}</div>
        ${hourStrip(x)}
      </div>`).join('') +
      `</div>
      <p class="rwarn" style="margin-top:10px">These come from the hourly model
      field sampled at each place, <b>not</b> from the radar picture above.
      Inside an hour the radar loop is the better guide — this tells you which
      belts to watch on it.</p>`;
  }

  h += radarAnimHtml(nc, b);
  h += `</div>`;
  return h;
}

/* Next three hours for one belt, as a row of labelled cells.
   The sentence above says what it means; this says how much and when, which
   words cannot do compactly. Cells are tinted by rain rate on the same
   thresholds the sentences use, so "moderate" looks the same everywhere. */
function hourStrip(x){
  const hrs = (x.hours || []).slice(0, 3);
  const labs = (x.hourLabels || []).slice(0, 3);
  if (!hrs.length || !labs.length) return '';
  const tone = v => v >= 20 ? 'h4' : v >= 10 ? 'h3' : v >= 4 ? 'h2'
                  : v >= 1 ? 'h1' : v >= 0.2 ? 'h0' : 'hz';
  const cell = (lab, v) => `<div class="hcell ${tone(v)}">
      <div class="hval">${v.toFixed(1)}</div>
      <div class="hlab">${esc(lab)}</div>
    </div>`;
  return `<div class="hstrip">
    ${cell('now', x.nowMmH || 0)}
    <span class="harrow">→</span>
    ${hrs.map((v, i) => cell(labs[i] || '', v)).join('')}
    <span class="hunit">mm/hr</span>
  </div>`;
}

/* ---------- the animation ------------------------------------------------ */
/* A west-to-east slice through the region: sea on the left, the city belts in
   the middle, the Ghat wall on the right. Blobs ride the steering flow across
   it and grow as they climb, which is the single mechanism that decides
   whether a Kalyan reader gets ten minutes of drizzle or two hours of rain.
   Speed of the animation is set from the actual steering wind, so a fast band
   visibly races and a slack one crawls. */
function radarAnimHtml(nc, b){
  const kmh = (nc && nc.scanSteerKmh) || 30;
  const dur = Math.max(4, Math.min(16, 420 / Math.max(8, kmh))).toFixed(1);
  const from = (nc && nc.scanFrom) || 'the west';
  const wetKeys = new Set(((b && b.list) || [])

  return `<h3>What is happening on that picture, right now</h3>
  <figure class="ranim">
    <svg viewBox="0 0 720 260" role="img" preserveAspectRatio="xMidYMid meet"
      aria-label="Cross-section from the Arabian Sea to the Western Ghats.
        Rain cells ride the onshore flow inland and grow as they are forced up
        the slope, so the crest gets most of the rain and the rain shadow least.">
      <defs>
        <marker id="rarrow" viewBox="0 0 10 10" refX="9" refY="5"
          markerWidth="6" markerHeight="6" orient="auto-start-reverse">
          <path d="M0,0 L10,5 L0,10 z" fill="currentColor"/>
        </marker>
      </defs>

      <!-- ground -->
      <line x1="0" y1="212" x2="720" y2="212" stroke="currentColor"
        stroke-width="1" opacity=".35"/>
      <path d="M0 212 L150 212 L150 205 L0 205 Z" fill="currentColor" opacity=".12"/>
      <text x="8" y="232" class="ral" text-anchor="start">Arabian Sea</text>

      <!-- the ghat wall -->
      <path d="M470 212 L560 96 L610 92 L700 212 Z" fill="currentColor" opacity=".16"/>
      <path d="M470 212 L560 96 L610 92 L700 212" fill="none" stroke="currentColor"
        stroke-width="1.5" opacity=".5"/>
      <text x="556" y="84" class="ral" text-anchor="middle">Ghat crest</text>
      <text x="712" y="232" class="ral" text-anchor="end">rain shadow</text>

      <!-- belts along the ground -->
      <g class="rbelt${lit('western')}">
        <line x1="196" y1="205" x2="196" y2="212" stroke="currentColor"/>
        <text x="196" y="232" class="ral" text-anchor="middle">Malad</text>
      </g>
      <g class="rbelt${lit('thane_kalyan')}">
        <line x1="330" y1="205" x2="330" y2="212" stroke="currentColor"/>
        <text x="330" y="232" class="ral" text-anchor="middle">Kalyan</text>
      </g>
      <g class="rbelt${lit('badlapur')}">
        <line x1="430" y1="205" x2="430" y2="212" stroke="currentColor"/>
        <text x="430" y="232" class="ral" text-anchor="middle">Karjat</text>
      </g>

      <!-- the steering flow -->
      <line x1="24" y1="168" x2="250" y2="168" stroke="currentColor"
        stroke-width="2" opacity=".55" marker-end="url(#rarrow)"/>
      <text x="24" y="146" class="ral">onshore flow from ${esc(from)} · ${Math.round(kmh)} km/h</text>

      <!-- the cells: same three shapes, growing as they move inland -->
      <g class="rcell" style="animation-duration:${dur}s">
        <ellipse cx="0" cy="176" rx="30" ry="12"/>
      </g>
      <g class="rcell rc2" style="animation-duration:${dur}s">
        <ellipse cx="0" cy="168" rx="34" ry="14"/>
      </g>
      <g class="rcell rc3" style="animation-duration:${dur}s">
        <ellipse cx="0" cy="182" rx="26" ry="11"/>
      </g>
    </svg>
    <figcaption>Cells ride the onshore flow inland and are forced upward at the
      Ghats, which is why the crest collects the most rain, the Kalyan belt gets
