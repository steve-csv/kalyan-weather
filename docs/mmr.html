  </figure>`;
}

/* ISO date -> short weekday for the upstream strip. Parsed as local midday so
   a timezone offset cannot roll the label onto the neighbouring day. */
function dayShort(iso){
  if (!iso) return '';
  const p = String(iso).split('-').map(Number);
  if (p.length !== 3 || p.some(isNaN)) return String(iso);
  const d = new Date(p[0], p[1] - 1, p[2], 12, 0, 0);
  return d.toLocaleDateString(undefined, { weekday: 'short' });
}

/* Tiny inline sparkline for a driver's recent track. */
function sparkSvg(vals){
  const w = 96, h = 22;
  const lo = Math.min(...vals), hi = Math.max(...vals);
  const span = (hi - lo) || 1;
  const pts = vals.map((v, i) =>
    `${(i / (vals.length - 1) * w).toFixed(1)},${(h - (v - lo) / span * h).toFixed(1)}`
  ).join(' ');
  return `<svg class="dspark" viewBox="0 0 ${w} ${h}" preserveAspectRatio="none"
    aria-hidden="true"><polyline points="${pts}" fill="none"
    stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"
    stroke-linecap="round" opacity=".75"/></svg>`;
}

function bindDrivers(){
  const grid = document.querySelector('.dgrid');
  if (!grid || grid.dataset.bound) return;
  grid.dataset.bound = '1';
  const d = (DAILY && DAILY.drivers) || (WEEKLY && WEEKLY.drivers) || {};
  const texts = [d.enso, d.iod, d.mjo, d.miso].filter(Boolean).map(x => x.text);
  grid.addEventListener('click', ev => {
    const btn = ev.target.closest('.dtile');
    if (!btn) return;
    grid.querySelectorAll('.dtile').forEach(b => {
      b.classList.toggle('sel', b === btn);
      b.setAttribute('aria-expanded', String(b === btn));
    });
    const out = document.getElementById('dtext');
    if (out) out.textContent = texts[+btn.dataset.drv] || '';
  });
}

/* ---------- week summary: what happened, what's coming, and why ---------- */
function summaryHtml(){
  const s = (DAILY && DAILY.summary) || (WEEKLY && WEEKLY.summary);
  if (!s || !s.days || !s.days.length) return '';

  const maxMm = Math.max(...s.days.map(d => d.hi), 1);
  const strip = s.days.map(d => {
    const pct = Math.max(4, Math.round(d.hi / maxMm * 100));
    // Observed days are visually distinct from forecast ones - a reader must
    // be able to see where measurement stops and prediction begins.
    const cls = d.observed ? 'sday obs' : 'sday fc';
    return `<div class="${cls}" title="${esc(d.day)}: ${d.hi.toFixed(1)} mm — ${esc(d.note)}">
      <div class="sbarwrap"><div class="sbar" style="height:${pct}%"></div></div>
      <div class="sval">${d.hi < 1 ? '–' : d.hi.toFixed(0)}</div>
      <div class="slab">${esc(d.day.split(' ').slice(0,2).join(' '))}</div>
    </div>`;
  }).join('');

  return `<section class="card summary">
    <h2>The week in context — ${esc(s.start)} to ${esc(s.end)}</h2>
    <p class="sbig">${esc(s.headline)}</p>
    <p class="sub" style="margin:0 0 14px">${esc(s.outlook)}</p>

    <div class="sstrip">${strip}</div>
    <div class="skey">
      <span><i class="kobs"></i> measured</span>
      <span><i class="kfc"></i> forecast</span>
    </div>

    <details class="sdet" open>
      <summary>Why the weather is doing this</summary>
      ${s.meteorology.map(t => `<p>${mdBold(t)}</p>`).join('')}
    </details>

    <details class="sdet">
      <summary>Why the region splits the way it does</summary>
      ${s.geography.map(t => `<p>${mdBold(t)}</p>`).join('')}
    </details>
  </section>`;
}

/* Only bold + italic are honoured, and only after escaping, so nothing in the
   data can inject markup. */
function mdBold(t){
  return esc(t).replace(/\*\*(.+?)\*\*/g, '<b>$1</b>')
               .replace(/\*(.+?)\*/g, '<i>$1</i>');
}

function skodaHtml(){
  return `<div class="skoda">
    <div class="sk-head">
      <div class="sk-av">🌂</div>
      <div>
        <div class="sk-name">Sam</div>
        <div class="sk-role">Answers from this week's forecast — nothing else</div>
      </div>
    </div>
    <div class="sk-log" id="skLog"></div>
    <form class="sk-form" id="skForm">
      <input class="sk-in" id="skIn" placeholder="Ask about this week's weather…"
             autocomplete="off" aria-label="Ask Sam about the forecast">
      <button class="sk-send" type="submit">Ask</button>
    </form>
    <div class="sk-chips" id="skChips">
      ${["How's the weekend?","Any warnings?","What about the Ghats?",
         "Why is it raining?","Wettest place this week?"]
        .map(c => `<button class="sk-chip" type="button">${c}</button>`).join('')}
    </div>
  </div>`;
}

/* Handlers are bound in JS rather than written as onclick/onsubmit attributes.
   A page served under a nonce-based Content-Security-Policy runs the script tag
   but silently refuses inline attribute handlers - which would leave every
   button here looking normal and doing nothing. Binding avoids depending on
   the host's CSP at all. */
function skodaBind(){
  const form = document.getElementById('skForm');
  if (form && !form.dataset.bound){
    form.dataset.bound = '1';
    form.addEventListener('submit', skAsk);
  }
  const chips = document.getElementById('skChips');
  if (chips && !chips.dataset.bound){
    chips.dataset.bound = '1';
    chips.addEventListener('click', (ev) => {
      const btn = ev.target.closest('.sk-chip');
      if (btn) skChip(btn);
    });
  }
}

function skPush(text, who){
  const log = document.getElementById('skLog');
  if (!log) return;
  const el = document.createElement('div');
  el.className = 'sk-msg ' + (who === 'q' ? 'sk-q' : 'sk-a');
  // Minimal markdown: bold and italics only, escaped first.
  el.innerHTML = esc(text)
    .replace(/\*\*(.+?)\*\*/g, '<b>$1</b>')
    .replace(/_(.+?)_/g, '<i>$1</i>');
  log.appendChild(el);
  log.scrollTop = log.scrollHeight;
}

function skAsk(ev){
  if (ev) ev.preventDefault();
  const input = document.getElementById('skIn');
  if (!input) return false;
  const q = input.value.trim();
  if (!q) return false;
  skPush(q, 'q');
  input.value = '';
  setTimeout(() => skPush(SK.answer(q), 'a'), 160);
  return false;
}

function skChip(btn){
  const input = document.getElementById('skIn');
  if (!input) return;
  input.value = btn.textContent;
  skAsk(null);
}

/* ---------- refresh (only when served by wxagent serve) ---------- */
/* Two conditions, both required:
   - an http(s) origin, because opened straight from disk there is no server;
   - not the published artifact, which IS https but is a static snapshot on
     claude.ai with no /api/refresh behind it. Showing the button there would
     give a control that always fails - worse than no control at all. */
/* A public static host is https but has no /api/refresh behind it, exactly
   like the artifact - so the refresh control is suppressed there too rather
   than shipping a button that always fails. */
const SERVED = (location.protocol === 'http:' || location.protocol === 'https:')
               && !D.artifact && !D.public;

/* The repository whose Actions run the cloud update. Used only to build the
   Update link on the public build. */
const REPO = 'steve-csv/kalyan-weather';

function refreshBarHtml(){
  if (SERVED){
    return `<div class="rbar">
      <button class="rbtn" id="rbtn" type="button">Refresh forecast</button>
      <div class="rmsg" id="rmsg">Rebuilds today's forecast on your PC. Takes about a minute.</div>
    </div>`;
  }
  /* On the public site there is no server to call, so the button cannot
     rebuild the page itself. What it CAN do is send you to the one screen
     that will: the workflow's Run page on GitHub. That works from a phone,
     needs no key embedded in a world-readable page, and is honest about
     where the work happens - which a button that silently failed would not
     be. */
  if (D.public){
    return `<div class="rbar">
      <a class="rbtn" target="_blank" rel="noopener"
         href="https://github.com/${REPO}/actions/workflows/forecast.yml">
        Update forecast &rarr;</a>
      <div class="rmsg">Opens GitHub, where you press <b>Run workflow</b>.
        The page rebuilds itself in the cloud and is live in two or three
        minutes — your laptop does not need to be on.</div>
    </div>`;
  }
  return '';
}

let pollTimer = null;

async function doRefresh(){
  const btn = document.getElementById('rbtn');
  const msg = document.getElementById('rmsg');
  if (!btn || !msg) return;
  btn.disabled = true;
  msg.textContent = 'Starting…';
  try {
    const r = await fetch('/api/refresh', {method:'POST'});
    const j = await r.json();
    msg.textContent = j.message || j.status;
    if (r.status === 202){
      pollStatus();
    } else {
      btn.disabled = false;   // cooldown or already-running: let them retry
    }
  } catch (e) {
    msg.textContent = 'Could not reach the PC. Is it awake and on the same WiFi?';
    btn.disabled = false;
  }
}

async function pollStatus(){
  const btn = document.getElementById('rbtn');
  const msg = document.getElementById('rmsg');
  clearTimeout(pollTimer);
  try {
    const r = await fetch('/api/status');
    const s = await r.json();
    if (s.running){
      msg.textContent = 'Rebuilding on the PC…';
      pollTimer = setTimeout(pollStatus, 4000);
      return;
    }
    if (s.last_result === 'ok'){
      msg.textContent = 'Done — reloading.';
      setTimeout(() => location.reload(), 700);
      return;
    }
    if (s.last_result){
      msg.textContent = 'Failed: ' + (s.last_error || s.last_result);
    }
  } catch (e) {
    msg.textContent = 'Lost contact with the PC.';
  }
  if (btn) btn.disabled = false;
}

        <p class="sub" style="margin:0 0 12px">${esc(D.weekend.plans)}</p>

            ${p.advice ? `<div class="pa">${esc(p.advice)}</div>` : ''}
            <div class="pc">${esc(p.confidence)}</div>
          </div></div>`).join('')}
      </div>`;
    }
  }

  /* ---- plain English week ---- */
  if (D.plainWeek && D.plainWeek.length){
    h += `<div class="card"><h2>In plain English</h2>
      <p class="sub" style="margin:-6px 0 14px">The forecast. Everything further
        down is the working behind it.</p>`;
    let prevAdvice = null, prevChar = null;
    h += D.plainWeek.map(p => {
      const showAdvice = p.advice && p.advice !== prevAdvice;
      prevAdvice = p.advice;
      return `<div class="pday">
        <div class="pic">${esc(p.icon)}</div>
        <div class="pbody">
          <div class="pd">${esc(p.day)}</div>
          <div class="ph">${esc(p.headline)}</div>
          ${p.detail ? `<div class="pt">${esc(p.detail)}</div>` : ''}
          ${showAdvice ? `<div class="pa">${esc(p.advice)}</div>` : ''}
          <div class="pc">${esc(p.confidence)}</div>
        </div></div>`;
    }).join('');
    h += `</div>`;
  }

  /* hero + headline */
  h += `<div class="card">
    <div class="hero">
      <div class="fig">${esc(probTxt)}</div>
      <div class="cap">chance of measurable rain (&ge;${D.heavyThreshold ? '2.5' : '2.5'} mm)
        ${D.members ? `<br><span class="muted">from a ${D.members}-member ensemble</span>` : ''}</div>
    </div>
    <p class="headline">
      <span class="pill s-${esc(D.status)}"><span class="dot"></span>${esc(D.statusIcon)}
        ${esc(D.categoryLo === D.categoryHi ? D.categoryLo : D.categoryLo + ' to ' + D.categoryHi)}</span>
      &nbsp;${D.rainLo.toFixed(0)}–${D.rainHi.toFixed(0)} mm expected · ${esc(D.character)}
    </p>
    <div class="quote">Report the <b>category</b>, not the millimetre figure — model agreement on
      category is defensible, agreement on a number is not.</div>
  </div>`;

  /* tiles */
  h += `<div class="card"><h2>At a glance</h2><div class="tiles">
    <div class="tile"><div class="lab">Rain range</div><div class="val">${D.rainLo.toFixed(0)}–${D.rainHi.toFixed(0)}<span style="font-size:14px;font-weight:500"> mm</span></div>
      <div class="note">median ${D.rainMedian.toFixed(0)} mm</div></div>
    <div class="tile"><div class="lab">Peak hourly rate</div><div class="val">${D.peakRate}<span style="font-size:14px;font-weight:500"> mm/h</span></div>
      <div class="note">${D.wetHours} wet hours, longest run ${D.longestRun} h</div></div>
    <div class="tile"><div class="lab">Heavy-rain chance</div><div class="val">${D.probHeavy !== null ? D.probHeavy + '%' : '--'}</div>
      <div class="note">&ge;${D.heavyThreshold} mm/24h (IMD heavy)</div></div>
    <div class="tile"><div class="lab">Confidence — rain occurs</div><div class="val" style="font-size:17px">${esc(c.occurrence)}</div>${meter(c.occurrenceRank)}</div>
    <div class="tile"><div class="lab">Confidence — amount</div><div class="val" style="font-size:17px">${esc(c.amount)}</div>${meter(c.amountRank)}</div>
    <div class="tile"><div class="lab">Confidence — timing</div><div class="val" style="font-size:17px">${esc(c.timing)}</div>${meter(c.timingRank)}</div>
  </div>
  <div class="quote">${esc(c.rationale)}</div></div>`;

  /* mechanism */
  h += `<div class="card"><h2>Mechanism — why, before how much</h2>
    <p style="margin:0 0 8px"><b>${esc(D.regime)}</b> — ${esc(D.regimeNote)}</p>
    <p style="margin:0;color:var(--text-secondary);font-size:14px">${esc(D.mechanism)}</p>
    <div class="quote">system &rarr; wind response &rarr; moisture transport &rarr; lifting zone
      &rarr; expected rain footprint</div></div>`;

  /* hourly */
  const hourRows = D.hourly.map(r => ({
    v: r.mm,
    label: r.h % 3 === 0 ? String(r.h).padStart(2,'0') : '',
    tip: `<b>${String(r.h).padStart(2,'0')}:00</b> — ${r.mm.toFixed(1)} mm/h`
  }));
  h += `<div class="card"><h2>Hour by hour — rainfall rate (mm/h)</h2>
    ${columns(hourRows, {unit:' mm/h', aria:'Hourly rainfall rate through the day'})}
    <div class="quote">A day's total is often dominated by a few intense bursts — plan around
      the burst, not the daily average.</div></div>`;

  /* windows + models */
  h += `<div class="grid g2">`;
  const wRows = D.windows.map(w => ({
    label: w.label, sub: `${String(w.start).padStart(2,'0')}–${String(w.end).padStart(2,'0')}`,
    v: w.mm, valLabel: w.mm.toFixed(1) + ' mm',
    tip: `<b>${esc(w.label)}</b> — ${w.mm.toFixed(1)} mm, peak ${w.peak.toFixed(1)} mm/h<br>Risk: ${esc(w.risk)}`
  }));
  h += `<div class="card"><h2>When</h2>${hbars(wRows,{labelWidth:150,aria:'Rain by part of day'})}</div>`;

  const mRows = D.models.map(m => ({
    label: m.name, v: m.mm, valLabel: m.mm.toFixed(1) + ' mm',
    tip: `<b>${esc(m.name)}</b> — ${m.mm.toFixed(1)} mm (${esc(m.band)})`
  }));
  h += `<div class="card"><h2>Model comparison</h2>${hbars(mRows,{labelWidth:110,aria:'24-hour total by model'})}
    <div class="quote">No arithmetic mean is shown, deliberately — averaging models that represent
      different physical scenarios hides the reason they disagree.</div>
    ${D.spreadWarning ? `<div class="warn">${esc(D.spreadWarning)}</div>` : ''}</div>`;
  h += `</div>`;

  /* terrain gradient */
  if (D.gradient.length){
    // Ordinal ramp along the windward approach (coast -> transition -> crest),
    // every step clear of the ordinal contrast floor in both modes. The
    // leeward site is NOT a step on that ramp - it is the control the gradient
    // is measured against, so it takes neutral ink rather than a blue step.
    const ramp = {coastal:'var(--seq-250)', transition:'var(--seq-400)',
                  ghat:'var(--seq-550)', leeward:'var(--axis)'};
    const gRows = D.gradient.map(s => ({
      label: s.name + (s.home ? '  ★' : ''), sub: s.zone,
      v: s.hi, valLabel: `${s.lo.toFixed(0)}–${s.hi.toFixed(0)} mm`,
      fill: ramp[s.zone] || 'var(--series-1)',
      tip: `<b>${esc(s.name)}</b> (${esc(s.zone)})<br>${s.lo.toFixed(0)}–${s.hi.toFixed(0)} mm · 850 hPa ${esc(s.wind)}<br>Terrain: ${esc(s.terrain)}`
    }));
    h += `<div class="card"><h2>Coast &rarr; crest &rarr; rain shadow</h2>
      <p class="sub" style="margin:-6px 0 12px">Shade deepens along the windward approach;
        the leeward control is grey.</p>
      ${hbars(gRows,{labelWidth:200,aria:'Rainfall across the terrain gradient'})}
      ${D.gradientVerdict ? `<div class="quote">${esc(D.gradientVerdict)}</div>` : ''}
      <div class="quote">The same westerly is <i>upslope</i> at Matheran and <i>descending</i> at
        Pune — which is why Pune is carried as a control, not another forecast point.</div></div>`;
  }

  /* outlook */
  if (D.outlook.length){
    const oRows = D.outlook.map(d => ({
      v: d.hi, label: d.short,
      tip: `<b>${esc(d.day)}</b> — ${d.lo.toFixed(0)}–${d.hi.toFixed(0)} mm<br>${esc(d.regime)}${d.chance ? '<br>Rain chance ' + esc(d.chance) : ''}`
    }));
    h += `<div class="card"><h2>Days ahead — rainfall range (mm)</h2>
      ${columns(oRows,{unit:' mm',aria:'Daily rainfall for the days ahead'})}
      <div class="scroll"><table><thead><tr><th>Day</th><th>Regime</th><th class="num">Rain</th><th class="num">Chance</th></tr></thead><tbody>
      ${D.outlook.map(d => `<tr><td>${esc(d.day)}</td><td>${esc(d.regime)}</td>
        <td class="num">${d.lo.toFixed(0)}–${d.hi.toFixed(0)} mm</td><td class="num">${esc(d.chance||'--')}</td></tr>`).join('')}
      </tbody></table></div>
      <div class="quote">At 3–5 days give the trend and risk window only — avoid exact hourly or
        suburb-level claims at this range.</div></div>`;
  }

  /* ---- when in the day does it rain (donut + heatmap) ---- */
  // `windows` carries the same per-daypart totals and has been in the payload
  // all along, so the donut works on older builds too rather than waiting for
  // the next full run.
  D.dayparts = D.dayparts
    || (D.windows || []).map(w => ({label: w.label, mm: w.mm}));

  if (D.dayparts && D.dayparts.some(p => p.mm > 0)){
    const ramp = ['var(--seq-250)','var(--seq-350)','var(--seq-450)',
                  'var(--seq-550)','var(--seq-650)'];
    const rows = D.dayparts.map((p, i) => ({
      label: p.label, v: p.mm, fill: ramp[i % ramp.length]
    }));
    const total = rows.reduce((a,b) => a + b.v, 0);
    h += `<div class="card"><h2>When it rains today</h2>
      <p class="sub" style="margin:-6px 0 10px">Share of the day's rain by time
        of day. Shade runs pre-dawn → night.</p>
      ${donut(rows, {aria:"Share of today's rain by time of day"})}
      <div class="scroll"><table><thead><tr><th>Time of day</th>
        <th class="num">Rain</th><th class="num">Share</th></tr></thead><tbody>
        ${rows.map(r => `<tr><td>${esc(r.label)}</td>
          <td class="num">${r.v.toFixed(1)} mm</td>
          <td class="num">${total ? (r.v/total*100).toFixed(0) : 0}%</td></tr>`).join('')}
      </tbody></table></div></div>`;
  }

  if (D.heatmap && D.heatmap.cells && D.heatmap.cells.length){
    const hm = D.heatmap;
    h += `<div class="card"><h2>The week, hour block by hour block</h2>
      <p class="sub" style="margin:-6px 0 12px">Darker means more rain. The
        empty cells are your dry windows.</p>
      ${heatmap(hm.days, hm.parts, hm.cells, {aria:'Rainfall by day and time of day'})}
      <div class="quote">Read the columns for "which day", the rows for "what
        time". A row that stays dark all week is a time of day worth avoiding
        for anything outdoors.</div></div>`;
  }

  /* ---- nowcast + live radar ---- */
  if (D.nowcast && D.nowcast.radar){
    const nc = D.nowcast;
    h += `<div class="card"><h2>Now — next few hours</h2>
      <p class="sub" style="margin:-6px 0 12px">For the next 0–3 hours, radar
        outranks every model on this page.</p>
      ${nc.verdict ? `<p style="margin:0 0 14px">${esc(nc.verdict)}</p>` : ''}
      ${nc.hours && nc.hours.length ? columns(nc.hours.map(x => ({
          v:x.mm, label:x.t.slice(0,2),
          tip:`<b>${esc(x.t)}</b> — ${x.mm.toFixed(1)} mm/h`
        })), {unit:' mm/h', aria:'Next hours of modelled rainfall'}) : ''}
      <div class="radarbar">
        <span class="rdot" id="rdot"></span>
        <span id="rstamp">Radar — loading…</span>
        <button class="sk-chip" type="button" id="rnow">Refresh now</button>
      </div>
      <div class="radar" id="radarWrap">
        ${nc.radar.slice(0,2).map(r => `<figure>
          <img data-radar="${esc(r.url.split('?')[0])}" alt="${esc(r.name)}">
          <figcaption><b>${esc(r.name)}</b><br>${esc(r.why)}</figcaption>
        </figure>`).join('')}
      </div>
      ${radarExplainHtml(D)}
      <div style="margin-top:12px">
        ${nc.radar.slice(2).map(r => `<a class="lk" href="${esc(r.url)}" target="_blank" rel="noopener">
          <b>${esc(r.name)}</b><span>${esc(r.why)}</span></a>`).join('')}
        <a class="lk" href="${esc(nc.radarPage)}" target="_blank" rel="noopener">
          <b>IMD radar page (animated)</b><span>The sequence — which is the one that actually matters.</span></a>
        <a class="lk" href="${esc(nc.rainviewer)}" target="_blank" rel="noopener">
          <b>RainViewer animation</b><span>About 2 h of frames, easier to loop.</span></a>
      </div>
      <h2 style="margin-top:20px">The five-question scan${nc.scanAt ? ` — answered ${esc(nc.scanAt)}` : ''}</h2>
      ${nc.scan && nc.scan.length
        ? `<ol class="qs qa">${nc.scan.map(x =>
             `<li><b>${esc(x.q)}</b><div class="qaa">${mdBold(x.a)}</div></li>`
           ).join('')}</ol>
           <div class="quote">Answered from the gridded analysis, not radar.
             The analysis lags and smooths, so it misses a cell that has just
             fired and understates an intense core. Inside three hours the
             radar loop above is still the authority — use these to know
             <i>what to look for</i> on it.</div>`
        : `<ol class="qs">${nc.questions.map(q => `<li>${esc(q)}</li>`).join('')}</ol>`}
      <div class="quote"><b>What radar will not tell you.</b>
        ${nc.limits.map(esc).join(' ')}
        This page deliberately does not compute arrival times from radar images —
        inverting a colour scale and extrapolating it produces a number that
        looks precise and is not. Use IMD's own nowcasts for anything
        safety-critical.</div>
    </div>`;
  }


  h += trackHtml(D);

  /* ---- upstream drivers (Somali jet, mid-level dry air) ---- */
  if (D.upstream && D.upstream.available){
    const u = D.upstream;
    const jetTone = /very strong|strong/.test(u.jet) ? 'good'
                  : /weak/.test(u.jet) ? 'bad' : 'neu';
    const dryTone = /very dry|dry/.test(u.dry) ? 'bad'
                  : /moist/.test(u.dry) ? 'good' : 'neu';
    const advBad = u.advection === 'steered onto us' && /dry/.test(u.dry);
    h += `<div class="card"><h2>Upstream drivers</h2>
      <p class="sub" style="margin:-6px 0 14px">The Somali jet decides how much
        moisture is being delivered. The mid-level airmass decides whether it can
        become deep cloud once it gets here.</p>
      <div class="dgrid">
        <div class="dtile d-${jetTone}">
          <div class="dname">SOMALI JET</div>
          <div class="dval">${u.jetSpeed != null ? u.jetSpeed + ' m/s' : '—'}</div>
          <div class="dsub"><b>${esc(u.jet)}</b>${u.jetDir ? ' from ' + esc(u.jetDir) : ''}
            ${u.sourceSupports === false ? ' · source slackening behind it' : ''}</div>
        </div>
        <div class="dtile d-${dryTone}">
          <div class="dname">MID-LEVEL AIR</div>
          <div class="dval">${u.midRh != null ? u.midRh + '%' : '—'}</div>
          <div class="dsub"><b>${esc(u.dry)}</b>${u.advection ? ' · ' + esc(u.advection) : ''}</div>
        </div>
      </div>
      ${u.reading ? `<div class="dtext">${mdBold(u.reading)}</div>` : ''}
      ${advBad ? `<div class="quote">Dry mid-level air is being steered onto the
        region. Low levels can look humid while cloud still fails to grow — this
        is the setup where model rain most often fails to verify.</div>` : ''}`;
    if (u.week && u.week.length > 1){
      h += `<div class="ustrip">` + u.week.map(d => {
        const t = /very strong|strong/.test(d.jet) ? 'good'
                : /weak/.test(d.jet) ? 'bad' : 'neu';
        return `<div class="uday">
          <div class="ubar u-${t}" style="height:${Math.max(6, Math.min(46, (d.jetSpeed||0) * 2))}px"
            title="${esc(d.jet)} — ${d.jetSpeed != null ? d.jetSpeed + ' m/s' : ''}"></div>
          <div class="uval">${d.jetSpeed != null ? d.jetSpeed : '—'}</div>
          <div class="ulab">${esc(dayShort(d.day))}</div>
        </div>`;
      }).join('') + `</div>
      <div class="sub" style="margin-top:6px">Corridor jet strength through the
        week, m/s. Read against the mid-level airmass: a strong jet under dry
        mid-levels delivers less than its speed suggests.</div>`;
    }
    h += `</div>`;
  }

  /* ---- systems ---- */
  if (D.systems){
    const sy = D.systems;
    h += `<div class="card"><h2>Low pressure systems, troughs and storms</h2>
      <p style="margin:0 0 12px">${esc(sy.trough)}</p>`;
    if (sy.list && sy.list.length){
      h += sy.list.map(s => `<div class="sysrow">
        <div class="at"><span class="tag t-${esc(s.relevance)}">${esc(s.relevance)}</span> ${esc(s.headline)}</div>
        <div class="ab">${esc(s.reasoning)}</div>
        <div class="pc">Closest approach ~${s.distanceKm} km · minimum ${s.pressure} hPa · moves ${s.movedKm} km</div>
      </div>`).join('');
    } else {
      h += `<p class="sub">No significant low pressure area or depression tracked
        within range this week. Rain will be driven by the broad monsoon flow and
        terrain rather than by an organised system.</p>`;
    }
    if (sy.cycloneWindow){
      h += `<div class="quote"><b>Cyclone season.</b> This month falls in an
        Arabian Sea cyclone window. For anything beyond casual tracking, IMD's
        official cyclone bulletins are authoritative and this tool is not.</div>`;
    }
    h += `</div>`;
  }

  /* ---- heat & cold ---- */
  if (D.thermal && D.thermal.days && D.thermal.days.length){
    const th = D.thermal;
    h += `<div class="card"><h2>Heat and cold — next 7 days</h2>
      <p style="margin:0 0 12px"><b>${esc(th.headline)}.</b></p>
      <div class="scroll"><table><thead><tr><th>Day</th><th class="num">Max</th>
        <th class="num">vs normal</th><th class="num">Min</th>
        <th class="num">Feels like</th><th>Flag</th></tr></thead><tbody>
      ${th.days.map(d => {
        let flag = '';
        if (d.heatFlag === 'severe-criteria') flag = '<span class="tag t-critical">severe heat</span>';
        else if (d.heatFlag === 'heatwave-criteria') flag = '<span class="tag t-warning">heatwave criteria</span>';
        else if (d.coldFlag) flag = '<span class="tag t-watch">cold criteria</span>';
        else if (d.heatIndex >= 41) flag = '<span class="tag t-warning">danger (feels-like)</span>';
        else if (d.heatIndex >= 32) flag = '<span class="tag t-watch">extreme caution</span>';
        return `<tr><td>${esc(d.day)}</td>
          <td class="num">${d.tmax === null ? '--' : d.tmax.toFixed(0)+'°'}</td>
          <td class="num">${d.depMax === null ? '--' : (d.depMax>=0?'+':'')+d.depMax.toFixed(1)}</td>
          <td class="num">${d.tmin === null ? '--' : d.tmin.toFixed(0)+'°'}</td>
          <td class="num">${d.heatIndex === null ? '--' : d.heatIndex.toFixed(0)+'°'}</td>
          <td>${flag}</td></tr>`;
      }).join('')}
      </tbody></table></div>
      <div class="quote">${esc(th.caveat)}</div></div>`;
  }

  /* ingredients */
  h += `<div class="card"><h2>Ingredients — checked before the rain layer</h2><div class="scroll"><table>
    <thead><tr><th>Ingredient</th><th class="num">Value</th><th>Reading</th></tr></thead><tbody>
    <tr><td>Dew point</td><td class="num">${nn(ing.dewPoint)} °C</td><td>Temp − dew point spread ${nn(ing.spread)} °C</td></tr>
    <tr><td>RH 925 / 850 / 700 hPa</td><td class="num">${nn(ing.rh925)} / ${nn(ing.rh850)} / ${nn(ing.rh700)} %</td><td>Moisture depth: <b>${esc(ing.depthClass)}</b></td></tr>
    <tr><td>Precipitable water</td><td class="num">${nn(ing.pwat)} mm</td><td>${esc(ing.moistureNote)}</td></tr>
    <tr><td>850 hPa wind</td><td class="num">${esc(ing.wind850Dir)} ${nn(ing.wind850Speed)} m/s</td><td>The moisture-transport layer</td></tr>
    <tr><td>Terrain-normal component</td><td class="num">${nn(ing.orographic)} m/s</td><td>Orographic forcing: <b>${esc(ing.forcingClass)}</b> — ${esc(ing.liftNote)}</td></tr>
    <tr><td>CAPE (peak)</td><td class="num">${nn(ing.capePeak)} J/kg</td><td><b>${esc(ing.capeClass)}</b> — potential, not certainty</td></tr>
    <tr><td>Bulk shear 925→500</td><td class="num">${nn(ing.shear)} m/s</td><td><b>${esc(ing.shearClass)}</b> — ${esc(ing.stormMode)}</td></tr>
    </tbody></table></div></div>`;

  /* synoptic */
  if (D.synoptic){
    h += `<div class="card"><h2>Synoptic setting</h2>
      <div style="color:var(--text-secondary);font-size:13.5px;line-height:1.65">${D.synoptic}</div></div>`;
  }

  /* links */
  h += `<div class="grid g2">
    <div class="card"><h2>Check it on Windy</h2>
      <p class="sub" style="margin-bottom:8px">Pressure first, rain last — the morning-routine order.</p>
      ${LINKS.map(l => `<a class="lk" href="${esc(l.url)}" target="_blank" rel="noopener">
        <b>${esc(l.title)}</b><span>${esc(l.why)}</span></a>`).join('')}</div>
    <div class="card"><h2>Compare the models</h2>
      <p class="sub" style="margin-bottom:8px">Same layer, same place, one model at a time.</p>
      ${MLINKS.map(l => `<a class="lk" href="${esc(l.url)}" target="_blank" rel="noopener">
        <b>${esc(l.title)}</b><span>${esc(l.why)}</span></a>`).join('')}
      <h2 style="margin-top:18px">Official sources</h2>
      ${Object.entries(D.imdUrls).map(([k,v]) => `<a class="lk" href="${esc(v)}" target="_blank" rel="noopener"><b>${esc(k)}</b></a>`).join('')}
      <a class="lk" href="${esc(D.tideUrl)}" target="_blank" rel="noopener"><b>Tide tables</b>
        <span>Heavy rain near high tide is a materially worse flooding scenario — this page never
        synthesises tide times, so check them here.</span></a>
    </div></div>`;

  h += `<footer>Independent interpretation, not an official IMD product.<br>
    For flooding, lightning, transport and emergency decisions, follow IMD nowcasts, warnings and
    local authority instructions.</footer>`;

  document.getElementById('app').innerHTML = h;

  document.querySelectorAll('.hit').forEach(el => {
    el.addEventListener('mousemove', e => showTip(e, el.dataset.tip));
    el.addEventListener('mouseleave', hideTip);
  });
  bindAll();
  skodaGreet();
}

/* All interactive wiring in one place, re-run after every render. Nothing here
   relies on inline on* attributes, so the page behaves the same under a strict
   Content-Security-Policy as it does opened from disk. */
/* ---------- live radar ------------------------------------------------
   IMD overwrites these images in place roughly every 10 minutes, always at the
   same URL. A page built once therefore shows whatever frame existed at build
   time unless the browser is told to re-fetch, which is what the cache-busting
   timestamp does here.

   The published artifact runs under a CSP that blocks requests to external
   hosts, so these images cannot load there at all. Rather than leave two
   broken image boxes, the failure is detected and replaced with links that do
   work. */
const RADAR_MS = 5 * 60 * 1000;
let radarTimer = null, radarFailed = false;

function radarRefresh(manual){
  const imgs = document.querySelectorAll('#radarWrap img[data-radar]');
  if (!imgs.length) return;
  const stamp = document.getElementById('rstamp');
  const dot = document.getElementById('rdot');
  const t = Date.now();
  let pending = imgs.length, failed = 0;

  imgs.forEach(img => {
    const base = img.dataset.radar;
    const probe = new Image();
    probe.onload = () => {
      img.src = probe.src;
      if (--pending === 0) settle();
    };
    probe.onerror = () => { failed++; if (--pending === 0) settle(); };
    probe.src = base + '?t=' + t;
  });

  function settle(){
    if (failed === imgs.length){
      radarFailed = true;
      if (dot) dot.className = 'rdot dead';
      if (stamp) stamp.textContent = 'Radar images blocked here';
      showRadarFallback();
      clearInterval(radarTimer);
      return;
    }
    if (dot) dot.className = 'rdot live';
    if (stamp){
      stamp.textContent = 'Radar updated ' +
        new Date().toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'}) +
        ' · auto-refreshes every 5 min';
    }
  }
}

function showRadarFallback(){
  const wrap = document.getElementById('radarWrap');
  if (!wrap || wrap.dataset.fallback) return;
  wrap.dataset.fallback = '1';
  const nc = (DAILY && DAILY.nowcast) || {};
  wrap.innerHTML = `<div class="radar-fallback">
    <b>Live radar can't display on this shared page.</b><br>
    It's hosted on claude.ai, which blocks images loaded from other sites —
    IMD's radar server is one of those. The links still work:
    <div style="margin-top:10px">
      ${(nc.radar || []).map(r => `<a class="lk" href="${esc(r.url)}" target="_blank" rel="noopener"><b>${esc(r.name)}</b></a>`).join('')}
      ${nc.radarPage ? `<a class="lk" href="${esc(nc.radarPage)}" target="_blank" rel="noopener"><b>IMD radar page (animated)</b></a>` : ''}
    </div>
    <div style="margin-top:10px"><b>Or open the public page instead</b> —
      the radar displays inline there and refreshes itself:<br>
      <a class="lk" href="https://${REPO.split('/')[0]}.github.io/${REPO.split('/')[1]}/"
         target="_blank" rel="noopener"><b>steve-csv.github.io/kalyan-weather</b></a>
    </div></div>`;
}

function startRadar(){
  if (!document.getElementById('radarWrap')) return;
  radarRefresh(false);
  clearInterval(radarTimer);
  radarTimer = setInterval(() => { if (!radarFailed) radarRefresh(false); },
                           RADAR_MS);
  const btn = document.getElementById('rnow');
  if (btn && !btn.dataset.bound){
    btn.dataset.bound = '1';
    btn.addEventListener('click', () => radarRefresh(true));
  }
}

function bindAll(){
  applyMood();
  buildSky();
  bindWindy();
  bindDrivers();
  skodaBind();
  startRadar();

  const theme = document.getElementById('themeBtn');
  if (theme && !theme.dataset.bound){
    theme.dataset.bound = '1';
    theme.addEventListener('click', toggleTheme);
  }

  const tabs = document.getElementById('viewTabs');
  if (tabs && !tabs.dataset.bound){
    tabs.dataset.bound = '1';
    tabs.addEventListener('click', (ev) => {
      const btn = ev.target.closest('button[data-view]');
      if (btn) showView(btn.dataset.view);
    });
  }

  const rbtn = document.getElementById('rbtn');
  if (rbtn && !rbtn.dataset.bound){
    rbtn.dataset.bound = '1';
    rbtn.addEventListener('click', doRefresh);
  }
}

/* ---------- the animated sky -----------------------------------------
   Density is driven by the actual forecast, so the animation is a reading of
   the data rather than decoration: a light-rain day gets a few drops, a
   very-heavy day gets a downpour and the occasional flash. */
/* A cloud silhouette built from overlapping lobes on a flat base — the shape
   people actually read as "cloud". Three variants so a sky with several does
   not look like one asset repeated. */
function cloudSvg(seed){
  const shapes = [
    'M18 62 Q18 44 34 42 Q39 25 58 26 Q74 20 84 34 Q104 33 106 50 '
      + 'Q120 52 118 62 Z',
    'M12 62 Q12 47 27 45 Q31 30 48 31 Q60 20 74 30 Q92 28 95 44 '
      + 'Q112 46 110 62 Z',
    'M20 62 Q16 46 33 44 Q36 28 55 29 Q70 22 80 36 Q99 36 100 50 '
      + 'Q116 54 112 62 Z',
  ];
  return `<svg viewBox="0 0 130 66" aria-hidden="true">
    <path d="${shapes[seed % shapes.length]}" fill="currentColor"/></svg>`;
}

function buildSky(){
  const sky = document.getElementById('sky');
  if (!sky) return;
  if (matchMedia('(prefers-reduced-motion: reduce)').matches){
    sky.innerHTML = '';
    return;
  }

  const mood = document.documentElement.getAttribute('data-wx') || 'light';
  // Sun stays visible on light-rain days too - that is what a Konkan monsoon
  // day actually looks like between spells, and it reads better than an
  // unbroken grey field.
  const spec = {
    sunny:  {drops:0,   clouds:2, sun:true,  flash:false},
    light:  {drops:30,  clouds:4, sun:true,  flash:false},
    wet:    {drops:65,  clouds:5, sun:false, flash:false},
    heavy:  {drops:115, clouds:7, sun:false, flash:false},
    severe: {drops:165, clouds:8, sun:false, flash:true},
  }[mood] || {drops:30, clouds:4, sun:false, flash:false};

  let html = '';
  if (spec.sun){
    // Disc plus a corona of tapered rays, drawn once and rotated slowly.
    let rays = '';
    for (let a = 0; a < 360; a += 30){
      rays += `<rect x="49.2" y="6" width="1.6" height="13" rx="0.8"
        fill="currentColor" opacity=".55"
        transform="rotate(${a} 50 50)"/>`;
    }
    html += `<div class="sunwrap"><div class="glow"></div>
      <svg viewBox="0 0 100 100" aria-hidden="true">
        ${rays}<circle cx="50" cy="50" r="19" fill="currentColor" opacity=".38"/>
      </svg></div>`;
  }

  for (let i = 0; i < spec.clouds; i++){
    const w = 200 + Math.random() * 280;
    const top = 3 + Math.random() * 54;
    const dur = 80 + Math.random() * 90;
    const op = (0.10 + Math.random() * 0.13).toFixed(2);
    html += `<div class="cloud" style="width:${w}px;top:${top}vh;
      opacity:${op};animation-duration:${dur}s;
      animation-delay:-${(Math.random() * dur).toFixed(1)}s">
      ${cloudSvg(i)}</div>`;
  }

  if (spec.drops){
    let drops = '';
    for (let i = 0; i < spec.drops; i++){
      const dur = 0.55 + Math.random() * 0.75;
      drops += `<i style="left:${Math.random() * 100}%;
        height:${9 + Math.random() * 18}px;
        animation-duration:${dur}s;
        animation-delay:-${(Math.random() * dur).toFixed(2)}s;
        opacity:${(0.18 + Math.random() * 0.32).toFixed(2)}"></i>`;
    }
    html += `<div class="rainlayer" style="opacity:1">${drops}</div>`;
  }

  html += '<div class="flash" id="flash"></div>';
  sky.innerHTML = html;

  if (spec.flash) scheduleFlash();
}

let flashTimer = null;
function scheduleFlash(){
  clearTimeout(flashTimer);
  const next = 7000 + Math.random() * 16000;
  flashTimer = setTimeout(() => {
    const f = document.getElementById('flash');
    if (f){
      f.classList.remove('on');
      void f.offsetWidth;              // restart the animation
      f.classList.add('on');
    }
    scheduleFlash();
  }, next);
}

function skodaGreet(){
  const log = document.getElementById('skLog');
  if (!log || log.childElementCount) return;
  const days = (DAILY && DAILY.plainWeek) || (WEEKLY && WEEKLY.plainWeek) || [];
  const hour = new Date().getHours();
  const greet = hour < 12 ? "Morning" : hour < 17 ? "Afternoon" : "Evening";
  let opener = `${greet}. Ask me anything about this week's forecast.`;
  if (days.length){
    const wet = days.filter(d => !/^(dry|mostly dry)/i.test(d.headline || '')).length;
    opener = `${greet}. I've got the next ${days.length} days in front of me`
           + (wet ? ` — ${wet} of them with rain in` : '')
           + ". What do you want to know?";
  }
  skPush(opener, 'a');
}

render();
</script>
