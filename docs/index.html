    ${columns(fRows,{max:T.orogVeryStrong*1.15,unit:' m/s',aria:'Daily orographic forcing'})}
    <div class="scroll"><table><thead><tr><th>Day</th><th>850 hPa wind</th>
      <th class="num">Speed</th><th class="num">Terrain-normal</th><th>Forcing</th></tr></thead><tbody>
      ${D.windRows.map(r => `<tr><td>${esc(r.day)}</td><td>${esc(r.dir)}</td>
        <td class="num">${r.speed.toFixed(1)} m/s</td>
        <td class="num">${r.orographic >= 0 ? '+' : ''}${r.orographic.toFixed(1)} m/s</td>
        <td>${esc(r.forcing)}</td></tr>`).join('')}
    </tbody></table></div>
    <div class="quote">A fast wind blowing <i>parallel</i> to the ridge lifts almost nothing; a
      moderate wind blowing straight at it lifts a great deal. Reference:
      ${T.orogModerate.toFixed(1)} m/s &asymp; 15 kt (a loaded engine),
      ${T.orogStrong.toFixed(1)} m/s &asymp; 20 kt.</div></div>`;

  /* trough */
  h += `<div class="card"><h2>Monsoon trough through the week</h2>
    <div class="scroll"><table><thead><tr><th>Day</th><th class="num">Trough axis</th><th>Phase</th></tr></thead><tbody>
    ${D.troughRows.map(r => `<tr><td>${esc(r.day)}</td><td class="num">${esc(r.axis)}</td>
      <td><span class="pill s-${r.phase.indexOf('break') === 0 ? 'warning' : r.phase.indexOf('active') === 0 ? 'good' : 'none'}">
      <span class="dot"></span>${esc(r.phase)}</span></td></tr>`).join('')}
    </tbody></table></div>
    <div class="quote">A trough hugging the foothills (&ge;28&deg;N) for several consecutive days is
      the break signal. A trough back over the plains is the active signal. Watch the
      <i>direction of travel</i> across the week, not any single day.</div></div>`;

  /* MMR matrix */
  const zoneOrder = {coastal:0, transition:1, ghat:2, leeward:3};
  h += `<div class="card"><h2>Rainfall across the MMR</h2>
    <div class="scroll"><table><thead><tr><th>Site</th><th>Zone</th>
      ${D.siteRows[0].cells.map(c => `<th class="num">${esc(c.short)}</th>`).join('')}
      <th class="num">Week</th></tr></thead><tbody>
    ${D.siteRows.map(s => `<tr><td>${esc(s.name)}${s.home ? ' &#9733;' : ''}</td>
      <td class="muted" style="font-size:12px">${esc(s.zone)}</td>
      ${s.cells.map(c => `<td class="num" title="${esc(c.tip)}">${c.hi >= 1
        ? c.lo.toFixed(0) + '–' + c.hi.toFixed(0) : '—'}</td>`).join('')}
      <td class="num"><b>~${s.week.toFixed(0)}</b></td></tr>`).join('')}
    </tbody></table></div>
    <div class="quote">Cells show the <b>range across ECMWF, GFS and ICON</b> in mm/24h, never a
      single number. The week column sums daily medians — an order-of-magnitude figure only.</div>
    <div class="quote">The ghat-versus-Pune contrast is the diagnostic. A large contrast confirms a
      classic westerly regime with the rain shadow intact; a small one means deep moisture and broad
      ascent are overwhelming it — usually an inland system, and a wetter event for everyone.</div></div>`;

  /* narratives */
  h += `<div class="card"><h2>Day by day</h2>
    ${D.narratives.map(n => `<div style="padding:13px 0;border-bottom:1px solid var(--border)">
      <div style="font-weight:600;margin-bottom:4px">${esc(n.day)} — ${esc(n.regime)}</div>
      <div style="color:var(--text-secondary);font-size:13.5px;line-height:1.6">${esc(n.text)}</div>
    </div>`).join('')}</div>`;

  if (D.synoptic){
    h += `<div class="card"><h2>Synoptic setting</h2>
      <div style="color:var(--text-secondary);font-size:13.5px;line-height:1.65">${D.synoptic}</div></div>`;
  }

  h += `<div class="grid g2">
    <div class="card"><h2>Check it on Windy</h2>
      ${LINKS.map(l => `<a class="lk" href="${esc(l.url)}" target="_blank" rel="noopener">
        <b>${esc(l.title)}</b><span>${esc(l.why)}</span></a>`).join('')}</div>
    <div class="card"><h2>Official sources</h2>
      ${Object.entries(D.imdUrls).map(([k,v]) => `<a class="lk" href="${esc(v)}" target="_blank" rel="noopener"><b>${esc(k)}</b></a>`).join('')}
      <a class="lk" href="${esc(D.tideUrl)}" target="_blank" rel="noopener"><b>Tide tables</b>
        <span>Never synthesised here — look them up when rain reaches the heavy band.</span></a></div></div>`;

  h += `<footer>Independent interpretation, not an official IMD product.<br>
    Days 1–2: category is defensible. Days 3–5: trend and risk window only.
    Days 6–7: scenario, confidence explicitly low.</footer>`;

  document.getElementById('app').innerHTML = h;
  document.querySelectorAll('.hit').forEach(el => {
    el.addEventListener('mousemove', e => showTip(e, el.dataset.tip));
    el.addEventListener('mouseleave', hideTip);
  });
  bindAll();
  skodaGreet();
}

/* ==========================================================================
   Sam - answers questions about this week's forecast.

   Runs entirely in the page against the forecast payload. No network call, no
   model: the artifact CSP blocks external hosts and the local file must work
   offline, so anything requiring a server would be dead in both places.

   The design rule that matters: Sam only ever states what is IN the data.
   Every answer is assembled from payload fields. When he cannot answer he says
   so and offers what he does hold, rather than improvising - a weather
   assistant that guesses is worse than no assistant.
   ========================================================================== */

const SK = (() => {
  const WD = ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];

  /* ---- voice -----------------------------------------------------------
     Sam reads aloud in the user's head, so he gets the cadence of someone
     answering a question rather than a database printing a row. The openers
     rotate on a hash of the question, not at random: asking the same thing
     twice should give the same reply, and a colleague who repeated himself
     differently every time would be unsettling rather than natural.
     Personality is in the framing only - never in the facts. */

  function seed(q){
    let h = 0;
    for (let i = 0; i < q.length; i++) h = ((h << 5) - h + q.charCodeAt(i)) | 0;
    return Math.abs(h);
  }
  function pickOne(list, q){ return list[seed(q) % list.length]; }

  const OPEN_RAIN = [
    "Right —", "So,", "Okay —", "Here's the picture:", "Looking at it:",
  ];
  const OPEN_GOOD = [
    "Good news —", "You're fine here —", "Nothing to worry about —",
  ];
  const OPEN_BAD = [
    "Heads up —", "Worth planning around this —", "This one needs care —",
  ];
  const OPEN_UNSURE = [
    "Honestly, this one's marginal —", "I'd hedge here —",
    "Not a confident call —",
  ];

  function opener(q, mood){
    const bank = mood === 'good' ? OPEN_GOOD
               : mood === 'bad' ? OPEN_BAD
               : mood === 'unsure' ? OPEN_UNSURE
               : OPEN_RAIN;
    return pickOne(bank, q);
  }

  /* Mood from the day itself, so the tone matches the content. */
  function moodOf(entry){
    const h = (entry.headline || '').toLowerCase();
    if (/very heavy|extremely heavy/.test(h)) return 'bad';
    if (/heavy/.test(h)) return 'bad';
    if (/^mostly dry|^dry/.test(h)) return 'good';
    if (/possible|unlikely/.test(h)) return 'unsure';
    return 'neutral';
  }

  /* Strip source citations. They belong in the written bulletin, which is the
     technical record; in conversation "Guide s12.1:" is just noise in front of
     the sentence that actually answers the question. */
  function deCite(s){
    let t = (s || '')
      // bracketed asides first: "(Guide s11.1)"
      .replace(/\s*\((?:Guide|Handbook)[^)]*\)/gi, '')
      // then inline references, longest form first
      .replace(/\b(?:Guide|Handbook)\s+Case Study\s+[A-F]\b/gi, '')
      .replace(/\b(?:Guide|Handbook)\s+Ch\.?\s*\d+(?:\/\d+)*\b/gi, '')
      .replace(/\b(?:Guide|Handbook)\s*(?:§|s)?\s*\d+(?:\.\d+)*\b/gi, '')
      // Removing a citation can strand the connector that introduced it -
      // "the orographic engine of ." - so drop a dangling preposition that is
      // now sitting immediately before punctuation or the end of the string.
      .replace(/\s+\b(?:of|in|per|from|see|via)\b\s*(?=[.,;:)]|$)/gi, '')
      .replace(/\s*:\s*(?=[.,;)]|$)/g, '')
      // A citation that introduced a clause ("...field. Guide s12.1: this...")
      // leaves its colon stranded after the previous sentence's full stop.
      .replace(/([.!?])\s*:\s*/g, '$1 ')
      .replace(/\s+([.,;:])/g, '$1')
      // ASCII arrows read as code in a chat bubble.
      .replace(/\s*->\s*/g, ' → ')
      .replace(/\s{2,}/g, ' ')
      .replace(/^[\s:—–-]+/, '')
      .trim();
    // A citation at the head of a sentence leaves the next word lowercase.
    t = t.replace(/(^|[.!?]\s+|\n)([a-z])/g, (m, pre, ch) => pre + ch.toUpperCase());
    return t;
  }

  /* Sam reads from BOTH payloads, never from D.
     D is whichever view is on screen, and it swaps when the reader taps a tab.
     Reading from it made his knowledge depend on the tab: on the MMR week view
     D has no plainWeek, so he answered "the weekend isn't inside the current
     seven-day window" while the daily payload held it all along. What he knows
     must not change based on what is being displayed. */
  function pick(key){
    const a = DAILY && DAILY[key];
    if (a && (!Array.isArray(a) || a.length)) return a;
    const b = WEEKLY && WEEKLY[key];
    if (b && (!Array.isArray(b) || b.length)) return b;
    return null;
  }

  function week(){ return pick('plainWeek') || []; }
  function areas(){ return pick('areas') || []; }
  function alerts(){ return pick('alerts') || []; }
  function thermal(){ return pick('thermal'); }
  function thermalRows(){ return pick('thermalRows') || []; }
  function systems(){ return pick('systems'); }
  function nowcast(){ return pick('nowcast'); }
  function issued(){ return pick('issued') || ''; }
  function weekendMeta(){ return pick('weekend'); }

  /* ---- dates ----------------------------------------------------------
     Every forecast entry is resolved to a real Date, and relative words are
     resolved against the reader's CLOCK, not against the array index. The
     naive version treated days[0] as "today", which is wrong the moment the
     page is a few hours old - open yesterday's build this morning and it
     cheerfully answers "today" with yesterday's forecast. */

  const MONTHS = ['january','february','march','april','may','june','july',
                  'august','september','october','november','december'];

  function midnight(d){ return new Date(d.getFullYear(), d.getMonth(), d.getDate()); }
  function today(){ return midnight(new Date()); }
  function addDays(d, n){ const x = new Date(d); x.setDate(x.getDate() + n); return x; }
  function sameDay(a, b){ return a.getTime() === b.getTime(); }

  /* Parse "Saturday 15 August" (the stored label) into a Date. The year is not
     in the label, so it is inferred from the issue date and corrected for a
     December-January rollover. */
  function parseLabel(label){
    if (!label) return null;
    const m = label.match(/(\d{1,2})\s+([A-Za-z]+)/);
    if (!m) return null;
    const dom = parseInt(m[1], 10);
    const mon = MONTHS.indexOf(m[2].toLowerCase());
    if (mon < 0) return null;
    let year = new Date().getFullYear();
    const issued = (D.issued || '').match(/(\d{4})/);
    if (issued) year = parseInt(issued[1], 10);
    let dt = new Date(year, mon, dom);
    // A window spanning New Year would otherwise land 12 months out.
    const ref = today();
    if (dt - ref > 300 * 864e5) dt = new Date(year - 1, mon, dom);
    if (ref - dt > 300 * 864e5) dt = new Date(year + 1, mon, dom);
    return dt;
  }

  function dated(){
    return week().map(d => ({ entry: d, date: parseLabel(d.day) }))
                 .filter(x => x.date);
  }

  function windowText(){
    const ds = dated();
    if (!ds.length) return 'the current forecast window';
    const f = ds[0].date, l = ds[ds.length - 1].date;
    const fmt = (x) => x.toLocaleDateString(undefined,
                        { weekday:'short', day:'numeric', month:'short' });
    return `${fmt(f)} to ${fmt(l)}`;
  }

  /* Resolve a target Date from the question, or null. */
  function targetDate(q){
    const ref = today();
    if (/\bday after tomorrow\b/.test(q)) return addDays(ref, 2);
    if (/\btomorrow\b|\btmrw\b|\btmr\b/.test(q)) return addDays(ref, 1);
    if (/\btoday\b|\btonight\b|\bthis evening\b|\bright now\b|\bnow\b/.test(q)) return ref;
    if (/\byesterday\b/.test(q)) return addDays(ref, -1);

    // "15 aug", "aug 15", "15th", "on the 15", "15/8"
    let m = q.match(/\b(\d{1,2})\s*(?:st|nd|rd|th)?\s+(jan|feb|mar|apr|may|jun|jul|aug|sep|oct|nov|dec)/);
    if (!m) {
      const m2 = q.match(/\b(jan|feb|mar|apr|may|jun|jul|aug|sep|oct|nov|dec)[a-z]*\s+(\d{1,2})\b/);
      if (m2) m = [m2[0], m2[2], m2[1]];
    }
    if (m){
      const dom = parseInt(m[1], 10);
      const mon = MONTHS.findIndex(x => x.startsWith(m[2]));
      if (mon >= 0){
        const hit = dated().find(x => x.date.getDate() === dom && x.date.getMonth() === mon);
        return hit ? hit.date : new Date(ref.getFullYear(), mon, dom);
      }
    }
    m = q.match(/\b(\d{1,2})\s*(?:st|nd|rd|th)\b/);
    if (m){
      const dom = parseInt(m[1], 10);
      const hit = dated().find(x => x.date.getDate() === dom);
      if (hit) return hit.date;
    }

    // Weekday name -> the occurrence inside the window.
    for (let i = 0; i < 7; i++){
      const name = WD[i].toLowerCase();
      if (new RegExp('\\b' + name + '\\b').test(q)){
        const hit = dated().find(x => x.date.getDay() === i);
        if (hit) return hit.date;
        for (let k = 1; k <= 7; k++){
          const cand = addDays(ref, k);
          if (cand.getDay() === i) return cand;
        }
      }
    }
    // Bare day-of-month as a last resort, e.g. "rain on 16".
    m = q.match(/\bon\s+(\d{1,2})\b/) || q.match(/\b(\d{1,2})\b/);
    if (m){
      const dom = parseInt(m[1], 10);
      if (dom >= 1 && dom <= 31){
        const hit = dated().find(x => x.date.getDate() === dom);
        if (hit) return hit.date;
      }
    }
    return null;
  }

  /* Entry for a date, or a structured miss explaining why. */
  function findDay(q){
    const want = targetDate(q);
    if (!want) return null;
    const ds = dated();
    const hit = ds.find(x => sameDay(x.date, want));
    if (hit) return hit.entry;
    return { _miss: true, wanted: want };
  }

  function findArea(q){
    const list = areas();
    if (!list.length) return null;
    const alias = {
      'kalyan':'kalyan_belt','dombivli':'kalyan_belt',
      'thane':'thane_belt','bhiwandi':'thane_belt',
      'colaba':'island_city','island city':'island_city','south mumbai':'island_city',
      'suburb':'suburbs','andheri':'suburbs','borivali':'suburbs','bandra':'suburbs',
      'santacruz':'suburbs','chembur':'suburbs','powai':'suburbs',
      'navi mumbai':'navi_mumbai','panvel':'navi_mumbai','vashi':'navi_mumbai',
      'badlapur':'badlapur_belt','ambernath':'badlapur_belt','karjat':'badlapur_belt',
      'vasai':'north_mmr','virar':'north_mmr','palghar':'north_mmr',
      'alibag':'south_mmr','raigad':'south_mmr',
      'matheran':'ghats','lonavala':'ghats','khandala':'ghats','ghat':'ghats',
      'trek':'ghats'
    };
    for (const k in alias){
      if (q.includes(k)){
        const hit = list.find(a => a.key === alias[k]);
        if (hit) return hit;
      }
    }
    for (const a of list){
      if (q.includes((a.name || '').toLowerCase().split('—')[0].trim().toLowerCase())) return a;
    }
    return null;
  }

  /* ---- answer builders ---- */
  function missAnswer(miss){
    const want = miss.wanted;
    const ref = today();
    const label = want.toLocaleDateString(undefined,
                    { weekday:'long', day:'numeric', month:'long' });
    if (want < ref){
      return `${label} is in the past — I only carry the forward forecast `
           + `(${windowText()}). The "what fell" table further down the page `
           + `has recent rainfall.`;
    }
    return `I don't have ${label}. This forecast covers ${windowText()} — `
         + `seven days, no further. Beyond that the honest answer is that `
         + `nobody can say much specific.`;
  }

  function staleNote(){
    // The page is a static build; if it is not from today, say so before
    // answering a question about "today".
    const ds = dated();
    if (!ds.length) return '';
    const first = ds[0].date;
    const gap = Math.round((today() - first) / 864e5);
    if (gap <= 0) return '';
    return `\n\n_Heads up: this page was built ${gap} day${gap > 1 ? 's' : ''} `
         + `ago (data from ${issued() || 'an earlier run'}). Refresh it for a `
         + `current read._`;
  }

  function dayAnswer(d, q){
    if (d && d._miss) return missAnswer(d);
    q = q || d.day || '';
    const head = (d.headline || '').replace(/\.$/, '');
    let s = `${opener(q, moodOf(d))} **${d.day}**: ${head.toLowerCase()}.`;
    if (d.detail) s += `\n\n${d.detail}`;
    if (d.advice) s += `\n\n${d.advice}`;
    if (d.confidence) s += `\n\n_${d.confidence}_`;
    return s + staleNote();
  }

  function isWeekendDay(p){
    // Prefer the flag, but fall back to the day name so this still works on a
    // page rendered before the flag existed.
    if (typeof p.isWeekend === 'boolean') return p.isWeekend;
    return /saturday|sunday/i.test(p.day || '');
  }

  function weekendAnswer(){
    const wk = week().filter(isWeekendDay);
    const meta = weekendMeta();
    if (!wk.length){
      return "The weekend isn't inside the current seven-day window. Ask me "
           + "again closer to the time.";
    }
    let s = meta ? `**${meta.verdict}** ${meta.plans}\n\n` : '';
    s += wk.map(d => {
      const head = (d.headline || '').replace(/\.$/, '');
      let t = `**${d.day}** — ${head.toLowerCase()}.`;
      if (d.detail) t += `\n${d.detail}`;
      if (d.advice) t += `\n${d.advice}`;
      return t;
    }).join('\n\n');
    return s;
  }

  function areaAnswer(a){
    let s = `**${a.name}** — ${a.accumulation || (a.weekMm ? '~' + a.weekMm.toFixed(0) + ' mm' : '')} this week.`;
    if (a.plain) s += `\n${a.plain}`;
    if (a.wettestDay) s += `\nWettest day: ${a.wettestDay}.`;
    if (a.character) s += `\n\n${a.character}`;
    return s;
  }

  function alertAnswer(){
    const list = alerts();
    if (!list.length){
      return "Nothing flagged this week, happily — the pattern just holds "
           + "steady the whole way through. Worth saying that's my own read "
           + "rather than an IMD warning, so check them for anything official.";
    }
    const lead = list.length === 1
      ? "One thing worth knowing about:"
      : `${list.length} things worth knowing about:`;
    return lead + "\n\n"
         + list.map(a => `${a.icon} **${a.title}**\n${a.body}`).join('\n\n');
  }

  function heatAnswer(){
    const t = thermal(), rows = thermalRows();
    if (!t && !rows.length) return "I don't have the heat/cold outlook on this page.";
    let s = t ? `**${t.headline}.**` : '';
    if (rows.length){
      s += '\n\n' + rows.map(r =>
        `${r.place}: warmest ${r.warmest == null ? '--' : r.warmest.toFixed(0) + '°C'}`
        + (r.peakFeels != null ? `, feels like up to ${r.peakFeels.toFixed(0)}°C` : '')
      ).join('\n');
    } else if (t && t.days && t.days.length){
      const hot = t.days.reduce((a,b) => (b.tmax||-99) > (a.tmax||-99) ? b : a);
      const feel = t.days.reduce((a,b) => (b.heatIndex||-99) > (a.heatIndex||-99) ? b : a);
      s += `\n\nWarmest ${hot.day} at ${hot.tmax.toFixed(0)}°C.`;
      if (feel.heatIndex != null)
        s += ` Peak feels-like ${feel.heatIndex.toFixed(0)}°C on ${feel.day}.`;
    }
    if (t && t.caveat) s += `\n\n_${t.caveat}_`;
    return s;
  }

  function systemAnswer(){
    const sy = systems();
    if (!sy) return "I don't have the systems analysis on this page.";
    let s = sy.trough ? sy.trough + '\n\n' : '';
    if (sy.list && sy.list.length){
      s += sy.list.map(x => `**${x.headline}**\n${x.reasoning}`).join('\n\n');
    } else {
      s += "No significant low pressure area or depression tracked within "
         + "range this week.";
    }
    if (sy.cycloneWindow){
      s += "\n\nThis month sits in an Arabian Sea cyclone window. For anything "
         + "beyond casual tracking, IMD's cyclone bulletins are the authority — "
         + "not me.";
    }
    return s;
  }

  function whyAnswer(){
    const regime = pick('regime'), mech = pick('mechanism');
    if (regime || mech){
      let s = regime ? `**${regime}**` : '';
      const note = pick('regimeNote');
      if (note) s += ` — ${note}`;
      if (mech) s += `\n\n${mech}`;
      return s;
    }
    const wr = pick('weekRegime');
    if (wr) return `**${wr.label}.** ${wr.note}`;
    return "I don't have the mechanism breakdown loaded.";
  }

  function nowAnswer(){
    const nc = nowcast();
    if (!nc || !nc.verdict)
      return "No short-range read on this page. The radar links above are the "
           + "better call for the next couple of hours anyway.";
    return `${nc.verdict}\n\nFor the next 0–3 hours radar beats every model `
         + `here — the IMD radar images are further down this page.`;
  }

  function compareAnswer(){
    const list = areas();
    if (list.length < 2){
      return "I don't have enough areas on this page to compare. The **MMR "
           + "week** page has the full nine-area breakdown.";
    }
    const w = list[0], d = list[list.length - 1];
    let s = `Wettest: **${w.name}** (${w.accumulation || w.weekMm.toFixed(0)+' mm'}).\n`
          + `Driest: **${d.name}** (${d.accumulation || d.weekMm.toFixed(0)+' mm'}).\n\n`
          + `Rain isn't uniform across the MMR — coast, transition belt and `
          + `Ghats behave differently in the same setup.`;
    // Never present a ranking from an incomplete field as the final word.
    const total = pick('areasTotal') || 9;
    if (list.length < total){
      s += `\n\n_Note: I have ${list.length} of ${total} areas loaded here. `
         + `The MMR week view carries the full ranking._`;
    }
    return s;
  }

  function helpAnswer(){
    return "I only know this week's forecast — nothing live, nothing beyond "
         + "seven days. Within that, ask me things like:\n"
         + "• how's the weekend looking\n"
         + "• will it rain on Sunday\n"
         + "• what about Thane, the Ghats, Navi Mumbai\n"
         + "• anything I should watch out for\n"
         + "• is it going to be hot\n"
         + "• any low pressure system around\n"
         + "• why is it raining\n"
         + "• which part of the MMR gets the most";
  }

  /* ---- routing ---- */
  function answer(raw){
    const q = (raw || '').toLowerCase().trim();
    if (!q) return helpAnswer();

    if (/^(hi|hello|hey|namaste|yo|good morning|good evening)\b/.test(q))
      return "Hello. What would you like to know? " + helpAnswer();

    if (/thank|thanks|cheers|great|nice work/.test(q))
      return "Any time. Shout if you want the weekend or a particular "
           + "suburb checked.";

    if (/help|what can you|how do i use/.test(q)) return helpAnswer();
    if (/weekend|saturday|sunday/.test(q) && !/only (sat|sun)/.test(q)){
      if (/weekend/.test(q)) return weekendAnswer();
    }
    if (/warn|alert|danger|risk|flood/.test(q)) return alertAnswer();
    if (/heat|hot|temperature|cold|cool|humid/.test(q)) return heatAnswer();
    if (/low pressure|lpa|depression|cyclone|system|trough|iod/.test(q))
      return systemAnswer();
    if (/^why|why is|why are|reason|because|mechanism|cause/.test(q))
      return whyAnswer();
    if (/right now|currently|at the moment|next few hours|nowcast/.test(q))
      return nowAnswer();
    if (/wettest|driest|compare|which (place|area|part)|most rain/.test(q))
      return compareAnswer();

    const day = findDay(q);
    const area = findArea(q);
    if (day && day._miss) return missAnswer(day);
    if (day && area){
      return `${dayAnswer(day, q)}\n\n_That's the Kalyan-anchored day forecast. `
           + `For ${area.name} specifically I only hold the weekly figure: `
           + `${area.accumulation || (area.weekMm ? '~'+area.weekMm.toFixed(0)+' mm' : 'n/a')}, `
           + `wettest ${area.wettestDay || 'n/a'}._`;
    }
    if (day) return dayAnswer(day, q);
    if (area) return areaAnswer(area);

    // A place was clearly meant but no area data is loaded anywhere.
    if (!areas().length && /ghat|lonavala|matheran|thane|vasai|virar|palghar|alibag|panvel|navi|badlapur|karjat|borivali|andheri|bandra|colaba|suburb|dombivli|bhiwandi|pune/.test(q)){
      const d0 = week()[0];
      return "I don't have per-area figures loaded — those come from the "
           + "weekly MMR run.\n\n"
           + (d0 ? `For Kalyan: ${d0.headline}` : '');
    }

    if (/rain|wet|shower|spell|umbrella/.test(q)){
      const days = week();
      if (days.length) return `Here's the week:\n\n`
        + days.map(d => `**${d.short || d.day}** — ${d.headline}`).join('\n');
    }

    return "Sorry — I can't match that to anything I hold. I'd rather say so "
         + "than guess at it.\n\n" + helpAnswer();
  }

  // Every answer goes through deCite, so no route can leak a citation.
  return { answer: (q) => deCite(answer(q)), help: helpAnswer };
})();

/* ---------- live Windy map (tap to load) --------------------------------
   Windy's Map Forecast API is a browser library, not a data feed - it embeds
   the real interactive map. Two consequences shape this:

   1. It pulls scripts from api.windy.com and unpkg.com, so it cannot run
      anywhere external hosts are blocked. The published artifact is exactly
      that case, so the card explains rather than showing a dead frame.
   2. Every load consumes Windy session quota. Loading on demand means a phone
      glancing at the forecast twice a day costs nothing. */
function windyMapHtml(){
  if (!D.windyMapKey) return '';
  const blocked = !!D.artifact;
  if (blocked){
    return `<div class="card"><h2>Live Windy map</h2>
      <p class="sub" style="margin:0">Can't run on this shared page — it needs
      scripts from windy.com, and claude.ai blocks external sources. Open the
      forecast from your own PC or the tunnel link and the map loads inline.</p>
      </div>`;
  }
  return `<div class="card"><h2>Live Windy map</h2>
    <p class="sub" style="margin:-6px 0 12px">The real Windy map, centred on
      Kalyan. Loads only when you ask, so it doesn't burn quota on every visit.</p>
    <div id="windyBox" class="windybox">
      <button class="rbtn" id="windyLoad" type="button">Load live map</button>
      <div class="wmsg">Wind, rain, radar, pressure and CAPE layers — scrub
        forward through time once loaded.</div>
    </div></div>`;
}

let windyLoaded = false;

function loadWindyMap(){
  if (windyLoaded) return;
  const box = document.getElementById('windyBox');
  if (!box || !D.windyMapKey) return;
  windyLoaded = true;
  box.innerHTML = '<div class="wmsg">Loading Windy…</div><div id="windy"></div>';

  const fail = (why) => {
    windyLoaded = false;
    box.innerHTML = `<div class="wmsg">Couldn't load the map: ${esc(why)}.
      <br>The layer links further down still work.</div>
      <button class="rbtn" id="windyLoad" type="button">Try again</button>`;
    bindWindy();
  };

  loadScript('https://unpkg.com/leaflet@1.4.0/dist/leaflet.js')
    .then(() => loadScript('https://api.windy.com/assets/map-forecast/libBoot.js'))
    .then(() => {
      if (typeof windyInit !== 'function') return fail('library did not initialise');
      windyInit({
        key: D.windyMapKey,
        lat: D.lat || 19.2437, lon: D.lon || 73.1305, zoom: 8,
        verbose: false, overlay: 'rain',
      }, () => {
        const m = document.querySelector('#windyBox .wmsg');
        if (m) m.remove();
      });
    })
    .catch(() => fail('network blocked or offline'));
}

function loadScript(src){
  return new Promise((res, rej) => {
    const s = document.createElement('script');
    s.src = src; s.async = true;
    s.onload = res; s.onerror = () => rej(new Error(src));
    document.head.appendChild(s);
  });
}

function bindWindy(){
  const b = document.getElementById('windyLoad');
  if (b && !b.dataset.bound){
    b.dataset.bound = '1';
    b.addEventListener('click', loadWindyMap);
  }
}

/* ---------- background climate drivers ---------------------------------- */
function driversHtml(){
  const d = (DAILY && DAILY.drivers) || (WEEKLY && WEEKLY.drivers);
  if (!d) return '';

  const tiles = [];

  if (d.enso){
    const e = d.enso;
    const tone = e.phase === 'El Nino' ? 'bad' : e.phase === 'La Nina' ? 'good' : 'neu';
    tiles.push({tone, name:'ENSO', value:`${e.phase}`,
      sub:`Niño 3.4 ${e.anomaly >= 0 ? '+' : ''}${e.anomaly.toFixed(2)}°C · ${e.when}`,
      spark:e.recent, text:e.text});
  }
  if (d.iod){
    const i = d.iod;
    const tone = i.phase === 'positive' ? 'good' : i.phase === 'negative' ? 'bad' : 'neu';
    tiles.push({tone, name:'IOD', value:i.phase,
      sub:`proxy DMI ${i.dmi >= 0 ? '+' : ''}${i.dmi.toFixed(2)}°C`,
      text:i.text});
  }
  if (d.mjo){
    const m = d.mjo;
    const tone = m.favourability === 'favourable' ? 'good'
               : m.favourability === 'unfavourable' ? 'bad' : 'neu';
    tiles.push({tone, name:'MJO', value:`Phase ${m.phase}`,
      sub:`${m.region} · ${m.lon.toFixed(0)}°E · ${m.favourability}`,
      spark:m.track, text:m.text});
  }
  if (d.miso){
    const s = d.miso;
    const near = s.lat >= 15 && s.lat < 22;
    tiles.push({tone: near ? 'good' : 'neu', name:'MISO',
      value:`${s.lat.toFixed(0)}°N`,
      sub:s.regime + (s.eta ? ` · ~${s.eta}d away` : ''),
      spark:s.track, text:s.text});
  }
  if (!tiles.length) return '';

  return `<div class="card"><h2>Background climate drivers</h2>
    <p class="sub" style="margin:-6px 0 14px">These tilt the season's odds.
      They do not forecast any single day — the week-to-week pattern does that.</p>
    <div class="dgrid">
      ${tiles.map((t, i) => `<button class="dtile d-${t.tone}" type="button"
          data-drv="${i}" aria-expanded="false">
        <div class="dname">${esc(t.name)}</div>
        <div class="dval">${esc(t.value)}</div>
        <div class="dsub">${esc(t.sub)}</div>
        ${t.spark && t.spark.length > 2 ? sparkSvg(t.spark) : ''}
      </button>`).join('')}
    </div>
    <div class="dtext" id="dtext">Tap any driver for what it means.</div>
    ${d.coherence ? `<div class="quote">${mdBold(d.coherence.replace(/^>\s*/, ''))}</div>` : ''}
  </div>`;
}

/* ---------- the track record ------------------------------------------- */
/* The point of this card is that a reader can check the agent rather than
   trust it. Each day shows what was forecast the day before against what
   actually fell, so a bad call stays visible instead of being averaged away.
   The most recent days deliberately show no verdict: ERA5 lags about five
   days, and filling that gap with the model's own analysis would be the agent
   marking its own homework. */
function trackHtml(D){
  const t = D.track;
  if (!t || !t.available || !t.days || !t.days.length) return '';
  const vals = t.days.flatMap(d => [d.fc || 0, d.obs || 0]);
  const max = Math.max(8, ...vals);
  const H = 54;
  const bar = v => Math.max(2, Math.round((v || 0) / max * H));

  const rows = t.days.map(d => {
    const pending = d.obs === null || d.obs === undefined;
    const cls = pending ? 'pend'
      : (d.verdict === 'hit' || d.verdict === 'correct_dry') ? 'ok' : 'bad';
    const tip = pending
      ? `${d.label}: forecast ${(d.fc||0).toFixed(0)} mm — not yet verified`
      : `${d.label}: forecast ${(d.fc||0).toFixed(0)} mm, actual ${(d.obs||0).toFixed(0)} mm`;
    return `<div class="tday ${cls}" title="${esc(tip)}">
      <div class="tbars">
        <div class="tb tf" style="height:${bar(d.fc)}px"></div>
        <div class="tb to${pending ? ' tp' : ''}" style="height:${pending ? 2 : bar(d.obs)}px"></div>
      </div>
      <div class="tlab">${esc(d.label.split(' ')[1] || d.label)}</div>
    </div>`;
  }).join('');

  return `<div class="card"><h2>Track record — has it actually been right?</h2>
    <p class="sub" style="margin:-6px 0 12px">Each pair of bars is one day:
      what was forecast the evening before, against what actually fell.</p>
    <p style="margin:0 0 14px">${mdBold(t.summary)}</p>
    <div class="tkey">
      <span><i class="k-f"></i>forecast</span>
      <span><i class="k-o"></i>actual</span>
      <span><i class="k-p"></i>not yet verified</span>
    </div>
    <div class="tstrip">${rows}</div>
    <div class="tstats">
      ${t.bandPct != null ? `<div class="tstat"><b>${t.bandPct}%</b><span>right rainfall band</span></div>` : ''}
      ${t.maeWet != null ? `<div class="tstat"><b>${t.maeWet} mm</b><span>average error on wet days</span></div>` : ''}
      <div class="tstat"><b>${t.verified}</b><span>days verified</span></div>
    </div>
    <div class="quote">Forecasts are the run issued the day <i>before</i> each
      date, pulled from the archive — not today's model replayed over the past,
      which would show fake skill. Truth is ERA5 reanalysis, which lags about
      five days; the last few days show their forecast with the verdict still
      pending rather than being scored against the model's own analysis.</div>
  </div>`;
}

/* When rain reaches each region, from a three-model steering wind.
   Placed above the belt table because it answers the sharper question - the
   table says how much the model gives you this hour, this says when the stuff
   currently upstream actually gets to you, and by how much the three models
   disagree about that. */
function arrivalsHtml(D){
  const a = D.arrivals;
  if (!a || !a.available || !a.list || !a.list.length) return '';
  const agree = a.agreement === 'tight'
      ? 'All three models agree closely, so these timings are as firm as this method gets.'
    : a.agreement === 'moderate'
      ? 'The models differ a little, so treat these as give-or-take.'
      : 'The models disagree noticeably — that disagreement is itself the warning.';
  const per = Object.entries(a.perModel || {})
      .map(([k, v]) => `${esc(MODEL_SHORT[k] || k)} ${v[0]}`).join(' · ');

  const row = x => {
    if (x.now) return `<div class="arr a-now"><div class="an">${esc(x.name)}</div>
        <div class=" av">Raining now</div></div>`;
    if (x.km === null || x.km === undefined)
      return `<div class="arr a-clear"><div class="an">${esc(x.name)}</div>
        <div class="av">Clear upstream</div></div>`;
    const win = (x.etaHi != null && x.etaLo != null && x.etaHi - x.etaLo >= 10)
      ? `<span class="aw">${x.etaLo}–${x.etaHi} min</span>` : '';
    const cls = x.eta <= 30 ? 'a-soon' : x.eta <= 75 ? 'a-mid' : 'a-later';
    return `<div class="arr ${cls}"><div class="an">${esc(x.name)}</div>
      <div class="av">~${x.eta} min ${win}</div>
      <div class="ad">${x.km.toFixed(0)} km upstream · ${x.mmH} mm/hr</div></div>`;
  };

  return `<h3>When it reaches each area</h3>
    <p class="rhead">Rain is moving on a <b>${esc(compassOf(a.fromDeg))}</b>
      wind at about <b>${a.speedKmh} km/h</b>. ${esc(agree)}
      <span class="amods">${per} km/h</span></p>
    <div class="arrs">${a.list.map(row).join('')}</div>
    <p class="rwarn" style="margin-top:10px">Arrival time is distance divided
      by wind speed, so it assumes the rain keeps moving and keeps going —
      cells die on the way. Positions come from the model analysis, which
      smooths a shower across a 25 km box. <b>For what is falling right now the
      radar section above outranks this</b> &mdash; that one is an observation.
      This answers the next question: where the model puts rain in a few
      hours.</p>`;
}

const MODEL_SHORT = {ecmwf_ifs025:'ECMWF', gfs_seamless:'GFS', icon_seamless:'ICON'};
function compassOf(deg){
  if (deg === null || deg === undefined) return 'westerly';
  const p = ['N','NNE','NE','ENE','E','ESE','SE','SSE','S','SSW','SW','WSW','W','WNW','NW','NNW'];
  return p[Math.round(((deg % 360) / 22.5)) % 16];
}

/* ---------- reading the radar, in plain words --------------------------- */
/* The two images above are the products IMD publishes by default, and both
   are routinely misread. MAX-Z is the strongest echo anywhere in the column,
   so it flags a growing cell before anything reaches the ground - which is
   exactly why it overstates what you will feel. SRI is that reflectivity
   converted to a surface rain rate, which is closer to experience but
   inherits every assumption in the conversion. Saying so is the difference
   between a picture and a forecast. */
function radarExplainHtml(D){
  const nc = D.nowcast || {};
  const b  = D.belts;
  let h = `<div class="rexp">
    <h3>What the two pictures above actually mean</h3>
    <div class="rgrid">
      <div class="rcard">
        <div class="rname">MAX-Z <span>maximum reflectivity</span></div>
        <p>The radar looks through the whole depth of the cloud and shows you
        the <b>strongest thing it finds anywhere in that column</b> — usually
        several kilometres up.</p>
        <ul>
          <li><b>Blue / green</b> — light rain or drizzle.</li>
          <li><b>Yellow</b> — steady, proper rain.</li>
          <li><b>Orange / red</b> — heavy downpour, the kind that floods a road
            in under an hour.</li>
          <li><b>Purple / white</b> — extreme core, often with hail aloft.</li>
        </ul>
        <p class="rwarn">Because it reads the top of the cloud, a red blob does
        <b>not</b> guarantee red rain on your street — the drops still have to
        survive the fall. Use it to spot cells <i>growing</i>.</p>
      </div>
      <div class="rcard">
        <div class="rname">SRI <span>surface rainfall intensity</span></div>
        <p>The same echo, converted into <b>how hard it is raining at ground
        level</b> — millimetres per hour. This is the one closest to what you
        would feel standing outside.</p>
        <ul>
          <li><b>Under 2 mm/hr</b> — you would barely bother with an umbrella.</li>
          <li><b>2–10 mm/hr</b> — ordinary monsoon rain.</li>
          <li><b>10–20 mm/hr</b> — heavy; low roads start holding water.</li>
          <li><b>Over 20 mm/hr</b> — torrential; waterlogging within the hour.</li>
        </ul>
        <p class="rwarn">The conversion from echo to rain rate is an estimate,
        not a measurement. In a heavy monsoon burst SRI tends to <b>under-read</b>
        what the gauges catch.</p>
      </div>
    </div>
    <p class="rhow"><b>How to read them together:</b> if MAX-Z is bright but SRI
    is faint, the cell is still building aloft — the rain has not arrived yet.
    If both are bright over the same spot, that is where it is coming down hard
    right now. If MAX-Z fades while SRI stays lit, the cell is dying and the
    rain you feel is what is left falling out of it.</p>`;

  /* The burst warning goes ABOVE the numbers, not below them: its whole
     point is to change how the rates underneath are read. */
  if (D.burst && D.burst.note){
    h += `<div class="burst b-${esc(D.burst.level)}">${mdBold(D.burst.note)}</div>`;
  }

  /* OBSERVATION BEFORE MODEL. Everything below this point is a model's
     opinion about the day; this block is the beam reporting what is actually
     in the air over each place. Where the two disagree about the present
     tense, this one is right, and putting it second would bury that. */
  if (D.radarNow && D.radarNow.belts && D.radarNow.belts.length){
    const R = D.radarNow;
    const band = v => v < 0.5 ? 'nothing' : v < 2.5 ? 'light'
                    : v < 7.5 ? 'moderate' : v < 20 ? 'heavy' : 'very heavy';
    const wet = R.belts.filter(x => x.hereMmH >= 0.5 && x.doubt !== 'clutter');
    const has = v => v !== null && v !== undefined;
    h += `<h3>What the radar can see falling right now</h3>`;
    /* The C-band picture itself, cropped to the MMR, with its own time - so
       an older frame shown beside an S-band reading is labelled as older. */
    if (R.image && String(R.image).startsWith('data:image/')){
      const L = R.legend || [];
      const grad = L.map(([v, c]) =>
        `${c} ${((v - 20) / 40 * 100).toFixed(1)}%`).join(',');
      h += `<figure class="radimg">
        <img src="${R.image}" alt="IMD C-band radar reflectivity over the Mumbai region">
        <figcaption>IMD <b>C-band DWR Mumbai</b> (Veravali) &middot; MAX-Z &middot;
          ${esc(R.imageWhen || '')}${has(R.imageAgeMin)
            ? ` &middot; ${R.imageAgeMin} min old` : ''} &middot; ring = Kalyan West</figcaption>
        ${grad ? `<div class="dbzbar" style="background:linear-gradient(90deg,${grad})"></div>
        <div class="dbzticks"><span>20 dBZ<br>~0.6 mm/hr</span><span>30<br>~3</span>
          <span>40<br>~12</span><span>50<br>~49</span><span>60 dBZ</span></div>` : ''}
      </figure>`;
    }
    h += `<p class="rhead">Observation, not forecast. Read from IMD's
        <b>${esc(R.site || 'Mumbai radar')}</b>, ${esc(R.when || 'at an unknown time')}${
          has(R.ageMin) ? ` (${R.ageMin} min ago)` : ''}.
        ${wet.length
          ? 'Rain is reaching the ground over <b>' +
            wet.map(x => esc(x.name)).join(', ') + '</b>.'
          : '<b>Nothing is reaching the ground anywhere in the MMR</b> on this scan.'}</p>
      ${R.note ? `<div class="quote">${esc(R.note)}</div>` : ''}
      ${R.checkNote ? `<div class="quote">${esc(R.checkNote)}</div>` : ''}
      <div class="belts">` + R.belts.map(x => {
        const st = band(x.hereMmH);
        const cls = st === 'nothing' ? 'b-dry'
                  : (st === 'light' ? 'b-drizzling' : 'b-raining');
        const near = (x.nearMmH >= 2.5 && x.nearKm > 3)
          ? `${band(x.nearMmH)} ~${x.nearKm} km away`
          : (x.nearMmH > 0 ? 'only light echo nearby'
                           : 'clear for 16 km around');
        const second = (R.secondName && has(x.secondMmH))
          ? ` &middot; <span class="muted">${esc(R.secondName)} check: ${band(x.secondMmH)}</span>`
          : '';
        const doubt = x.doubt === 'clutter'
          ? `<div class="rwarn">Unconfirmed &mdash; the other radar sees nothing
             here. Possibly clutter off the hills rather than rain.</div>`
          : x.doubt === 'blocked'
          ? `<div class="rwarn">The other radar has rain here. Heavy rain in
             between may be weakening this beam.</div>` : '';
        return `<div class="belt ${cls}">
          <div class="bname">${esc(x.name)}</div>
          <div class="bsent">${st === 'nothing'
            ? 'Nothing overhead'
            : `<b>${st.charAt(0).toUpperCase() + st.slice(1)} rain</b> &middot; ~${x.hereMmH} mm/hr`}
            &middot; <span class="muted">${near}</span>${second}</div>${doubt}
        </div>`;
      }).join('') + `</div>`;
    if (R.peakDbz){
      h += `<p class="rhow">Strongest return anywhere in range
        <b>${Math.round(R.peakDbz)} dBZ</b> &mdash; about <b>${R.peakMmH} mm/hr</b>
        where it is falling.</p>`;
    }
    h += `<p class="rwarn" style="margin-top:8px">Rates come from reflectivity
      via the standard Marshall&ndash;Palmer relationship, an average over many
      storms rather than a measurement of this one &mdash; the same 40 dBZ can
      be 6 mm/hr in one shower and 20 in another. Trust the <b>where</b> and
      the <b>whether</b> far more than the millimetres.</p>`;
  }

  h += arrivalsHtml(D);

  if (b && b.available && b.list && b.list.length){
    h += `<h3>Next few hours, belt by belt</h3>
      ${b.headline ? `<p class="rhead">${mdBold(b.headline)}</p>` : ''}
      <div class="belts">` +
      b.list.map(x => `<div class="belt b-${esc(x.state)}">
        <div class="bname">${esc(x.name)}</div>
        <div class="bsent">${mdBold(x.sentence)}</div>
        ${hourStrip(x)}
      </div>`).join('') +
      `</div>
      ${D.beltsNote ? `<div class="beltsnote">${mdBold(D.beltsNote)}</div>` : ''}
      <p class="rwarn" style="margin-top:10px">These come from the hourly model
      field sampled at each place, <b>not</b> from the radar picture above.
      Inside an hour the radar loop is the better guide — this tells you which
      belts to watch on it.</p>`;
  }

  h += radarAnimHtml(nc, b);
  h += `</div>`;
  return h;
}

/* Next three hours for one belt, as a row of labelled cells.
   The sentence above says what it means; this says how much and when, which
   words cannot do compactly. Cells are tinted by rain rate on the same
   thresholds the sentences use, so "moderate" looks the same everywhere. */
function hourStrip(x){
  const hrs = (x.hours || []).slice(0, 3);
  const labs = (x.hourLabels || []).slice(0, 3);
  if (!hrs.length || !labs.length) return '';
  const tone = v => v >= 20 ? 'h4' : v >= 10 ? 'h3' : v >= 4 ? 'h2'
                  : v >= 1 ? 'h1' : v >= 0.2 ? 'h0' : 'hz';
  const cell = (lab, v) => `<div class="hcell ${tone(v)}">
      <div class="hval">${v.toFixed(1)}</div>
      <div class="hlab">${esc(lab)}</div>
    </div>`;
  return `<div class="hstrip">
    ${cell('now', x.nowMmH || 0)}
    <span class="harrow">→</span>
    ${hrs.map((v, i) => cell(labs[i] || '', v)).join('')}
    <span class="hunit">mm/hr</span>
  </div>`;
}

/* ---------- the animation ------------------------------------------------ */
/* A west-to-east slice through the region: sea on the left, the city belts in
   the middle, the Ghat wall on the right. Blobs ride the steering flow across
   it and grow as they climb, which is the single mechanism that decides
   whether a Kalyan reader gets ten minutes of drizzle or two hours of rain.
   Speed of the animation is set from the actual steering wind, so a fast band
   visibly races and a slack one crawls. */
function radarAnimHtml(nc, b){

/* ISO date -> short weekday for the upstream strip. Parsed as local midday so
   a timezone offset cannot roll the label onto the neighbouring day. */
function dayShort(iso){
  if (!iso) return '';
  const p = String(iso).split('-').map(Number);
  if (p.length !== 3 || p.some(isNaN)) return String(iso);
  const d = new Date(p[0], p[1] - 1, p[2], 12, 0, 0);
  return d.toLocaleDateString(undefined, { weekday: 'short' });
}

/* Tiny inline sparkline for a driver's recent track. */
function sparkSvg(vals){
  const w = 96, h = 22;
  const lo = Math.min(...vals), hi = Math.max(...vals);
  const span = (hi - lo) || 1;
  const pts = vals.map((v, i) =>
    `${(i / (vals.length - 1) * w).toFixed(1)},${(h - (v - lo) / span * h).toFixed(1)}`
  ).join(' ');
  return `<svg class="dspark" viewBox="0 0 ${w} ${h}" preserveAspectRatio="none"
    aria-hidden="true"><polyline points="${pts}" fill="none"
    stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"
    stroke-linecap="round" opacity=".75"/></svg>`;
}

function bindDrivers(){
  const grid = document.querySelector('.dgrid');
  if (!grid || grid.dataset.bound) return;
  grid.dataset.bound = '1';
  const d = (DAILY && DAILY.drivers) || (WEEKLY && WEEKLY.drivers) || {};
  const texts = [d.enso, d.iod, d.mjo, d.miso].filter(Boolean).map(x => x.text);
  grid.addEventListener('click', ev => {
    const btn = ev.target.closest('.dtile');
    if (!btn) return;
    grid.querySelectorAll('.dtile').forEach(b => {
      b.classList.toggle('sel', b === btn);
      b.setAttribute('aria-expanded', String(b === btn));
    });
    const out = document.getElementById('dtext');
    if (out) out.textContent = texts[+btn.dataset.drv] || '';
  });
}

/* ---------- week summary: what happened, what's coming, and why ---------- */
function summaryHtml(){
  const s = (DAILY && DAILY.summary) || (WEEKLY && WEEKLY.summary);
  if (!s || !s.days || !s.days.length) return '';

  const maxMm = Math.max(...s.days.map(d => d.hi), 1);
  const strip = s.days.map(d => {
    const pct = Math.max(4, Math.round(d.hi / maxMm * 100));
    // Observed days are visually distinct from forecast ones - a reader must
    // be able to see where measurement stops and prediction begins.
    const cls = d.observed ? 'sday obs' : 'sday fc';
    return `<div class="${cls}" title="${esc(d.day)}: ${d.hi.toFixed(1)} mm — ${esc(d.note)}">
      <div class="sbarwrap"><div class="sbar" style="height:${pct}%"></div></div>
      <div class="sval">${d.hi < 1 ? '–' : d.hi.toFixed(0)}</div>
      <div class="slab">${esc(d.day.split(' ').slice(0,2).join(' '))}</div>
    </div>`;
  }).join('');

  return `<section class="card summary">
    <h2>The week in context — ${esc(s.start)} to ${esc(s.end)}</h2>
    <p class="sbig">${esc(s.headline)}</p>
    <p class="sub" style="margin:0 0 14px">${esc(s.outlook)}</p>

    <div class="sstrip">${strip}</div>
    <div class="skey">
      <span><i class="kobs"></i> measured</span>
      <span><i class="kfc"></i> forecast</span>
    </div>

    <details class="sdet" open>
      <summary>Why the weather is doing this</summary>
      ${s.meteorology.map(t => `<p>${mdBold(t)}</p>`).join('')}
    </details>

    <details class="sdet">
      <summary>Why the region splits the way it does</summary>
      ${s.geography.map(t => `<p>${mdBold(t)}</p>`).join('')}
    </details>
  </section>`;
}

/* Only bold + italic are honoured, and only after escaping, so nothing in the
   data can inject markup. */
function mdBold(t){
  return esc(t).replace(/\*\*(.+?)\*\*/g, '<b>$1</b>')
               .replace(/\*(.+?)\*/g, '<i>$1</i>');
}

function skodaHtml(){
  return `<div class="skoda">
    <div class="sk-head">
      <div class="sk-av">🌂</div>
      <div>
        <div class="sk-name">Sam</div>
        <div class="sk-role">Answers from this week's forecast — nothing else</div>
      </div>
    </div>
    <div class="sk-log" id="skLog"></div>
    <form class="sk-form" id="skForm">
      <input class="sk-in" id="skIn" placeholder="Ask about this week's weather…"
             autocomplete="off" aria-label="Ask Sam about the forecast">
      <button class="sk-send" type="submit">Ask</button>
    </form>
    <div class="sk-chips" id="skChips">
      ${["How's the weekend?","Any warnings?","What about the Ghats?",
         "Why is it raining?","Wettest place this week?"]
        .map(c => `<button class="sk-chip" type="button">${c}</button>`).join('')}
    </div>
  </div>`;
}

/* Handlers are bound in JS rather than written as onclick/onsubmit attributes.
   A page served under a nonce-based Content-Security-Policy runs the script tag
   but silently refuses inline attribute handlers - which would leave every
   button here looking normal and doing nothing. Binding avoids depending on
   the host's CSP at all. */
function skodaBind(){
  const form = document.getElementById('skForm');
  if (form && !form.dataset.bound){
    form.dataset.bound = '1';
    form.addEventListener('submit', skAsk);
  }
  const chips = document.getElementById('skChips');
  if (chips && !chips.dataset.bound){
    chips.dataset.bound = '1';
    chips.addEventListener('click', (ev) => {
      const btn = ev.target.closest('.sk-chip');
      if (btn) skChip(btn);
    });
  }
}

function skPush(text, who){
  const log = document.getElementById('skLog');
  if (!log) return;
  const el = document.createElement('div');
  el.className = 'sk-msg ' + (who === 'q' ? 'sk-q' : 'sk-a');
  // Minimal markdown: bold and italics only, escaped first.
  el.innerHTML = esc(text)
    .replace(/\*\*(.+?)\*\*/g, '<b>$1</b>')
    .replace(/_(.+?)_/g, '<i>$1</i>');
  log.appendChild(el);
  log.scrollTop = log.scrollHeight;
}

function skAsk(ev){
  if (ev) ev.preventDefault();
  const input = document.getElementById('skIn');
  if (!input) return false;
  const q = input.value.trim();
  if (!q) return false;
  skPush(q, 'q');
  input.value = '';
  setTimeout(() => skPush(SK.answer(q), 'a'), 160);
  return false;
}

function skChip(btn){
  const input = document.getElementById('skIn');
  if (!input) return;
  input.value = btn.textContent;
  skAsk(null);
}

/* ---------- refresh (only when served by wxagent serve) ---------- */
/* Two conditions, both required:
   - an http(s) origin, because opened straight from disk there is no server;
   - not the published artifact, which IS https but is a static snapshot on
     claude.ai with no /api/refresh behind it. Showing the button there would
     give a control that always fails - worse than no control at all. */
/* A public static host is https but has no /api/refresh behind it, exactly
   like the artifact - so the refresh control is suppressed there too rather
   than shipping a button that always fails. */
const SERVED = (location.protocol === 'http:' || location.protocol === 'https:')
               && !D.artifact && !D.public;

/* The repository whose Actions run the cloud update. Used only to build the
   Update link on the public build. */
const REPO = 'steve-csv/kalyan-weather';

function refreshBarHtml(){
  if (SERVED){
    return `<div class="rbar">
      <button class="rbtn" id="rbtn" type="button">Refresh forecast</button>
      <div class="rmsg" id="rmsg">Rebuilds today's forecast on your PC. Takes about a minute.</div>
    </div>`;
  }
  /* On the public site there is no server to call, so the button cannot
     rebuild the page itself. What it CAN do is send you to the one screen
     that will: the workflow's Run page on GitHub. That works from a phone,
     needs no key embedded in a world-readable page, and is honest about
     where the work happens - which a button that silently failed would not
     be. */
  if (D.public){
    return `<div class="rbar">
      <a class="rbtn" target="_blank" rel="noopener"
         href="https://github.com/${REPO}/actions/workflows/forecast.yml">
        Update forecast &rarr;</a>
      <div class="rmsg">Opens GitHub, where you press <b>Run workflow</b>.
        The page rebuilds itself in the cloud and is live in two or three
        minutes — your laptop does not need to be on.</div>
    </div>`;
  }
  return '';
}

let pollTimer = null;

async function doRefresh(){
  const btn = document.getElementById('rbtn');
  const msg = document.getElementById('rmsg');
  if (!btn || !msg) return;
  btn.disabled = true;
  msg.textContent = 'Starting…';
  try {
    const r = await fetch('/api/refresh', {method:'POST'});
    const j = await r.json();
    msg.textContent = j.message || j.status;
    if (r.status === 202){
      pollStatus();
    } else {
      btn.disabled = false;   // cooldown or already-running: let them retry
    }
  } catch (e) {
    msg.textContent = 'Could not reach the PC. Is it awake and on the same WiFi?';
    btn.disabled = false;
  }
}

async function pollStatus(){
  const btn = document.getElementById('rbtn');
  const msg = document.getElementById('rmsg');
  clearTimeout(pollTimer);
  try {
    const r = await fetch('/api/status');
    const s = await r.json();
    if (s.running){
      msg.textContent = 'Rebuilding on the PC…';
      pollTimer = setTimeout(pollStatus, 4000);
      return;
    }
    if (s.last_result === 'ok'){
      msg.textContent = 'Done — reloading.';
      setTimeout(() => location.reload(), 700);
      return;
    }
    if (s.last_result){
      msg.textContent = 'Failed: ' + (s.last_error || s.last_result);
    }
  } catch (e) {
    msg.textContent = 'Lost contact with the PC.';
  }
  if (btn) btn.disabled = false;
}

/* ---------- build ---------- */
const statusText = {none:'No meaningful rain', good:'Light', warning:'Moderate',
                    serious:'Heavy', critical:'Very heavy'};

function render(){
  if (D.page === 'weekly') return renderWeekly();
  const c = D.confidence, ing = D.ingredients;
  const probTxt = D.probability !== null ? D.probability + '%' : D.modelAgreement;
  let h = '';

  h += `<header>
    <div>
      <h1>${esc(D.site)} — rain forecast</h1>
      <p class="sub">${esc(D.validDate)} · issued ${esc(D.issued)} · ${esc(D.season)}</p>
    </div>
    ${navHtml('today')}
  </header>` + refreshBarHtml();

  /* ---- right now: the radar leads, the model follows ----
     The one line worth reading on a phone. When there is a fresh scan it says
     what the beam sees falling, and only then what the models expect. */
  if (D.nowLine){
    h += `<div class="card"><h2>Right now</h2>
      <p class="rhead" style="margin:0">${mdBold(D.nowLine)}</p></div>`;
  }

  /* ---- what KIND of rain ----
     Placed before the amounts. Millimetres alone cannot tell a reader what a
     day will feel like: twelve from the monsoon is a grey hours-long soak,
     twelve from an easterly storm is one violent quarter-hour. The driver
     also decides WHERE it lands, because an easterly reverses the terrain. */
  if (D.rainSource && D.rainSource.headline){
    const S = D.rainSource;
    const tw = S.thunder === 'likely' ? 'Thunderstorms likely'
             : S.thunder === 'possible' ? 'Thunderstorms possible' : '';
    h += `<div class="card"><h2>What kind of rain this is</h2>
      <div class="srcline">
        <span class="srctag src-${esc(S.key)}">${esc(S.label)}</span>
        ${tw ? `<span class="srctag src-thunder">&#9889; ${tw}</span>` : ''}
        ${S.windFrom !== null && S.windFrom !== undefined
          ? `<span class="srcwind">850 hPa wind ${S.windFrom}&deg; at ${S.windMs} m/s</span>` : ''}
      </div>
      <p class="rhead" style="margin-top:10px"><b>${esc(S.headline)}.</b></p>
      ${mdBold(S.detail).split(/\n\n+/).map(p => `<p class="pt">${p}</p>`).join('')}
      ${S.terrain ? `<div class="quote">${mdBold(S.terrain)}</div>` : ''}
      ${tw && S.burst !== null && S.burst !== undefined && S.burst >= 0.28
        ? `<p class="rhow">About <b>${Math.round(S.burst*100)}%</b> of the day's
           rain is modelled to fall in a single hour &mdash; the shape of a
           shower rather than of steady rain.</p>` : ''}
      ${S.contributors && S.contributors.length
        ? `<p class="rhow">Also in play: ${S.contributors.map(mdBold).join('; ')}.</p>` : ''}
    </div>`;
  }

  if (D.alerts && D.alerts.length){
    h += `<div class="card" style="border-color:var(--alert-edge)">
      <h2>⚡ Major weather shifts — next 7 days</h2>
      ${D.alerts.map(a => `<div class="alert a-${esc(a.severity)}">
        <div class="ai">${esc(a.icon)}</div>
        <div><div class="at"><span class="tag">${esc(a.label)}</span> ${esc(a.title)}</div>
        <div class="ab">${mdBold(a.body)}${subList(a.points)}</div></div></div>`).join('')}
    </div>`;
  } else {
    h += `<div class="card"><h2>⚡ Major weather shifts</h2>
      <p class="sub" style="margin:0">No major shifts in the next seven days —
        the pattern holds steady throughout.</p></div>`;
  }

  h += summaryHtml();
  h += windyMapHtml();
  h += driversHtml();
  h += skodaHtml();

  /* ---- the weekend, called out on its own ---- */
  if (D.weekend && D.plainWeek){
    const wk = D.plainWeek.filter(p => p.isWeekend);
    if (wk.length){
      h += `<div class="card"><h2>This weekend</h2>
        <p style="margin:0 0 4px;font-size:16px;font-weight:620">${esc(D.weekend.verdict)}</p>
        <p class="sub" style="margin:0 0 12px">${esc(D.weekend.plans)}</p>
        ${wk.map(p => `<div class="pday">
          <div class="pic">${esc(p.icon)}</div>
          <div class="pbody">
            <div class="pd">${esc(p.day)}</div>
            <div class="ph">${esc(p.headline)}</div>
            ${p.detail ? `<div class="pt">${esc(p.detail)}</div>` : ''}
            ${p.advice ? `<div class="pa">${esc(p.advice)}</div>` : ''}
            <div class="pc">${esc(p.confidence)}</div>
          </div></div>`).join('')}

  /* ---- plain English week ---- */
  if (D.plainWeek && D.plainWeek.length){
    h += `<div class="card"><h2>In plain English</h2>
      <p class="sub" style="margin:-6px 0 14px">The forecast. Everything further
        down is the working behind it.</p>`;
    let prevAdvice = null, prevChar = null;
    h += D.plainWeek.map(p => {

        <div class="pic">${esc(p.icon)}</div>
        <div class="pbody">
          <div class="pd">${esc(p.day)}</div>
          <div class="ph">${esc(p.headline)}</div>
          ${p.detail ? `<div class="pt">${esc(p.detail)}</div>` : ''}
          ${showAdvice ? `<div class="pa">${esc(p.advice)}</div>` : ''}

  /* hero + headline */
  h += `<div class="card">
    <div class="hero">
      <div class="fig">${esc(probTxt)}</div>
      <div class="cap">chance of measurable rain (&ge;${D.heavyThreshold ? '2.5' : '2.5'} mm)

  /* tiles */
  h += `<div class="card"><h2>At a glance</h2><div class="tiles">
    <div class="tile"><div class="lab">Rain range</div><div class="val">${D.rainLo.toFixed(0)}–${D.rainHi.toFixed(0)}<span style="font-size:14px;font-weight:500"> mm</span></div>
      <div class="note">median ${D.rainMedian.toFixed(0)} mm</div></div>
    <div class="tile"><div class="lab">Peak hourly rate</div><div class="val">${D.peakRate}<span style="font-size:14px;font-weight:500"> mm/h</span></div>
      <div class="note">${D.wetHours} wet hours, longest run ${D.longestRun} h</div></div>
    <div class="tile"><div class="lab">Heavy-rain chance</div><div class="val">${D.probHeavy !== null ? D.probHeavy + '%' : '--'}</div>
      <div class="note">&ge;${D.heavyThreshold} mm/24h (IMD heavy)</div></div>
    <div class="tile"><div class="lab">Confidence — rain occurs</div><div class="val" style="font-size:17px">${esc(c.occurrence)}</div>${meter(c.occurrenceRank)}</div>
    <div class="tile"><div class="lab">Confidence — amount</div><div class="val" style="font-size:17px">${esc(c.amount)}</div>${meter(c.amountRank)}</div>
    <div class="tile"><div class="lab">Confidence — timing</div><div class="val" style="font-size:17px">${esc(c.timing)}</div>${meter(c.timingRank)}</div>

  <div class="quote">${esc(c.rationale)}</div></div>`;

  /* mechanism */
  h += `<div class="card"><h2>Mechanism — why, before how much</h2>
    <p style="margin:0 0 8px"><b>${esc(D.regime)}</b> — ${esc(D.regimeNote)}</p>
