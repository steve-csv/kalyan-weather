                 + "the Kalyan daily page.";
    let s = `**${M.label}.** ${M.sentence}`;
    const met = (M.criteria || []).filter(c => c.ok);
    const not = (M.criteria || []).filter(c => !c.ok);
    if (met.length) s += `\n\nMet: ` + met.map(c => c.name.toLowerCase()).join('; ') + '.';
    if (not.length) s += `\nNot met: ` + not.map(c => c.name.toLowerCase()).join('; ') + '.';
    s += "\n\nIMD declares withdrawal from its own station network — this is "
       + "me reading the same criteria off the model analysis, so treat it as "
       + "the signature arriving rather than the date being set.";
    return s;
  }
  function fogAnswer(q){
    const F = pick('fog');
    // Honour a named day. Answering "will it be foggy tomorrow?" with
    // Monday's fog is true and still reads as yes.
    const want = q ? targetDate(q) : null;
    if (want && F && F.length){
      const label = `${['Sun','Mon','Tue','Wed','Thu','Fri','Sat'][want.getDay()]} `
                  + String(want.getDate()).padStart(2, '0');
      const onDay = F.find(x => (x.day || '').startsWith(label));
      if (!onDay)
        return `No fog or mist expected that morning. The next one I can see `
             + `is **${F[0].day}** — ${F[0].sentence}`;
      return `**${onDay.day}** — ${onDay.sentence}`;
    }
    if (!F || !F.length)
      return "No fog or mist in the next seven mornings. I look for four "
           + "things together: the air cooling to within a degree or two of "
           + "its dew point, wind under about 3 m/s, a clear sky, and a big "
           + "overnight temperature fall — that last one is what separates "
           + "real radiation fog from air that is merely damp.";
    const f = F[0];
    let s = `**${f.day}** — ${f.sentence}`;
    if (F.length > 1) s += `\n\n${F.length} mornings flagged this week.`;
    s += "\n\nOnly GFS publishes a visibility field for this point, so I work "
       + "from the ingredients and show you each model separately rather than "
       + "averaging a disagreement into false confidence.";
    return s;
  }
  function windAnswer(){
    const W = pick('wind');
    if (!W || !W.length) return "No wind read on this view.";
    const w = W[0];
    let s = `**${w.day}** — ${w.sentence}`;
    const gusty = W.filter(x => x.gustKmph && x.gustKmph >= 35);
    if (gusty.length){
      const top = gusty.reduce((a, b) => b.gustKmph > a.gustKmph ? b : a);
      s += `\n\nWindiest: **${top.day}**, gusting ${top.gustKmph} kmph. `
         + `IMD's fishermen's advisory starts at 35 kmph and "squally" at 45.`;
    } else {
      s += `\n\nNothing above IMD's 35 kmph advisory threshold this week.`;
    }
    const sb = W.filter(x => x.seaBreezeHour !== null && x.seaBreezeHour !== undefined);
    if (sb.length)
      s += `\n\nThe sea breeze reaches Kalyan around ${sb[0].seaBreezeHour}:00 `
         + `on ${sb[0].day} — it arrives later here than on the shore because `
         + `the front has 30-odd km of land to cross first.`;
    return s;
  }
  function feelsAnswer(){
    const W = pick('wind');
    if (!W || !W.length) return heatAnswer();
    const withFeel = W.filter(x => x.feels !== null && x.feels !== undefined);
    if (!withFeel.length) return heatAnswer();
    const top = withFeel.reduce((a, b) => b.feels > a.feels ? b : a);
    let s = `Worst on **${top.day}**: feels like **${top.feels}°C** against a `
          + `real ${top.temp}°C`
          + (top.gap ? ` — the humidity alone is adding ${top.gap}°C` : '') + '.';
    if (top.band) s += `\n\n${top.band} on IMD's heat-index scale: ${top.bandNote}`;
    s += "\n\nThis is the NWS heat index — temperature and humidity only. It "
       + "is a shade figure: standing in the sun is worse than this, and a "
       + "breeze takes some back, which is why I report the wind separately "
       + "instead of hiding it inside one number.";
    const rest = withFeel.filter(x => x !== top && x.feels >= 40);
    if (rest.length) s += `\n\n${rest.length + 1} days this week reach 40°C or more.`;
    return s;
  }

  function tideAnswer(){
    const k = kbById('tide');
    const url = pick('tideUrl');
    return (k ? k.a : '') + (url ? `\n\nIMD tide table: ${url}` : '');
  }
  function moreAnswer(){
    switch (ctx.route){
      case 'day':   return whyAnswer();
      case 'radar': {
        const R = radarNow();
        if (!R || !R.belts) return helpAnswer();
        return `Every area on the last scan (${R.when}):\n\n`
          + R.belts.map(b => `**${b.name.replace(/ belt$/, '')}** — ${beltLine(b)}`).join('\n');
      }
      case 'type':  { const k = kbById('rain_types'); return k ? k.a : helpAnswer(); }
      case 'alerts': return systemAnswer();
      case 'kb':    {
        const k = kbById(ctx.kb);
        return k ? `That's the heart of it. If it helps, ask me how it plays out today — "what kind of rain is it today?" or "is it raining now?"` : helpAnswer();
      }
      default:      return alertAnswer();
    }
  }

  function helpAnswer(){
    return "Ask me the way you'd ask a friend who follows the weather — in "
         + "English, Hindi or Marathi. For example:\n"
         + "• is it raining in Thane right now\n"
         + "• will it rain tomorrow / on Sunday / this weekend\n"
         + "• what kind of rain is it — monsoon, storms, a low?\n"
         + "• when will the rain reach Kalyan\n"
         + "• anything to watch out for\n"
         + "• what's clutter / what does dBZ mean / why is Pune drier\n"
         + "• how accurate have you been";
  }

  /* ---- routing ---- */
  function route(raw){
    const q = localise((raw || '').toLowerCase().trim());
    if (!q) return helpAnswer();

    if (/^(hi|hello|hey|namaste|namaskar|yo|good (morning|afternoon|evening))\b/.test(q))
      return "Hello! Ask me anything about the weather here — right now, "
           + "later today, or the week ahead.";

    if (/^(thank|thanks|thx|cheers|great|nice|ok|okay|cool)\b/.test(q))
      return "Any time. Shout if you want a particular day or suburb checked.";

    if (/^(why|how come|but why)\??$/.test(q)){ ctx.route = 'why'; return whyAnswer(); }
    if (/^(more|tell me more|details?|go on|and\??|explain( more)?|elaborate)\??$/.test(q))
      return moreAnswer();
    if (/\bhelp\b|what can (you|i)|how do i use/.test(q)) return helpAnswer();

    // Asking what something IS -> Sam's notes, unless it's clearly about a day.
    const kb = kbMatch(q);
    if (kb && CONCEPT.test(q) && !EXPLICIT_DATE.test(q) && !/\b(now|currently)\b/.test(q)){
      ctx.route = 'kb'; ctx.kb = kb.id; return kb.a;
    }
    // Practical questions about a day ("safe to trek on Thursday?"): the
    // advice, then that day's actual forecast, rather than advice alone.
    if (kb && /\bsafe|safety|dangerous|\btrek|\bhike|\bpicnic|\bfort\b|waterfall/.test(q)){
      ctx.route = 'kb'; ctx.kb = kb.id;
      const d = findDay(q);
      if (d && !d._miss){
        const drv = driverFor(d);
        return `${kb.a}\n\n**For ${d.day}:** ${(d.headline || '').replace(/\.$/, '').toLowerCase()}.`
             + (d.detail ? ` ${d.detail}` : '') + (drv ? ` ${drv}` : '');
      }
      return kb.a;
    }

    // What is falling now - the radar, never the model.
    if (/\bis it (raining|pouring|drizzling)\b|\braining (now|here|right now|at the moment)\b|\b(right now|currently|at the moment|abhi)\b|\bradar\b|\bnow\b.*\brain|\brain\b.*\bnow\b/.test(q)){
      ctx.route = 'radar'; return radarAnswer(q);
    }
    if (/(kind|type|sort) of rain|what.*(driv|caus)|\bthunder|\blightning|\bstorm|easterl|northerl|westerl|monsoon (wind|flow)|withdraw|pulling back/.test(q)){
      ctx.route = 'type'; return rainTypeAnswer(q);
    }
    /* Elements added after the rain engine. These sit ABOVE the
       arrival and heat/alert routes, because "when does the sea breeze arrive"
       matched the rain-ETA route on the word "arrive" and answered with where
       the rain bands were. The specific question has to be asked first. */
    if (/\bfog|mist|haze|visibilit|dhund|smog/.test(q)){
      ctx.route = 'fog'; return fogAnswer(q);
    }
    if (/\bwind|breez|gust|squall|windy|hawa|storm.*wind|sea ?breeze/.test(q)){
      ctx.route = 'wind'; return windAnswer();
    }
    if (/feels? like|apparent|humidex|heat index|real feel|muggy|sticky|oppressiv/.test(q)){
      ctx.route = 'feels'; return feelsAnswer();
    }
    if (/monsoon.*(over|end|gone|left|withdraw|retreat|finish)|withdraw|retreat|(is|has) the monsoon|season (over|chang)/.test(q)){
      ctx.route = 'monsoon'; return monsoonAnswer();
    }

    if (/when will (it|the rain)|\breach\b|\barriv|how long (until|till|before)|coming (towards|to|here)|\beta\b/.test(q)){
      ctx.route = 'arrive'; return arrivalsAnswer(q);
    }
    if (/accura|track record|how good (are|is|were)|hit rate|scorecard|how reliable|(right|wrong) (last|yesterday)/.test(q)){
      ctx.route = 'track'; return trackAnswer();
    }
    if (/confiden|how sure|how certain/.test(q)){ ctx.route = 'conf'; return confidenceAnswer(); }
    if (/\b(ecmwf|gfs|icon)\b|\bmodels?\b/.test(q)){ ctx.route = 'models'; return modelsAnswer(); }
    if (/el ni|la ni|\benso\b|\biod\b|dipole|\bmjo\b|\bmiso\b/.test(q)){ ctx.route = 'drivers'; return driversAnswer(); }
    if (/somali|\bjet\b|dry air/.test(q)){ ctx.route = 'upstream'; return upstreamAnswer(); }
    if (/\btide|waterlog/.test(q)){ ctx.route = 'tide'; return tideAnswer(); }

    if (/weekend/.test(q)){ ctx.route = 'day'; return weekendAnswer(); }
    if (/warn|alert|danger|risk|flood/.test(q)){ ctx.route = 'alerts'; return alertAnswer(); }
    if (/heat|hot|temperature|cold|cool|humid|feels like/.test(q)){ ctx.route = 'heat'; return heatAnswer(); }
    if (/low pressure|\blpa\b|depression|cyclone|\bsystem|trough/.test(q)){ ctx.route = 'systems'; return systemAnswer(); }
    if (/^why|why is|why are|reason|because|mechanism|cause/.test(q)){ ctx.route = 'why'; return whyAnswer(); }
    if (/next few hours|nowcast|this evening|tonight/.test(q) && !findDay(q)){ ctx.route = 'radar'; return nowAnswer(); }
    if (/wettest|driest|compare|which (place|area|part)|most rain/.test(q)){ ctx.route = 'areas'; return compareAnswer(); }

    // Beyond the MMR: Pune, Nashik, Konkan, Marathwada...
    const region = regionHit(q);
    const area = findArea(q);
    if (region && !area){ ctx.route = 'region'; return regionAnswer(region); }
    // Outside the MMR, with no regional outlook on this view: say so rather
    // than answer for Kalyan as though that were the question.
    if (!region && !area && !pick('regions')
        && /\b(pune|nashik|konkan|ratnagiri|sindhudurg|goa|aurangabad|marathwada|vidarbha|nagpur|satara|kolhapur|solapur|gujarat|karnataka)\b/.test(q)){
      const d0 = week()[0];
      return "That's outside what this page carries — the regional outlook for "
           + "the rest of Maharashtra is on the MMR week view."
           + (d0 ? `\n\nFor Kalyan West today: ${d0.headline}` : '');
    }

    const day = findDay(q);
    if (day && day._miss) return missAnswer(day);
    if (day && area){
      ctx.route = 'day';
      return `${dayAnswer(day, q)}\n\n_That's the Kalyan-anchored day forecast. `
           + `For ${area.name} specifically I only hold the weekly figure: `
           + `${area.accumulation || (area.weekMm ? '~'+area.weekMm.toFixed(0)+' mm' : 'n/a')}, `
           + `wettest ${area.wettestDay || 'n/a'}._`;
    }
    if (day){ ctx.route = 'day'; return dayAnswer(day, q); }
    if (area){ ctx.route = 'areas'; return areaAnswer(area); }

    // A place was clearly meant but no area data is loaded anywhere.
    if (!areas().length && /ghat|lonavala|matheran|thane|vasai|virar|palghar|alibag|panvel|navi|badlapur|karjat|borivali|andheri|bandra|colaba|suburb|dombivli|bhiwandi|pune/.test(q)){
      const d0 = week()[0];
      return "I don't have per-area figures loaded — those come from the "
           + "weekly MMR run.\n\n"
           + (d0 ? `For Kalyan: ${d0.headline}` : '');
    }

    // A concept named without a question word ("clutter?", "rain shadow").
    if (kb){ ctx.route = 'kb'; ctx.kb = kb.id; return kb.a; }

    if (/rain|wet|shower|spell|umbrella/.test(q)){
      const days = week();
      ctx.route = 'day';
      if (days.length) return `Here's the week:\n\n`
        + days.map(d => `**${d.short || d.day}** — ${d.headline}`).join('\n');
    }

    return "I couldn't match that to anything on this page, and I'd rather "
         + "say so than guess. Try asking it another way — or one of these:\n\n"
         + helpAnswer();
  }

  /* Follow-up chips that fit where the conversation is. */
  function suggest(){
    switch (ctx.route){
      case 'day':    return ["Why?", "What kind of rain?", "Is it raining now?", "Tomorrow?"];
      case 'radar':  return ["Tell me more", "When will it reach Kalyan?", "What's clutter?", "Today's forecast?"];
      case 'type':   return ["Thunderstorm safety?", "Why is Pune drier?", "Tomorrow?", "Any warnings?"];
      case 'arrive': return ["Is it raining now?", "How heavy?", "Today's forecast?", "Any warnings?"];
      case 'kb':     return ["Is it raining now?", "What kind of rain today?", "Tomorrow?", "How accurate are you?"];
      case 'alerts': return ["Any low pressure system?", "Weekend?", "Is it raining now?", "What kind of rain?"];
      case 'fog':    return ["How do you spot fog?", "What's the wind doing?", "Tomorrow?", "Is the monsoon over?"];
      case 'wind':   return ["When does the sea breeze arrive?", "What does it feel like?", "Any warnings?", "Tomorrow?"];
      case 'feels':  return ["Why so humid?", "What's the wind doing?", "Any heat warnings?", "Tomorrow?"];
      case 'monsoon':return ["What kind of rain now?", "Will it rain again?", "What's the wind doing?", "Any warnings?"];
      default:       return ["Is it raining now?", "Today?", "What kind of rain?", "Any warnings?", "How's the weekend?"];
    }
  }

  // Every answer goes through deCite, so no route can leak a citation.
  return { answer: (q) => deCite(route(q)), help: helpAnswer, suggest };
})();

/* ==========================================================================
   Sam with Claude - on the claude.ai page only.

   The published Artifact may ask Claude through the `sample` capability, on
   the VIEWER's own Claude account, with their permission (asked once, on the
   first question). There Sam stops being a set of rules: Claude reads a
   digest of everything on this page plus Sam's notes, and answers whatever
   was asked, in whatever language, following the conversation.

   Everywhere else - GitHub Pages, the local file, a viewer who says no, a
   rate limit - `claude.use` is absent or fails and the rule-based SK above
   answers instead. Nothing depends on this path existing.

   The digest is assembled from NAMED fields, never by dumping the payload:
   the payload also carries a map key and a 140 KB radar picture, and neither
   belongs in a prompt.
   ========================================================================== */
const SamAI = (() => {
  let sample = null;
  let off = false;
  let busy = null;                 // AbortController of the call in flight
  const turns = [];                // the visible chat, oldest first
  const BUDGET = 60000;            // bytes; the platform's cap is 64 KiB

  function start(){
    if (!(window.claude && typeof window.claude.use === 'function')){ off = true; return; }
    window.claude.use('sample').then(s => {
      if (s){ sample = s; skodaMode(true); } else { off = true; }
    }).catch(() => { off = true; });
  }
  const ready = () => !!sample && !off;

  const clean = v => String(v == null ? '' : v)
    .replace(/<[^>]+>/g, ' ').replace(/\*\*/g, '').replace(/\s+/g, ' ').trim();
  const bytes = s => new TextEncoder().encode(s).length;

  function views(){
    const dly = (DAILY && DAILY.page !== 'weekly') ? DAILY : null;
    const wk = WEEKLY || ((DAILY && DAILY.page === 'weekly') ? DAILY : null);
    return [dly || {}, wk || {}];
  }

  /* Sections in priority order; the tail is dropped first if space runs out. */
  function sections(){
    const [d, w] = views();
    const S = [];
    const add = (title, lines) => {
      const body = (Array.isArray(lines) ? lines : [lines]).map(clean).filter(Boolean).join('\n');
      if (body) S.push(`## ${title}\n${body}`);
    };
    add('Page', [
      d.issued ? `Built ${d.issued} for ${d.validDate}. Season: ${d.season}.` : '',
      w.issued ? `MMR week view built ${w.issued}, covering ${w.validDate}.` : '',
      'Home: Kalyan West, in the transition belt between the Mumbai coast and the Western Ghats.',
    ]);
    add('Right now (the page\'s top line)', d.nowLine);
    const R = d.radarNow;
    if (R && R.belts){
      add('Radar - what is falling now (observation)', [
        `${R.site}, ${R.when}${R.ageMin != null ? `, ${R.ageMin} min old when the page was built` : ''}.`,
        R.note, R.checkNote,
        ...R.belts.map(b => `${b.name}: ${b.hereMmH >= 0.5 ? `${b.hereMmH} mm/hr overhead` : 'nothing overhead'}`
          + (b.nearMmH >= 2.5 && b.nearKm > 3 ? `; ${b.nearMmH} mm/hr about ${b.nearKm} km away` : '')
          + (b.secondMmH != null && R.secondName ? `; ${R.secondName} check ${b.secondMmH} mm/hr` : '')
          + (b.doubt ? `; ${b.doubt === 'clutter' ? 'UNCONFIRMED - other radar sees nothing, possibly clutter' : 'other radar has rain here, this beam may be blocked'}` : '')),
        R.peakDbz ? `Strongest return in range: ${Math.round(R.peakDbz)} dBZ (~${R.peakMmH} mm/hr).` : '',
      ]);
    }
    const rs = d.rainSource;
    if (rs && rs.headline) add('What kind of rain today', [
      `${rs.label}: ${rs.headline}. ${rs.detail}`,
      rs.terrain, rs.thunder && rs.thunder !== 'none' ? `Thunderstorms ${rs.thunder}.` : '',
      rs.windFrom != null ? `850 hPa wind from ${rs.windFrom} deg at ${rs.windMs} m/s.` : '',
      (rs.contributors || []).length ? `Also in play: ${rs.contributors.join('; ')}.` : '',
    ]);
    if (d.validDate) {
      const ig = d.ingredients || {}, c = d.confidence || {};
      add(`Today at Kalyan West (${d.validDate})`, [
        `Chance of measurable rain (2.5 mm+): ${d.probability}% from ${d.members} GFS-ensemble members. Models: ${d.rainLo}-${d.rainHi} mm (${d.categoryLo} to ${d.categoryHi}); median ${d.rainMedian} mm.`,
        (d.models || []).map(m => `${m.name} ${m.mm} mm (${m.band})`).join(', '),
        d.spreadWarning,
        `Character: ${d.character} - ${d.characterNote}. About ${d.wetHours} wet hours, peak ${d.peakRate} mm/hr.`,
        (d.windows || []).map(x => `${x.label} ${x.start}-${x.end}h: ${x.mm} mm, peak ${x.peak} mm/hr, risk ${x.risk}`).join('; '),
        `Confidence: ${c.occurrence} on whether it rains, ${c.amount} on amount, ${c.timing} on timing. ${c.rationale || ''}`,
        `Regime: ${d.regime} - ${d.regimeNote} ${d.mechanism}`,
        `Ingredients: dew point ${ig.dewPoint}C; RH 925/850/700 hPa ${ig.rh925}/${ig.rh850}/${ig.rh700}%; precipitable water ${ig.pwat} mm (${ig.depthClass} moisture); 850 hPa wind ${ig.wind850Dir} ${ig.wind850Speed} m/s, terrain lift ${ig.forcingClass}; CAPE peak ${ig.capePeak} J/kg (${ig.capeClass}); shear ${ig.shear} m/s. ${ig.stormMode || ''}`,
        d.gradientVerdict,
      ]);
    }
    const nc = d.nowcast, A = d.arrivals, B = d.belts;
    add('Next few hours (models, not observation)', [
      nc && nc.verdict,
      nc && nc.hours ? nc.hours.map(h => `${h.t} ${h.mm} mm`).join(', ') : '',
      B && B.headline,
      B && B.list ? B.list.map(b => `${b.name}: ${b.sentence}`).join('\n') : '',
      A && A.available ? `Rain areas moving from ${A.fromDeg} deg at ${A.speedKmh} km/h (models ${A.agreement}).` : '',
      A && A.list ? A.list.map(x => `${x.name}: ${x.now ? 'now' : x.eta ? `in ~${x.eta} h` : 'nothing arriving'} - ${x.sentence}`).join('\n') : '',
    ]);
    const al = d.alerts || w.alerts || [];
    add('Major weather shifts (alerts)', al.map(a =>
      `${a.label}: ${a.title}. ${a.body}` + ((a.points || []).length ? ' Possibilities: ' + a.points.join(' | ') : '')));
    add('Day by day (Kalyan West)', (d.plainWeek || []).map(p =>
      `${p.day}: ${p.headline} ${p.detail} ${p.advice} (${p.confidence})`));
    add('Kind of rain, day by day', (w.rainTypes || []).map(r =>
      `${r.day}: ${r.label} - ${r.headline}${r.thunder && r.thunder !== 'none' ? `; thunder ${r.thunder}` : ''}`));
    if (d.weekend) add('Weekend', `${d.weekend.verdict} ${d.weekend.plans}`);
    const ar = (w.areas && w.areas.length ? w.areas : d.areas) || [];
    add('MMR areas this week', ar.map(a =>
      `${a.name}: ${a.accumulation || (a.weekMm != null ? `~${a.weekMm} mm` : '')}, wettest ${a.wettestDay || '-'}. ${a.plain || ''} (${a.character || ''})`));
    const rg = w.regions;
    if (rg && rg.list) add('Maharashtra and beyond (regional outlook)', [
      rg.lead ? `Driven by: ${rg.lead.headline} (min ${rg.lead.pressure} hPa, closest ${rg.lead.closestKm} km).` : '',
      ...rg.list.map(r => `${r.name}: ${r.wet ? `${r.band}, ~${r.totalMm} mm this week, peak ${r.peakDay} (${r.peakLo}-${r.peakHi} mm)` : 'mostly dry'}. ${r.note || ''}`),
    ]);
    const sy = d.systems || w.systems;
    if (sy) add('Low pressure systems and troughs', [
      sy.trough,
      ...(sy.list || []).map(x => `${x.headline} (${x.relevance}): ${x.reasoning}` + ((x.points || []).length ? ' Possibilities: ' + x.points.join(' | ') : '')),
      sy.cycloneWindow ? 'This month is in an Arabian Sea cyclone window.' : '',
    ]);
    add('Cyclone basins', (w.basins || []).map(b => `${b.headline} ${b.detail}`));
    if (w.weekRegime) add('Week pattern', `${w.weekRegime.label}: ${w.weekRegime.note}`);
    const th = d.thermal;
    add('Heat and cold', [th && th.headline,
      ...((w.thermalRows || d.thermalRows || []).map(r => `${r.place}: warmest ${r.warmest}C` + (r.peakFeels != null ? `, feels like up to ${r.peakFeels}C` : '')))]);
    const up = d.upstream;
    if (up && up.available) add('Upstream (moisture supply)', up.reading || `Jet ${up.jet}: ${up.jetNote}. ${up.dryNote}`);
    const dv = w.drivers;
    if (dv) add('Background climate drivers', ['enso', 'iod', 'mjo', 'miso'].map(k =>
      dv[k] && dv[k].text ? `${k.toUpperCase()}: ${dv[k].text.slice(0, 420)}` : ''));
    if (d.track && d.track.available) add('Scorecard (forecast vs what happened)', d.track.summary);
    add('Coming days (models)', (d.outlook || []).map(o => `${o.day}: ${o.lo}-${o.hi} mm, chance ${o.chance}, ${o.regime}`));
    add('Terrain gradient today', (d.gradient || []).map(g => `${g.name} (${g.zone}): ${g.lo}-${g.hi} mm, wind ${g.wind}, terrain ${g.terrain}`));
    return S;
  }

  function notes(){
    return (typeof SAM_KB !== 'undefined' ? SAM_KB : [])
      .map(e => `### ${e.t}\n${e.a}`).join('\n\n');
  }

  function brief(budget){
    const now = new Date().toLocaleString('en-IN', {
      timeZone: 'Asia/Kolkata', weekday: 'short', day: 'numeric', month: 'short',
      hour: '2-digit', minute: '2-digit' });
    const head = [
      "You are Sam, the forecast assistant on a rain-forecast web page for Kalyan West and the Mumbai Metropolitan Region (MMR), Maharashtra, India. A reader is chatting with you on the page.",
      "",
      "How to answer:",
      "- Use ONLY the PAGE DATA and SAM'S NOTES below. They are all you know about the weather. If the answer is not there, say so plainly and offer what you do have. Never invent a number, time, place or warning.",
      "- Keep observation and forecast apart. The radar is what was falling at its scan time; the models are opinions about later. For the next hour or two the radar wins. Compare the scan time with the reader's current time: past about 45 minutes it is history, so say so.",
      "- The page is a snapshot built at the time shown under Page. If the reader's time is well after that, say the 'now' parts may be out of date.",
      "- Talk like a knowledgeable local friend: warm, direct, plain English. Put the answer in the first sentence, then the one or two reasons that matter. Usually 2 to 5 sentences; a short list only for several places or days. Explain any term you must use (dBZ, CAPE, LPA) in a few words. No citations such as 'Guide' or 'Handbook'.",
      "- Say 'about' with millimetres: whether it rains and the IMD band are firmer than the exact figure.",
      "- For safety (lightning, flooding, cyclones) give practical advice and point to IMD's official warnings. You are not an official source.",
      "- If the reader writes in Hindi, Marathi or Hinglish, reply in the same language and style.",
      "- Plain text. You may use **bold** for the key phrase and '• ' for bullets. No headings, tables or links.",
      "",
      `Reader's current time: ${now} IST.`,
      "",
      "=== SAM'S NOTES (how to read the weather here) ===",
      notes(),
      "",
      "=== PAGE DATA ===",
    ].join('\n');
    let out = head;
    for (const sec of sections()){
      if (bytes(out) + bytes(sec) + 2 > budget) break;
      out += '\n\n' + sec;
    }
    return out;
  }

  /* Ask; resolves to 'ok' | 'stopped' | 'partial' | 'limited' | 'fallback'. */
  async function ask(q, bubble){
    const ctl = new AbortController();
    busy = ctl;
    let hist = turns.slice(-6).map(t => ({ role: t.role, content: t.content.slice(0, 1500) }));
    const used = hist.reduce((n, t) => n + bytes(t.content), 0) + bytes(q);
    const input = [{ role: 'user', content: brief(BUDGET - used - 500) }, ...hist,
                   { role: 'user', content: q }];
    try {
      const res = await sample(input, {
        cache: false, signal: ctl.signal,
        onText: ({ text }) => skRender(bubble, text),
      });
      turns.push({ role: 'user', content: q }, { role: 'assistant', content: res.text });
      if (res.truncated) skRender(bubble, res.text + '\n\n_(Cut short — ask me for less at once.)_');
      return 'ok';
    } catch (e){
      const code = e && e.code;
      if (code === 'cancelled'){
        if (e.text) skRender(bubble, e.text + ' …'); else skRender(bubble, '_(Stopped.)_');
        return 'stopped';
      }
      if (['not_granted', 'sampling_disabled', 'not_declared',
           'capability_disabled', 'capability_removed'].includes(code)){
        off = true; skodaMode(false); return 'fallback';
      }
      if (code !== 'refused' && e && e.text){
        skRender(bubble, e.text + '\n\n_(Interrupted — ask again if you need the rest.)_');
        return 'partial';
      }
      return code === 'rate_limited' ? 'limited' : 'fallback';
    } finally {
      busy = null;
    }
  }

  return { start, ready, ask,
           stop: () => { if (busy) busy.abort(); },
           isBusy: () => !!busy,
           // What Claude would be sent - for checking the digest by hand.
           preview: () => brief(BUDGET) };
})();

/* ---------- live Windy map (tap to load) --------------------------------
   Windy's Map Forecast API is a browser library, not a data feed - it embeds
   the real interactive map. Two consequences shape this:

   1. It pulls scripts from api.windy.com and unpkg.com, so it cannot run
      anywhere external hosts are blocked. The published artifact is exactly
      that case, so the card explains rather than showing a dead frame.
   2. Every load consumes Windy session quota. Loading on demand means a phone
      glancing at the forecast twice a day costs nothing. */
function windyMapHtml(){
  if (!D.windyMapKey) return '';
  const blocked = !!D.artifact;
  if (blocked){
    return `<div class="card"><h2>Live Windy map</h2>
      <p class="sub" style="margin:0">Can't run on this shared page — it needs
      scripts from windy.com, and claude.ai blocks external sources. Open the
      forecast from your own PC or the tunnel link and the map loads inline.</p>
      </div>`;
  }
  return `<div class="card"><h2>Live Windy map</h2>
    <p class="sub" style="margin:-6px 0 12px">The real Windy map, centred on
      Kalyan. Loads only when you ask, so it doesn't burn quota on every visit.</p>
    <div id="windyBox" class="windybox">
      <button class="rbtn" id="windyLoad" type="button">Load live map</button>
      <div class="wmsg">Wind, rain, radar, pressure and CAPE layers — scrub
        forward through time once loaded.</div>
    </div></div>`;
}

let windyLoaded = false;

function loadWindyMap(){
  if (windyLoaded) return;
  const box = document.getElementById('windyBox');
  if (!box || !D.windyMapKey) return;
  windyLoaded = true;
  box.innerHTML = '<div class="wmsg">Loading Windy…</div><div id="windy"></div>';

  const fail = (why) => {
    windyLoaded = false;
    box.innerHTML = `<div class="wmsg">Couldn't load the map: ${esc(why)}.
      <br>The layer links further down still work.</div>
      <button class="rbtn" id="windyLoad" type="button">Try again</button>`;
    bindWindy();
  };

  loadScript('https://unpkg.com/leaflet@1.4.0/dist/leaflet.js')
    .then(() => loadScript('https://api.windy.com/assets/map-forecast/libBoot.js'))
    .then(() => {
      if (typeof windyInit !== 'function') return fail('library did not initialise');
      windyInit({
        key: D.windyMapKey,
        lat: D.lat || 19.2437, lon: D.lon || 73.1305, zoom: 8,
        verbose: false, overlay: 'rain',
      }, () => {
        const m = document.querySelector('#windyBox .wmsg');
        if (m) m.remove();
      });
    })
    .catch(() => fail('network blocked or offline'));
}

function loadScript(src){
  return new Promise((res, rej) => {
    const s = document.createElement('script');
    s.src = src; s.async = true;
    s.onload = res; s.onerror = () => rej(new Error(src));
    document.head.appendChild(s);
  });
}

function bindWindy(){
  const b = document.getElementById('windyLoad');
  if (b && !b.dataset.bound){
    b.dataset.bound = '1';
    b.addEventListener('click', loadWindyMap);
  }
}

/* ---------- background climate drivers ---------------------------------- */
function driversHtml(){
  const d = (DAILY && DAILY.drivers) || (WEEKLY && WEEKLY.drivers);
  if (!d) return '';

  const tiles = [];

  if (d.enso){
    const e = d.enso;
    const tone = e.phase === 'El Nino' ? 'bad' : e.phase === 'La Nina' ? 'good' : 'neu';
    tiles.push({tone, name:'ENSO', value:`${e.phase}`,
      sub:`Niño 3.4 ${e.anomaly >= 0 ? '+' : ''}${e.anomaly.toFixed(2)}°C · ${e.when}`,
      spark:e.recent, text:e.text});
  }
  if (d.iod){
    const i = d.iod;
    const tone = i.phase === 'positive' ? 'good' : i.phase === 'negative' ? 'bad' : 'neu';
    tiles.push({tone, name:'IOD', value:i.phase,
      sub:`proxy DMI ${i.dmi >= 0 ? '+' : ''}${i.dmi.toFixed(2)}°C`,
      text:i.text});
  }
  if (d.mjo){
    const m = d.mjo;
    const tone = m.favourability === 'favourable' ? 'good'
               : m.favourability === 'unfavourable' ? 'bad' : 'neu';
    tiles.push({tone, name:'MJO', value:`Phase ${m.phase}`,
      sub:`${m.region} · ${m.lon.toFixed(0)}°E · ${m.favourability}`,
      spark:m.track, text:m.text});
  }
  if (d.miso){
    const s = d.miso;
    const near = s.lat >= 15 && s.lat < 22;
    tiles.push({tone: near ? 'good' : 'neu', name:'MISO',
      value:`${s.lat.toFixed(0)}°N`,
      sub:s.regime + (s.eta ? ` · ~${s.eta}d away` : ''),
      spark:s.track, text:s.text});
  }
  if (!tiles.length) return '';

  return `<div class="card"><h2>Background climate drivers</h2>
    <p class="sub" style="margin:-6px 0 14px">These tilt the season's odds.
      They do not forecast any single day — the week-to-week pattern does that.</p>
    <div class="dgrid">
      ${tiles.map((t, i) => `<button class="dtile d-${t.tone}" type="button"
          data-drv="${i}" aria-expanded="false">
        <div class="dname">${esc(t.name)}</div>
        <div class="dval">${esc(t.value)}</div>
        <div class="dsub">${esc(t.sub)}</div>
        ${t.spark && t.spark.length > 2 ? sparkSvg(t.spark) : ''}
      </button>`).join('')}
    </div>
    <div class="dtext" id="dtext">Tap any driver for what it means.</div>
    ${d.coherence ? `<div class="quote">${mdBold(d.coherence.replace(/^>\s*/, ''))}</div>` : ''}
  </div>`;
}

/* ---------- the track record ------------------------------------------- */
/* The point of this card is that a reader can check the agent rather than
   trust it. Each day shows what was forecast the day before against what
   actually fell, so a bad call stays visible instead of being averaged away.
   The most recent days deliberately show no verdict: ERA5 lags about five
   days, and filling that gap with the model's own analysis would be the agent
   marking its own homework. */
function trackHtml(D){
  const t = D.track;
  if (!t || !t.available || !t.days || !t.days.length) return '';
  const vals = t.days.flatMap(d => [d.fc || 0, d.obs || 0]);
  const max = Math.max(8, ...vals);
  const H = 54;
  const bar = v => Math.max(2, Math.round((v || 0) / max * H));

  const rows = t.days.map(d => {
    const pending = d.obs === null || d.obs === undefined;
    const cls = pending ? 'pend'
      : (d.verdict === 'hit' || d.verdict === 'correct_dry') ? 'ok' : 'bad';
    const tip = pending
      ? `${d.label}: forecast ${(d.fc||0).toFixed(0)} mm — not yet verified`
      : `${d.label}: forecast ${(d.fc||0).toFixed(0)} mm, actual ${(d.obs||0).toFixed(0)} mm`;
    return `<div class="tday ${cls}" title="${esc(tip)}">
      <div class="tbars">
        <div class="tb tf" style="height:${bar(d.fc)}px"></div>
        <div class="tb to${pending ? ' tp' : ''}" style="height:${pending ? 2 : bar(d.obs)}px"></div>
      </div>
      <div class="tlab">${esc(d.label.split(' ')[1] || d.label)}</div>
    </div>`;
  }).join('');

  return `<div class="card"><h2>Track record — has it actually been right?</h2>
    <p class="sub" style="margin:-6px 0 12px">Each pair of bars is one day:
      what was forecast the evening before, against what actually fell.</p>
    <p style="margin:0 0 14px">${mdBold(t.summary)}</p>
    <div class="tkey">
      <span><i class="k-f"></i>forecast</span>
      <span><i class="k-o"></i>actual</span>
      <span><i class="k-p"></i>not yet verified</span>
    </div>
    <div class="tstrip">${rows}</div>
    <div class="tstats">
      ${t.bandPct != null ? `<div class="tstat"><b>${t.bandPct}%</b><span>right rainfall band</span></div>` : ''}
      ${t.maeWet != null ? `<div class="tstat"><b>${t.maeWet} mm</b><span>average error on wet days</span></div>` : ''}
      <div class="tstat"><b>${t.verified}</b><span>days verified</span></div>
    </div>
    <div class="quote">Forecasts are the run issued the day <i>before</i> each
      date, pulled from the archive — not today's model replayed over the past,
      which would show fake skill. Truth is ERA5 reanalysis, which lags about
      five days; the last few days show their forecast with the verdict still
      pending rather than being scored against the model's own analysis.</div>
  </div>`;
}

/* When rain reaches each region, from a three-model steering wind.
   Placed above the belt table because it answers the sharper question - the
   table says how much the model gives you this hour, this says when the stuff
   currently upstream actually gets to you, and by how much the three models
   disagree about that. */
function arrivalsHtml(D){
  const a = D.arrivals;
  if (!a || !a.available || !a.list || !a.list.length) return '';
  const agree = a.agreement === 'tight'
      ? 'All three models agree closely, so these timings are as firm as this method gets.'
    : a.agreement === 'moderate'
      ? 'The models differ a little, so treat these as give-or-take.'
      : 'The models disagree noticeably — that disagreement is itself the warning.';
  const per = Object.entries(a.perModel || {})
      .map(([k, v]) => `${esc(MODEL_SHORT[k] || k)} ${v[0]}`).join(' · ');

  const row = x => {
    if (x.now) return `<div class="arr a-now"><div class="an">${esc(x.name)}</div>
        <div class=" av">Raining now</div></div>`;
    if (x.km === null || x.km === undefined)
      return `<div class="arr a-clear"><div class="an">${esc(x.name)}</div>
        <div class="av">Clear upstream</div></div>`;
    const win = (x.etaHi != null && x.etaLo != null && x.etaHi - x.etaLo >= 10)
      ? `<span class="aw">${x.etaLo}–${x.etaHi} min</span>` : '';
    const cls = x.eta <= 30 ? 'a-soon' : x.eta <= 75 ? 'a-mid' : 'a-later';
    return `<div class="arr ${cls}"><div class="an">${esc(x.name)}</div>
      <div class="av">~${x.eta} min ${win}</div>
      <div class="ad">${x.km.toFixed(0)} km upstream · ${x.mmH} mm/hr</div></div>`;
  };

  return `<h3>When it reaches each area</h3>
    <p class="rhead">Rain is moving on a <b>${esc(compassOf(a.fromDeg))}</b>
      wind at about <b>${a.speedKmh} km/h</b>. ${esc(agree)}
      <span class="amods">${per} km/h</span></p>
    <div class="arrs">${a.list.map(row).join('')}</div>
    <p class="rwarn" style="margin-top:10px">Arrival time is distance divided
      by wind speed, so it assumes the rain keeps moving and keeps going —
      cells die on the way. Positions come from the model analysis, which
      smooths a shower across a 25 km box. <b>For what is falling right now the
      radar section above outranks this</b> &mdash; that one is an observation.
      This answers the next question: where the model puts rain in a few
      hours.</p>`;
}

const MODEL_SHORT = {ecmwf_ifs025:'ECMWF', gfs_seamless:'GFS', icon_seamless:'ICON'};
function compassOf(deg){
  if (deg === null || deg === undefined) return 'westerly';
  const p = ['N','NNE','NE','ENE','E','ESE','SE','SSE','S','SSW','SW','WSW','W','WNW','NW','NNW'];
  return p[Math.round(((deg % 360) / 22.5)) % 16];
}

/* ---------- reading the radar, in plain words --------------------------- */
/* The two images above are the products IMD publishes by default, and both
   are routinely misread. MAX-Z is the strongest echo anywhere in the column,
   so it flags a growing cell before anything reaches the ground - which is
   exactly why it overstates what you will feel. SRI is that reflectivity
   converted to a surface rain rate, which is closer to experience but
   inherits every assumption in the conversion. Saying so is the difference
   between a picture and a forecast. */
function radarExplainHtml(D){
  const nc = D.nowcast || {};
  const b  = D.belts;
  let h = `<div class="rexp">
    <h3>What the two pictures above actually mean</h3>
    <div class="rgrid">
      <div class="rcard">
        <div class="rname">MAX-Z <span>maximum reflectivity</span></div>
        <p>The radar looks through the whole depth of the cloud and shows you
        the <b>strongest thing it finds anywhere in that column</b> — usually
        several kilometres up.</p>
        <ul>
          <li><b>Blue / green</b> — light rain or drizzle.</li>
          <li><b>Yellow</b> — steady, proper rain.</li>
          <li><b>Orange / red</b> — heavy downpour, the kind that floods a road
            in under an hour.</li>
          <li><b>Purple / white</b> — extreme core, often with hail aloft.</li>
        </ul>
        <p class="rwarn">Because it reads the top of the cloud, a red blob does
        <b>not</b> guarantee red rain on your street — the drops still have to
        survive the fall. Use it to spot cells <i>growing</i>.</p>
      </div>
      <div class="rcard">
        <div class="rname">SRI <span>surface rainfall intensity</span></div>
        <p>The same echo, converted into <b>how hard it is raining at ground
        level</b> — millimetres per hour. This is the one closest to what you
        would feel standing outside.</p>
        <ul>
          <li><b>Under 2 mm/hr</b> — you would barely bother with an umbrella.</li>
          <li><b>2–10 mm/hr</b> — ordinary monsoon rain.</li>
          <li><b>10–20 mm/hr</b> — heavy; low roads start holding water.</li>
          <li><b>Over 20 mm/hr</b> — torrential; waterlogging within the hour.</li>
        </ul>
        <p class="rwarn">The conversion from echo to rain rate is an estimate,
        not a measurement. In a heavy monsoon burst SRI tends to <b>under-read</b>
        what the gauges catch.</p>
      </div>
    </div>
    <p class="rhow"><b>How to read them together:</b> if MAX-Z is bright but SRI
    is faint, the cell is still building aloft — the rain has not arrived yet.
    If both are bright over the same spot, that is where it is coming down hard
    right now. If MAX-Z fades while SRI stays lit, the cell is dying and the
    rain you feel is what is left falling out of it.</p>`;

  /* The burst warning goes ABOVE the numbers, not below them: its whole
     point is to change how the rates underneath are read. */
  if (D.burst && D.burst.note){
    h += `<div class="burst b-${esc(D.burst.level)}">${mdBold(D.burst.note)}</div>`;
  }

  /* OBSERVATION BEFORE MODEL. Everything below this point is a model's
     opinion about the day; this block is the beam reporting what is actually
     in the air over each place. Where the two disagree about the present
     tense, this one is right, and putting it second would bury that. */
  if (D.radarNow && D.radarNow.belts && D.radarNow.belts.length){
    const R = D.radarNow;
    const band = v => v < 0.5 ? 'nothing' : v < 2.5 ? 'light'
                    : v < 7.5 ? 'moderate' : v < 20 ? 'heavy' : 'very heavy';
    const wet = R.belts.filter(x => x.hereMmH >= 0.5 && x.doubt !== 'clutter');
    const has = v => v !== null && v !== undefined;
    h += `<h3>What the radar can see falling right now</h3>`;
    /* The C-band picture itself, cropped to the MMR, with its own time - so
       an older frame shown beside an S-band reading is labelled as older. */
    if (R.image && String(R.image).startsWith('data:image/')){
      const L = R.legend || [];
      const grad = L.map(([v, c]) =>
        `${c} ${((v - 20) / 40 * 100).toFixed(1)}%`).join(',');
      h += `<figure class="radimg">
        <img src="${R.image}" alt="IMD C-band radar reflectivity over the Mumbai region">
        <figcaption>IMD <b>C-band DWR Mumbai</b> (Veravali) &middot; MAX-Z &middot;
          ${esc(R.imageWhen || '')}${has(R.imageAgeMin)
            ? ` &middot; ${R.imageAgeMin} min old` : ''} &middot; ring = Kalyan West</figcaption>
        ${grad ? `<div class="dbzbar" style="background:linear-gradient(90deg,${grad})"></div>
        <div class="dbzticks"><span>20 dBZ<br>~0.6 mm/hr</span><span>30<br>~3</span>
          <span>40<br>~12</span><span>50<br>~49</span><span>60 dBZ</span></div>` : ''}
      </figure>`;
    }
    h += `<p class="rhead">Observation, not forecast. Read from IMD's
        <b>${esc(R.site || 'Mumbai radar')}</b>, ${esc(R.when || 'at an unknown time')}${
          has(R.ageMin) ? ` (${R.ageMin} min ago)` : ''}.
        ${wet.length
          ? 'Rain is reaching the ground over <b>' +
            wet.map(x => esc(x.name)).join(', ') + '</b>.'
          : '<b>Nothing is reaching the ground anywhere in the MMR</b> on this scan.'}</p>
      ${R.note ? `<div class="quote">${esc(R.note)}</div>` : ''}
      ${R.checkNote ? `<div class="quote">${esc(R.checkNote)}</div>` : ''}
      <div class="belts">` + R.belts.map(x => {
        const st = band(x.hereMmH);
        const cls = st === 'nothing' ? 'b-dry'
                  : (st === 'light' ? 'b-drizzling' : 'b-raining');
        const near = (x.nearMmH >= 2.5 && x.nearKm > 3)
          ? `${band(x.nearMmH)} ~${x.nearKm} km away`
          : (x.nearMmH > 0 ? 'only light echo nearby'
                           : 'clear for 16 km around');
        const second = (R.secondName && has(x.secondMmH))
          ? ` &middot; <span class="muted">${esc(R.secondName)} check: ${band(x.secondMmH)}</span>`
          : '';
        const doubt = x.doubt === 'clutter'
          ? `<div class="rwarn">Unconfirmed &mdash; the other radar sees nothing
             here. Possibly clutter off the hills rather than rain.</div>`
          : x.doubt === 'blocked'
          ? `<div class="rwarn">The other radar has rain here. Heavy rain in
             between may be weakening this beam.</div>` : '';
        return `<div class="belt ${cls}">
          <div class="bname">${esc(x.name)}</div>
          <div class="bsent">${st === 'nothing'
            ? 'Nothing overhead'
            : `<b>${st.charAt(0).toUpperCase() + st.slice(1)} rain</b> &middot; ~${x.hereMmH} mm/hr`}
            &middot; <span class="muted">${near}</span>${second}</div>${doubt}
        </div>`;
      }).join('') + `</div>`;
    if (R.peakDbz){
      h += `<p class="rhow">Strongest return anywhere in range
        <b>${Math.round(R.peakDbz)} dBZ</b> &mdash; about <b>${R.peakMmH} mm/hr</b>
        where it is falling.</p>`;
    }
    h += `<p class="rwarn" style="margin-top:8px">Rates come from reflectivity
      via the standard Marshall&ndash;Palmer relationship, an average over many
      storms rather than a measurement of this one &mdash; the same 40 dBZ can
      be 6 mm/hr in one shower and 20 in another. Trust the <b>where</b> and
      the <b>whether</b> far more than the millimetres.</p>`;
  }

  h += arrivalsHtml(D);

  if (b && b.available && b.list && b.list.length){
    h += `<h3>Next few hours, belt by belt</h3>
      ${b.headline ? `<p class="rhead">${mdBold(b.headline)}</p>` : ''}
      <div class="belts">` +
      b.list.map(x => `<div class="belt b-${esc(x.state)}">
        <div class="bname">${esc(x.name)}</div>
        <div class="bsent">${mdBold(x.sentence)}</div>
        ${hourStrip(x)}
      </div>`).join('') +
      `</div>
      ${D.beltsNote ? `<div class="beltsnote">${mdBold(D.beltsNote)}</div>` : ''}
      <p class="rwarn" style="margin-top:10px">These come from the hourly model
      field sampled at each place, <b>not</b> from the radar picture above.
      Inside an hour the radar loop is the better guide — this tells you which
      belts to watch on it.</p>`;
  }

  h += radarAnimHtml(nc, b);
  h += `</div>`;
  return h;
}

/* Next three hours for one belt, as a row of labelled cells.
   The sentence above says what it means; this says how much and when, which
   words cannot do compactly. Cells are tinted by rain rate on the same
   thresholds the sentences use, so "moderate" looks the same everywhere. */
function hourStrip(x){
  const hrs = (x.hours || []).slice(0, 3);
  const labs = (x.hourLabels || []).slice(0, 3);
  if (!hrs.length || !labs.length) return '';
  const tone = v => v >= 20 ? 'h4' : v >= 10 ? 'h3' : v >= 4 ? 'h2'
                  : v >= 1 ? 'h1' : v >= 0.2 ? 'h0' : 'hz';
  const cell = (lab, v) => `<div class="hcell ${tone(v)}">
      <div class="hval">${v.toFixed(1)}</div>
      <div class="hlab">${esc(lab)}</div>
    </div>`;
  return `<div class="hstrip">
    ${cell('now', x.nowMmH || 0)}
    <span class="harrow">→</span>
    ${hrs.map((v, i) => cell(labs[i] || '', v)).join('')}
    <span class="hunit">mm/hr</span>
  </div>`;
}

/* ---------- the animation ------------------------------------------------ */
/* A west-to-east slice through the region: sea on the left, the city belts in
   the middle, the Ghat wall on the right. Blobs ride the steering flow across
   it and grow as they climb, which is the single mechanism that decides
   whether a Kalyan reader gets ten minutes of drizzle or two hours of rain.
   Speed of the animation is set from the actual steering wind, so a fast band
   visibly races and a slack one crawls. */
function radarAnimHtml(nc, b){
  const kmh = (nc && nc.scanSteerKmh) || 30;
  const dur = Math.max(4, Math.min(16, 420 / Math.max(8, kmh))).toFixed(1);
  const from = (nc && nc.scanFrom) || 'the west';
  const wetKeys = new Set(((b && b.list) || [])
    .filter(x => x.state === 'raining' || x.state === 'arriving')
    .map(x => x.key));
  const lit = k => wetKeys.has(k) ? ' lit' : '';

  return `<h3>What is happening on that picture, right now</h3>
  <figure class="ranim">
    <svg viewBox="0 0 720 260" role="img" preserveAspectRatio="xMidYMid meet"
      aria-label="Cross-section from the Arabian Sea to the Western Ghats.
        Rain cells ride the onshore flow inland and grow as they are forced up
        the slope, so the crest gets most of the rain and the rain shadow least.">
      <defs>
        <marker id="rarrow" viewBox="0 0 10 10" refX="9" refY="5"
          markerWidth="6" markerHeight="6" orient="auto-start-reverse">
          <path d="M0,0 L10,5 L0,10 z" fill="currentColor"/>
        </marker>
      </defs>

      <!-- ground -->
      <line x1="0" y1="212" x2="720" y2="212" stroke="currentColor"
        stroke-width="1" opacity=".35"/>
      <path d="M0 212 L150 212 L150 205 L0 205 Z" fill="currentColor" opacity=".12"/>
      <text x="8" y="232" class="ral" text-anchor="start">Arabian Sea</text>

      <!-- the ghat wall -->
      <path d="M470 212 L560 96 L610 92 L700 212 Z" fill="currentColor" opacity=".16"/>
      <path d="M470 212 L560 96 L610 92 L700 212" fill="none" stroke="currentColor"
        stroke-width="1.5" opacity=".5"/>
      <text x="556" y="84" class="ral" text-anchor="middle">Ghat crest</text>
      <text x="712" y="232" class="ral" text-anchor="end">rain shadow</text>

      <!-- belts along the ground -->
      <g class="rbelt${lit('western')}">
        <line x1="196" y1="205" x2="196" y2="212" stroke="currentColor"/>
        <text x="196" y="232" class="ral" text-anchor="middle">Malad</text>
      </g>
      <g class="rbelt${lit('thane_kalyan')}">
        <line x1="330" y1="205" x2="330" y2="212" stroke="currentColor"/>
        <text x="330" y="232" class="ral" text-anchor="middle">Kalyan</text>
      </g>
      <g class="rbelt${lit('badlapur')}">
        <line x1="430" y1="205" x2="430" y2="212" stroke="currentColor"/>
        <text x="430" y="232" class="ral" text-anchor="middle">Karjat</text>
      </g>

      <!-- the steering flow -->
      <line x1="24" y1="168" x2="250" y2="168" stroke="currentColor"
        stroke-width="2" opacity=".55" marker-end="url(#rarrow)"/>
      <text x="24" y="146" class="ral">onshore flow from ${esc(from)} · ${Math.round(kmh)} km/h</text>

      <!-- the cells: same three shapes, growing as they move inland -->
      <g class="rcell" style="animation-duration:${dur}s">
        <ellipse cx="0" cy="176" rx="30" ry="12"/>
      </g>
      <g class="rcell rc2" style="animation-duration:${dur}s">
        <ellipse cx="0" cy="168" rx="34" ry="14"/>
      </g>
      <g class="rcell rc3" style="animation-duration:${dur}s">
        <ellipse cx="0" cy="182" rx="26" ry="11"/>
      </g>
    </svg>
    <figcaption>Cells ride the onshore flow inland and are forced upward at the
      Ghats, which is why the crest collects the most rain, the Kalyan belt gets
      what survives the climb, and Pune — behind the wall — gets least.</figcaption>
  </figure>`;
}

/* ISO date -> short weekday for the upstream strip. Parsed as local midday so
   a timezone offset cannot roll the label onto the neighbouring day. */
function dayShort(iso){
  if (!iso) return '';
  const p = String(iso).split('-').map(Number);
  if (p.length !== 3 || p.some(isNaN)) return String(iso);
  const d = new Date(p[0], p[1] - 1, p[2], 12, 0, 0);
  return d.toLocaleDateString(undefined, { weekday: 'short' });
}

/* Tiny inline sparkline for a driver's recent track. */
function sparkSvg(vals){
  const w = 96, h = 22;
  const lo = Math.min(...vals), hi = Math.max(...vals);
  const span = (hi - lo) || 1;
  const pts = vals.map((v, i) =>
    `${(i / (vals.length - 1) * w).toFixed(1)},${(h - (v - lo) / span * h).toFixed(1)}`
  ).join(' ');
  return `<svg class="dspark" viewBox="0 0 ${w} ${h}" preserveAspectRatio="none"
    aria-hidden="true"><polyline points="${pts}" fill="none"
    stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"
    stroke-linecap="round" opacity=".75"/></svg>`;
}

function bindDrivers(){
  const grid = document.querySelector('.dgrid');
  if (!grid || grid.dataset.bound) return;
  grid.dataset.bound = '1';
  const d = (DAILY && DAILY.drivers) || (WEEKLY && WEEKLY.drivers) || {};
  const texts = [d.enso, d.iod, d.mjo, d.miso].filter(Boolean).map(x => x.text);
  grid.addEventListener('click', ev => {
    const btn = ev.target.closest('.dtile');
    if (!btn) return;
    grid.querySelectorAll('.dtile').forEach(b => {
      b.classList.toggle('sel', b === btn);
      b.setAttribute('aria-expanded', String(b === btn));
    });
    const out = document.getElementById('dtext');
    if (out) out.textContent = texts[+btn.dataset.drv] || '';
  });
}

/* ---------- week summary: what happened, what's coming, and why ---------- */
function summaryHtml(){
  const s = (DAILY && DAILY.summary) || (WEEKLY && WEEKLY.summary);
  if (!s || !s.days || !s.days.length) return '';

  const maxMm = Math.max(...s.days.map(d => d.hi), 1);
  const strip = s.days.map(d => {
    const pct = Math.max(4, Math.round(d.hi / maxMm * 100));
    // Observed days are visually distinct from forecast ones - a reader must
    // be able to see where measurement stops and prediction begins.
    const cls = d.observed ? 'sday obs' : 'sday fc';
    return `<div class="${cls}" title="${esc(d.day)}: ${d.hi.toFixed(1)} mm — ${esc(d.note)}">
      <div class="sbarwrap"><div class="sbar" style="height:${pct}%"></div></div>
      <div class="sval">${d.hi < 1 ? '–' : d.hi.toFixed(0)}</div>
      <div class="slab">${esc(d.day.split(' ').slice(0,2).join(' '))}</div>
    </div>`;
  }).join('');

  return `<section class="card summary">
    <h2>The week in context — ${esc(s.start)} to ${esc(s.end)}</h2>
    <p class="sbig">${esc(s.headline)}</p>
    <p class="sub" style="margin:0 0 14px">${esc(s.outlook)}</p>

    <div class="sstrip">${strip}</div>
    <div class="skey">
      <span><i class="kobs"></i> measured</span>
      <span><i class="kfc"></i> forecast</span>
    </div>

    <details class="sdet" open>
      <summary>Why the weather is doing this</summary>
      ${s.meteorology.map(t => `<p>${mdBold(t)}</p>`).join('')}
    </details>

    <details class="sdet">
      <summary>Why the region splits the way it does</summary>
      ${s.geography.map(t => `<p>${mdBold(t)}</p>`).join('')}
    </details>
  </section>`;
}

/* Only bold + italic are honoured, and only after escaping, so nothing in the
   data can inject markup. */
function mdBold(t){
  return esc(t).replace(/\*\*(.+?)\*\*/g, '<b>$1</b>')
               .replace(/\*(.+?)\*/g, '<i>$1</i>');
}

function skodaHtml(){
  return `<div class="skoda">
    <div class="sk-head">
      <div class="sk-av">🌂</div>
      <div>
        <div class="sk-name">Sam</div>
        <div class="sk-role" id="skRole">${esc(skRoleText())}</div>
      </div>
    </div>
    <div class="sk-log" id="skLog" aria-live="polite"></div>
    <form class="sk-form" id="skForm">
      <input class="sk-in" id="skIn" placeholder="Ask anything — in English, Hindi or Marathi…"
             autocomplete="off" aria-label="Ask Sam about the weather">
      <button class="sk-send" id="skSend" type="submit">Ask</button>
    </form>
    <div class="sk-chips" id="skChips">${skChipsHtml(SK.suggest())}</div>
  </div>`;
}

let SK_AI = false;
function skRoleText(){
  return SK_AI
    ? "Thinks with Claude, from everything on this page · your first question asks permission"
    : "Answers from this page's forecast and radar — nothing made up";
}
/* Called when the Claude path becomes available, or is refused. */
function skodaMode(ai){
  SK_AI = !!ai;
  const r = document.getElementById('skRole');
  if (r) r.textContent = skRoleText();
}
function skChipsHtml(list){
  return (list || []).map(c => `<button class="sk-chip" type="button">${esc(c)}</button>`).join('');
}
function skChipsUpdate(){
  const el = document.getElementById('skChips');
  if (el) el.innerHTML = skChipsHtml(SK.suggest());
}
function skBusy(on){
  const b = document.getElementById('skSend');
  if (b) b.textContent = on ? 'Stop' : 'Ask';
}
/* The log outlives a tab switch: the view re-renders, the conversation
   should not vanish with it. */
let SK_LOG = '';
function skSave(){
  const log = document.getElementById('skLog');
  if (log) SK_LOG = log.innerHTML;
}

/* Handlers are bound in JS rather than written as onclick/onsubmit attributes.
   A page served under a nonce-based Content-Security-Policy runs the script tag
   but silently refuses inline attribute handlers - which would leave every
   button here looking normal and doing nothing. Binding avoids depending on
   the host's CSP at all. */
function skodaBind(){
  const form = document.getElementById('skForm');
  if (form && !form.dataset.bound){
    form.dataset.bound = '1';
    form.addEventListener('submit', skAsk);
  }
  const chips = document.getElementById('skChips');
  if (chips && !chips.dataset.bound){
    chips.dataset.bound = '1';
    chips.addEventListener('click', (ev) => {
      const btn = ev.target.closest('.sk-chip');
      if (btn) skChip(btn);
    });
  }
}

/* Minimal markdown: bold and italics only, escaped first, so nothing in an
   answer - Claude's included - can inject markup. */
function skRender(el, text){
  if (!el) return;
  el.innerHTML = esc(text)
    .replace(/\*\*(.+?)\*\*/g, '<b>$1</b>')
    .replace(/(^|[\s(])_(.+?)_(?=[\s).,!?]|$)/g, '$1<i>$2</i>');
  const log = document.getElementById('skLog');
  if (log) log.scrollTop = log.scrollHeight;
  skSave();
}

function skPush(text, who){
  const log = document.getElementById('skLog');
  if (!log) return null;
  const el = document.createElement('div');
  el.className = 'sk-msg ' + (who === 'q' ? 'sk-q' : 'sk-a');
  log.appendChild(el);
  skRender(el, text);
  return el;
}

function skAsk(ev){
  if (ev) ev.preventDefault();
  // While Claude is answering, the button is Stop.
  if (SamAI.isBusy()){ SamAI.stop(); return false; }
  const input = document.getElementById('skIn');
  if (!input) return false;
  const q = input.value.trim();
  if (!q) return false;
  skPush(q, 'q');
  input.value = '';
  // The rule-based answer also moves the conversation's context along, so
  // the follow-up chips fit whichever Sam answered.
  const quick = SK.answer(q);
  if (SamAI.ready()){
    const bubble = skPush('Thinking…', 'a');
    skBusy(true);
    SamAI.ask(q, bubble).then(r => {
      skBusy(false);
      if (r === 'fallback') skRender(bubble, quick);
      if (r === 'limited') skRender(bubble,
        "_Claude is busy for you right now, so here's my quick answer from the page:_\n\n" + quick);
      skChipsUpdate();
    });
  } else {
    setTimeout(() => { skPush(quick, 'a'); skChipsUpdate(); }, 160);
  }
  return false;
}

function skChip(btn){
  const input = document.getElementById('skIn');
  if (!input) return;
  input.value = btn.textContent;
  skAsk(null);
}

/* ---------- refresh (only when served by wxagent serve) ---------- */
/* Two conditions, both required:
   - an http(s) origin, because opened straight from disk there is no server;
   - not the published artifact, which IS https but is a static snapshot on
     claude.ai with no /api/refresh behind it. Showing the button there would
     give a control that always fails - worse than no control at all. */
/* A public static host is https but has no /api/refresh behind it, exactly
   like the artifact - so the refresh control is suppressed there too rather
   than shipping a button that always fails. */
const SERVED = (location.protocol === 'http:' || location.protocol === 'https:')
               && !D.artifact && !D.public;

/* The repository whose Actions run the cloud update. Used only to build the
   Update link on the public build. */
const REPO = 'steve-csv/kalyan-weather';

function refreshBarHtml(){
  if (SERVED){
    return `<div class="rbar">
      <button class="rbtn" id="rbtn" type="button">Refresh forecast</button>
      <div class="rmsg" id="rmsg">Rebuilds today's forecast on your PC. Takes about a minute.</div>
    </div>`;
  }
  /* On the public site there is no server to call, so the button cannot
     rebuild the page itself. What it CAN do is send you to the one screen
     that will: the workflow's Run page on GitHub. That works from a phone,
     needs no key embedded in a world-readable page, and is honest about
     where the work happens - which a button that silently failed would not
     be. */
  if (D.public){
    return `<div class="rbar">
      <a class="rbtn" target="_blank" rel="noopener"
         href="https://github.com/${REPO}/actions/workflows/forecast.yml">
        Update forecast &rarr;</a>
      <div class="rmsg">Opens GitHub, where you press <b>Run workflow</b>.
        The page rebuilds itself in the cloud and is live in two or three
        minutes — your laptop does not need to be on.</div>
    </div>`;
  }
  return '';
}

let pollTimer = null;

async function doRefresh(){
  const btn = document.getElementById('rbtn');
  const msg = document.getElementById('rmsg');
  if (!btn || !msg) return;
  btn.disabled = true;
  msg.textContent = 'Starting…';
  try {
    const r = await fetch('/api/refresh', {method:'POST'});
    const j = await r.json();
    msg.textContent = j.message || j.status;
    if (r.status === 202){
      pollStatus();
    } else {
      btn.disabled = false;   // cooldown or already-running: let them retry
    }
  } catch (e) {
    msg.textContent = 'Could not reach the PC. Is it awake and on the same WiFi?';
    btn.disabled = false;
  }
}

async function pollStatus(){
  const btn = document.getElementById('rbtn');
  const msg = document.getElementById('rmsg');
  clearTimeout(pollTimer);
  try {
    const r = await fetch('/api/status');
    const s = await r.json();
    if (s.running){
      msg.textContent = 'Rebuilding on the PC…';
      pollTimer = setTimeout(pollStatus, 4000);
      return;
    }
    if (s.last_result === 'ok'){
      msg.textContent = 'Done — reloading.';
      setTimeout(() => location.reload(), 700);
      return;
    }
    if (s.last_result){
      msg.textContent = 'Failed: ' + (s.last_error || s.last_result);
    }
  } catch (e) {
    msg.textContent = 'Lost contact with the PC.';
  }
  if (btn) btn.disabled = false;
}

/* ---------- navigation ---------- */
/* Two forms of nav: separate files cross-link; the single-page (artifact)
   build swaps views in place, so one URL carries the whole forecast. */
function navHtml(current){
  if (WEEKLY){
    return `<div class="tabs" role="tablist" id="viewTabs">
      <button role="tab" type="button" data-view="today" aria-selected="${current==='today'}">Today</button>
      <button role="tab" type="button" data-view="week" aria-selected="${current==='week'}">MMR week</button>
    </div>`;
  }
  const other = current === 'today'
    ? '<a class="navbtn" href="./mmr.html">MMR week &rsaquo;</a>'
    : '<a class="navbtn" href="./index.html">&lsaquo; Today</a>';
  const theme = D.artifact ? '' :
    '<button class="navbtn" id="themeBtn" type="button">Light / dark</button>';
  return `<div class="nav">${other}${theme}</div>`;
}

function showView(which){
  VIEW = which;
  D = (which === 'week') ? WEEKLY : DAILY;
  render();
  scrollTo({top:0, behavior:'smooth'});
}

/* ---------- build ---------- */
const statusText = {none:'No meaningful rain', good:'Light', warning:'Moderate',
                    serious:'Heavy', critical:'Very heavy'};

function render(){
  if (D.page === 'weekly') return renderWeekly();
  const c = D.confidence, ing = D.ingredients;
  const probTxt = D.probability !== null ? D.probability + '%' : D.modelAgreement;
  let h = '';

  h += `<header>
    <div>
      <h1>${esc(D.site)} — rain forecast</h1>
      <p class="sub">${esc(D.validDate)} · issued ${esc(D.issued)} · ${esc(D.season)}</p>
    </div>
    ${navHtml('today')}
  </header>` + refreshBarHtml();

  /* ---- right now: the radar leads, the model follows ----
     The one line worth reading on a phone. When there is a fresh scan it says
     what the beam sees falling, and only then what the models expect. */
  if (D.nowLine){
    h += `<div class="card"><h2>Right now</h2>
      <p class="rhead" style="margin:0">${mdBold(D.nowLine)}</p></div>`;
  }

  /* ---- wind and feels-like ----
     Feels-like sits in the second column on purpose: it is the number people
     actually experience, and on this coast it runs several degrees above the
     thermometer for months at a time. The gap beside it is the humidity, which
     is the part readers find surprising. */
  if (D.wind && D.wind.length){
    const W = D.wind;
    const first = W[0];
    h += `<div class="card"><h2>Wind and how it will feel</h2>
      ${first && first.sentence
        ? `<p class="rhead">${mdBold(first.sentence)}</p>` : ''}
      <div class="scroll"><table style="white-space:nowrap"><thead><tr>
        <th>Day</th><th>Feels like</th><th>Actual</th><th>Wind</th>
        <th>Gust</th><th>From</th>
      </tr></thead><tbody>
      ${W.map(w => `<tr>
        <td>${esc(w.day)}</td>
        <td class="num"><b>${w.feels === null || w.feels === undefined
          ? '—' : w.feels + '&deg;C'}</b>${
          w.gap ? ` <span class="muted">(+${w.gap})</span>` : ''}</td>
        <td class="num">${w.temp === null || w.temp === undefined
          ? '—' : w.temp + '&deg;C'}</td>
        <td class="num">${w.maxMs === null || w.maxMs === undefined
          ? '—' : w.maxMs.toFixed(0) + ' m/s'}</td>
        <td class="num">${w.gustKmph === null || w.gustKmph === undefined
          ? '—' : w.gustKmph + ' kmph'}</td>
        <td>${esc(w.from || '—')}</td></tr>`).join('')}
      </tbody></table></div>
      <div class="quote">Feels-like is the NWS heat index — temperature and
        humidity only, and the bracketed figure is how much the humidity adds.
        It is a shade value: the sun makes it worse, and a sea breeze takes
        some back, which is why the wind is beside it rather than inside it.
        IMD's heat-index danger band opens at 41&deg;C.</div>
    </div>`;
  }

  /* ---- morning visibility ----
     Shown per model rather than as one verdict, because the models disagree
     about dawn humidity at this point more than they disagree about almost
     anything else: over January 2026 every flagged morning was ECMWF and ICON
     against GFS, which ran 4-10C drier and reported 24 km. A single headline
     would hide the one thing a reader needs in order to decide whether to
     leave early. */
  if (D.fog && D.fog.length){
    h += `<div class="card"><h2>Morning visibility</h2>
      ${D.fog.map(f => `
        <p class="rhead"><b>${esc(f.day)} — ${esc(
          f.level === 'haze' ? 'haze' :
          f.level === 'dense' ? 'dense fog' :
          f.level === 'fog' ? 'fog' : 'mist')}</b>
          <span class="muted">(${f.agree} of ${f.total} models)</span></p>
        <p class="pt">${mdBold(f.sentence)}</p>
        <div class="scroll"><table style="white-space:nowrap"><thead><tr>
          <th>Model</th><th>Call</th><th>Dew-point gap</th><th>Wind</th>
          <th>Overnight cooling</th><th>Visibility</th>
        </tr></thead><tbody>
        ${(f.models || []).map(m => `<tr>
          <td>${esc(m.name)}</td>
          <td><b>${esc(m.level === 'none' ? 'nothing' : m.level)}</b></td>
          <td class="num">${m.dep === null ? '—' : m.dep.toFixed(1) + '&deg;C'}</td>
          <td class="num">${m.wind === null ? '—' : m.wind.toFixed(1) + ' m/s'}</td>
          <td class="num">${m.cool === null ? '—' : m.cool.toFixed(0) + '&deg;C'}</td>
          <td class="num">${m.vis === null || m.vis === undefined ? 'not published'
            : (m.vis >= 10000 ? 'clear' : Math.round(m.vis) + ' m')}</td>
          </tr>`).join('')}
        </tbody></table></div>`).join('')}
      <div class="quote">Fog is diagnosed from the ingredients — a small
        dew-point gap, light wind, clear sky and a big overnight temperature
        fall — because only GFS publishes a visibility field for this point.
        IMD's fog warnings are the official ones.</div>
    </div>`;
  }

  /* ---- where the monsoon is ----
     Ahead of everything else, because it is the frame the rest gets read
     inside. The calendar used to decide this on its own, and on 1 Oct 2026 it
     announced the post-monsoon while the westerly was still running and a low
     sat 139 km offshore. The four rows are IMD's own withdrawal tests, shown
     whether or not they are met - a reader can check them against an IMD
     chart, which is the point. */
  if (D.monsoonState && D.monsoonState.sentence){
    const M = D.monsoonState;
    h += `<div class="card"><h2>Where the monsoon is</h2>
      <p class="rhead"><b>${esc(M.label)}.</b> ${esc(M.sentence)}</p>
      ${M.disagrees
        ? `<div class="warn">The calendar calls this
           <b>${esc(M.calendar)}</b>; the fields say <b>${esc(M.diagnosed)}</b>,
           and the wording on this page follows the fields. A date cannot know
           where the monsoon is.</div>`
        : ''}
      <table style="margin-top:12px"><thead><tr>
        <th>IMD withdrawal test</th><th>Reads as</th><th>Evidence</th>
      </tr></thead><tbody>
      ${(M.criteria || []).map(c => `<tr>
        <td>${esc(c.name)}</td>
        <td><span class="pill ${c.ok ? 's-warning' : 's-good'}"
            style="padding:2px 9px;font-size:12px;white-space:nowrap"
            ><span class="dot"></span>${c.ok ? 'met' : 'not met'}</span></td>
        <td>${esc(c.why)}</td></tr>`).join('')}
      </tbody></table>
      <div class="quote">${esc(M.note)}</div>
    </div>`;
  }

  h += basinsHtml();

  /* ---- what KIND of rain ----
     Placed before the amounts. Millimetres alone cannot tell a reader what a
     day will feel like: twelve from the monsoon is a grey hours-long soak,
     twelve from an easterly storm is one violent quarter-hour. The driver
     also decides WHERE it lands, because an easterly reverses the terrain. */
  if (D.rainSource && D.rainSource.headline){
    const S = D.rainSource;
    const tw = S.thunder === 'likely' ? 'Thunderstorms likely'
             : S.thunder === 'possible' ? 'Thunderstorms possible' : '';
    h += `<div class="card"><h2>What kind of rain this is</h2>
      <div class="srcline">
        <span class="srctag src-${esc(S.key)}">${esc(S.label)}</span>
        ${tw ? `<span class="srctag src-thunder">&#9889; ${tw}</span>` : ''}
        ${S.windFrom !== null && S.windFrom !== undefined
          ? `<span class="srcwind">850 hPa wind ${S.windFrom}&deg; at ${S.windMs} m/s</span>` : ''}
      </div>
      <p class="rhead" style="margin-top:10px"><b>${esc(S.headline)}.</b></p>
      ${mdBold(S.detail).split(/\n\n+/).map(p => `<p class="pt">${p}</p>`).join('')}
      ${S.terrain ? `<div class="quote">${mdBold(S.terrain)}</div>` : ''}
      ${tw && S.burst !== null && S.burst !== undefined && S.burst >= 0.28
        ? `<p class="rhow">About <b>${Math.round(S.burst*100)}%</b> of the day's
           rain is modelled to fall in a single hour &mdash; the shape of a
           shower rather than of steady rain.</p>` : ''}
      ${S.contributors && S.contributors.length
        ? `<p class="rhow">Also in play: ${S.contributors.map(mdBold).join('; ')}.</p>` : ''}
    </div>`;
  }

  if (D.alerts && D.alerts.length){
    h += `<div class="card" style="border-color:var(--alert-edge)">
      <h2>⚡ Major weather shifts — next 7 days</h2>
      ${D.alerts.map(a => `<div class="alert a-${esc(a.severity)}">
        <div class="ai">${esc(a.icon)}</div>
        <div><div class="at"><span class="tag">${esc(a.label)}</span> ${esc(a.title)}</div>
        <div class="ab">${mdBold(a.body)}${subList(a.points)}</div></div></div>`).join('')}
    </div>`;
  } else {
    h += `<div class="card"><h2>⚡ Major weather shifts</h2>
      <p class="sub" style="margin:0">No major shifts in the next seven days —
        the pattern holds steady throughout.</p></div>`;
  }

  h += summaryHtml();
  h += windyMapHtml();
  h += driversHtml();
  h += skodaHtml();

  /* ---- the weekend, called out on its own ---- */
  if (D.weekend && D.plainWeek){
    const wk = D.plainWeek.filter(p => p.isWeekend);
    if (wk.length){
      h += `<div class="card"><h2>This weekend</h2>
        <p style="margin:0 0 4px;font-size:16px;font-weight:620">${esc(D.weekend.verdict)}</p>
        <p class="sub" style="margin:0 0 12px">${esc(D.weekend.plans)}</p>
        ${wk.map(p => `<div class="pday">
          <div class="pic">${esc(p.icon)}</div>
          <div class="pbody">
            <div class="pd">${esc(p.day)}</div>
            <div class="ph">${esc(p.headline)}</div>
            ${p.detail ? `<div class="pt">${esc(p.detail)}</div>` : ''}
            ${p.advice ? `<div class="pa">${esc(p.advice)}</div>` : ''}
            <div class="pc">${esc(p.confidence)}</div>
          </div></div>`).join('')}
      </div>`;
    }
  }

  /* ---- plain English week ---- */
  if (D.plainWeek && D.plainWeek.length){
    h += `<div class="card"><h2>In plain English</h2>
      <p class="sub" style="margin:-6px 0 14px">The forecast. Everything further
        down is the working behind it.</p>`;
    let prevAdvice = null, prevChar = null;
    h += D.plainWeek.map(p => {
      const showAdvice = p.advice && p.advice !== prevAdvice;
      prevAdvice = p.advice;
      return `<div class="pday">
        <div class="pic">${esc(p.icon)}</div>
        <div class="pbody">
          <div class="pd">${esc(p.day)}</div>
          <div class="ph">${esc(p.headline)}</div>
          ${p.detail ? `<div class="pt">${esc(p.detail)}</div>` : ''}
          ${showAdvice ? `<div class="pa">${esc(p.advice)}</div>` : ''}
          <div class="pc">${esc(p.confidence)}</div>
        </div></div>`;
    }).join('');
    h += `</div>`;
  }

  /* hero + headline */
  h += `<div class="card">
    <div class="hero">
      <div class="fig">${esc(probTxt)}</div>
      <div class="cap">chance of measurable rain (&ge;${D.heavyThreshold ? '2.5' : '2.5'} mm)
        ${D.members ? `<br><span class="muted">from a ${D.members}-member ensemble</span>` : ''}</div>
    </div>
    <p class="headline">
      <span class="pill s-${esc(D.status)}"><span class="dot"></span>${esc(D.statusIcon)}
        ${esc(D.categoryLo === D.categoryHi ? D.categoryLo : D.categoryLo + ' to ' + D.categoryHi)}</span>
      &nbsp;${D.rainLo.toFixed(0)}–${D.rainHi.toFixed(0)} mm expected · ${esc(D.character)}
    </p>
    <div class="quote">Report the <b>category</b>, not the millimetre figure — model agreement on
      category is defensible, agreement on a number is not.</div>
  </div>`;

  /* tiles */
  h += `<div class="card"><h2>At a glance</h2><div class="tiles">
    <div class="tile"><div class="lab">Rain range</div><div class="val">${D.rainLo.toFixed(0)}–${D.rainHi.toFixed(0)}<span style="font-size:14px;font-weight:500"> mm</span></div>
      <div class="note">median ${D.rainMedian.toFixed(0)} mm</div></div>
    <div class="tile"><div class="lab">Peak hourly rate</div><div class="val">${D.peakRate}<span style="font-size:14px;font-weight:500"> mm/h</span></div>
      <div class="note">${D.wetHours} wet hours, longest run ${D.longestRun} h</div></div>
    <div class="tile"><div class="lab">Heavy-rain chance</div><div class="val">${D.probHeavy !== null ? D.probHeavy + '%' : '--'}</div>
      <div class="note">&ge;${D.heavyThreshold} mm/24h (IMD heavy)</div></div>
    <div class="tile"><div class="lab">Confidence — rain occurs</div><div class="val" style="font-size:17px">${esc(c.occurrence)}</div>${meter(c.occurrenceRank)}</div>
    <div class="tile"><div class="lab">Confidence — amount</div><div class="val" style="font-size:17px">${esc(c.amount)}</div>${meter(c.amountRank)}</div>
    <div class="tile"><div class="lab">Confidence — timing</div><div class="val" style="font-size:17px">${esc(c.timing)}</div>${meter(c.timingRank)}</div>
  </div>
  <div class="quote">${esc(c.rationale)}</div></div>`;

  /* mechanism */
  h += `<div class="card"><h2>Mechanism — why, before how much</h2>
    <p style="margin:0 0 8px"><b>${esc(D.regime)}</b> — ${esc(D.regimeNote)}</p>
    <p style="margin:0;color:var(--text-secondary);font-size:14px">${esc(D.mechanism)}</p>
    <div class="quote">system &rarr; wind response &rarr; moisture transport &rarr; lifting zone
      &rarr; expected rain footprint</div></div>`;

  /* hourly */
  const hourRows = D.hourly.map(r => ({
    v: r.mm,
    label: r.h % 3 === 0 ? String(r.h).padStart(2,'0') : '',
    tip: `<b>${String(r.h).padStart(2,'0')}:00</b> — ${r.mm.toFixed(1)} mm/h`
  }));
  h += `<div class="card"><h2>Hour by hour — rainfall rate (mm/h)</h2>
    ${columns(hourRows, {unit:' mm/h', aria:'Hourly rainfall rate through the day'})}
    <div class="quote">A day's total is often dominated by a few intense bursts — plan around
      the burst, not the daily average.</div></div>`;

  /* windows + models */
  h += `<div class="grid g2">`;
  const wRows = D.windows.map(w => ({
    label: w.label, sub: `${String(w.start).padStart(2,'0')}–${String(w.end).padStart(2,'0')}`,
    v: w.mm, valLabel: w.mm.toFixed(1) + ' mm',
    tip: `<b>${esc(w.label)}</b> — ${w.mm.toFixed(1)} mm, peak ${w.peak.toFixed(1)} mm/h<br>Risk: ${esc(w.risk)}`
  }));
  h += `<div class="card"><h2>When</h2>${hbars(wRows,{labelWidth:150,aria:'Rain by part of day'})}</div>`;

  const mRows = D.models.map(m => ({
    label: m.name, v: m.mm, valLabel: m.mm.toFixed(1) + ' mm',
    tip: `<b>${esc(m.name)}</b> — ${m.mm.toFixed(1)} mm (${esc(m.band)})`
  }));
  h += `<div class="card"><h2>Model comparison</h2>${hbars(mRows,{labelWidth:110,aria:'24-hour total by model'})}
    <div class="quote">No arithmetic mean is shown, deliberately — averaging models that represent
      different physical scenarios hides the reason they disagree.</div>
    ${D.spreadWarning ? `<div class="warn">${esc(D.spreadWarning)}</div>` : ''}</div>`;
  h += `</div>`;

  /* terrain gradient */
  if (D.gradient.length){
    // Ordinal ramp along the windward approach (coast -> transition -> crest),
    // every step clear of the ordinal contrast floor in both modes. The
    // leeward site is NOT a step on that ramp - it is the control the gradient
    // is measured against, so it takes neutral ink rather than a blue step.
    const ramp = {coastal:'var(--seq-250)', transition:'var(--seq-400)',
                  ghat:'var(--seq-550)', leeward:'var(--axis)'};
    const gRows = D.gradient.map(s => ({
      label: s.name + (s.home ? '  ★' : ''), sub: s.zone,
      v: s.hi, valLabel: `${s.lo.toFixed(0)}–${s.hi.toFixed(0)} mm`,
      fill: ramp[s.zone] || 'var(--series-1)',
      tip: `<b>${esc(s.name)}</b> (${esc(s.zone)})<br>${s.lo.toFixed(0)}–${s.hi.toFixed(0)} mm · 850 hPa ${esc(s.wind)}<br>Terrain: ${esc(s.terrain)}`
    }));
    h += `<div class="card"><h2>Coast &rarr; crest &rarr; rain shadow</h2>
      <p class="sub" style="margin:-6px 0 12px">Shade deepens along the windward approach;
        the leeward control is grey.</p>
      ${hbars(gRows,{labelWidth:200,aria:'Rainfall across the terrain gradient'})}
      ${D.gradientVerdict ? `<div class="quote">${esc(D.gradientVerdict)}</div>` : ''}
      <div class="quote">The same westerly is <i>upslope</i> at Matheran and <i>descending</i> at
        Pune — which is why Pune is carried as a control, not another forecast point.</div></div>`;
  }

  /* outlook */
  if (D.outlook.length){
    const oRows = D.outlook.map(d => ({
      v: d.hi, label: d.short,
      tip: `<b>${esc(d.day)}</b> — ${d.lo.toFixed(0)}–${d.hi.toFixed(0)} mm<br>${esc(d.regime)}${d.chance ? '<br>Rain chance ' + esc(d.chance) : ''}`
    }));
    h += `<div class="card"><h2>Days ahead — rainfall range (mm)</h2>
      ${columns(oRows,{unit:' mm',aria:'Daily rainfall for the days ahead'})}
      <div class="scroll"><table><thead><tr><th>Day</th><th>Regime</th><th class="num">Rain</th><th class="num">Chance</th></tr></thead><tbody>
      ${D.outlook.map(d => `<tr><td>${esc(d.day)}</td><td>${esc(d.regime)}</td>
        <td class="num">${d.lo.toFixed(0)}–${d.hi.toFixed(0)} mm</td><td class="num">${esc(d.chance||'--')}</td></tr>`).join('')}
      </tbody></table></div>
