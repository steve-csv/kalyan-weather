b.*(alert|warning|orange|red|yellow)", "(orange|red|yellow) alert", "official"], "t": "Official warnings", "a": "I'm not an official source. IMD's colour-coded warnings — yellow, orange, red — and the civic authorities' instructions are what to act on for safety. The page's own alerts are a forecaster's read of the pattern, meant to help you plan, not to replace them."}];
let D = DAILY;                  /* the view currently on screen */
let VIEW = DAILY.page === 'weekly' ? 'week' : 'today';

/* ---------- theme ---------- */
/* localStorage throws outright on an opaque origin (data: URLs, some file://
   setups, private browsing). Unguarded, that exception kills the whole script
   before anything renders and the page comes up blank - so every access is
   wrapped and the theme simply falls back to the OS setting. */
function storeGet(k){ try { return localStorage.getItem(k); } catch (e) { return null; } }
function storeSet(k, v){ try { localStorage.setItem(k, v); } catch (e) { /* no-op */ } }

const saved = storeGet('wx-theme');
if (saved) document.documentElement.setAttribute('data-theme', saved);

/* Tint the page from the day being shown. Derived from the IMD band, so it
   tracks the actual forecast rather than a guess at "nice weather". */
function applyMood(){
  const days = (DAILY && DAILY.plainWeek) || (WEEKLY && WEEKLY.plainWeek) || [];
  const head = (days[0] && days[0].headline || '').toLowerCase();
  let mood = 'light';
  if (/^(dry|mostly dry)/.test(head)) mood = 'sunny';
  else if (/very heavy|extremely heavy/.test(head)) mood = 'severe';
  else if (/heavy/.test(head)) mood = 'heavy';
  else if (/moderate/.test(head)) mood = 'wet';
  else if (/light/.test(head)) mood = 'light';
  document.documentElement.setAttribute('data-wx', mood);
}
function toggleTheme(){
  const cur = document.documentElement.getAttribute('data-theme')
    || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
  const next = cur === 'dark' ? 'light' : 'dark';
  document.documentElement.setAttribute('data-theme', next);
  storeSet('wx-theme', next);
}

/* ---------- helpers ---------- */
const esc = s => String(s ?? '').replace(/[&<>"]/g, c =>
  ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
/* Sub-points describe ONE event's possible resolutions. They arrive with
   **bold** markers; escape first, then promote only that marker, so nothing
   else in the string can become markup. */
const subList = pts => (pts && pts.length)
  ? `<ul class="apts">` + pts.map(t =>
      `<li>${esc(t).replace(/\*\*(.+?)\*\*/g, '<b>$1</b>')}</li>`
    ).join('') + `</ul>`
  : '';
const nn = v => (v === null || v === undefined) ? '--' : v;

const tip = document.getElementById('tip');
function showTip(e, html){
  tip.innerHTML = html; tip.style.opacity = 1;
  const r = tip.getBoundingClientRect();
  let x = e.clientX + 14, y = e.clientY - r.height - 10;
  if (x + r.width > innerWidth - 8) x = e.clientX - r.width - 14;
  if (y < 8) y = e.clientY + 18;
  tip.style.left = x + 'px'; tip.style.top = y + 'px';
}
function hideTip(){ tip.style.opacity = 0; }

/* ---------- column chart (magnitude over time, single series) ---------- */
function columns(rows, opts){
  const W = 980, H = 190, PT = 22, PB = 26, PL = 34, PR = 8;
  const max = Math.max(opts.max || 0, ...rows.map(r => r.v), 0.1);
  const n = rows.length;
  const band = (W - PL - PR) / n;
  // Bars capped at 24px, with a 2px surface gap between neighbours.
  const bw = Math.max(3, Math.min(24, band - 2));
  const y = v => H - PB - (v / max) * (H - PT - PB);

  let g = '';
  // recessive gridlines + ticks
  const steps = 4;
  for (let i = 0; i <= steps; i++){
    const v = max * i / steps, yy = y(v);
    g += `<line class="gl" x1="${PL}" x2="${W-PR}" y1="${yy}" y2="${yy}"/>`;
    g += `<text class="tick" x="${PL-7}" y="${yy+3.5}" text-anchor="end">${
      v >= 10 ? v.toFixed(0) : v.toFixed(1)}</text>`;
  }
  g += `<line class="base" x1="${PL}" x2="${W-PR}" y1="${H-PB}" y2="${H-PB}"/>`;

  rows.forEach((r, i) => {
    const cx = PL + band * i + band / 2;
    const x = cx - bw / 2;
    const hh = Math.max(0, H - PB - y(r.v));
    if (r.v > 0){
      // 4px rounded data-end, square at the baseline
      const rr = Math.min(4, bw / 2, hh);
      const fill = r.fill || 'var(--series-1)';
      g += `<path d="M${x},${H-PB} L${x},${H-PB-hh+rr} Q${x},${H-PB-hh} ${x+rr},${H-PB-hh}
        L${x+bw-rr},${H-PB-hh} Q${x+bw},${H-PB-hh} ${x+bw},${H-PB-hh+rr}
        L${x+bw},${H-PB} Z" fill="${fill}"/>`;
    }
    if (r.label) g += `<text class="tick" x="${cx}" y="${H-PB+15}" text-anchor="middle">${esc(r.label)}</text>`;
    g += `<rect class="hit" x="${PL+band*i}" y="${PT-10}" width="${band}" height="${H-PT-PB+20}"
      data-tip="${esc(r.tip)}"/>`;
  });

  // label only the extreme, never every bar
  const peak = rows.reduce((a,b) => b.v > a.v ? b : a, rows[0] || {v:0});
  if (peak && peak.v > 0){
    const pi = rows.indexOf(peak);
    const cx = PL + band * pi + band / 2;
    g += `<text class="vlab" x="${cx}" y="${y(peak.v)-7}" text-anchor="middle">${
      peak.v >= 10 ? peak.v.toFixed(0) : peak.v.toFixed(1)}${opts.unit||''}</text>`;
  }
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(opts.aria||'')}">${g}</svg>`;
}

/* ---------- donut: share of a day's rain by time of day ----------------
   A pie/donut is only defensible for part-to-whole, at a glance, with few
   segments - which is exactly this: five ordered slices of one day's rain.
   It is NOT used for the nine-area comparison, where the values are close and
   numerous and a bar chart reads far better.
   The slices are an ORDERED ramp (dawn -> night), not categorical hues, and
   every value is repeated in the table beneath so nothing is gated behind
   colour or a hover. */
function donut(rows, opts){
  const W = 460, H = 260, cx = 130, cy = 130, r = 96, inner = 58;
  const total = rows.reduce((a, b) => a + b.v, 0);
  if (total <= 0){
    return `<p class="sub">No rain to break down for this day.</p>`;
  }

  let a0 = -Math.PI / 2, g = '';
  const GAP = 0.016;                       // surface gap between slices, in rad

  rows.forEach((r0, i) => {
    const frac = r0.v / total;
    if (frac <= 0) return;
    const a1 = a0 + frac * Math.PI * 2;
    const s = a0 + GAP / 2, e = Math.max(s, a1 - GAP / 2);
    const large = (e - s) > Math.PI ? 1 : 0;
    const p = (rad, radius) => [cx + radius * Math.cos(rad), cy + radius * Math.sin(rad)];
    const [x1, y1] = p(s, r), [x2, y2] = p(e, r);
    const [x3, y3] = p(e, inner), [x4, y4] = p(s, inner);
    g += `<path d="M${x1},${y1} A${r},${r} 0 ${large} 1 ${x2},${y2}
      L${x3},${y3} A${inner},${inner} 0 ${large} 0 ${x4},${y4} Z"
      fill="${r0.fill}"/>`;
    g += `<rect class="hit" x="0" y="0" width="${W}" height="${H}"
      style="pointer-events:none"/>`;
    a0 = a1;
  });

  // Hero figure in the hole - the number the chart is actually about.
  g += `<text x="${cx}" y="${cy - 4}" text-anchor="middle"
     style="font-size:26px;font-weight:660;fill:var(--text-primary)">${total.toFixed(0)}</text>`;
  g += `<text x="${cx}" y="${cy + 15}" text-anchor="middle"
     style="font-size:11px;fill:var(--muted)">mm total</text>`;

  // Legend: identity never rests on colour alone.
  rows.forEach((r0, i) => {
    const y = 26 + i * 21;
    const pct = total ? (r0.v / total * 100) : 0;
    g += `<rect x="266" y="${y - 9}" width="11" height="11" rx="3" fill="${r0.fill}"/>`;
    g += `<text x="284" y="${y}" style="font-size:12px;fill:var(--text-primary)">${esc(r0.label)}</text>`;
    g += `<text x="${W - 6}" y="${y}" text-anchor="end"
       style="font-size:12px;fill:var(--text-secondary);font-variant-numeric:tabular-nums">${r0.v.toFixed(1)} mm · ${pct.toFixed(0)}%</text>`;
  });

  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(opts.aria || '')}">${g}</svg>`;
}

/* ---------- heatmap: week x time of day -------------------------------- */
function heatmap(days, parts, cells, opts){
  const W = 980, LEFT = 96, TOP = 26, CH = 34, PAD = 4;
  const H = TOP + parts.length * CH + 16;
  const colW = (W - LEFT - 8) / days.length;
  const max = Math.max(...cells.flat(), 0.1);
  let g = '';

  days.forEach((d, i) => {
    g += `<text class="tick" x="${LEFT + colW * i + colW / 2}" y="${TOP - 10}"
       text-anchor="middle">${esc(d)}</text>`;
  });

  parts.forEach((p, r) => {
    const y = TOP + r * CH;
    g += `<text class="tick" x="${LEFT - 10}" y="${y + CH / 2 + 4}"
       text-anchor="end">${esc(p)}</text>`;
    days.forEach((d, c) => {
      const v = cells[r][c] || 0;
      const t = Math.min(1, v / max);
      // One hue, light->dark. Opacity carries magnitude against the surface,
      // so it reads correctly in both themes without a second palette.
      const op = v <= 0.05 ? 0 : 0.14 + t * 0.86;
      const x = LEFT + colW * c;
      g += `<rect x="${x + PAD / 2}" y="${y + PAD / 2}"
         width="${colW - PAD}" height="${CH - PAD}" rx="5"
         fill="var(--series-1)" fill-opacity="${op.toFixed(3)}"/>`;
      if (v <= 0.05){
        g += `<rect x="${x + PAD / 2}" y="${y + PAD / 2}"
           width="${colW - PAD}" height="${CH - PAD}" rx="5"
           fill="none" stroke="var(--grid)"/>`;
      }
      g += `<rect class="hit" x="${x}" y="${y}" width="${colW}" height="${CH}"
         data-tip="${esc(d + ' ' + p + ' — ' + v.toFixed(1) + ' mm')}"/>`;
    });
  });

  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(opts.aria || '')}">${g}</svg>`;
}

/* ---------- horizontal bars ---------- */
function hbars(rows, opts){
  const W = 980, RH = 34, PL = opts.labelWidth || 168, PR = 62;
  const H = rows.length * RH + 12;
  const max = Math.max(...rows.map(r => r.v), 0.1);
  let g = '';
  rows.forEach((r, i) => {
    const y = i * RH + 6;
    const bh = Math.min(24, RH - 12);
    const len = Math.max(0, (r.v / max) * (W - PL - PR));
    const rr = Math.min(4, bh / 2, len);
    g += `<text class="tick" x="0" y="${y+bh/2+4}" style="fill:var(--text-primary);font-size:12.5px">${esc(r.label)}</text>`;
    if (r.sub) g += `<text class="tick" x="${PL-10}" y="${y+bh/2+4}" text-anchor="end">${esc(r.sub)}</text>`;
    if (len > 0){
      g += `<path d="M${PL},${y} L${PL+len-rr},${y} Q${PL+len},${y} ${PL+len},${y+rr}
        L${PL+len},${y+bh-rr} Q${PL+len},${y+bh} ${PL+len-rr},${y+bh} L${PL},${y+bh} Z"
        fill="${r.fill || 'var(--series-1)'}"/>`;
    }
    g += `<text class="vlab" x="${PL+len+9}" y="${y+bh/2+4}">${esc(r.valLabel)}</text>`;
    g += `<rect class="hit" x="0" y="${y-4}" width="${W}" height="${RH}" data-tip="${esc(r.tip)}"/>`;
  });
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(opts.aria||'')}">${g}</svg>`;
}

function meter(rank){
  let s = '<div class="meter">';
  for (let i = 1; i <= 5; i++) s += `<i class="${i <= rank ? 'on' : ''}"></i>`;
  return s + '</div>';
}

/* ---------- weekly layout ---------- */
function renderWeekly(){
  const T = D.thresholds;
  let h = '';
  h += `<header>
    <div>
      <h1>Mumbai MMR — week ahead</h1>
      <p class="sub">${esc(D.validDate)} · issued ${esc(D.issued)} · ${esc(D.season)}</p>
    </div>
    ${navHtml('week')}
  </header>`;

  h += `<div class="card">
    <div class="hero"><div class="fig" style="font-size:38px">${esc(D.weekRegime.label)}</div></div>
    <p class="headline" style="font-weight:400;font-size:15px;color:var(--text-secondary)">${esc(D.weekRegime.note)}</p>
    <div class="quote">Built from wind-pattern analysis — the 850 hPa terrain-normal component,
      the monsoon trough position and the offshore trough — not from a rainfall total.</div>
  </div>`;

  h += summaryHtml();
  h += windyMapHtml();
  h += driversHtml();
  h += skodaHtml();

  /* ---- alerts ---- */
  if (D.alerts && D.alerts.length){
    h += `<div class="card"><h2>⚡ Major weather shifts this week</h2>
      ${D.alerts.map(a => `<div class="alert a-${esc(a.severity)}">
        <div class="ai">${esc(a.icon)}</div>
        <div><div class="at"><span class="tag">${esc(a.label)}</span> ${esc(a.title)}</div>
        <div class="ab">${mdBold(a.body)}${subList(a.points)}</div></div></div>`).join('')}
    </div>`;
  } else {
    h += `<div class="card"><h2>⚡ Major weather shifts this week</h2>
      <p class="sub" style="margin:0">None — the pattern holds steady all week.</p></div>`;
  }

  /* ---- area by area across the MMR ---- */
  if (D.areas && D.areas.length){
    const maxWk = Math.max(...D.areas.map(a => a.weekMm), 1);
    h += `<div class="card"><h2>Across the MMR — area by area</h2>
      <p class="sub" style="margin:-6px 0 14px">The MMR is not one forecast.
        Ranked wettest first; ★ marks your home belt.</p>
      ${hbars(D.areas.map(a => ({
        label: a.name + (a.home ? '  ★' : ''),
        v: a.weekMm, valLabel: a.weekMm.toFixed(0) + ' mm',
        fill: a.home ? 'var(--seq-550)' : 'var(--seq-400)',
        tip: `<b>${esc(a.name)}</b><br>~${a.weekMm.toFixed(0)} mm this week<br>Wettest ${esc(a.wettestDay)} (${a.wettestMm.toFixed(0)} mm)`
      })), {labelWidth:230, aria:'Weekly rainfall by MMR area'})}
      <div class="scroll"><table><thead><tr><th>Area</th><th class="num">Week</th>
        <th>Wettest</th><th>What to expect</th></tr></thead><tbody>
      ${D.areas.map(a => `<tr><td>${esc(a.name)}${a.home ? ' ★' : ''}</td>
        <td class="num">~${a.weekMm.toFixed(0)} mm</td><td>${esc(a.wettestDay)}</td>
        <td>${esc(a.plain)}</td></tr>`).join('')}
      </tbody></table></div>
      <div class="quote"><b>${esc(D.areas[0].name)}</b> takes about
        ${D.areas[0].weekMm.toFixed(0)} mm this week against
        ${D.areas[D.areas.length-1].weekMm.toFixed(0)} mm for
        <b>${esc(D.areas[D.areas.length-1].name)}</b> — across a region you can
        drive over in two hours. A single "Mumbai" number hides all of that.</div>
    </div>`;
  }


  h += trackHtml(D);

  /* ---- upstream drivers (Somali jet, mid-level dry air) ---- */
  if (D.upstream && D.upstream.available){
    const u = D.upstream;
    const jetTone = /very strong|strong/.test(u.jet) ? 'good'
                  : /weak/.test(u.jet) ? 'bad' : 'neu';
    const dryTone = /very dry|dry/.test(u.dry) ? 'bad'
                  : /moist/.test(u.dry) ? 'good' : 'neu';
    const advBad = u.advection === 'steered onto us' && /dry/.test(u.dry);
    h += `<div class="card"><h2>Upstream drivers</h2>
      <p class="sub" style="margin:-6px 0 14px">The Somali jet decides how much
        moisture is being delivered. The mid-level airmass decides whether it can
        become deep cloud once it gets here.</p>
      <div class="dgrid">
        <div class="dtile d-${jetTone}">
          <div class="dname">SOMALI JET</div>
          <div class="dval">${u.jetSpeed != null ? u.jetSpeed + ' m/s' : '—'}</div>
          <div class="dsub"><b>${esc(u.jet)}</b>${u.jetDir ? ' from ' + esc(u.jetDir) : ''}
            ${u.sourceSupports === false ? ' · source slackening behind it' : ''}</div>
        </div>
        <div class="dtile d-${dryTone}">
          <div class="dname">MID-LEVEL AIR</div>
          <div class="dval">${u.midRh != null ? u.midRh + '%' : '—'}</div>
          <div class="dsub"><b>${esc(u.dry)}</b>${u.advection ? ' · ' + esc(u.advection) : ''}</div>
        </div>
      </div>
      ${u.reading ? `<div class="dtext">${mdBold(u.reading)}</div>` : ''}
      ${advBad ? `<div class="quote">Dry mid-level air is being steered onto the
        region. Low levels can look humid while cloud still fails to grow — this
        is the setup where model rain most often fails to verify.</div>` : ''}`;
    if (u.week && u.week.length > 1){
      h += `<div class="ustrip">` + u.week.map(d => {
        const t = /very strong|strong/.test(d.jet) ? 'good'
                : /weak/.test(d.jet) ? 'bad' : 'neu';
        return `<div class="uday">
          <div class="ubar u-${t}" style="height:${Math.max(6, Math.min(46, (d.jetSpeed||0) * 2))}px"
            title="${esc(d.jet)} — ${d.jetSpeed != null ? d.jetSpeed + ' m/s' : ''}"></div>

      <div class="sub" style="margin-top:6px">Corridor jet strength through the

    h += `</div>`;

  /* ---- which sea: Arabian or Bay ---- */

  if (D.basins && D.basins.length){
    h += `<div class="card"><h2>Where this week's lows form</h2>

        <div class="blinks">

  /* ---- systems ---- */

    h += `</div>`;

  /* ---- who gets this system, and when ----
     The regional forecasters people actually follow answer a question this

  if (D.regions && D.regions.list && D.regions.list.length){

    h += `<div class="card"><h2>Who gets this system, and when</h2>

    }
    h += `<div class="regs">` + rg.list.map(r => {
      if (!r.wet){

    h += `<div class="quote">Seven-day model totals over large areas, so a

  /* ---- heat & cold gradient ---- */
  if (D.thermalRows && D.thermalRows.length){
    h += `<div class="card"><h2>Heat and cold across the region</h2>

      <div class="scroll"><table><thead><tr><th>Place</th><th>IMD type</th>

      ${D.thermalRows.map(t => {
        let flag = '';

          <td class="num">${t.warmest === null ? '--' : t.warmest.toFixed(0)+'°'}</td>

      </tbody></table></div></div>`;
  }

  /* forcing chart - the spine */
  const fRows = D.windRows.map(r => ({
    v: Math.max(0, r.orographic), label: r.short,
    fill: r.orographic >= T.orogVeryStrong ? 'var(--seq-650)'
        : r.orographic >= T.orogStrong ? 'var(--seq-550)'

    tip: `<b>${esc(r.day)}</b><br>850 hPa ${esc(r.dir)} ${r.speed.toFixed(1)} m/s<br>Terrain-normal ${r.orographic.toFixed(1)} m/s — ${esc(r.forcing)}`
  }));
  h += `<div class="card"><h2>Orographic forcing — the spine of this outlook</h2>
    <p class="sub" style="margin:-6px 0 12px">Component of the 850 hPa wind aimed square at the Ghat face (m/s).

    ${columns(fRows,{max:T.orogVeryStrong*1.15,unit:' m/s',aria:'Daily orographic forcing'})}
    <div class="scroll"><table><thead><tr><th>Day</th><th>850 hPa wind</th>
      <th class="num">Speed</th><th class="num">Terrain-normal</th><th>Forcing</th></tr></thead><tbody>
      ${D.windRows.map(r => `<tr><td>${esc(r.day)}</td><td>${esc(r.dir)}</td>
        <td class="num">${r.speed.toFixed(1)} m/s</td>

    </tbody></table></div>
    <div class="quote">A fast wind blowing <i>parallel</i> to the ridge lifts almost nothing; a

  /* trough */
  h += `<div class="card"><h2>Monsoon trough through the week</h2>
    <div class="scroll"><table><thead><tr><th>Day</th><th class="num">Trough axis</th><th>Phase</th></tr></thead><tbody>
    ${D.troughRows.map(r => `<tr><td>${esc(r.day)}</td><td class="num">${esc(r.axis)}</td>
      <td><span class="pill s-${r.phase.indexOf('break') === 0 ? 'warning' : r.phase.indexOf('active') === 0 ? 'good' : 'none'}">
      <span class="dot"></span>${esc(r.phase)}</span></td></tr>`).join('')}
    </tbody></table></div>
    <div class="quote">A trough hugging the foothills (&ge;28&deg;N) for several consecutive days is
      the break signal. A trough back over the plains is the active signal. Watch the
      <i>direction of travel</i> across the week, not any single day.</div></div>`;

  /* MMR matrix */
  const zoneOrder = {coastal:0, transition:1, ghat:2, leeward:3};
  h += `<div class="card"><h2>Rainfall across the MMR</h2>
    <div class="scroll"><table><thead><tr><th>Site</th><th>Zone</th>
      ${D.siteRows[0].cells.map(c => `<th class="num">${esc(c.short)}</th>`).join('')}
      <th class="num">Week</th></tr></thead><tbody>
    ${D.siteRows.map(s => `<tr><td>${esc(s.name)}${s.home ? ' &#9733;' : ''}</td>
      <td class="muted" style="font-size:12px">${esc(s.zone)}</td>
      ${s.cells.map(c => `<td class="num" title="${esc(c.tip)}">${c.hi >= 1
        ? c.lo.toFixed(0) + '–' + c.hi.toFixed(0) : '—'}</td>`).join('')}
      <td class="num"><b>~${s.week.toFixed(0)}</b></td></tr>`).join('')}
    </tbody></table></div>
    <div class="quote">Cells show the <b>range across ECMWF, GFS and ICON</b> in mm/24h, never a
      single number. The week column sums daily medians — an order-of-magnitude figure only.</div>
    <div class="quote">The ghat-versus-Pune contrast is the diagnostic. A large contrast confirms a
      classic westerly regime with the rain shadow intact; a small one means deep moisture and broad
      ascent are overwhelming it — usually an inland system, and a wetter event for everyone.</div></div>`;

  /* narratives */
  h += `<div class="card"><h2>Day by day</h2>
    ${D.narratives.map(n => `<div style="padding:13px 0;border-bottom:1px solid var(--border)">
      <div style="font-weight:600;margin-bottom:4px">${esc(n.day)} — ${esc(n.regime)}</div>
      <div style="color:var(--text-secondary);font-size:13.5px;line-height:1.6">${esc(n.text)}</div>
    </div>`).join('')}</div>`;

  if (D.synoptic){
    h += `<div class="card"><h2>Synoptic setting</h2>
      <div style="color:var(--text-secondary);font-size:13.5px;line-height:1.65">${D.synoptic}</div></div>`;
  }

  h += `<div class="grid g2">
    <div class="card"><h2>Check it on Windy</h2>
      ${LINKS.map(l => `<a class="lk" href="${esc(l.url)}" target="_blank" rel="noopener">
        <b>${esc(l.title)}</b><span>${esc(l.why)}</span></a>`).join('')}</div>
    <div class="card"><h2>Official sources</h2>
      ${Object.entries(D.imdUrls).map(([k,v]) => `<a class="lk" href="${esc(v)}" target="_blank" rel="noopener"><b>${esc(k)}</b></a>`).join('')}
      <a class="lk" href="${esc(D.tideUrl)}" target="_blank" rel="noopener"><b>Tide tables</b>
        <span>Never synthesised here — look them up when rain reaches the heavy band.</span></a></div></div>`;

  h += `<footer>Independent interpretation, not an official IMD product.<br>
    Days 1–2: category is defensible. Days 3–5: trend and risk window only.
    Days 6–7: scenario, confidence explicitly low.</footer>`;

  document.getElementById('app').innerHTML = h;
  document.querySelectorAll('.hit').forEach(el => {
    el.addEventListener('mousemove', e => showTip(e, el.dataset.tip));
    el.addEventListener('mouseleave', hideTip);
  });
  bindAll();
  skodaGreet();
}

/* ==========================================================================
   Sam - answers questions about this week's forecast.

   Runs entirely in the page against the forecast payload. No network call, no
   model: the artifact CSP blocks external hosts and the local file must work
   offline, so anything requiring a server would be dead in both places.

   The design rule that matters: Sam only ever states what is IN the data.
   Every answer is assembled from payload fields. When he cannot answer he says
   so and offers what he does hold, rather than improvising - a weather
   assistant that guesses is worse than no assistant.
   ========================================================================== */

const SK = (() => {
  const WD = ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];

  /* ---- voice -----------------------------------------------------------
     Sam reads aloud in the user's head, so he gets the cadence of someone
     answering a question rather than a database printing a row. The openers
     rotate on a hash of the question, not at random: asking the same thing
     twice should give the same reply, and a colleague who repeated himself
     differently every time would be unsettling rather than natural.
     Personality is in the framing only - never in the facts. */

  function seed(q){
    let h = 0;
    for (let i = 0; i < q.length; i++) h = ((h << 5) - h + q.charCodeAt(i)) | 0;
    return Math.abs(h);
  }
  function pickOne(list, q){ return list[seed(q) % list.length]; }

  const OPEN_RAIN = [
    "Right —", "So,", "Okay —", "Here's the picture:", "Looking at it:",
  ];
  const OPEN_GOOD = [
    "Good news —", "You're fine here —", "Nothing to worry about —",
  ];
  const OPEN_BAD = [
    "Heads up —", "Worth planning around this —", "This one needs care —",
  ];
  const OPEN_UNSURE = [
    "Honestly, this one's marginal —", "I'd hedge here —",
    "Not a confident call —",
  ];

  function opener(q, mood){
    const bank = mood === 'good' ? OPEN_GOOD
               : mood === 'bad' ? OPEN_BAD
               : mood === 'unsure' ? OPEN_UNSURE
               : OPEN_RAIN;
    return pickOne(bank, q);
  }

  /* Mood from the day itself, so the tone matches the content. */
  function moodOf(entry){
    const h = (entry.headline || '').toLowerCase();
    if (/very heavy|extremely heavy/.test(h)) return 'bad';
    if (/heavy/.test(h)) return 'bad';
    if (/^mostly dry|^dry/.test(h)) return 'good';
    if (/possible|unlikely/.test(h)) return 'unsure';
    return 'neutral';
  }

  /* Strip source citations. They belong in the written bulletin, which is the
     technical record; in conversation "Guide s12.1:" is just noise in front of
     the sentence that actually answers the question. */
  function deCite(s){
    let t = (s || '')
      // bracketed asides first: "(Guide s11.1)"
      .replace(/\s*\((?:Guide|Handbook)[^)]*\)/gi, '')
      // then inline references, longest form first
      .replace(/\b(?:Guide|Handbook)\s+Case Study\s+[A-F]\b/gi, '')
      .replace(/\b(?:Guide|Handbook)\s+Ch\.?\s*\d+(?:\/\d+)*\b/gi, '')
      .replace(/\b(?:Guide|Handbook)\s*(?:§|s)?\s*\d+(?:\.\d+)*\b/gi, '')
      // Removing a citation can strand the connector that introduced it -
      // "the orographic engine of ." - so drop a dangling preposition that is
      // now sitting immediately before punctuation or the end of the string.
      .replace(/\s+\b(?:of|in|per|from|see|via)\b\s*(?=[.,;:)]|$)/gi, '')
      .replace(/\s*:\s*(?=[.,;)]|$)/g, '')
      // A citation that introduced a clause ("...field. Guide s12.1: this...")
      // leaves its colon stranded after the previous sentence's full stop.
      .replace(/([.!?])\s*:\s*/g, '$1 ')
      .replace(/\s+([.,;:])/g, '$1')
      // ASCII arrows read as code in a chat bubble.
      .replace(/\s*->\s*/g, ' → ')
      .replace(/\s{2,}/g, ' ')
      .replace(/^[\s:—–-]+/, '')
      .trim();
    // A citation at the head of a sentence leaves the next word lowercase.
    t = t.replace(/(^|[.!?]\s+|\n)([a-z])/g, (m, pre, ch) => pre + ch.toUpperCase());
    return t;
  }

  /* Sam reads from BOTH payloads, never from D.
     D is whichever view is on screen, and it swaps when the reader taps a tab.
     Reading from it made his knowledge depend on the tab: on the MMR week view
     D has no plainWeek, so he answered "the weekend isn't inside the current
     seven-day window" while the daily payload held it all along. What he knows
     must not change based on what is being displayed. */
  function pick(key){
    const a = DAILY && DAILY[key];
    if (a && (!Array.isArray(a) || a.length)) return a;
    const b = WEEKLY && WEEKLY[key];
    if (b && (!Array.isArray(b) || b.length)) return b;
    return null;
  }

  function week(){ return pick('plainWeek') || []; }
  function areas(){ return pick('areas') || []; }
  function alerts(){ return pick('alerts') || []; }
  function thermal(){ return pick('thermal'); }
  function thermalRows(){ return pick('thermalRows') || []; }
  function systems(){ return pick('systems'); }
  function nowcast(){ return pick('nowcast'); }
  function issued(){ return pick('issued') || ''; }
  function weekendMeta(){ return pick('weekend'); }

  /* ---- dates ----------------------------------------------------------
     Every forecast entry is resolved to a real Date, and relative words are
     resolved against the reader's CLOCK, not against the array index. The
     naive version treated days[0] as "today", which is wrong the moment the
     page is a few hours old - open yesterday's build this morning and it
     cheerfully answers "today" with yesterday's forecast. */

  const MONTHS = ['january','february','march','april','may','june','july',
                  'august','september','october','november','december'];

  function midnight(d){ return new Date(d.getFullYear(), d.getMonth(), d.getDate()); }
  function today(){ return midnight(new Date()); }
  function addDays(d, n){ const x = new Date(d); x.setDate(x.getDate() + n); return x; }
  function sameDay(a, b){ return a.getTime() === b.getTime(); }

  /* Parse "Saturday 15 August" (the stored label) into a Date. The year is not
     in the label, so it is inferred from the issue date and corrected for a
     December-January rollover. */
  function parseLabel(label){
    if (!label) return null;
    const m = label.match(/(\d{1,2})\s+([A-Za-z]+)/);
    if (!m) return null;
    const dom = parseInt(m[1], 10);
    const mon = MONTHS.indexOf(m[2].toLowerCase());
    if (mon < 0) return null;
    let year = new Date().getFullYear();
    const issued = (D.issued || '').match(/(\d{4})/);
    if (issued) year = parseInt(issued[1], 10);
    let dt = new Date(year, mon, dom);
    // A window spanning New Year would otherwise land 12 months out.
    const ref = today();
    if (dt - ref > 300 * 864e5) dt = new Date(year - 1, mon, dom);
    if (ref - dt > 300 * 864e5) dt = new Date(year + 1, mon, dom);
    return dt;
  }

  function dated(){
    return week().map(d => ({ entry: d, date: parseLabel(d.day) }))
                 .filter(x => x.date);
  }

  function windowText(){
    const ds = dated();
    if (!ds.length) return 'the current forecast window';
    const f = ds[0].date, l = ds[ds.length - 1].date;
    const fmt = (x) => x.toLocaleDateString(undefined,
                        { weekday:'short', day:'numeric', month:'short' });
    return `${fmt(f)} to ${fmt(l)}`;
  }

  /* Resolve a target Date from the question, or null. */
  function targetDate(q){
    const ref = today();
    if (/\bday after tomorrow\b/.test(q)) return addDays(ref, 2);
    if (/\btomorrow\b|\btmrw\b|\btmr\b/.test(q)) return addDays(ref, 1);
    if (/\btoday\b|\btonight\b|\bthis evening\b|\bright now\b|\bnow\b/.test(q)) return ref;
    if (/\byesterday\b/.test(q)) return addDays(ref, -1);

    // "15 aug", "aug 15", "15th", "on the 15", "15/8"
    let m = q.match(/\b(\d{1,2})\s*(?:st|nd|rd|th)?\s+(jan|feb|mar|apr|may|jun|jul|aug|sep|oct|nov|dec)/);
    if (!m) {
      const m2 = q.match(/\b(jan|feb|mar|apr|may|jun|jul|aug|sep|oct|nov|dec)[a-z]*\s+(\d{1,2})\b/);
      if (m2) m = [m2[0], m2[2], m2[1]];
    }
    if (m){
      const dom = parseInt(m[1], 10);
      const mon = MONTHS.findIndex(x => x.startsWith(m[2]));
      if (mon >= 0){
        const hit = dated().find(x => x.date.getDate() === dom && x.date.getMonth() === mon);
        return hit ? hit.date : new Date(ref.getFullYear(), mon, dom);
      }
    }
    m = q.match(/\b(\d{1,2})\s*(?:st|nd|rd|th)\b/);
    if (m){
      const dom = parseInt(m[1], 10);
      const hit = dated().find(x => x.date.getDate() === dom);
      if (hit) return hit.date;
    }

    // Weekday name -> the occurrence inside the window.
    for (let i = 0; i < 7; i++){
      const name = WD[i].toLowerCase();
      if (new RegExp('\\b' + name + '\\b').test(q)){
        const hit = dated().find(x => x.date.getDay() === i);
        if (hit) return hit.date;
        for (let k = 1; k <= 7; k++){
          const cand = addDays(ref, k);
          if (cand.getDay() === i) return cand;
        }
      }
    }
    // Bare day-of-month as a last resort, e.g. "rain on 16".
    m = q.match(/\bon\s+(\d{1,2})\b/) || q.match(/\b(\d{1,2})\b/);
    if (m){
      const dom = parseInt(m[1], 10);
      if (dom >= 1 && dom <= 31){
        const hit = dated().find(x => x.date.getDate() === dom);
        if (hit) return hit.date;
      }
    }
    return null;
  }

  /* Entry for a date, or a structured miss explaining why. */
  function findDay(q){
    const want = targetDate(q);
    if (!want) return null;
    const ds = dated();
    const hit = ds.find(x => sameDay(x.date, want));
    if (hit) return hit.entry;
    return { _miss: true, wanted: want };
  }

  function findArea(q){
    const list = areas();
    if (!list.length) return null;
    const alias = {
      'kalyan':'kalyan_belt','dombivli':'kalyan_belt',
      'thane':'thane_belt','bhiwandi':'thane_belt',
      'colaba':'island_city','island city':'island_city','south mumbai':'island_city',
      'suburb':'suburbs','andheri':'suburbs','borivali':'suburbs','bandra':'suburbs',
      'santacruz':'suburbs','chembur':'suburbs','powai':'suburbs',
      'navi mumbai':'navi_mumbai','panvel':'navi_mumbai','vashi':'navi_mumbai',
      'badlapur':'badlapur_belt','ambernath':'badlapur_belt','karjat':'badlapur_belt',
      'vasai':'north_mmr','virar':'north_mmr','palghar':'north_mmr',
      'alibag':'south_mmr','raigad':'south_mmr',
      'matheran':'ghats','lonavala':'ghats','khandala':'ghats','ghat':'ghats',
      'trek':'ghats'
    };
    for (const k in alias){
      if (q.includes(k)){
        const hit = list.find(a => a.key === alias[k]);
        if (hit) return hit;
      }
    }
    for (const a of list){
      if (q.includes((a.name || '').toLowerCase().split('—')[0].trim().toLowerCase())) return a;
    }
    return null;
  }

  /* ---- answer builders ---- */
  function missAnswer(miss){
    const want = miss.wanted;
    const ref = today();
    const label = want.toLocaleDateString(undefined,
                    { weekday:'long', day:'numeric', month:'long' });
    if (want < ref){
      return `${label} is in the past — I only carry the forward forecast `
           + `(${windowText()}). The "what fell" table further down the page `
           + `has recent rainfall.`;
    }
    return `I don't have ${label}. This forecast covers ${windowText()} — `
         + `seven days, no further. Beyond that the honest answer is that `
         + `nobody can say much specific.`;
  }

  function staleNote(){
    // The page is a static build; if it is not from today, say so before
    // answering a question about "today".
    const ds = dated();
    if (!ds.length) return '';
    const first = ds[0].date;
    const gap = Math.round((today() - first) / 864e5);
    if (gap <= 0) return '';
    return `\n\n_Heads up: this page was built ${gap} day${gap > 1 ? 's' : ''} `
         + `ago (data from ${issued() || 'an earlier run'}). Refresh it for a `
         + `current read._`;
  }

  function dayAnswer(d, q){
    if (d && d._miss) return missAnswer(d);
    q = q || d.day || '';
    const head = (d.headline || '').replace(/\.$/, '');
    let s = `${opener(q, moodOf(d))} **${d.day}**: ${head.toLowerCase()}.`;
    if (d.detail) s += `\n\n${d.detail}`;
    const drv = driverFor(d);
    if (drv) s += `\n\n${drv}`;
    if (d.advice) s += `\n\n${d.advice}`;
    if (d.confidence) s += `\n\n_${d.confidence}_`;
    return s + staleNote();
  }

  /* The kind of rain for a plain-week entry, when the page holds it. */
  function driverFor(d){
    const date = parseLabel(d.day);
    const first = dated()[0];
    const S = pick('rainSource');
    if (date && first && sameDay(date, first.date) && S && S.headline)
      return `What kind of rain: ${S.headline.charAt(0).toLowerCase() + S.headline.slice(1)}.`;
    const rt = pick('rainTypes') || [];
    const hit = date && rt.find(r => {
      const m = (r.day || '').match(/(\d{1,2})\s+([A-Za-z]{3})/);
      return m && +m[1] === date.getDate()
        && MONTHS[date.getMonth()].startsWith(m[2].toLowerCase());
    });
    if (!hit || !d.facts || d.facts.band === 'No / trace rain') return '';
    return `What kind of rain: ${hit.label.toLowerCase()}`
         + (hit.thunder && hit.thunder !== 'none' ? `, thunderstorms ${hit.thunder}` : '') + '.';
  }

  function isWeekendDay(p){
    // Prefer the flag, but fall back to the day name so this still works on a
    // page rendered before the flag existed.
    if (typeof p.isWeekend === 'boolean') return p.isWeekend;
    return /saturday|sunday/i.test(p.day || '');
  }

  function weekendAnswer(){
    const wk = week().filter(isWeekendDay);
    const meta = weekendMeta();
    if (!wk.length){
      return "The weekend isn't inside the current seven-day window. Ask me "
           + "again closer to the time.";
    }
    let s = meta ? `**${meta.verdict}** ${meta.plans}\n\n` : '';
    s += wk.map(d => {
      const head = (d.headline || '').replace(/\.$/, '');
      let t = `**${d.day}** — ${head.toLowerCase()}.`;
      if (d.detail) t += `\n${d.detail}`;
      if (d.advice) t += `\n${d.advice}`;
      return t;
    }).join('\n\n');
    return s;
  }

  function areaAnswer(a){
    let s = `**${a.name}** — ${a.accumulation || (a.weekMm ? '~' + a.weekMm.toFixed(0) + ' mm' : '')} this week.`;
    if (a.plain) s += `\n${a.plain}`;
    if (a.wettestDay) s += `\nWettest day: ${a.wettestDay}.`;
    if (a.character) s += `\n\n${a.character}`;
    return s;
  }

  function alertAnswer(){
    const list = alerts();
    if (!list.length){
      return "Nothing flagged this week, happily — the pattern just holds "
           + "steady the whole way through. Worth saying that's my own read "
           + "rather than an IMD warning, so check them for anything official.";
    }
    const lead = list.length === 1
      ? "One thing worth knowing about:"
      : `${list.length} things worth knowing about:`;
    return lead + "\n\n"
         + list.map(a => `${a.icon} **${a.title}**\n${a.body}`).join('\n\n');
  }

  function heatAnswer(){
    const t = thermal(), rows = thermalRows();
    if (!t && !rows.length) return "I don't have the heat/cold outlook on this page.";
    let s = t ? `**${t.headline}.**` : '';
    if (rows.length){
      s += '\n\n' + rows.map(r =>
        `${r.place}: warmest ${r.warmest == null ? '--' : r.warmest.toFixed(0) + '°C'}`
        + (r.peakFeels != null ? `, feels like up to ${r.peakFeels.toFixed(0)}°C` : '')
      ).join('\n');
    } else if (t && t.days && t.days.length){
      const hot = t.days.reduce((a,b) => (b.tmax||-99) > (a.tmax||-99) ? b : a);
      const feel = t.days.reduce((a,b) => (b.heatIndex||-99) > (a.heatIndex||-99) ? b : a);
      s += `\n\nWarmest ${hot.day} at ${hot.tmax.toFixed(0)}°C.`;
      if (feel.heatIndex != null)
        s += ` Peak feels-like ${feel.heatIndex.toFixed(0)}°C on ${feel.day}.`;
    }
    if (t && t.caveat) s += `\n\n_${t.caveat}_`;
    return s;
  }

  function systemAnswer(){
    const sy = systems();
    if (!sy) return "I don't have the systems analysis on this page.";
    let s = sy.trough ? sy.trough + '\n\n' : '';
    if (sy.list && sy.list.length){
      s += sy.list.map(x => `**${x.headline}**\n${x.reasoning}`).join('\n\n');
    } else {
      s += "No significant low pressure area or depression tracked within "
         + "range this week.";
    }
    if (sy.cycloneWindow){
      s += "\n\nThis month sits in an Arabian Sea cyclone window. For anything "
         + "beyond casual tracking, IMD's cyclone bulletins are the authority — "
         + "not me.";
    }
    return s;
  }

  function whyAnswer(){
    const regime = pick('regime'), mech = pick('mechanism');
    // The driver first, in plain words; the regime name is the technical
    // label for the same thing and reads as jargon on its own.
    const S = pick('rainSource');
    const lead = (S && S.headline) ? `**${S.headline}.** ${S.detail}\n\n` : '';
    if (regime || mech){
      let s = lead + (regime ? `In the forecaster's terms it's a **${regime.toLowerCase()}** day` : '');
      const note = pick('regimeNote');
      if (note) s += ` — ${note}`;
      if (mech) s += `\n\n${mech}`;
      return s;
    }
    if (lead) return lead.trim();
    const wr = pick('weekRegime');
    if (wr) return `**${wr.label}.** ${wr.note}`;
    return "I don't have the mechanism breakdown loaded.";
  }

  function nowAnswer(){
    const nc = nowcast();
    if (!nc || !nc.verdict)
      return "No short-range read on this page. The radar links above are the "
           + "better call for the next couple of hours anyway.";
    return `${nc.verdict}\n\nFor the next 0–3 hours radar beats every model `
         + `here — the IMD radar images are further down this page.`;
  }

  function compareAnswer(){
    const list = areas();
    if (list.length < 2){
      return "I don't have enough areas on this page to compare. The **MMR "
           + "week** page has the full nine-area breakdown.";
    }
    const w = list[0], d = list[list.length - 1];
    let s = `Wettest: **${w.name}** (${w.accumulation || w.weekMm.toFixed(0)+' mm'}).\n`
          + `Driest: **${d.name}** (${d.accumulation || d.weekMm.toFixed(0)+' mm'}).\n\n`
          + `Rain isn't uniform across the MMR — coast, transition belt and `
          + `Ghats behave differently in the same setup.`;
    // Never present a ranking from an incomplete field as the final word.
    const total = pick('areasTotal') || 9;
    if (list.length < total){
      s += `\n\n_Note: I have ${list.length} of ${total} areas loaded here. `
         + `The MMR week view carries the full ranking._`;
    }
    return s;
  }


  /* ---- everyday words -------------------------------------------------
     Readers here write the way they talk - "aaj paus padel ka?", "kal
     baarish hogi?". The common Marathi and Hindi words are mapped onto the
     English the routes below understand instead of failing them. "kal" is
     both yesterday and tomorrow; asked of a forecast, it means tomorrow. */
  const LOCAL_WORDS = [
    [/\baaj\b/g, 'today'], [/\bparso\b|\bparva\b/g, 'day after tomorrow'],
    [/\bkal\b|\budya\b/g, 'tomorrow'],
    [/\bpaa?us\b|\bbaa?rish\b|\bbarsaat\b|\bpani\b/g, 'rain'],
    [/\bgarmi\b|\bukad[ae]?\b/g, 'heat'], [/\bthand[ia]?\b/g, 'cold'],
    [/\btoofan\b|\btufan\b|\bvadal\b/g, 'storm'],
    [/\bbijli\b|\bvij\b/g, 'lightning'], [/\bhawa\b|\bvara\b/g, 'wind'],
  ];
  function localise(q){
    let t = q;
    for (const [re, w] of LOCAL_WORDS) t = t.replace(re, w);
    return t;
  }

  /* ---- Sam's notes (samkb.py) ----------------------------------------- */
  const KB = (typeof SAM_KB !== 'undefined' && Array.isArray(SAM_KB) ? SAM_KB : [])
    .map(e => Object.assign({}, e, { re: e.keys.map(k => new RegExp(k, 'i')) }));
  function kbMatch(q){
    let best = null, n = 0;
    for (const e of KB){
      const hits = e.re.filter(r => r.test(q)).length;
      if (hits > n){ best = e; n = hits; }
    }
    return best;
  }
  function kbById(id){ return KB.find(e => e.id === id) || null; }
  // Asking what something IS, rather than what the weather will do.
  const CONCEPT = /^(what|why|how|explain|define|meaning|tell me about|what's|whats|is it true|difference)\b|\bmean(s|ing)?\b|\bdifference\b|\bexplain\b|\bhow (does|do|is|are)\b|\bwhat (is|are|does)\b|\b(the same|same (low|system|one)|different (lows?|systems?))\b/;
  const EXPLICIT_DATE = /\b(today|tonight|tomorrow|tmrw|yesterday|monday|tuesday|wednesday|thursday|friday|saturday|sunday|weekend|\d{1,2}\s*(st|nd|rd|th)|jan|feb|mar|apr|jun|jul|aug|sep|oct|nov|dec)\b/;

  /* ---- conversation memory ---------------------------------------------
     Enough to follow "and tomorrow?", "why?" and "tell me more" the way a
     person would, without pretending to remember more than the last turn. */
  const ctx = { route: null, kb: null };

  const BAND = v => v < 0.5 ? 'nothing' : v < 2.5 ? 'light rain'
                  : v < 7.5 ? 'moderate rain' : v < 20 ? 'heavy rain'
                  : 'very heavy rain';

  /* ---- live radar ------------------------------------------------------ */
  function radarNow(){ return pick('radarNow'); }
  const BELT_ALIAS = [
    [/kalyan|dombivli|thane|bhiwandi|ulhasnagar|titwala/, 'Kalyan'],
    [/badlapur|ambernath|karjat|neral|shelu/, 'Badlapur'],
    [/navi mumbai|vashi|panvel|kharghar|nerul|belapur|airoli/, 'Navi Mumbai'],
    [/malad|borivali|andheri|goregaon|kandivali|dahisar|jogeshwari|western suburb/, 'Malad'],
    [/dadar|colaba|island city|south mumbai|churchgate|worli|byculla|parel/, 'Dadar'],
    [/vasai|virar|palghar|nalasopara|bhayandar|mira road/, 'Vasai'],
    [/igatpuri|kasara/, 'Igatpuri'],
    [/matheran|lonavala|khandala|khopoli/, 'Matheran'],
    [/malshej|murbad|junnar/, 'Malshej'],
  ];
  function findBelt(q, belts){
    for (const [re, key] of BELT_ALIAS){
      if (re.test(q)){
        const b = belts.find(x => (x.name || '').includes(key));
        if (b) return b;
      }
    }
    return null;
  }
  function beltLine(b){
    const here = b.hereMmH >= 0.5
      ? `**${BAND(b.hereMmH)}** overhead (about ${Math.max(1, Math.round(b.hereMmH))} mm/hr)`
      : 'nothing overhead';
    const near = (b.nearMmH >= 2.5 && b.nearKm > 3)
      ? `, with ${BAND(b.nearMmH)} about ${b.nearKm} km away` : '';
    const doubt = b.doubt === 'clutter'
      ? ' — unconfirmed: the other radar sees nothing there, so it may be clutter off the hills'
      : b.doubt === 'blocked'
      ? ' — the other radar has rain there that this one may be missing' : '';
    return `${here}${near}${doubt}`;
  }
  /* Minutes between the scan and the reader's clock, not the build's. */
  function scanAgeNow(){
    const R = radarNow();
    const m = (issued() || '').match(/(\d{1,2})\s+([A-Za-z]{3})[a-z]*\s+(\d{4})/);
    if (!R || !R.at || !m) return null;
    const mon = MONTHS.findIndex(x => x.startsWith(m[2].toLowerCase()));
    const hm = R.at.split(':').map(Number);
    if (mon < 0 || hm.length < 2) return null;
    const t = new Date(+m[3], mon, +m[1], hm[0], hm[1]);
    return Math.round((Date.now() - t.getTime()) / 60000);
  }
  function fmtAge(min){
    if (min < 90) return `${min} minutes`;
    if (min < 36 * 60) return `${Math.round(min / 60)} hours`;
    return `${Math.round(min / 1440)} days`;
  }
  function radarAnswer(q){
    const R = radarNow();
    if (!R || !R.belts || !R.belts.length) return nowAnswer();
    const name = (R.site || 'radar').replace(/ DWR Mumbai.*$/, '').trim();
    const age = scanAgeNow();
    let s = '';
    if (age != null && age > 60){
      s += `One thing first — the newest radar on this page is from ${R.at}, `
         + `about ${fmtAge(age)} ago, so it's history rather than now. IMD's `
         + `live radar (linked on the page) is the thing to open.\n\n`;
    }
    const belt = findBelt(q, R.belts);
    if (belt){
      const mood = belt.doubt === 'clutter' ? 'unsure'
                 : belt.hereMmH >= 7.5 ? 'bad' : belt.hereMmH < 0.5 ? 'good' : 'neutral';
      s += `${opener(q, mood)} on the ${name} radar (${R.when}), `
         + `${belt.name.replace(/ belt$/, '')} has ${beltLine(belt)}.`;
    } else {
      const wet = R.belts.filter(b => b.hereMmH >= 0.5 && b.doubt !== 'clutter');
      s += wet.length
        ? `On the ${name} radar (${R.when}), rain is falling over `
          + wet.map(b => b.name.replace(/ belt$/, '')).join(', ') + '.'
        : `On the ${name} radar (${R.when}), nothing is reaching the ground anywhere in the MMR.`;
      const home = R.belts.find(b => /Kalyan/.test(b.name || ''));
      if (home) s += `\n\nOver Kalyan: ${beltLine(home)}.`;
      const heavy = R.belts.filter(b => b.nearMmH >= 7.5 && b.nearKm > 3 && b !== home);
      if (heavy.length){
        s += `\n\nHeavier cells nearby: ` + heavy.slice(0, 3).map(b =>
          `${BAND(b.nearMmH)} ~${b.nearKm} km from ${b.name.replace(/ belt$/, '')}`).join('; ') + '.';
      }
    }
    if (R.note) s += `\n\n_${R.note}_`;
    if (R.checkNote) s += `\n\n_${R.checkNote}_`;
    return s + `\n\nRadar is right about where and whether far more than exactly how much.`;
  }

  /* ---- what kind of rain ---------------------------------------------- */
  function parseShort(label){
    // "Tue 22 Sep" - the weekly labels use short month names.
    const m = (label || '').match(/(\d{1,2})\s+([A-Za-z]{3})/);
    if (!m) return null;
    const mon = MONTHS.findIndex(x => x.startsWith(m[2].toLowerCase()));
    if (mon < 0) return null;
    const y = ((issued() || '').match(/(\d{4})/) || [0, new Date().getFullYear()])[1];
    return new Date(+y, mon, +m[1]);
  }
  function thunderWords(t){
    return t === 'likely' ? 'thunderstorms likely'
         : t === 'possible' ? 'thunderstorms possible' : '';
  }
  function rainTypeAnswer(q){
    const S = pick('rainSource');
    const rt = pick('rainTypes') || [];
    const want = targetDate(q);
    const first = dated()[0];
    const isFirst = !want || (first && sameDay(want, first.date));
    if (isFirst && S && S.headline){
      let s = `**${S.headline}.** ${S.detail}`;
      const tw = thunderWords(S.thunder);
      if (tw) s += `\n\n**${tw[0].toUpperCase() + tw.slice(1)}.**`;
      if (S.terrain) s += `\n\n${S.terrain}`;
      return s;
    }
    if (want && rt.length){
      const hit = rt.find(r => { const d = parseShort(r.day); return d && sameDay(d, want); });
      if (hit){
        const tw = thunderWords(hit.thunder);
        return `**${hit.day}: ${hit.label}.** ${hit.headline}.` + (tw ? ` ${tw[0].toUpperCase() + tw.slice(1)}.` : '');
      }
    }
    if (rt.length){
      return "Here's what drives the rain, day by day:\n\n"
        + rt.map(r => `**${r.day}** — ${r.label}` + (thunderWords(r.thunder) ? ` (${thunderWords(r.thunder)})` : '')).join('\n')
        + "\n\nA change of driver matters more than a change of total — monsoon rain and easterly storms land on opposite sides of the Ghats.";
    }
    if (S && S.headline) return `Today: **${S.headline}.** ${S.detail}\n\n_I only hold today's rain type on this page; the MMR week view has every day._`;
    const k = kbById('rain_types');
    return k ? k.a : "I don't have the rain-type read on this page.";
  }

  /* ---- timing, accuracy, models, regions, background ------------------- */
  function arrivalsAnswer(q){
    const A = pick('arrivals');
    if (!A || !A.available || !A.list) return nowAnswer();
    const R = radarNow();
    const hit = findBelt(q, A.list) || A.list.find(x => /Kalyan/.test(x.name || ''));
    let s = `Rain areas are drifting from about ${Math.round(A.fromDeg)}° at roughly `
          + `${A.speedKmh} km/h (the three models ${A.agreement === 'tight' ? 'agree closely' : 'differ a bit'} on that).`;
    if (hit) s += `\n\n**${hit.name}**: ${hit.sentence}`;
    const soon = A.list.filter(x => x !== hit && (x.now || (x.eta && x.eta > 0)));
    if (soon.length) s += `\n\nElsewhere: ` + soon.slice(0, 4).map(x =>
      `${x.name.replace(/ belt$/, '')} ${x.now ? 'now' : 'in ~' + x.eta + ' h'}`).join(', ') + '.';
    s += `\n\nThat's distance divided by the steering wind, so it assumes the rain keeps going — cells grow and die on the way.`;
    if (R) s += ` For what's falling right now, ask me about the radar.`;
    return s;
  }
  function trackAnswer(){
    const T = pick('track');
    const k = kbById('accuracy');
    if (!T || !T.available) return k ? k.a : "No scorecard on this page.";
    return T.summary + (k ? `\n\n${k.a}` : '');
  }
  function modelsAnswer(){
    const M = pick('models') || [];
    if (!M.length){ const k = kbById('no_average'); return k ? k.a : "No model breakdown on this page."; }
    let s = `For today at Kalyan West: ` + M.map(m => `${m.name} ${m.mm} mm (${m.band.toLowerCase()})`).join(', ') + '.';
    const sw = pick('spreadWarning');
    if (sw) s += `\n\n${sw}`;
    s += `\n\nI never average them — when they disagree it usually means the outcome hinges on something small, like exactly where a storm fires. Trust what they agree on more than what they don't.`;
    return s;
  }
  function confidenceAnswer(){
    const c = pick('confidence');
    if (!c) { const k = kbById('confidence'); return k ? k.a : "No confidence breakdown on this page."; }
    return `Today: **${c.occurrence}** confidence it rains, **${c.amount}** on how much, **${c.timing}** on when.\n\n${c.rationale || ''}`;
  }
  function regionHit(q){
    const R = pick('regions');
    if (!R || !R.list) return null;
    const words = q.split(/[^a-z]+/).filter(w => w.length >= 4);
    return R.list.find(r => words.some(w => (r.name || '').toLowerCase().includes(w))) || null;
  }
  function regionAnswer(r){
    const R = pick('regions');
    let s = `**${r.name}**: ${r.wet ? `${r.band.toLowerCase()}, about ${Math.round(r.totalMm)} mm over the week` : 'mostly dry this week'}`;
    if (r.wet && r.peakDay) s += `, wettest on ${r.peakDay} (${r.peakLo}–${r.peakHi} mm)`;
    s += '.';
    if (r.perModel) s += ` Models for that day: ` + Object.entries(r.perModel).map(([k, v]) => `${k} ${v}`).join(', ') + ' mm.';
    if (r.note) s += `\n\n${r.note}`;
    if (R && R.lead && R.lead.headline) s += `\n\nThe system driving it: ${R.lead.headline}.`;
    return s;
  }
  function driversAnswer(){
    const Dv = pick('drivers');
    const k = kbById('climate_drivers');
    if (!Dv) return k ? k.a : "The climate drivers are on the MMR week view.";
    // First two real sentences; skip lead-ins like "Here is why."
    const first = t => ((t || '').match(/[^.]+(\.|$)/g) || [])
      .filter(x => x.trim().length > 24).slice(0, 2).join('').trim();
    const parts = [];
    for (const key of ['enso', 'iod', 'mjo', 'miso']){
      const x = Dv[key];
      if (x && x.text) parts.push(`**${key.toUpperCase()}**: ${first(x.text)}`);
    }
    return (parts.length ? parts.join('\n\n') : (k ? k.a : ''))
         + "\n\nThey tilt the odds over weeks, not any single day.";
  }
  function upstreamAnswer(){
    const U = pick('upstream');
    const k = kbById('upstream');
    if (!U || !U.available) return k ? k.a : "No upstream read on this page.";
    return (U.reading || `The moisture-carrying jet is ${U.jet}: ${U.jetNote}. Mid-levels: ${U.dryNote}.`)
         + (k ? `\n\n${k.a}` : '');
  }
  function tideAnswer(){
    const k = kbById('tide');
    const url = pick('tideUrl');
    return (k ? k.a : '') + (url ? `\n\nIMD tide table: ${url}` : '');
  }
  function moreAnswer(){
    switch (ctx.route){
      case 'day':   return whyAnswer();
      case 'radar': {
        const R = radarNow();
        if (!R || !R.belts) return helpAnswer();
        return `Every area on the last scan (${R.when}):\n\n`
          + R.belts.map(b => `**${b.name.replace(/ belt$/, '')}** — ${beltLine(b)}`).join('\n');
      }
      case 'type':  { const k = kbById('rain_types'); return k ? k.a : helpAnswer(); }
      case 'alerts': return systemAnswer();
      case 'kb':    {
        const k = kbById(ctx.kb);
        return k ? `That's the heart of it. If it helps, ask me how it plays out today — "what kind of rain is it today?" or "is it raining now?"` : helpAnswer();
      }
      default:      return alertAnswer();
    }
  }

  function helpAnswer(){
    return "Ask me the way you'd ask a friend who follows the weather — in "
         + "English, Hindi or Marathi. For example:\n"
         + "• is it raining in Thane right now\n"
         + "• will it rain tomorrow / on Sunday / this weekend\n"
         + "• what kind of rain is it — monsoon, storms, a low?\n"
         + "• when will the rain reach Kalyan\n"
         + "• anything to watch out for\n"
         + "• what's clutter / what does dBZ mean / why is Pune drier\n"
         + "• how accurate have you been";
  }

  /* ---- routing ---- */
  function route(raw){
    const q = localise((raw || '').toLowerCase().trim());
    if (!q) return helpAnswer();

    if (/^(hi|hello|hey|namaste|namaskar|yo|good (morning|afternoon|evening))\b/.test(q))
      return "Hello! Ask me anything about the weather here — right now, "
           + "later today, or the week ahead.";

    if (/^(thank|thanks|thx|cheers|great|nice|ok|okay|cool)\b/.test(q))
      return "Any time. Shout if you want a particular day or suburb checked.";

    if (/^(why|how come|but why)\??$/.test(q)){ ctx.route = 'why'; return whyAnswer(); }
    if (/^(more|tell me more|details?|go on|and\??|explain( more)?|elaborate)\??$/.test(q))
      return moreAnswer();
    if (/\bhelp\b|what can (you|i)|how do i use/.test(q)) return helpAnswer();

    // Asking what something IS -> Sam's notes, unless it's clearly about a day.
    const kb = kbMatch(q);
    if (kb && CONCEPT.test(q) && !EXPLICIT_DATE.test(q) && !/\b(now|currently)\b/.test(q)){
      ctx.route = 'kb'; ctx.kb = kb.id; return kb.a;
    }
    // Practical questions about a day ("safe to trek on Thursday?"): the
    // advice, then that day's actual forecast, rather than advice alone.
    if (kb && /\bsafe|safety|dangerous|\btrek|\bhike|\bpicnic|\bfort\b|waterfall/.test(q)){
      ctx.route = 'kb'; ctx.kb = kb.id;
      const d = findDay(q);
      if (d && !d._miss){
        const drv = driverFor(d);
        return `${kb.a}\n\n**For ${d.day}:** ${(d.headline || '').replace(/\.$/, '').toLowerCase()}.`
             + (d.detail ? ` ${d.detail}` : '') + (drv ? ` ${drv}` : '');
      }
      return kb.a;
    }

    // What is falling now - the radar, never the model.
    if (/\bis it (raining|pouring|drizzling)\b|\braining (now|here|right now|at the moment)\b|\b(right now|currently|at the moment|abhi)\b|\bradar\b|\bnow\b.*\brain|\brain\b.*\bnow\b/.test(q)){
      ctx.route = 'radar'; return radarAnswer(q);
    }
    if (/(kind|type|sort) of rain|what.*(driv|caus)|\bthunder|\blightning|\bstorm|easterl|northerl|westerl|monsoon (wind|flow)|withdraw|pulling back/.test(q)){
      ctx.route = 'type'; return rainTypeAnswer(q);
    }
    if (/when will (it|the rain)|\breach\b|\barriv|how long (until|till|before)|coming (towards|to|here)|\beta\b/.test(q)){
      ctx.route = 'arrive'; return arrivalsAnswer(q);
    }
    if (/accura|track record|how good (are|is|were)|hit rate|scorecard|how reliable|(right|wrong) (last|yesterday)/.test(q)){
      ctx.route = 'track'; return trackAnswer();
    }
    if (/confiden|how sure|how certain/.test(q)){ ctx.route = 'conf'; return confidenceAnswer(); }
    if (/\b(ecmwf|gfs|icon)\b|\bmodels?\b/.test(q)){ ctx.route = 'models'; return modelsAnswer(); }
    if (/el ni|la ni|\benso\b|\biod\b|dipole|\bmjo\b|\bmiso\b/.test(q)){ ctx.route = 'drivers'; return driversAnswer(); }
    if (/somali|\bjet\b|dry air/.test(q)){ ctx.route = 'upstream'; return upstreamAnswer(); }
    if (/\btide|waterlog/.test(q)){ ctx.route = 'tide'; return tideAnswer(); }

    if (/weekend/.test(q)){ ctx.route = 'day'; return weekendAnswer(); }
    if (/warn|alert|danger|risk|flood/.test(q)){ ctx.route = 'alerts'; return alertAnswer(); }
    if (/heat|hot|temperature|cold|cool|humid|feels like/.test(q)){ ctx.route = 'heat'; return heatAnswer(); }
    if (/low pressure|\blpa\b|depression|cyclone|\bsystem|trough/.test(q)){ ctx.route = 'systems'; return systemAnswer(); }
    if (/^why|why is|why are|reason|because|mechanism|cause/.test(q)){ ctx.route = 'why'; return whyAnswer(); }
    if (/next few hours|nowcast|this evening|tonight/.test(q) && !findDay(q)){ ctx.route = 'radar'; return nowAnswer(); }
    if (/wettest|driest|compare|which (place|area|part)|most rain/.test(q)){ ctx.route = 'areas'; return compareAnswer(); }

    // Beyond the MMR: Pune, Nashik, Konkan, Marathwada...
    const region = regionHit(q);
    const area = findArea(q);
    if (region && !area){ ctx.route = 'region'; return regionAnswer(region); }
    // Outside the MMR, with no regional outlook on this view: say so rather
    // than answer for Kalyan as though that were the question.
    if (!region && !area && !pick('regions')
        && /\b(pune|nashik|konkan|ratnagiri|sindhudurg|goa|aurangabad|marathwada|vidarbha|nagpur|satara|kolhapur|solapur|gujarat|karnataka)\b/.test(q)){
      const d0 = week()[0];
      return "That's outside what this page carries — the regional outlook for "
           + "the rest of Maharashtra is on the MMR week view."
           + (d0 ? `\n\nFor Kalyan West today: ${d0.headline}` : '');
    }

    const day = findDay(q);
    if (day && day._miss) return missAnswer(day);
    if (day && area){
      ctx.route = 'day';
      return `${dayAnswer(day, q)}\n\n_That's the Kalyan-anchored day forecast. `
           + `For ${area.name} specifically I only hold the weekly figure: `
           + `${area.accumulation || (area.weekMm ? '~'+area.weekMm.toFixed(0)+' mm' : 'n/a')}, `
           + `wettest ${area.wettestDay || 'n/a'}._`;
    }
    if (day){ ctx.route = 'day'; return dayAnswer(day, q); }
    if (area){ ctx.route = 'areas'; return areaAnswer(area); }

    // A place was clearly meant but no area data is loaded anywhere.
    if (!areas().length && /ghat|lonavala|matheran|thane|vasai|virar|palghar|alibag|panvel|navi|badlapur|karjat|borivali|andheri|bandra|colaba|suburb|dombivli|bhiwandi|pune/.test(q)){
      const d0 = week()[0];
      return "I don't have per-area figures loaded — those come from the "
           + "weekly MMR run.\n\n"
           + (d0 ? `For Kalyan: ${d0.headline}` : '');
    }

    // A concept named without a question word ("clutter?", "rain shadow").
    if (kb){ ctx.route = 'kb'; ctx.kb = kb.id; return kb.a; }

    if (/rain|wet|shower|spell|umbrella/.test(q)){
      const days = week();
      ctx.route = 'day';
      if (days.length) return `Here's the week:\n\n`
        + days.map(d => `**${d.short || d.day}** — ${d.headline}`).join('\n');
    }

    return "I couldn't match that to anything on this page, and I'd rather "
         + "say so than guess. Try asking it another way — or one of these:\n\n"
         + helpAnswer();
  }

  /* Follow-up chips that fit where the conversation is. */
  function suggest(){
    switch (ctx.route){
      case 'day':    return ["Why?", "What kind of rain?", "Is it raining now?", "Tomorrow?"];
      case 'radar':  return ["Tell me more", "When will it reach Kalyan?", "What's clutter?", "Today's forecast?"];
      case 'type':   return ["Thunderstorm safety?", "Why is Pune drier?", "Tomorrow?", "Any warnings?"];
      case 'arrive': return ["Is it raining now?", "How heavy?", "Today's forecast?", "Any warnings?"];
      case 'kb':     return ["Is it raining now?", "What kind of rain today?", "Tomorrow?", "How accurate are you?"];
      case 'alerts': return ["Any low pressure system?", "Weekend?", "Is it raining now?", "What kind of rain?"];
      default:       return ["Is it raining now?", "Today?", "What kind of rain?", "Any warnings?", "How's the weekend?"];
    }
  }

  // Every answer goes through deCite, so no route can leak a citation.
  return { answer: (q) => deCite(route(q)), help: helpAnswer, suggest };
})();

/* ==========================================================================
   Sam with Claude - on the claude.ai page only.

   The published Artifact may ask Claude through the `sample` capability, on
   the VIEWER's own Claude account, with their permission (asked once, on the
   first question). There Sam stops being a set of rules: Claude reads a
   digest of everything on this page plus Sam's notes, and answers whatever
   was asked, in whatever language, following the conversation.

   Everywhere else - GitHub Pages, the local file, a viewer who says no, a
   rate limit - `claude.use` is absent or fails and the rule-based SK above
   answers instead. Nothing depends on this path existing.

   The digest is assembled from NAMED fields, never by dumping the payload:
   the payload also carries a map key and a 140 KB radar picture, and neither
   belongs in a prompt.
   ========================================================================== */
const SamAI = (() => {
  let sample = null;
  let off = false;
  let busy = null;                 // AbortController of the call in flight
  const turns = [];                // the visible chat, oldest first
  const BUDGET = 60000;            // bytes; the platform's cap is 64 KiB

  function start(){
    if (!(window.claude && typeof window.claude.use === 'function')){ off = true; return; }
    window.claude.use('sample').then(s => {
      if (s){ sample = s; skodaMode(true); } else { off = true; }
    }).catch(() => { off = true; });
  }
  const ready = () => !!sample && !off;

  const clean = v => String(v == null ? '' : v)
    .replace(/<[^>]+>/g, ' ').replace(/\*\*/g, '').replace(/\s+/g, ' ').trim();
  const bytes = s => new TextEncoder().encode(s).length;

  function views(){
    const dly = (DAILY && DAILY.page !== 'weekly') ? DAILY : null;
    const wk = WEEKLY || ((DAILY && DAILY.page === 'weekly') ? DAILY : null);
    return [dly || {}, wk || {}];
  }

  /* Sections in priority order; the tail is dropped first if space runs out. */
  function sections(){
    const [d, w] = views();
    const S = [];
    const add = (title, lines) => {
      const body = (Array.isArray(lines) ? lines : [lines]).map(clean).filter(Boolean).join('\n');
      if (body) S.push(`## ${title}\n${body}`);
    };
    add('Page', [
      d.issued ? `Built ${d.issued} for ${d.validDate}. Season: ${d.season}.` : '',
      w.issued ? `MMR week view built ${w.issued}, covering ${w.validDate}.` : '',
      'Home: Kalyan West, in the transition belt between the Mumbai coast and the Western Ghats.',
    ]);
    add('Right now (the page\'s top line)', d.nowLine);
    const R = d.radarNow;
    if (R && R.belts){
      add('Radar - what is falling now (observation)', [
        `${R.site}, ${R.when}${R.ageMin != null ? `, ${R.ageMin} min old when the page was built` : ''}.`,
        R.note, R.checkNote,
        ...R.belts.map(b => `${b.name}: ${b.hereMmH >= 0.5 ? `${b.hereMmH} mm/hr overhead` : 'nothing overhead'}`
          + (b.nearMmH >= 2.5 && b.nearKm > 3 ? `; ${b.nearMmH} mm/hr about ${b.nearKm} km away` : '')
          + (b.secondMmH != null && R.secondName ? `; ${R.secondName} check ${b.secondMmH} mm/hr` : '')
          + (b.doubt ? `; ${b.doubt === 'clutter' ? 'UNCONFIRMED - other radar sees nothing, possibly clutter' : 'other radar has rain here, this beam may be blocked'}` : '')),
        R.peakDbz ? `Strongest return in range: ${Math.round(R.peakDbz)} dBZ (~${R.peakMmH} mm/hr).` : '',
      ]);
    }
    const rs = d.rainSource;
    if (rs && rs.headline) add('What kind of rain today', [
      `${rs.label}: ${rs.headline}. ${rs.detail}`,
      rs.terrain, rs.thunder && rs.thunder !== 'none' ? `Thunderstorms ${rs.thunder}.` : '',
      rs.windFrom != null ? `850 hPa wind from ${rs.windFrom} deg at ${rs.windMs} m/s.` : '',
      (rs.contributors || []).length ? `Also in play: ${rs.contributors.join('; ')}.` : '',
    ]);
    if (d.validDate) {
      const ig = d.ingredients || {}, c = d.confidence || {};
      add(`Today at Kalyan West (${d.validDate})`, [
        `Chance of measurable rain (2.5 mm+): ${d.probability}% from ${d.members} GFS-ensemble members. Models: ${d.rainLo}-${d.rainHi} mm (${d.categoryLo} to ${d.categoryHi}); median ${d.rainMedian} mm.`,
        (d.models || []).map(m => `${m.name} ${m.mm} mm (${m.band})`).join(', '),
        d.spreadWarning,
        `Character: ${d.character} - ${d.characterNote}. About ${d.wetHours} wet hours, peak ${d.peakRate} mm/hr.`,
        (d.windows || []).map(x => `${x.label} ${x.start}-${x.end}h: ${x.mm} mm, peak ${x.peak} mm/hr, risk ${x.risk}`).join('; '),
        `Confidence: ${c.occurrence} on whether it rains, ${c.amount} on amount, ${c.timing} on timing. ${c.rationale || ''}`,
        `Regime: ${d.regime} - ${d.regimeNote} ${d.mechanism}`,
        `Ingredients: dew point ${ig.dewPoint}C; RH 925/850/700 hPa ${ig.rh925}/${ig.rh850}/${ig.rh700}%; precipitable water ${ig.pwat} mm (${ig.depthClass} moisture); 850 hPa wind ${ig.wind850Dir} ${ig.wind850Speed} m/s, terrain lift ${ig.forcingClass}; CAPE peak ${ig.capePeak} J/kg (${ig.capeClass}); shear ${ig.shear} m/s. ${ig.stormMode || ''}`,
        d.gradientVerdict,
      ]);
    }
    const nc = d.nowcast, A = d.arrivals, B = d.belts;
    add('Next few hours (models, not observation)', [
      nc && nc.verdict,
      nc && nc.hours ? nc.hours.map(h => `${h.t} ${h.mm} mm`).join(', ') : '',
      B && B.headline,
      B && B.list ? B.list.map(b => `${b.name}: ${b.sentence}`).join('\n') : '',
      A && A.available ? `Rain areas moving from ${A.fromDeg} deg at ${A.speedKmh} km/h (models ${A.agreement}).` : '',
      A && A.list ? A.list.map(x => `${x.name}: ${x.now ? 'now' : x.eta ? `in ~${x.eta} h` : 'nothing arriving'} - ${x.sentence}`).join('\n') : '',
    ]);
    const al = d.alerts || w.alerts || [];
    add('Major weather shifts (alerts)', al.map(a =>
      `${a.label}: ${a.title}. ${a.body}` + ((a.points || []).length ? ' Possibilities: ' + a.points.join(' | ') : '')));
    add('Day by day (Kalyan West)', (d.plainWeek || []).map(p =>
      `${p.day}: ${p.headline} ${p.detail} ${p.advice} (${p.confidence})`));
    add('Kind of rain, day by day', (w.rainTypes || []).map(r =>
      `${r.day}: ${r.label} - ${r.headline}${r.thunder && r.thunder !== 'none' ? `; thunder ${r.thunder}` : ''}`));
    if (d.weekend) add('Weekend', `${d.weekend.verdict} ${d.weekend.plans}`);
    const ar = (w.areas && w.areas.length ? w.areas : d.areas) || [];
    add('MMR areas this week', ar.map(a =>
      `${a.name}: ${a.accumulation || (a.weekMm != null ? `~${a.weekMm} mm` : '')}, wettest ${a.wettestDay || '-'}. ${a.plain || ''} (${a.character || ''})`));
    const rg = w.regions;
    if (rg && rg.list) add('Maharashtra and beyond (regional outlook)', [
      rg.lead ? `Driven by: ${rg.lead.headline} (min ${rg.lead.pressure} hPa, closest ${rg.lead.closestKm} km).` : '',
      ...rg.list.map(r => `${r.name}: ${r.wet ? `${r.band}, ~${r.totalMm} mm this week, peak ${r.peakDay} (${r.peakLo}-${r.peakHi} mm)` : 'mostly dry'}. ${r.note || ''}`),
    ]);
    const sy = d.systems || w.systems;
    if (sy) add('Low pressure systems and troughs', [
      sy.trough,
      ...(sy.list || []).map(x => `${x.headline} (${x.relevance}): ${x.reasoning}` + ((x.points || []).length ? ' Possibilities: ' + x.points.join(' | ') : '')),
      sy.cycloneWindow ? 'This month is in an Arabian Sea cyclone window.' : '',
    ]);
    add('Cyclone basins', (w.basins || []).map(b => `${b.headline} ${b.detail}`));
    if (w.weekRegime) add('Week pattern', `${w.weekRegime.label}: ${w.weekRegime.note}`);
    const th = d.thermal;
    add('Heat and cold', [th && th.headline,
      ...((w.thermalRows || d.thermalRows || []).map(r => `${r.place}: warmest ${r.warmest}C` + (r.peakFeels != null ? `, feels like up to ${r.peakFeels}C` : '')))]);
    const up = d.upstream;
    if (up && up.available) add('Upstream (moisture supply)', up.reading || `Jet ${up.jet}: ${up.jetNote}. ${up.dryNote}`);
    const dv = w.drivers;
    if (dv) add('Background climate drivers', ['enso', 'iod', 'mjo', 'miso'].map(k =>
      dv[k] && dv[k].text ? `${k.toUpperCase()}: ${dv[k].text.slice(0, 420)}` : ''));
    if (d.track && d.track.available) add('Scorecard (forecast vs what happened)', d.track.summary);
    add('Coming days (models)', (d.outlook || []).map(o => `${o.day}: ${o.lo}-${o.hi} mm, chance ${o.chance}, ${o.regime}`));
    add('Terrain gradient today', (d.gradient || []).map(g => `${g.name} (${g.zone}): ${g.lo}-${g.hi} mm, wind ${g.wind}, terrain ${g.terrain}`));
    return S;
  }

  function notes(){
    return (typeof SAM_KB !== 'undefined' ? SAM_KB : [])
      .map(e => `### ${e.t}\n${e.a}`).join('\n\n');
  }

  function brief(budget){
    const now = new Date().toLocaleString('en-IN', {
      timeZone: 'Asia/Kolkata', weekday: 'short', day: 'numeric', month: 'short',
      hour: '2-digit', minute: '2-digit' });
    const head = [
      "You are Sam, the forecast assistant on a rain-forecast web page for Kalyan West and the Mumbai Metropolitan Region (MMR), Maharashtra, India. A reader is chatting with you on the page.",
      "",
      "How to answer:",
      "- Use ONLY the PAGE DATA and SAM'S NOTES below. They are all you know about the weather. If the answer is not there, say so plainly and offer what you do have. Never invent a number, time, place or warning.",
      "- Keep observation and forecast apart. The radar is what was falling at its scan time; the models are opinions about later. For the next hour or two the radar wins. Compare the scan time with the reader's current time: past about 45 minutes it is history, so say so.",
      "- The page is a snapshot built at the time shown under Page. If the reader's time is well after that, say the 'now' parts may be out of date.",
      "- Talk like a knowledgeable local friend: warm, direct, plain English. Put the answer in the first sentence, then the one or two reasons that matter. Usually 2 to 5 sentences; a short list only for several places or days. Explain any term you must use (dBZ, CAPE, LPA) in a few words. No citations such as 'Guide' or 'Handbook'.",
      "- Say 'about' with millimetres: whether it rains and the IMD band are firmer than the exact figure.",
      "- For safety (lightning, flooding, cyclones) give practical advice and point to IMD's official warnings. You are not an official source.",
      "- If the reader writes in Hindi, Marathi or Hinglish, reply in the same language and style.",
      "- Plain text. You may use **bold** for the key phrase and '• ' for bullets. No headings, tables or links.",
      "",
      `Reader's current time: ${now} IST.`,
      "",
      "=== SAM'S NOTES (how to read the weather here) ===",
      notes(),
      "",
      "=== PAGE DATA ===",
    ].join('\n');
    let out = head;
    for (const sec of sections()){
      if (bytes(out) + bytes(sec) + 2 > budget) break;
      out += '\n\n' + sec;
    }
    return out;
  }

  /* Ask; resolves to 'ok' | 'stopped' | 'partial' | 'limited' | 'fallback'. */
  async function ask(q, bubble){
    const ctl = new AbortController();
    busy = ctl;
    let hist = turns.slice(-6).map(t => ({ role: t.role, content: t.content.slice(0, 1500) }));
    const used = hist.reduce((n, t) => n + bytes(t.content), 0) + bytes(q);
    const input = [{ role: 'user', content: brief(BUDGET - used - 500) }, ...hist,
                   { role: 'user', content: q }];
    try {
      const res = await sample(input, {
        cache: false, signal: ctl.signal,
        onText: ({ text }) => skRender(bubble, text),
      });
      turns.push({ role: 'user', content: q }, { role: 'assistant', content: res.text });
      if (res.truncated) skRender(bubble, res.text + '\n\n_(Cut short — ask me for less at once.)_');
      return 'ok';
    } catch (e){
      const code = e && e.code;
      if (code === 'cancelled'){
        if (e.text) skRender(bubble, e.text + ' …'); else skRender(bubble, '_(Stopped.)_');
        return 'stopped';
      }
      if (['not_granted', 'sampling_disabled', 'not_declared',
           'capability_disabled', 'capability_removed'].includes(code)){
        off = true; skodaMode(false); return 'fallback';
      }
      if (code !== 'refused' && e && e.text){
        skRender(bubble, e.text + '\n\n_(Interrupted — ask again if you need the rest.)_');
        return 'partial';
      }
      return code === 'rate_limited' ? 'limited' : 'fallback';
    } finally {
      busy = null;
    }
  }

  return { start, ready, ask,
           stop: () => { if (busy) busy.abort(); },
           isBusy: () => !!busy,
           // What Claude would be sent - for checking the digest by hand.
           preview: () => brief(BUDGET) };
})();

/* ---------- live Windy map (tap to load) --------------------------------
   Windy's Map Forecast API is a browser library, not a data feed - it embeds
   the real interactive map. Two consequences shape this:

   1. It pulls scripts from api.windy.com and unpkg.com, so it cannot run
      anywhere external hosts are blocked. The published artifact is exactly
      that case, so the card explains rather than showing a dead frame.
   2. Every load consumes Windy session quota. Loading on demand means a phone
      glancing at the forecast twice a day costs nothing. */
function windyMapHtml(){
  if (!D.windyMapKey) return '';
  const blocked = !!D.artifact;
  if (blocked){
    return `<div class="card"><h2>Live Windy map</h2>
      <p class="sub" style="margin:0">Can't run on this shared page — it needs
      scripts from windy.com, and claude.ai blocks external sources. Open the
      forecast from your own PC or the tunnel link and the map loads inline.</p>
      </div>`;
  }
  return `<div class="card"><h2>Live Windy map</h2>
    <p class="sub" style="margin:-6px 0 12px">The real Windy map, centred on
      Kalyan. Loads only when you ask, so it doesn't burn quota on every visit.</p>
    <div id="windyBox" class="windybox">
      <button class="rbtn" id="windyLoad" type="button">Load live map</button>
      <div class="wmsg">Wind, rain, radar, pressure and CAPE layers — scrub
        forward through time once loaded.</div>
    </div></div>`;
}

let windyLoaded = false;

function loadWindyMap(){
  if (windyLoaded) return;
  const box = document.getElementById('windyBox');
  if (!box || !D.windyMapKey) return;
  windyLoaded = true;
  box.innerHTML = '<div class="wmsg">Loading Windy…</div><div id="windy"></div>';

  const fail = (why) => {
    windyLoaded = false;
    box.innerHTML = `<div class="wmsg">Couldn't load the map: ${esc(why)}.
      <br>The layer links further down still work.</div>
      <button class="rbtn" id="windyLoad" type="button">Try again</button>`;
    bindWindy();
  };

  loadScript('https://unpkg.com/leaflet@1.4.0/dist/leaflet.js')
    .then(() => loadScript('https://api.windy.com/assets/map-forecast/libBoot.js'))
    .then(() => {
      if (typeof windyInit !== 'function') return fail('library did not initialise');
      windyInit({
        key: D.windyMapKey,
        lat: D.lat || 19.2437, lon: D.lon || 73.1305, zoom: 8,
        verbose: false, overlay: 'rain',
      }, () => {
        const m = document.querySelector('#windyBox .wmsg');
        if (m) m.remove();
      });
    })
    .catch(() => fail('network blocked or offline'));
}

function loadScript(src){
  return new Promise((res, rej) => {
    const s = document.createElement('script');
    s.src = src; s.async = true;
    s.onload = res; s.onerror = () => rej(new Error(src));
    document.head.appendChild(s);
  });
}

function bindWindy(){
  const b = document.getElementById('windyLoad');
  if (b && !b.dataset.bound){
    b.dataset.bound = '1';
    b.addEventListener('click', loadWindyMap);
  }
}

/* ---------- background climate drivers ---------------------------------- */
function driversHtml(){
  const d = (DAILY && DAILY.drivers) || (WEEKLY && WEEKLY.drivers);
  if (!d) return '';

  const tiles = [];

  if (d.enso){
    const e = d.enso;
    const tone = e.phase === 'El Nino' ? 'bad' : e.phase === 'La Nina' ? 'good' : 'neu';
    tiles.push({tone, name:'ENSO', value:`${e.phase}`,
      sub:`Niño 3.4 ${e.anomaly >= 0 ? '+' : ''}${e.anomaly.toFixed(2)}°C · ${e.when}`,
      spark:e.recent, text:e.text});
  }
  if (d.iod){
    const i = d.iod;
    const tone = i.phase === 'positive' ? 'good' : i.phase === 'negative' ? 'bad' : 'neu';
    tiles.push({tone, name:'IOD', value:i.phase,
      sub:`proxy DMI ${i.dmi >= 0 ? '+' : ''}${i.dmi.toFixed(2)}°C`,
      text:i.text});
  }
  if (d.mjo){
    const m = d.mjo;
    const tone = m.favourability === 'favourable' ? 'good'
               : m.favourability === 'unfavourable' ? 'bad' : 'neu';
    tiles.push({tone, name:'MJO', value:`Phase ${m.phase}`,
      sub:`${m.region} · ${m.lon.toFixed(0)}°E · ${m.favourability}`,
      spark:m.track, text:m.text});
  }
  if (d.miso){
    const s = d.miso;
    const near = s.lat >= 15 && s.lat < 22;
    tiles.push({tone: near ? 'good' : 'neu', name:'MISO',
      value:`${s.lat.toFixed(0)}°N`,
      sub:s.regime + (s.eta ? ` · ~${s.eta}d away` : ''),
      spark:s.track, text:s.text});
  }
  if (!tiles.length) return '';

  return `<div class="card"><h2>Background climate drivers</h2>
    <p class="sub" style="margin:-6px 0 14px">These tilt the season's odds.
      They do not forecast any single day — the week-to-week pattern does that.</p>
    <div class="dgrid">
      ${tiles.map((t, i) => `<button class="dtile d-${t.tone}" type="button"
          data-drv="${i}" aria-expanded="false">
        <div class="dname">${esc(t.name)}</div>
        <div class="dval">${esc(t.value)}</div>
        <div class="dsub">${esc(t.sub)}</div>
        ${t.spark && t.spark.length > 2 ? sparkSvg(t.spark) : ''}
      </button>`).join('')}
