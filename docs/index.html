const SAM_KB = [{"id": "about_sam", "keys": ["\\bwho are you\\b", "\\bwhat are you\\b", "how do you work", "are you (an )?(ai|bot|human|real)", "\\bsam\\b.*\\b(accurate|trust)"], "t": "Who Sam is and how he answers", "a": "I'm Sam — I read this page's forecast so you don't have to dig through it. Everything I say comes from the data on this page (the models, the radar, the systems tracker) and from notes on how to read it. On the claude.ai copy I think with Claude, if you allow it; elsewhere I answer from built-in rules. Either way I'm not IMD: for official warnings, IMD and the civic authorities are the word that counts."}, {"id": "snapshot", "keys": ["\\b(old|stale|outdated|updated|refresh|latest|current)\\b.*\\b(page|forecast|data)\\b", "when was (this|the page|it) (made|built|updated|issued)"], "t": "The page is a snapshot", "a": "This page is a snapshot, built at the issue time shown at the top. It doesn't update itself, so the older it is, the less the 'right now' parts mean — the radar especially. The day-by-day outlook ages more gently than the present tense does."}, {"id": "radar_vs_models", "keys": ["why (trust|believe|use) (the )?radar", "radar (vs|versus|or) (the )?model", "model(s)? (say|said) .*radar", "radar.*(different|disagree).*model"], "t": "Why radar outranks the models for right now", "a": "For the next hour or two, trust the radar over any model. The radar is an observation — the beam is reporting what's in the air right now. A model is an opinion about the whole day, drawn on a grid about 25 km across, so it smears a shower over a big box and often misses one that has just formed. On 12 Sep the model said nothing for the hour while the radar had rain over Kalyan. The models earn their keep for later today and the coming days; the radar owns the present."}, {"id": "cband", "keys": ["c[- ]?band", "s[- ]?band", "veravali", "which radar", "two radars", "colaba radar", "dwr"], "t": "The two Mumbai radars", "a": "Mumbai has two IMD Doppler weather radars. The C-band at Veravali, in Andheri, is the one I lead with: it's about 30 km from Kalyan against Colaba's 50, its picture is roughly three times sharper, and its colour scale steps in single dBZ rather than big 15-dBZ jumps, so light and moderate rain are told apart. Colaba's S-band uses a longer wavelength. I keep it as a second opinion and as the fallback when the C-band can't be read or its scan is out of date."}, {"id": "dbz", "keys": ["\\bdbz\\b", "reflectivity", "mm ?/ ?h(ou)?r", "rain rate", "colou?r(s)? (on|in) (the )?radar", "what do the colou?rs"], "t": "Reading the radar colours", "a": "The colours are reflectivity, in dBZ — how strongly the rain bounces the beam back. I turn that into a rain rate with the standard Marshall-Palmer formula: about 20 dBZ is 0.6 mm/hr, 30 is 3, 40 is 12 and 50 is nearly 50 mm/hr. Navy and blue are light rain, white is moderate to heavy, yellow and orange are downpours. The formula is an average over many storms, so trust the where and the whether far more than the exact millimetres."}, {"id": "radar_time", "keys": ["(radar|scan).*(old|time|age|when)", "how (old|recent|fresh).*radar", "scanned", "published"], "t": "How old the radar picture is", "a": "IMD's file time is not the scan time. Both Mumbai radars' files appear 10 to 25 minutes after the scan, and the C-band file gets re-uploaded unchanged every few minutes, so a radar that stopped hours ago can look fresh. I read the scan time printed on the C-band image itself. For Colaba I can only see the upload time, so the page says 'published' there, not 'scanned'. Past 45 minutes I stop treating a scan as 'now'."}, {"id": "clutter", "keys": ["clutter", "unconfirmed", "false echo", "hill.*radar", "radar.*hill", "fake rain", "not really raining"], "t": "Clutter: echoes that aren't rain", "a": "Clutter is the radar seeing hills, towers or buildings instead of rain. Near the Veravali dish it shows up as grainy specks over the Borivali national park hills and the Parsik hills near Vashi — they don't move between scans, and rain always does. I read the C-band in roughly 1 km squares and only count a square if the ones around it carry echo too, which removes the specks but keeps any real shower 2 km or more across. When only one radar sees something strong, the page calls it unconfirmed rather than rain."}, {"id": "attenuation", "keys": ["attenuat", "blocked", "weaken(ed)? beam", "behind (the |a )?(storm|core)"], "t": "The C-band's weak spot", "a": "The C-band's weakness is heavy rain itself. Its beam loses power passing through a downpour, so rain behind a heavy core, as seen from Andheri, can look weaker than it is. Colaba's longer-wavelength S-band barely suffers from that, which is why it's kept as the check. When Colaba shows rain the C-band misses, the page says the C-band's beam may be blocked."}, {"id": "radars_disagree", "keys": ["radars? (disagree|differ|don.?t match)", "colaba.*(nothing|empty|blind)", "why (does|is) .*s[- ]?band"], "t": "When the two radars disagree", "a": "Sometimes one radar simply isn't seeing properly. On 22 Sep, Colaba showed one speck in 250 km while the C-band had an organised rain band over the sea. That evening Colaba saw only a third of the C-band's echo and missed most of a storm complex over the Ghats. So I only let one radar confirm or doubt the other when it sees at least half as much rain and their scans are within 15 minutes of each other. Otherwise the page just tells you they disagree."}, {"id": "rain_types", "keys": ["(kind|type|sort)s? of rain", "what (drives|causes|is driving)", "\\bdriver\\b", "where.*rain.*come from"], "t": "The kinds of rain", "a": "Twelve millimetres from the monsoon and twelve from a thunderstorm are different days. Monsoon rain comes in on a westerly wind and falls steadily for hours, hardest on the windward Ghats. Easterly rain comes the other way, mostly as afternoon and evening thunderstorms, and hits the inland belts first. A low pressure system gives widespread, long rain that even reaches Pune. When the monsoon pulls back, a northerly brings heat-built Ghat storms. In winter a western disturbance can bring cloud but rarely rain here. The 'What kind of rain' card names today's driver."}, {"id": "sw_monsoon", "keys": ["south ?west monsoon", "\\bsw (monsoon|wind)", "westerl(y|ies)", "monsoon wind", "onshore"], "t": "Southwest monsoon rain", "a": "The monsoon's own wind blows in off the Arabian Sea from the west or southwest, loaded with moisture. When it meets the Western Ghats it's forced upward, cools, and rains — so the windward face above Kalyan, Igatpuri and Matheran gets the most, the coast gets a lot, and Pune, behind the crest, stays comparatively dry. It's usually steady rain that lasts for hours rather than short bursts."}, {"id": "easterly", "keys": ["easterl(y|ies)", "east wind", "from the east"], "t": "Easterly rain", "a": "An easterly is the monsoon wind running backwards, and the terrain works backwards with it. The east face of the Ghats becomes the windward side and the Konkan — Mumbai, Thane, Kalyan — sits in the lee. So the storms usually build over the inland belts (Karjat, Badlapur, the plateau) in the afternoon and evening, short, heavy, very local and with lightning, while the coast can stay dry until something drifts down to it."}, {"id": "withdrawal", "keys": ["withdraw", "pull(ing)? back", "monsoon (end|over|leav|retreat)", "northerl(y|ies)", "october"], "t": "The monsoon pulling back", "a": "In late September and October the wind a kilometre and a half up turns northerly — off the land instead of in from the sea. That's the monsoon withdrawing. Nothing blows rain in any more, but the air is often still humid and the sun is strong, so rain gets built in place: storms fire over the Ghats in the afternoon and drift out in the evening, heavy where they land and dry in between. When the air finally dries out too, the rain stops and the October heat arrives."}, {"id": "thunderstorm", "keys": ["thunder", "lightning", "storm cell", "cloudburst", "hail", "\\bcape\\b", "instab"], "t": "Thunderstorms", "a": "A thunderstorm needs moist air, energy (CAPE, the fuel for rising air) and something to set it off — daytime heating, the hills, or colliding winds. Lots of energy is a risk, not a promise: plenty of high-energy days produce nothing. When storms do fire they're patchy — one suburb gets twenty minutes of downpour while the next stays dry — and lightning is the real danger. With weak upper winds they're short-lived 'pulse' storms that die on their own outflow within an hour or two."}, {"id": "lightning_safety", "keys": ["lightning safe", "(safe|safety).*(storm|thunder|lightning)", "struck", "what (should|do) i do.*(storm|thunder)"], "t": "Staying safe from lightning", "a": "If you can hear thunder, you're close enough to be struck. Get inside a proper building or a hard-top car and wait about half an hour after the last thunder. Stay off open ground, rooftops and ridges, away from lone trees, water and metal fences. On a trek, get down off the summit and exposed ridges early — Ghat storms build fast in the afternoon."}, {"id": "western_disturbance", "keys": ["western disturbance", "\\bwd\\b", "winter rain"], "t": "Western disturbances", "a": "A western disturbance is a winter storm system moving east across north India. It brings cloud, cooler days and sometimes light rain there, but it almost never reaches this coast. The page can only infer one from the high-level winds, because the pressure grid it reads stops at 28°N and these systems sit north of that."}, {"id": "rain_shadow", "keys": ["rain ?shadow", "\\bpune\\b.*(dry|less|why)", "why.*\\bpune\\b", "leeward", "\\blee\\b"], "t": "The rain shadow", "a": "Air rising up the western face of the Ghats drops its rain there; once it's over the crest it sinks, warms and dries out. That's why Pune, behind the hills, gets far less than Matheran or Lonavala on a monsoon day. Two things break the pattern: a low pressure system lifts air over a whole region, so Pune gets caught up too, and an easterly flips it, making the east face the wet side."}, {"id": "orographic", "keys": ["orograph", "terrain", "\\bghats?\\b.*(more|wetter|why)", "why.*\\bghats?\\b", "upslope", "windward"], "t": "Why the hills get more rain", "a": "When wind blows straight at a mountain range, the air has to climb, and rising air cools and rains. The stronger and more head-on the westerly, the more the Ghats squeeze out. A wind running along the range instead of into it gives almost no lift, however strong it is. That's why the page shows a 'terrain-normal' wind: the part blowing straight at the hills."}, {"id": "kalyan_zone", "keys": ["kalyan.*(zone|belt|different|special)", "transition (belt|zone)"], "t": "Where Kalyan sits", "a": "Kalyan is in the transition belt — between the coast and the Ghats. It gets less than the crest in a westerly but more than the island city on many days, and it's close enough to the hills that Ghat storms drifting out in the evening often reach it. Badlapur and Karjat, a little further in, usually feel the hills' effect first."}, {"id": "lpa", "keys": ["\\blpa\\b", "low pressure", "depression", "cyclon", "well[- ]marked", "\\bsystem\\b"], "t": "Lows, depressions and cyclones", "a": "A low pressure area is a patch where air is rising and pressure is lower than around it. As the winds circling it strengthen, IMD upgrades it: a depression at 17–27 knots, a deep depression at 28–33, a cyclonic storm from 34. A low doesn't need to come close to matter. A Bay of Bengal system crossing central India can pull the monsoon westerlies harder onto this coast from 800 km away. Which SIDE of it you are on matters as much as the distance: a low to our south or east reaches us as an easterly, and then the rain lands inland and on the Pune side first, not on the coast. For anything cyclone-related, IMD's bulletins are the authority."}, {"id": "event_grouping", "keys": ["same (low|lpa|system)", "(multiple|several|many|two|different) (lows|lpas|systems)", "one event", "sub[- ]?point", "possibilit"], "t": "Why one low shows as one event", "a": "One low can be detected several times — at different distances, on different days, as its centre wobbles. Listing each detection would make one system look like three. So the page groups detections into a single event and lists the possibilities under it as sub-points. Two centres only count as separate lows when there's a ridge of higher pressure, at least 1 hPa, between them — being far apart isn't enough on its own."}, {"id": "two_lows", "keys": ["gujarat", "two trajector", "separate (low|system)", "\\bcol\\b", "ridge between"], "t": "Telling two lows apart", "a": "The test is whether pressure rises between them. If you can walk from one centre to the other without climbing, it's one stretched system; if there's a ridge in between, they're two. On 20 Sep that's how the Gujarat and Maharashtra lows came out as two separate systems: a 2–3 hPa ridge sat between them. They weren't one low taking two possible paths."}, {"id": "system_motion", "keys": ["stationary", "not moving", "(which way|where) is (it|the low) (moving|going)", "track(ing)?", "\\bmoving\\b"], "t": "How confident a track is", "a": "The pressure grid I track lows on has points about 210 km apart, so a centre that seems to shift less than that may just be rounding. I only call a low 'moving' when it has travelled clearly more than one grid step, fairly directly, over at least 18 hours. Otherwise the page says slow, wandering, or that the motion can't be resolved yet."}, {"id": "monsoon_trough", "keys": ["monsoon trough", "\\btrough\\b", "active (spell|phase|monsoon)", "\\bbreak\\b", "\\bactive\\b"], "t": "Active and break monsoon", "a": "The monsoon trough is a line of low pressure across north India. When it sits in its normal place or further south, the sea winds blow hard onto the west coast — an active spell, with widespread and often heavy rain. When it shifts north to the Himalayan foothills, the engine idles — a break: sunshine, patchy afternoon showers, long dry gaps. An offshore trough along the coast squeezes sea air together and can turn a damp wind into real rain."}, {"id": "upstream", "keys": ["somali", "\\bjet\\b", "dry air", "mid[- ]level", "upstream"], "t": "What feeds the monsoon", "a": "Two things upstream decide how much the coast can get. The Somali jet is the low-level river of wind that carries Arabian Sea moisture to us — when it's weak, heavy rain almost never happens. Dry air a few kilometres up chokes clouds before they grow tall, even when the ground feels muggy. The page reads both each day."}, {"id": "climate_drivers", "keys": ["el ni[nñ]o", "la ni[nñ]a", "\\benso\\b", "\\biod\\b", "indian ocean dipole", "\\bmjo\\b", "\\bmiso\\b", "madden"], "t": "The background climate drivers", "a": "El Niño, the Indian Ocean Dipole and the MJO tilt the odds over weeks to a whole season; they don't decide any single day. A strong El Niño leans against our monsoon, and a positive IOD leans for it. The MJO and MISO are pulses of cloud that travel east and north over a few weeks and can switch an active or break spell on. Read them as a tilt, not a verdict."}, {"id": "probability", "keys": ["(chance|probability|percent|%)", "\\bmembers?\\b", "ensemble"], "t": "What the rain chance means", "a": "The percentage is the share of 31 runs of the GFS ensemble, each started slightly differently, that give at least 2.5 mm at Kalyan West that day — IMD's line for a rainy day. It's about whether it rains measurably at that point, not how much or for how long. At the top of the scale it's trustworthy: near-unanimous runs verified about 98% of the time in three past monsoons."}, {"id": "low_chance", "keys": ["(said|forecast).*(dry|unlikely).*(rain|rained)", "why did it rain", "low chance", "isolated showers possible", "nothing organised"], "t": "Why a low chance can still mean rain", "a": "In the monsoon a low number means 'nothing organised', not 'dry'. Over three seasons, on days the models gave under 20%, it still rained on 24% of them. The reason is a shared blind spot: all the models see the same big-picture flow, so when rain is forced locally — a sea-breeze line, one cell anchored on a hill — they all miss it together, and agreement gets mistaken for certainty. Outside the monsoon, a low number really does mean dry."}, {"id": "no_average", "keys": ["average", "\\bmean\\b", "(models?) (disagree|differ)", "\\becmwf\\b", "\\bgfs\\b", "\\bicon\\b", "which model"], "t": "Why the page never averages the models", "a": "ECMWF, GFS and ICON are compared side by side and never averaged. When they disagree, it usually means the outcome hinges on something small — exactly where a storm fires, or the track of an offshore swirl — and averaging hides that. The honest reading is: trust the part they agree on (does it rain) more than the part they don't (how much). None of them is reliably best here; ECMWF actually had the most false alarms at Kalyan in the backtest."}, {"id": "confidence", "keys": ["confiden", "how sure", "certain", "reliable"], "t": "The three confidences", "a": "The page gives three separate confidences: whether it rains, how much, and when. They often differ — 'high confidence on rain, low on amount' is common on convective days, because the models agree something will fall but not where the heavy cells land. Plan around the one that matters to you."}, {"id": "imd_bands", "keys": ["light rain", "moderate rain", "heavy rain", "very heavy", "how much is", "imd (scale|categor|band)"], "t": "IMD's rain bands", "a": "IMD's daily bands: light rain is 2.5–15.5 mm, moderate 15.6–64.4, heavy 64.5–115.5, very heavy 115.6–204.4, and extremely heavy above that. The page treats the band as the forecast and the millimetres as a guide — a model's exact figure is never as solid as it looks."}, {"id": "character", "keys": ["steady", "continuous", "intermittent", "spells", "burst", "showers field"], "t": "Steady rain or showers", "a": "The same total can fall as hours of drizzle or one violent quarter-hour. I judge the character from how much of the day's rain lands in its busiest hour. Around half in one hour is a shower; a small share means steady layer cloud. The models' own 'showers' label can't be used for this: ECMWF reports zero showers always and GFS and ICON put nearly everything there."}, {"id": "alerts_logic", "keys": ["why.*(alert|warning).*(monday|tuesday|wednesday|thursday|friday|saturday|sunday|day)", "(alert|warning).*wrong day", "surge"], "t": "Why an alert can name a different day from the wettest", "a": "A pattern alert — a monsoon surge, say — is triggered by the winds and moisture changing, not by the rain total. The pattern can switch on a day before the heaviest rain arrives, so the alert names when it starts and says separately which day is wettest. If the two look out of step, that's the reason."}, {"id": "accuracy", "keys": ["accura", "track record", "how good", "hit rate", "(right|wrong) (last|yesterday)", "\\bscore\\b", "miss(ed)?\\b"], "t": "How accurate this forecast is", "a": "Every forecast is checked against what actually fell, misses included — the scorecard on the page shows the last month. Over May–August 2026 it called rain or no-rain right most of the time, and beat 'same as yesterday' mainly by raising fewer false alarms. Its known weak spot is heavy rain: it caught only 2 of 5 heavy days in that test. So lean on it for 'will it rain', and be careful with 'how hard'."}, {"id": "what_fell", "keys": ["how much (did it|has it) rain", "(rain|rainfall) (yesterday|last night)", "what fell", "\\bgauge", "observed"], "t": "The 'what fell' figures", "a": "The 'what fell' table is model analysis, not rain gauges. IMD's gauge network needs a data agreement and the city's gauges have no open feed. The analysis gets the pattern right but runs low on convective days — on 11 Aug 2026 gauges had Borivali at 84 mm in 12 hours while the analysis said 29 mm for the whole day. Read the ranking, not the millimetres; any real gauge beats it."}, {"id": "sources", "keys": ["(data|forecast) (come from|source)", "where do you get", "\\bwindy\\b", "open[- ]?meteo", "\\bmodels?\\b.*\\buse"], "t": "Where the data comes from", "a": "The forecast uses the three big global models — ECMWF, GFS and ICON — plus the 31-member GFS ensemble for the rain chance, and ERA5 reanalysis to check past days. The present tense comes from IMD's two Mumbai radars. Windy shows these same models; it doesn't run one of its own."}, {"id": "heat", "keys": ["feels like", "heat ?index", "heatwave", "humid", "sultry", "muggy"], "t": "Humid heat and heatwaves", "a": "In a humid coastal city, feels-like and heatwave are different things. IMD declares a heatwave on the actual temperature (37°C on the coast, 40°C inland, well above normal), so a 33°C day with sticky air isn't one — but it can feel like 42°C and wear you down. That's why the page warns about oppressive humid heat even when there's no heatwave."}, {"id": "tide", "keys": ["\\btide", "waterlog", "flood", "high tide"], "t": "Rain and high tide", "a": "Mumbai's storm drains empty into the sea, so heavy rain at high tide can't get away and the streets flood far faster. Watch the combination, not either one alone. IMD's tide table is linked on the page. For flooding, follow the civic authorities' updates."}, {"id": "trek", "keys": ["\\btrek", "\\bhike", "hiking", "fort\\b", "waterfall", "picnic"], "t": "Planning a trek", "a": "For a Ghat trek, go early. On storm days the hills fire first, usually from early afternoon, so aim to be off exposed tops and ridges by then. Streams can rise within minutes after a cell upstream, even if it's dry where you are, so don't cross fast water. Check the day's rain type on the page: steady monsoon rain means a wet but predictable day, while thunderstorms mean a dry morning and a dangerous afternoon."}, {"id": "northeast_monsoon", "keys": ["northeast monsoon", "north-?east monsoon", "\\bnem\\b", "winter monsoon", "second monsoon", "tamil nadu", "october.*(rain|monsoon)"], "t": "The northeast monsoon, and why it mostly misses us", "a": "It's the other half of the Indian monsoon, and the one people here hear about without ever getting much of. As the land cools after October the pressure gradient reverses, the low-level flow turns to the northeast, and it crosses the Bay of Bengal picking up moisture — so it arrives on India's EASTERN coast already loaded. Tamil Nadu, Rayalaseema, south interior Karnataka and Kerala take about half their yearly rain from it. IMD usually declares its onset over the south peninsula in the third week of October.\n\nThe geography is unkind to us. We are on the far side of the peninsula and behind the Western Ghats, so that moisture has to cross the whole landmass and then the crest — and the hills wring it out on the way, exactly as they wring out the southwest monsoon before it reaches Pune. The Konkan sits in the northeast monsoon's rain shadow the same way Pune sits in the southwest monsoon's. Same hills, other wind. That one sentence explains most of our October and November.\n\nWhen it does reach the MMR it is because something pushed moisture unusually far north and west — a Bay low tracking west, an easterly wave, a trough aloft — and it shows up as scattered evening thunderstorms, not the grey all-day soak of July.\n\nThe gradient runs steeply south to north, and that is the thing to watch. In the October 2026 onset the models put Goa at 45 mm and Sindhudurg at 34 mm over nine days while Kalyan got 0.2 mm — two hundred kilometres between a wet week and nothing at all. If Goa and Sindhudurg are not wet, we will not be either, so that is the check I make before believing any 'rain for Maharashtra' headline at this time of year."}, {"id": "withdrawal_test", "keys": ["how.*(know|decide|tell).*monsoon", "withdrawal (test|criteri)", "imd.*criteri", "(is|has) the monsoon (over|ended|gone|withdrawn)", "season (over|chang)"], "t": "How I decide the monsoon has gone", "a": "I stopped letting the calendar decide this. October the 1st is not a withdrawal, it's a date — the Konkan has lost the monsoon anywhere from the last days of September to the third week of October. So I read IMD's own four tests off the last ten days: five rainless days, the 850 hPa westerly gone, the column dried out, and the monsoon trough no longer sitting over the plains. I show you all four whether or not they're met, so you can check them against an IMD chart.\n\nThe hard part is that a BREAK and a WITHDRAWAL look identical in those fields — dry, westerly gone, drier air. The only thing telling them apart is the date and what happens next, so I won't call a withdrawal before the last week of September however dry it gets. And IMD declares it, not me."}, {"id": "fog_how", "keys": ["\\bfog", "\\bmist\\b", "\\bhaze\\b", "visibilit", "how.*(spot|detect|know).*fog", "\\bdhund\\b", "smog"], "t": "How I forecast fog, and why haze is different", "a": "Radiation fog needs four things at once, and missing any one of them is why most cold nights produce nothing. The air has to cool to within a degree or two of its dew point; the wind has to be light, because dead calm only wets the grass and anything over about 3 m/s mixes it into low cloud instead; the sky has to be clear so the ground can radiate its heat away; and — the one I got wrong first — the night has to actually COOL. My first version flagged ten of ten September mornings, because saturated air at dawn is simply what the monsoon is. Nothing was condensing out of it. A Kalyan January night falls 14-16°C from the afternoon peak; a monsoon night falls four or five.\n\nKalyan fogs more readily than Colaba or Santacruz — inland, on the Ulhas, without the sea holding the night temperature up.\n\nFog is not haze. Fog is water and burns off an hour or two after sunrise. Haze is dry particulate in a shallow inversion and it does not burn off — it waits for wind. I tell you which one it is, because that decides whether eleven o'clock is clear.\n\nOne honest caveat: only GFS publishes a visibility field here, and over January it ran 4-10°C drier at dawn than ECMWF and ICON and called every one of those mornings clear. When the models split like that I show you all three rather than averaging them into a confidence none of them has."}, {"id": "wind_sea_breeze", "keys": ["\\bwind\\b", "breez", "\\bgust", "squall", "sea ?breeze", "land ?breeze", "\\bhawa\\b", "kmph"], "t": "The wind, and the sea breeze that runs the afternoon", "a": "For most of the year the daily cycle matters more here than the synoptic one. The land heats faster than the sea, pressure falls over it, and from late morning air floods in off the water. That sea breeze is why a Mumbai afternoon is survivable — and why Kalyan waits longer for it, because the front has 30-odd km of land to cross before it gets here. It arrives as a shift rather than a freshening: the wind swings round to the west, picks up, and the humidity jumps at the same time.\n\nAt night it reverses, weakly. The land cools below the sea and the flow drains back offshore. That land breeze is light and stable, which is exactly what lets fog and haze settle — so the wind and the visibility answers keep pointing at each other.\n\nFor thresholds I use IMD's: 35 kmph starts the fishermen's advisory, 45 kmph is 'squally', and above 55 the wording turns to damage. I quote gusts, not the average, because the gust is what moves things."}, {"id": "feels_like", "keys": ["feels? like", "heat index", "apparent temp", "humidex", "real ?feel", "why.*(so )?(humid|sticky|muggy)", "oppressiv"], "t": "What 'feels like' is, and what it leaves out", "a": "It's the NWS heat index: temperature and humidity, nothing else. In a city whose dew point sits in the mid-20s for half the year that's the right primary measure, and it's the one IMD frames its own heat-index product around. The gap between it and the thermometer IS the humidity — 34°C at 50% humidity feels like 40°C, and no amount of staring at the forecast temperature tells you that.\n\nTwo things it gets wrong, in opposite directions. It's a SHADE value, so standing in the sun is worse than the number. And it assumes light wind, so a good sea breeze takes some back. That's why I report the wind separately instead of burying it inside one figure — you can judge the breeze yourself, you can't unpick it from a single number.\n\nI checked it against Open-Meteo's own apparent temperature, which does model sun and wind: the two stayed within about a degree all day and never diverged by two. Publishing both would have cost you more confusion than it bought in accuracy.\n\nOn IMD's scale, 41-54°C is 'danger' — heat exhaustion likely, heat stroke probable with continued exposure. A humid coastal city gets there on days no heatwave would ever be declared."}, {"id": "unofficial_alerts", "keys": ["unofficial", "why.*not.*(heatwave|heat wave|declar)", "heatwave criteria", "cold ?wave", "coldwave"], "t": "Why my heat and cold alerts say 'unofficial'", "a": "Because IMD declares them and I don't. A heatwave needs BOTH halves of IMD's test: an absolute threshold — 37°C for a coastal station — and a departure of at least +4.5°C from that station's own normal. A day can be the most abnormal of the month and still correctly not be a heatwave, which is exactly what happened on 3 October 2026: +4.6°C above normal at 36°C, one and a bit degrees short on the absolute. I say which half is met and which isn't, and by how much, so the silence is explained rather than just silent.\n\nA formal cold wave essentially never applies on this coast, so when I flag unusually cold nights I'm telling you the numbers are unusual by local standards, not that anyone will declare anything.\n\nOne caveat on all of it: the normals I compare against are computed here from ERA5 over ten years, not IMD's official 1991-2020 series. Read the direction and the rough size, not the exact decimal."}, {"id": "official", "keys": ["\\bimd\\b.*(alert|warning|orange|red|yellow)", "(orange|red|yellow) alert", "official"], "t": "Official warnings", "a": "I'm not an official source. IMD's colour-coded warnings — yellow, orange, red — and the civic authorities' instructions are what to act on for safety. The page's own alerts are a forecaster's read of the pattern, meant to help you plan, not to replace them."}];
let D = DAILY;                  /* the view currently on screen */
let VIEW = DAILY.page === 'weekly' ? 'week' : 'today';

/* ---------- theme ---------- */
/* localStorage throws outright on an opaque origin (data: URLs, some file://
   setups, private browsing). Unguarded, that exception kills the whole script
   before anything renders and the page comes up blank - so every access is
   wrapped and the theme simply falls back to the OS setting. */
function storeGet(k){ try { return localStorage.getItem(k); } catch (e) { return null; } }
function storeSet(k, v){ try { localStorage.setItem(k, v); } catch (e) { /* no-op */ } }

const saved = storeGet('wx-theme');
if (saved) document.documentElement.setAttribute('data-theme', saved);

/* Tint the page from the day being shown. Derived from the IMD band, so it
   tracks the actual forecast rather than a guess at "nice weather". */
function applyMood(){
  const days = (DAILY && DAILY.plainWeek) || (WEEKLY && WEEKLY.plainWeek) || [];
  const head = (days[0] && days[0].headline || '').toLowerCase();
  let mood = 'light';
  if (/^(dry|mostly dry)/.test(head)) mood = 'sunny';
  else if (/very heavy|extremely heavy/.test(head)) mood = 'severe';
  else if (/heavy/.test(head)) mood = 'heavy';
  else if (/moderate/.test(head)) mood = 'wet';
  else if (/light/.test(head)) mood = 'light';
  document.documentElement.setAttribute('data-wx', mood);
}
function toggleTheme(){
  const cur = document.documentElement.getAttribute('data-theme')
    || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
  const next = cur === 'dark' ? 'light' : 'dark';
  document.documentElement.setAttribute('data-theme', next);
  storeSet('wx-theme', next);
}

/* ---------- helpers ---------- */
const esc = s => String(s ?? '').replace(/[&<>"]/g, c =>
  ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
/* Sub-points describe ONE event's possible resolutions. They arrive with
   **bold** markers; escape first, then promote only that marker, so nothing
   else in the string can become markup. */
const subList = pts => (pts && pts.length)
  ? `<ul class="apts">` + pts.map(t =>
      `<li>${esc(t).replace(/\*\*(.+?)\*\*/g, '<b>$1</b>')}</li>`
    ).join('') + `</ul>`
  : '';
const nn = v => (v === null || v === undefined) ? '--' : v;

const tip = document.getElementById('tip');
function showTip(e, html){
  tip.innerHTML = html; tip.style.opacity = 1;
  const r = tip.getBoundingClientRect();
  let x = e.clientX + 14, y = e.clientY - r.height - 10;
  if (x + r.width > innerWidth - 8) x = e.clientX - r.width - 14;
  if (y < 8) y = e.clientY + 18;
  tip.style.left = x + 'px'; tip.style.top = y + 'px';
}
function hideTip(){ tip.style.opacity = 0; }

/* ---------- column chart (magnitude over time, single series) ---------- */
function columns(rows, opts){
  const W = 980, H = 190, PT = 22, PB = 26, PL = 34, PR = 8;
  const max = Math.max(opts.max || 0, ...rows.map(r => r.v), 0.1);
  const n = rows.length;
  const band = (W - PL - PR) / n;
  // Bars capped at 24px, with a 2px surface gap between neighbours.
  const bw = Math.max(3, Math.min(24, band - 2));
  const y = v => H - PB - (v / max) * (H - PT - PB);

  let g = '';
  // recessive gridlines + ticks
  const steps = 4;
  for (let i = 0; i <= steps; i++){
    const v = max * i / steps, yy = y(v);
    g += `<line class="gl" x1="${PL}" x2="${W-PR}" y1="${yy}" y2="${yy}"/>`;
    g += `<text class="tick" x="${PL-7}" y="${yy+3.5}" text-anchor="end">${
      v >= 10 ? v.toFixed(0) : v.toFixed(1)}</text>`;
  }
  g += `<line class="base" x1="${PL}" x2="${W-PR}" y1="${H-PB}" y2="${H-PB}"/>`;

  rows.forEach((r, i) => {
    const cx = PL + band * i + band / 2;
    const x = cx - bw / 2;
    const hh = Math.max(0, H - PB - y(r.v));
    if (r.v > 0){
      // 4px rounded data-end, square at the baseline
      const rr = Math.min(4, bw / 2, hh);
      const fill = r.fill || 'var(--series-1)';
      g += `<path d="M${x},${H-PB} L${x},${H-PB-hh+rr} Q${x},${H-PB-hh} ${x+rr},${H-PB-hh}
        L${x+bw-rr},${H-PB-hh} Q${x+bw},${H-PB-hh} ${x+bw},${H-PB-hh+rr}
        L${x+bw},${H-PB} Z" fill="${fill}"/>`;
    }
    if (r.label) g += `<text class="tick" x="${cx}" y="${H-PB+15}" text-anchor="middle">${esc(r.label)}</text>`;
    g += `<rect class="hit" x="${PL+band*i}" y="${PT-10}" width="${band}" height="${H-PT-PB+20}"
      data-tip="${esc(r.tip)}"/>`;
  });

  // label only the extreme, never every bar
  const peak = rows.reduce((a,b) => b.v > a.v ? b : a, rows[0] || {v:0});
  if (peak && peak.v > 0){
    const pi = rows.indexOf(peak);
    const cx = PL + band * pi + band / 2;
    g += `<text class="vlab" x="${cx}" y="${y(peak.v)-7}" text-anchor="middle">${
      peak.v >= 10 ? peak.v.toFixed(0) : peak.v.toFixed(1)}${opts.unit||''}</text>`;
  }
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(opts.aria||'')}">${g}</svg>`;
}

/* ---------- donut: share of a day's rain by time of day ----------------
   A pie/donut is only defensible for part-to-whole, at a glance, with few
   segments - which is exactly this: five ordered slices of one day's rain.
   It is NOT used for the nine-area comparison, where the values are close and
   numerous and a bar chart reads far better.
   The slices are an ORDERED ramp (dawn -> night), not categorical hues, and
   every value is repeated in the table beneath so nothing is gated behind
   colour or a hover. */
function donut(rows, opts){
  const W = 460, H = 260, cx = 130, cy = 130, r = 96, inner = 58;
  const total = rows.reduce((a, b) => a + b.v, 0);
  if (total <= 0){
    return `<p class="sub">No rain to break down for this day.</p>`;
  }

  let a0 = -Math.PI / 2, g = '';
  const GAP = 0.016;                       // surface gap between slices, in rad

  rows.forEach((r0, i) => {
    const frac = r0.v / total;
    if (frac <= 0) return;
    const a1 = a0 + frac * Math.PI * 2;
    const s = a0 + GAP / 2, e = Math.max(s, a1 - GAP / 2);
    const large = (e - s) > Math.PI ? 1 : 0;
    const p = (rad, radius) => [cx + radius * Math.cos(rad), cy + radius * Math.sin(rad)];
    const [x1, y1] = p(s, r), [x2, y2] = p(e, r);
    const [x3, y3] = p(e, inner), [x4, y4] = p(s, inner);
    g += `<path d="M${x1},${y1} A${r},${r} 0 ${large} 1 ${x2},${y2}
      L${x3},${y3} A${inner},${inner} 0 ${large} 0 ${x4},${y4} Z"
      fill="${r0.fill}"/>`;
    g += `<rect class="hit" x="0" y="0" width="${W}" height="${H}"
      style="pointer-events:none"/>`;
    a0 = a1;
  });

  // Hero figure in the hole - the number the chart is actually about.
  g += `<text x="${cx}" y="${cy - 4}" text-anchor="middle"
     style="font-size:26px;font-weight:660;fill:var(--text-primary)">${total.toFixed(0)}</text>`;
  g += `<text x="${cx}" y="${cy + 15}" text-anchor="middle"
     style="font-size:11px;fill:var(--muted)">mm total</text>`;

  // Legend: identity never rests on colour alone.
  rows.forEach((r0, i) => {
    const y = 26 + i * 21;
    const pct = total ? (r0.v / total * 100) : 0;
    g += `<rect x="266" y="${y - 9}" width="11" height="11" rx="3" fill="${r0.fill}"/>`;
    g += `<text x="284" y="${y}" style="font-size:12px;fill:var(--text-primary)">${esc(r0.label)}</text>`;
    g += `<text x="${W - 6}" y="${y}" text-anchor="end"
       style="font-size:12px;fill:var(--text-secondary);font-variant-numeric:tabular-nums">${r0.v.toFixed(1)} mm · ${pct.toFixed(0)}%</text>`;
  });

  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(opts.aria || '')}">${g}</svg>`;
}

/* ---------- heatmap: week x time of day -------------------------------- */
function heatmap(days, parts, cells, opts){
  const W = 980, LEFT = 96, TOP = 26, CH = 34, PAD = 4;
  const H = TOP + parts.length * CH + 16;
  const colW = (W - LEFT - 8) / days.length;
  const max = Math.max(...cells.flat(), 0.1);
  let g = '';

  days.forEach((d, i) => {
    g += `<text class="tick" x="${LEFT + colW * i + colW / 2}" y="${TOP - 10}"
       text-anchor="middle">${esc(d)}</text>`;
  });

  parts.forEach((p, r) => {
    const y = TOP + r * CH;
    g += `<text class="tick" x="${LEFT - 10}" y="${y + CH / 2 + 4}"
       text-anchor="end">${esc(p)}</text>`;
    days.forEach((d, c) => {
      const v = cells[r][c] || 0;
      const t = Math.min(1, v / max);
      // One hue, light->dark. Opacity carries magnitude against the surface,
      // so it reads correctly in both themes without a second palette.
      const op = v <= 0.05 ? 0 : 0.14 + t * 0.86;
      const x = LEFT + colW * c;
      g += `<rect x="${x + PAD / 2}" y="${y + PAD / 2}"
         width="${colW - PAD}" height="${CH - PAD}" rx="5"
         fill="var(--series-1)" fill-opacity="${op.toFixed(3)}"/>`;
      if (v <= 0.05){
        g += `<rect x="${x + PAD / 2}" y="${y + PAD / 2}"
           width="${colW - PAD}" height="${CH - PAD}" rx="5"
           fill="none" stroke="var(--grid)"/>`;
      }
      g += `<rect class="hit" x="${x}" y="${y}" width="${colW}" height="${CH}"
         data-tip="${esc(d + ' ' + p + ' — ' + v.toFixed(1) + ' mm')}"/>`;
    });
  });

  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(opts.aria || '')}">${g}</svg>`;
}

/* ---------- horizontal bars ---------- */
function hbars(rows, opts){
  const W = 980, RH = 34, PL = opts.labelWidth || 168, PR = 62;
  const H = rows.length * RH + 12;
  const max = Math.max(...rows.map(r => r.v), 0.1);
  let g = '';
  rows.forEach((r, i) => {
    const y = i * RH + 6;
    const bh = Math.min(24, RH - 12);
    const len = Math.max(0, (r.v / max) * (W - PL - PR));
    const rr = Math.min(4, bh / 2, len);
    g += `<text class="tick" x="0" y="${y+bh/2+4}" style="fill:var(--text-primary);font-size:12.5px">${esc(r.label)}</text>`;
    if (r.sub) g += `<text class="tick" x="${PL-10}" y="${y+bh/2+4}" text-anchor="end">${esc(r.sub)}</text>`;
    if (len > 0){
      g += `<path d="M${PL},${y} L${PL+len-rr},${y} Q${PL+len},${y} ${PL+len},${y+rr}
        L${PL+len},${y+bh-rr} Q${PL+len},${y+bh} ${PL+len-rr},${y+bh} L${PL},${y+bh} Z"
        fill="${r.fill || 'var(--series-1)'}"/>`;
    }
    g += `<text class="vlab" x="${PL+len+9}" y="${y+bh/2+4}">${esc(r.valLabel)}</text>`;
    g += `<rect class="hit" x="0" y="${y-4}" width="${W}" height="${RH}" data-tip="${esc(r.tip)}"/>`;
  });
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(opts.aria||'')}">${g}</svg>`;
}

function meter(rank){
  let s = '<div class="meter">';
  for (let i = 1; i <= 5; i++) s += `<i class="${i <= rank ? 'on' : ''}"></i>`;
  return s + '</div>';
}

          clear.map(r => esc(r.place)).join(', ')}.</p>`;
    }
    h += `<div class="quote">Fog is the most local thing on this page. A
      coastal station reporting clear can be an hour's drive from a valley
      under a metre of it.</div></div>`;
  }

  /* NOT windRows: the MMR page already uses that key for the 850 hPa
     orographic forcing chart, and overwriting it broke the whole page
     with a TypeError that node --check cannot see. */
  if (D.feelsRows && D.feelsRows.length){
    h += `<div class="card"><h2>Where it feels worst, and where it blows</h2>
      <div class="scroll"><table style="white-space:nowrap"><thead><tr>
        <th>Place</th><th>Zone</th><th>Feels like</th><th>Actual</th>
        <th>Peak gust</th><th>Sea breeze</th>
      </tr></thead><tbody>
      ${D.feelsRows.map(r => `<tr>
        <td>${esc(r.place)}</td><td>${esc(r.zone)}</td>
        <td class="num"><b>${r.feels === null || r.feels === undefined
          ? '—' : r.feels + '&deg;C'}</b>${r.gap ? ` <span class="muted">(+${r.gap})</span>` : ''}</td>
        <td class="num">${r.temp === null || r.temp === undefined
          ? '—' : r.temp + '&deg;C'}</td>
        <td class="num">${r.peakGustKmph === null || r.peakGustKmph === undefined
          ? '—' : r.peakGustKmph + ' kmph'}</td>
        <td class="num">${r.seaBreezeHour === null || r.seaBreezeHour === undefined
          ? 'none' : String(r.seaBreezeHour).padStart(2,'0') + ':00'}</td>
        </tr>`).join('')}
      </tbody></table></div>
      <div class="quote">Sorted by how it will feel, not by the thermometer —
        the bracketed figure is what the humidity adds on its own, and it runs
        widest by the water and narrowest in the rain shadow. Which place is
        hottest and which feels worst are not the same question, and the
        answer changes week to week. The breeze column is the sea breeze on
        the coast; at a ghat or leeward site it is the westerly accelerating
        through the ghat gaps, which arrives dry.</div></div>`;
  }

  }

  /* forcing chart - the spine */
  const fRows = D.windRows.map(r => ({
    v: Math.max(0, r.orographic), label: r.short,
    fill: r.orographic >= T.orogVeryStrong ? 'var(--seq-650)'
        : r.orographic >= T.orogStrong ? 'var(--seq-550)'
        : r.orographic >= T.orogModerate ? 'var(--seq-400)' : 'var(--seq-250)',
    tip: `<b>${esc(r.day)}</b><br>850 hPa ${esc(r.dir)} ${r.speed.toFixed(1)} m/s<br>Terrain-normal ${r.orographic.toFixed(1)} m/s — ${esc(r.forcing)}`
  }));
  h += `<div class="card"><h2>Orographic forcing — the spine of this outlook</h2>
    <p class="sub" style="margin:-6px 0 12px">Component of the 850 hPa wind aimed square at the Ghat face (m/s).
      Deeper shade = stronger forcing.</p>
    ${columns(fRows,{max:T.orogVeryStrong*1.15,unit:' m/s',aria:'Daily orographic forcing'})}
    <div class="scroll"><table><thead><tr><th>Day</th><th>850 hPa wind</th>
      <th class="num">Speed</th><th class="num">Terrain-normal</th><th>Forcing</th></tr></thead><tbody>
      ${D.windRows.map(r => `<tr><td>${esc(r.day)}</td><td>${esc(r.dir)}</td>
        <td class="num">${r.speed.toFixed(1)} m/s</td>
        <td class="num">${r.orographic >= 0 ? '+' : ''}${r.orographic.toFixed(1)} m/s</td>
        <td>${esc(r.forcing)}</td></tr>`).join('')}
    </tbody></table></div>
    <div class="quote">A fast wind blowing <i>parallel</i> to the ridge lifts almost nothing; a
      moderate wind blowing straight at it lifts a great deal. Reference:
      ${T.orogModerate.toFixed(1)} m/s &asymp; 15 kt (a loaded engine),
      ${T.orogStrong.toFixed(1)} m/s &asymp; 20 kt.</div></div>`;

  /* trough */
  h += `<div class="card"><h2>Monsoon trough through the week</h2>
    <div class="scroll"><table><thead><tr><th>Day</th><th class="num">Trough axis</th><th>Phase</th></tr></thead><tbody>
    ${D.troughRows.map(r => `<tr><td>${esc(r.day)}</td><td class="num">${esc(r.axis)}</td>
      <td><span class="pill s-${r.phase.indexOf('break') === 0 ? 'warning' : r.phase.indexOf('active') === 0 ? 'good' : 'none'}">
      <span class="dot"></span>${esc(r.phase)}</span></td></tr>`).join('')}
    </tbody></table></div>
    <div class="quote">A trough hugging the foothills (&ge;28&deg;N) for several consecutive days is
      the break signal. A trough back over the plains is the active signal. Watch the
      <i>direction of travel</i> across the week, not any single day.</div></div>`;

  /* MMR matrix */
  const zoneOrder = {coastal:0, transition:1, ghat:2, leeward:3};
  h += `<div class="card"><h2>Rainfall across the MMR</h2>
    <div class="scroll"><table><thead><tr><th>Site</th><th>Zone</th>
      ${D.siteRows[0].cells.map(c => `<th class="num">${esc(c.short)}</th>`).join('')}
      <th class="num">Week</th></tr></thead><tbody>
    ${D.siteRows.map(s => `<tr><td>${esc(s.name)}${s.home ? ' &#9733;' : ''}</td>
      <td class="muted" style="font-size:12px">${esc(s.zone)}</td>
      ${s.cells.map(c => `<td class="num" title="${esc(c.tip)}">${c.hi >= 1
        ? c.lo.toFixed(0) + '–' + c.hi.toFixed(0) : '—'}</td>`).join('')}
      <td class="num"><b>~${s.week.toFixed(0)}</b></td></tr>`).join('')}
    </tbody></table></div>
    <div class="quote">Cells show the <b>range across ECMWF, GFS and ICON</b> in mm/24h, never a
      single number. The week column sums daily medians — an order-of-magnitude figure only.</div>
    <div class="quote">The ghat-versus-Pune contrast is the diagnostic. A large contrast confirms a
      classic westerly regime with the rain shadow intact; a small one means deep moisture and broad
      ascent are overwhelming it — usually an inland system, and a wetter event for everyone.</div></div>`;

  /* narratives */
  h += `<div class="card"><h2>Day by day</h2>
    ${D.narratives.map(n => `<div style="padding:13px 0;border-bottom:1px solid var(--border)">
      <div style="font-weight:600;margin-bottom:4px">${esc(n.day)} — ${esc(n.regime)}</div>
      <div style="color:var(--text-secondary);font-size:13.5px;line-height:1.6">${esc(n.text)}</div>
    </div>`).join('')}</div>`;

  if (D.synoptic){
    h += `<div class="card"><h2>Synoptic setting</h2>
      <div style="color:var(--text-secondary);font-size:13.5px;line-height:1.65">${D.synoptic}</div></div>`;
  }

  h += `<div class="grid g2">
    <div class="card"><h2>Check it on Windy</h2>
      ${LINKS.map(l => `<a class="lk" href="${esc(l.url)}" target="_blank" rel="noopener">
        <b>${esc(l.title)}</b><span>${esc(l.why)}</span></a>`).join('')}</div>
    <div class="card"><h2>Official sources</h2>
      ${Object.entries(D.imdUrls).map(([k,v]) => `<a class="lk" href="${esc(v)}" target="_blank" rel="noopener"><b>${esc(k)}</b></a>`).join('')}
      <a class="lk" href="${esc(D.tideUrl)}" target="_blank" rel="noopener"><b>Tide tables</b>
        <span>Never synthesised here — look them up when rain reaches the heavy band.</span></a></div></div>`;

  h += `<footer>Independent interpretation, not an official IMD product.<br>
    Days 1–2: category is defensible. Days 3–5: trend and risk window only.
    Days 6–7: scenario, confidence explicitly low.</footer>`;

  document.getElementById('app').innerHTML = h;
  document.querySelectorAll('.hit').forEach(el => {
    el.addEventListener('mousemove', e => showTip(e, el.dataset.tip));
    el.addEventListener('mouseleave', hideTip);
  });
  bindAll();
  skodaGreet();
}

/* ==========================================================================
   Sam - answers questions about this week's forecast.

   Runs entirely in the page against the forecast payload. No network call, no
   model: the artifact CSP blocks external hosts and the local file must work
   offline, so anything requiring a server would be dead in both places.

   The design rule that matters: Sam only ever states what is IN the data.
   Every answer is assembled from payload fields. When he cannot answer he says
   so and offers what he does hold, rather than improvising - a weather
   assistant that guesses is worse than no assistant.
   ========================================================================== */

const SK = (() => {
  const WD = ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];

  /* ---- voice -----------------------------------------------------------
     Sam reads aloud in the user's head, so he gets the cadence of someone
     answering a question rather than a database printing a row. The openers
     rotate on a hash of the question, not at random: asking the same thing
     twice should give the same reply, and a colleague who repeated himself
     differently every time would be unsettling rather than natural.
     Personality is in the framing only - never in the facts. */

  function seed(q){
    let h = 0;
    for (let i = 0; i < q.length; i++) h = ((h << 5) - h + q.charCodeAt(i)) | 0;
    return Math.abs(h);
  }
  function pickOne(list, q){ return list[seed(q) % list.length]; }

  const OPEN_RAIN = [
    "Right —", "So,", "Okay —", "Here's the picture:", "Looking at it:",
  ];
  const OPEN_GOOD = [
    "Good news —", "You're fine here —", "Nothing to worry about —",
  ];
  const OPEN_BAD = [
    "Heads up —", "Worth planning around this —", "This one needs care —",
  ];
  const OPEN_UNSURE = [
    "Honestly, this one's marginal —", "I'd hedge here —",
    "Not a confident call —",
  ];

  function opener(q, mood){
    const bank = mood === 'good' ? OPEN_GOOD
               : mood === 'bad' ? OPEN_BAD
               : mood === 'unsure' ? OPEN_UNSURE
               : OPEN_RAIN;
    return pickOne(bank, q);
  }

  /* Mood from the day itself, so the tone matches the content. */
  function moodOf(entry){
    const h = (entry.headline || '').toLowerCase();
    if (/very heavy|extremely heavy/.test(h)) return 'bad';
    if (/heavy/.test(h)) return 'bad';
    if (/^mostly dry|^dry/.test(h)) return 'good';
    if (/possible|unlikely/.test(h)) return 'unsure';
    return 'neutral';
  }

  /* Strip source citations. They belong in the written bulletin, which is the
     technical record; in conversation "Guide s12.1:" is just noise in front of
     the sentence that actually answers the question. */
  function deCite(s){
    let t = (s || '')
      // bracketed asides first: "(Guide s11.1)"
      .replace(/\s*\((?:Guide|Handbook)[^)]*\)/gi, '')
      // then inline references, longest form first
      .replace(/\b(?:Guide|Handbook)\s+Case Study\s+[A-F]\b/gi, '')
      .replace(/\b(?:Guide|Handbook)\s+Ch\.?\s*\d+(?:\/\d+)*\b/gi, '')
      .replace(/\b(?:Guide|Handbook)\s*(?:§|s)?\s*\d+(?:\.\d+)*\b/gi, '')
      // Removing a citation can strand the connector that introduced it -
      // "the orographic engine of ." - so drop a dangling preposition that is
      // now sitting immediately before punctuation or the end of the string.
      .replace(/\s+\b(?:of|in|per|from|see|via)\b\s*(?=[.,;:)]|$)/gi, '')
      .replace(/\s*:\s*(?=[.,;)]|$)/g, '')
      // A citation that introduced a clause ("...field. Guide s12.1: this...")
      // leaves its colon stranded after the previous sentence's full stop.
      .replace(/([.!?])\s*:\s*/g, '$1 ')
      .replace(/\s+([.,;:])/g, '$1')
      // ASCII arrows read as code in a chat bubble.
      .replace(/\s*->\s*/g, ' → ')
      .replace(/\s{2,}/g, ' ')
      .replace(/^[\s:—–-]+/, '')
      .trim();
    // A citation at the head of a sentence leaves the next word lowercase.
    t = t.replace(/(^|[.!?]\s+|\n)([a-z])/g, (m, pre, ch) => pre + ch.toUpperCase());
    return t;
  }

  /* Sam reads from BOTH payloads, never from D.
     D is whichever view is on screen, and it swaps when the reader taps a tab.
     Reading from it made his knowledge depend on the tab: on the MMR week view
     D has no plainWeek, so he answered "the weekend isn't inside the current
     seven-day window" while the daily payload held it all along. What he knows
     must not change based on what is being displayed. */
  function pick(key){
    const a = DAILY && DAILY[key];
    if (a && (!Array.isArray(a) || a.length)) return a;
    const b = WEEKLY && WEEKLY[key];
    if (b && (!Array.isArray(b) || b.length)) return b;
    return null;
  }

  function week(){ return pick('plainWeek') || []; }
  function areas(){ return pick('areas') || []; }
  function alerts(){ return pick('alerts') || []; }
  function thermal(){ return pick('thermal'); }
  function thermalRows(){ return pick('thermalRows') || []; }
  function systems(){ return pick('systems'); }
  function nowcast(){ return pick('nowcast'); }
  function issued(){ return pick('issued') || ''; }
  function weekendMeta(){ return pick('weekend'); }

  /* ---- dates ----------------------------------------------------------
     Every forecast entry is resolved to a real Date, and relative words are
     resolved against the reader's CLOCK, not against the array index. The
     naive version treated days[0] as "today", which is wrong the moment the
     page is a few hours old - open yesterday's build this morning and it
     cheerfully answers "today" with yesterday's forecast. */

  const MONTHS = ['january','february','march','april','may','june','july',
                  'august','september','october','november','december'];

  function midnight(d){ return new Date(d.getFullYear(), d.getMonth(), d.getDate()); }
  function today(){ return midnight(new Date()); }
  function addDays(d, n){ const x = new Date(d); x.setDate(x.getDate() + n); return x; }
  function sameDay(a, b){ return a.getTime() === b.getTime(); }

  /* Parse "Saturday 15 August" (the stored label) into a Date. The year is not
     in the label, so it is inferred from the issue date and corrected for a
     December-January rollover. */
  function parseLabel(label){
    if (!label) return null;
    const m = label.match(/(\d{1,2})\s+([A-Za-z]+)/);
    if (!m) return null;
    const dom = parseInt(m[1], 10);
    const mon = MONTHS.indexOf(m[2].toLowerCase());
    if (mon < 0) return null;
    let year = new Date().getFullYear();
    const issued = (D.issued || '').match(/(\d{4})/);
    if (issued) year = parseInt(issued[1], 10);
    let dt = new Date(year, mon, dom);
    // A window spanning New Year would otherwise land 12 months out.
    const ref = today();
    if (dt - ref > 300 * 864e5) dt = new Date(year - 1, mon, dom);
    if (ref - dt > 300 * 864e5) dt = new Date(year + 1, mon, dom);
    return dt;
  }

  function dated(){
    return week().map(d => ({ entry: d, date: parseLabel(d.day) }))
                 .filter(x => x.date);
  }

  function windowText(){
    const ds = dated();
    if (!ds.length) return 'the current forecast window';
    const f = ds[0].date, l = ds[ds.length - 1].date;
    const fmt = (x) => x.toLocaleDateString(undefined,
                        { weekday:'short', day:'numeric', month:'short' });
    return `${fmt(f)} to ${fmt(l)}`;
  }

  /* Resolve a target Date from the question, or null. */
  function targetDate(q){
    const ref = today();
    if (/\bday after tomorrow\b/.test(q)) return addDays(ref, 2);
    if (/\btomorrow\b|\btmrw\b|\btmr\b/.test(q)) return addDays(ref, 1);
    if (/\btoday\b|\btonight\b|\bthis evening\b|\bright now\b|\bnow\b/.test(q)) return ref;
    if (/\byesterday\b/.test(q)) return addDays(ref, -1);

    // "15 aug", "aug 15", "15th", "on the 15", "15/8"
    let m = q.match(/\b(\d{1,2})\s*(?:st|nd|rd|th)?\s+(jan|feb|mar|apr|may|jun|jul|aug|sep|oct|nov|dec)/);
    if (!m) {
      const m2 = q.match(/\b(jan|feb|mar|apr|may|jun|jul|aug|sep|oct|nov|dec)[a-z]*\s+(\d{1,2})\b/);
      if (m2) m = [m2[0], m2[2], m2[1]];
    }
    if (m){
      const dom = parseInt(m[1], 10);
      const mon = MONTHS.findIndex(x => x.startsWith(m[2]));
      if (mon >= 0){
        const hit = dated().find(x => x.date.getDate() === dom && x.date.getMonth() === mon);
        return hit ? hit.date : new Date(ref.getFullYear(), mon, dom);
      }
    }
    m = q.match(/\b(\d{1,2})\s*(?:st|nd|rd|th)\b/);
    if (m){
      const dom = parseInt(m[1], 10);
      const hit = dated().find(x => x.date.getDate() === dom);
      if (hit) return hit.date;
    }

    // Weekday name -> the occurrence inside the window.
    for (let i = 0; i < 7; i++){
      const name = WD[i].toLowerCase();
      if (new RegExp('\\b' + name + '\\b').test(q)){
        const hit = dated().find(x => x.date.getDay() === i);
        if (hit) return hit.date;
        for (let k = 1; k <= 7; k++){
          const cand = addDays(ref, k);
          if (cand.getDay() === i) return cand;
        }
      }
    }
    // Bare day-of-month as a last resort, e.g. "rain on 16".
    m = q.match(/\bon\s+(\d{1,2})\b/) || q.match(/\b(\d{1,2})\b/);
    if (m){
      const dom = parseInt(m[1], 10);
      if (dom >= 1 && dom <= 31){
        const hit = dated().find(x => x.date.getDate() === dom);
        if (hit) return hit.date;
      }
    }
    return null;
  }

  /* Entry for a date, or a structured miss explaining why. */
  function findDay(q){
    const want = targetDate(q);
    if (!want) return null;
    const ds = dated();
    const hit = ds.find(x => sameDay(x.date, want));
    if (hit) return hit.entry;
    return { _miss: true, wanted: want };
  }

  function findArea(q){
    const list = areas();
    if (!list.length) return null;
    const alias = {
      'kalyan':'kalyan_belt','dombivli':'kalyan_belt',
      'thane':'thane_belt','bhiwandi':'thane_belt',
      'colaba':'island_city','island city':'island_city','south mumbai':'island_city',
      'suburb':'suburbs','andheri':'suburbs','borivali':'suburbs','bandra':'suburbs',
      'santacruz':'suburbs','chembur':'suburbs','powai':'suburbs',
      'navi mumbai':'navi_mumbai','panvel':'navi_mumbai','vashi':'navi_mumbai',
      'badlapur':'badlapur_belt','ambernath':'badlapur_belt','karjat':'badlapur_belt',
      'vasai':'north_mmr','virar':'north_mmr','palghar':'north_mmr',
      'alibag':'south_mmr','raigad':'south_mmr',
      'matheran':'ghats','lonavala':'ghats','khandala':'ghats','ghat':'ghats',
      'trek':'ghats'
    };
    for (const k in alias){
      if (q.includes(k)){
        const hit = list.find(a => a.key === alias[k]);
        if (hit) return hit;
      }
    }
    for (const a of list){
      if (q.includes((a.name || '').toLowerCase().split('—')[0].trim().toLowerCase())) return a;
    }
    return null;
  }

  /* ---- answer builders ---- */
  function missAnswer(miss){
    const want = miss.wanted;
    const ref = today();
    const label = want.toLocaleDateString(undefined,
                    { weekday:'long', day:'numeric', month:'long' });
    if (want < ref){
      return `${label} is in the past — I only carry the forward forecast `
           + `(${windowText()}). The "what fell" table further down the page `
           + `has recent rainfall.`;
    }
    return `I don't have ${label}. This forecast covers ${windowText()} — `
         + `seven days, no further. Beyond that the honest answer is that `
         + `nobody can say much specific.`;
  }

  function staleNote(){
    // The page is a static build; if it is not from today, say so before
    // answering a question about "today".
    const ds = dated();
    if (!ds.length) return '';
    const first = ds[0].date;
    const gap = Math.round((today() - first) / 864e5);
    if (gap <= 0) return '';
    return `\n\n_Heads up: this page was built ${gap} day${gap > 1 ? 's' : ''} `
         + `ago (data from ${issued() || 'an earlier run'}). Refresh it for a `
         + `current read._`;
  }

  function dayAnswer(d, q){
    if (d && d._miss) return missAnswer(d);
    q = q || d.day || '';
    const head = (d.headline || '').replace(/\.$/, '');
    let s = `${opener(q, moodOf(d))} **${d.day}**: ${head.toLowerCase()}.`;
    if (d.detail) s += `\n\n${d.detail}`;
    const drv = driverFor(d);
    if (drv) s += `\n\n${drv}`;
    if (d.advice) s += `\n\n${d.advice}`;
    if (d.confidence) s += `\n\n_${d.confidence}_`;
    return s + staleNote();
  }

  /* The kind of rain for a plain-week entry, when the page holds it. */
  function driverFor(d){
    const date = parseLabel(d.day);
    const first = dated()[0];
    const S = pick('rainSource');
    if (date && first && sameDay(date, first.date) && S && S.headline)
      return `What kind of rain: ${S.headline.charAt(0).toLowerCase() + S.headline.slice(1)}.`;
    const rt = pick('rainTypes') || [];
    const hit = date && rt.find(r => {
      const m = (r.day || '').match(/(\d{1,2})\s+([A-Za-z]{3})/);
      return m && +m[1] === date.getDate()
        && MONTHS[date.getMonth()].startsWith(m[2].toLowerCase());
    });
    if (!hit || !d.facts || d.facts.band === 'No / trace rain') return '';
    return `What kind of rain: ${hit.label.toLowerCase()}`
         + (hit.thunder && hit.thunder !== 'none' ? `, thunderstorms ${hit.thunder}` : '') + '.';
  }

  function isWeekendDay(p){
    // Prefer the flag, but fall back to the day name so this still works on a
    // page rendered before the flag existed.
    if (typeof p.isWeekend === 'boolean') return p.isWeekend;
    return /saturday|sunday/i.test(p.day || '');
  }

  function weekendAnswer(){
    const wk = week().filter(isWeekendDay);
    const meta = weekendMeta();
    if (!wk.length){
      return "The weekend isn't inside the current seven-day window. Ask me "
           + "again closer to the time.";
    }
    let s = meta ? `**${meta.verdict}** ${meta.plans}\n\n` : '';
    s += wk.map(d => {
      const head = (d.headline || '').replace(/\.$/, '');
      let t = `**${d.day}** — ${head.toLowerCase()}.`;
      if (d.detail) t += `\n${d.detail}`;
      if (d.advice) t += `\n${d.advice}`;
      return t;
    }).join('\n\n');
    return s;
  }

  function areaAnswer(a){
    let s = `**${a.name}** — ${a.accumulation || (a.weekMm ? '~' + a.weekMm.toFixed(0) + ' mm' : '')} this week.`;
    if (a.plain) s += `\n${a.plain}`;
    if (a.wettestDay) s += `\nWettest day: ${a.wettestDay}.`;
    if (a.character) s += `\n\n${a.character}`;
    return s;
  }

  function alertAnswer(){
    const list = alerts();
    if (!list.length){
      return "Nothing flagged this week, happily — the pattern just holds "
           + "steady the whole way through. Worth saying that's my own read "
           + "rather than an IMD warning, so check them for anything official.";
    }
    const lead = list.length === 1
      ? "One thing worth knowing about:"
      : `${list.length} things worth knowing about:`;
    return lead + "\n\n"
         + list.map(a => `${a.icon} **${a.title}**\n${a.body}`).join('\n\n');
  }

  function heatAnswer(){
    const t = thermal(), rows = thermalRows();
    if (!t && !rows.length) return "I don't have the heat/cold outlook on this page.";
    let s = t ? `**${t.headline}.**` : '';
    if (rows.length){
      s += '\n\n' + rows.map(r =>
        `${r.place}: warmest ${r.warmest == null ? '--' : r.warmest.toFixed(0) + '°C'}`
        + (r.peakFeels != null ? `, feels like up to ${r.peakFeels.toFixed(0)}°C` : '')
      ).join('\n');
    } else if (t && t.days && t.days.length){
      const hot = t.days.reduce((a,b) => (b.tmax||-99) > (a.tmax||-99) ? b : a);
      const feel = t.days.reduce((a,b) => (b.heatIndex||-99) > (a.heatIndex||-99) ? b : a);
      s += `\n\nWarmest ${hot.day} at ${hot.tmax.toFixed(0)}°C.`;
      if (feel.heatIndex != null)
        s += ` Peak feels-like ${feel.heatIndex.toFixed(0)}°C on ${feel.day}.`;
    }
    if (t && t.caveat) s += `\n\n_${t.caveat}_`;
    return s;
  }

  function systemAnswer(){
    const sy = systems();
    if (!sy) return "I don't have the systems analysis on this page.";
    let s = sy.trough ? sy.trough + '\n\n' : '';
    if (sy.list && sy.list.length){
      s += sy.list.map(x => `**${x.headline}**\n${x.reasoning}`).join('\n\n');
    } else {
      s += "No significant low pressure area or depression tracked within "
         + "range this week.";
    }
    if (sy.cycloneWindow){
      s += "\n\nThis month sits in an Arabian Sea cyclone window. For anything "
         + "beyond casual tracking, IMD's cyclone bulletins are the authority — "
         + "not me.";
    }
    return s;
  }

  function whyAnswer(){
    const regime = pick('regime'), mech = pick('mechanism');
    // The driver first, in plain words; the regime name is the technical
    // label for the same thing and reads as jargon on its own.
    const S = pick('rainSource');
    const lead = (S && S.headline) ? `**${S.headline}.** ${S.detail}\n\n` : '';
    if (regime || mech){
      let s = lead + (regime ? `In the forecaster's terms it's a **${regime.toLowerCase()}** day` : '');
      const note = pick('regimeNote');
      if (note) s += ` — ${note}`;
      if (mech) s += `\n\n${mech}`;
      return s;
    }
    if (lead) return lead.trim();
    const wr = pick('weekRegime');
    if (wr) return `**${wr.label}.** ${wr.note}`;
    return "I don't have the mechanism breakdown loaded.";
  }

  function nowAnswer(){
    const nc = nowcast();
    if (!nc || !nc.verdict)
      return "No short-range read on this page. The radar links above are the "
           + "better call for the next couple of hours anyway.";
    return `${nc.verdict}\n\nFor the next 0–3 hours radar beats every model `
         + `here — the IMD radar images are further down this page.`;
  }

  function compareAnswer(){
    const list = areas();
    if (list.length < 2){
      return "I don't have enough areas on this page to compare. The **MMR "
           + "week** page has the full nine-area breakdown.";
    }
    const w = list[0], d = list[list.length - 1];
    let s = `Wettest: **${w.name}** (${w.accumulation || w.weekMm.toFixed(0)+' mm'}).\n`
          + `Driest: **${d.name}** (${d.accumulation || d.weekMm.toFixed(0)+' mm'}).\n\n`
          + `Rain isn't uniform across the MMR — coast, transition belt and `
          + `Ghats behave differently in the same setup.`;
    // Never present a ranking from an incomplete field as the final word.
    const total = pick('areasTotal') || 9;
    if (list.length < total){
      s += `\n\n_Note: I have ${list.length} of ${total} areas loaded here. `
         + `The MMR week view carries the full ranking._`;
    }
    return s;
  }


  /* ---- everyday words -------------------------------------------------
     Readers here write the way they talk - "aaj paus padel ka?", "kal
     baarish hogi?". The common Marathi and Hindi words are mapped onto the
     English the routes below understand instead of failing them. "kal" is
     both yesterday and tomorrow; asked of a forecast, it means tomorrow. */
  const LOCAL_WORDS = [
    [/\baaj\b/g, 'today'], [/\bparso\b|\bparva\b/g, 'day after tomorrow'],
    [/\bkal\b|\budya\b/g, 'tomorrow'],
    [/\bpaa?us\b|\bbaa?rish\b|\bbarsaat\b|\bpani\b/g, 'rain'],
    [/\bgarmi\b|\bukad[ae]?\b/g, 'heat'], [/\bthand[ia]?\b/g, 'cold'],
    [/\btoofan\b|\btufan\b|\bvadal\b/g, 'storm'],
    [/\bbijli\b|\bvij\b/g, 'lightning'], [/\bhawa\b|\bvara\b/g, 'wind'],
  ];
  function localise(q){
    let t = q;
    for (const [re, w] of LOCAL_WORDS) t = t.replace(re, w);
    return t;
  }

  /* ---- Sam's notes (samkb.py) ----------------------------------------- */
  const KB = (typeof SAM_KB !== 'undefined' && Array.isArray(SAM_KB) ? SAM_KB : [])
    .map(e => Object.assign({}, e, { re: e.keys.map(k => new RegExp(k, 'i')) }));
  function kbMatch(q){
    let best = null, n = 0;
    for (const e of KB){
      const hits = e.re.filter(r => r.test(q)).length;
      if (hits > n){ best = e; n = hits; }
    }
    return best;
  }
  function kbById(id){ return KB.find(e => e.id === id) || null; }
  // Asking what something IS, rather than what the weather will do.
  const CONCEPT = /^(what|why|how|explain|define|meaning|tell me about|what's|whats|is it true|difference)\b|\bmean(s|ing)?\b|\bdifference\b|\bexplain\b|\bhow (does|do|is|are)\b|\bwhat (is|are|does)\b|\b(the same|same (low|system|one)|different (lows?|systems?))\b/;
  const EXPLICIT_DATE = /\b(today|tonight|tomorrow|tmrw|yesterday|monday|tuesday|wednesday|thursday|friday|saturday|sunday|weekend|\d{1,2}\s*(st|nd|rd|th)|jan|feb|mar|apr|jun|jul|aug|sep|oct|nov|dec)\b/;

  /* ---- conversation memory ---------------------------------------------
     Enough to follow "and tomorrow?", "why?" and "tell me more" the way a
     person would, without pretending to remember more than the last turn. */
  const ctx = { route: null, kb: null };

  const BAND = v => v < 0.5 ? 'nothing' : v < 2.5 ? 'light rain'
                  : v < 7.5 ? 'moderate rain' : v < 20 ? 'heavy rain'
                  : 'very heavy rain';

  /* ---- live radar ------------------------------------------------------ */
  function radarNow(){ return pick('radarNow'); }
  const BELT_ALIAS = [
    [/kalyan|dombivli|thane|bhiwandi|ulhasnagar|titwala/, 'Kalyan'],
    [/badlapur|ambernath|karjat|neral|shelu/, 'Badlapur'],
    [/navi mumbai|vashi|panvel|kharghar|nerul|belapur|airoli/, 'Navi Mumbai'],
    [/malad|borivali|andheri|goregaon|kandivali|dahisar|jogeshwari|western suburb/, 'Malad'],
    [/dadar|colaba|island city|south mumbai|churchgate|worli|byculla|parel/, 'Dadar'],
    [/vasai|virar|palghar|nalasopara|bhayandar|mira road/, 'Vasai'],
    [/igatpuri|kasara/, 'Igatpuri'],
    [/matheran|lonavala|khandala|khopoli/, 'Matheran'],
    [/malshej|murbad|junnar/, 'Malshej'],
  ];
  function findBelt(q, belts){
    for (const [re, key] of BELT_ALIAS){
      if (re.test(q)){
        const b = belts.find(x => (x.name || '').includes(key));
        if (b) return b;
      }
    }
    return null;
  }
  function beltLine(b){
    const here = b.hereMmH >= 0.5
      ? `**${BAND(b.hereMmH)}** overhead (about ${Math.max(1, Math.round(b.hereMmH))} mm/hr)`
      : 'nothing overhead';
    const near = (b.nearMmH >= 2.5 && b.nearKm > 3)
      ? `, with ${BAND(b.nearMmH)} about ${b.nearKm} km away` : '';
    const doubt = b.doubt === 'clutter'
      ? ' — unconfirmed: the other radar sees nothing there, so it may be clutter off the hills'
      : b.doubt === 'blocked'
      ? ' — the other radar has rain there that this one may be missing' : '';
    return `${here}${near}${doubt}`;
  }
  /* Minutes between the scan and the reader's clock, not the build's. */
  function scanAgeNow(){
    const R = radarNow();
    const m = (issued() || '').match(/(\d{1,2})\s+([A-Za-z]{3})[a-z]*\s+(\d{4})/);
    if (!R || !R.at || !m) return null;
    const mon = MONTHS.findIndex(x => x.startsWith(m[2].toLowerCase()));
    const hm = R.at.split(':').map(Number);
    if (mon < 0 || hm.length < 2) return null;
    const t = new Date(+m[3], mon, +m[1], hm[0], hm[1]);
    return Math.round((Date.now() - t.getTime()) / 60000);
  }
  function fmtAge(min){
    if (min < 90) return `${min} minutes`;
    if (min < 36 * 60) return `${Math.round(min / 60)} hours`;
    return `${Math.round(min / 1440)} days`;
  }
  function radarAnswer(q){
    const R = radarNow();
    if (!R || !R.belts || !R.belts.length) return nowAnswer();
    const name = (R.site || 'radar').replace(/ DWR Mumbai.*$/, '').trim();
    const age = scanAgeNow();
    let s = '';
    if (age != null && age > 60){
      s += `One thing first — the newest radar on this page is from ${R.at}, `
         + `about ${fmtAge(age)} ago, so it's history rather than now. IMD's `
         + `live radar (linked on the page) is the thing to open.\n\n`;
    }
    const belt = findBelt(q, R.belts);
    if (belt){
      const mood = belt.doubt === 'clutter' ? 'unsure'
                 : belt.hereMmH >= 7.5 ? 'bad' : belt.hereMmH < 0.5 ? 'good' : 'neutral';
      s += `${opener(q, mood)} on the ${name} radar (${R.when}), `
         + `${belt.name.replace(/ belt$/, '')} has ${beltLine(belt)}.`;
    } else {
      const wet = R.belts.filter(b => b.hereMmH >= 0.5 && b.doubt !== 'clutter');
      s += wet.length
        ? `On the ${name} radar (${R.when}), rain is falling over `
          + wet.map(b => b.name.replace(/ belt$/, '')).join(', ') + '.'
        : `On the ${name} radar (${R.when}), nothing is reaching the ground anywhere in the MMR.`;
      const home = R.belts.find(b => /Kalyan/.test(b.name || ''));
      if (home) s += `\n\nOver Kalyan: ${beltLine(home)}.`;
      const heavy = R.belts.filter(b => b.nearMmH >= 7.5 && b.nearKm > 3 && b !== home);
      if (heavy.length){
        s += `\n\nHeavier cells nearby: ` + heavy.slice(0, 3).map(b =>
          `${BAND(b.nearMmH)} ~${b.nearKm} km from ${b.name.replace(/ belt$/, '')}`).join('; ') + '.';
      }
    }
    if (R.note) s += `\n\n_${R.note}_`;
    if (R.checkNote) s += `\n\n_${R.checkNote}_`;
    return s + `\n\nRadar is right about where and whether far more than exactly how much.`;
  }

  /* ---- what kind of rain ---------------------------------------------- */
  function parseShort(label){
    // "Tue 22 Sep" - the weekly labels use short month names.
    const m = (label || '').match(/(\d{1,2})\s+([A-Za-z]{3})/);
    if (!m) return null;
    const mon = MONTHS.findIndex(x => x.startsWith(m[2].toLowerCase()));
    if (mon < 0) return null;
    const y = ((issued() || '').match(/(\d{4})/) || [0, new Date().getFullYear()])[1];
    return new Date(+y, mon, +m[1]);
  }
  function thunderWords(t){
    return t === 'likely' ? 'thunderstorms likely'
         : t === 'possible' ? 'thunderstorms possible' : '';
  }
  function rainTypeAnswer(q){
    const S = pick('rainSource');
    const rt = pick('rainTypes') || [];
    const want = targetDate(q);
    const first = dated()[0];
    const isFirst = !want || (first && sameDay(want, first.date));
    if (isFirst && S && S.headline){
      let s = `**${S.headline}.** ${S.detail}`;
      const tw = thunderWords(S.thunder);
      if (tw) s += `\n\n**${tw[0].toUpperCase() + tw.slice(1)}.**`;
      if (S.terrain) s += `\n\n${S.terrain}`;
      return s;
    }
    if (want && rt.length){
      const hit = rt.find(r => { const d = parseShort(r.day); return d && sameDay(d, want); });
      if (hit){
        const tw = thunderWords(hit.thunder);
        return `**${hit.day}: ${hit.label}.** ${hit.headline}.` + (tw ? ` ${tw[0].toUpperCase() + tw.slice(1)}.` : '');
      }
    }
    if (rt.length){
      return "Here's what drives the rain, day by day:\n\n"
        + rt.map(r => `**${r.day}** — ${r.label}` + (thunderWords(r.thunder) ? ` (${thunderWords(r.thunder)})` : '')).join('\n')
        + "\n\nA change of driver matters more than a change of total — monsoon rain and easterly storms land on opposite sides of the Ghats.";
    }
    if (S && S.headline) return `Today: **${S.headline}.** ${S.detail}\n\n_I only hold today's rain type on this page; the MMR week view has every day._`;
    const k = kbById('rain_types');
    return k ? k.a : "I don't have the rain-type read on this page.";
  }

  /* ---- timing, accuracy, models, regions, background ------------------- */
  function arrivalsAnswer(q){
    const A = pick('arrivals');
    if (!A || !A.available || !A.list) return nowAnswer();
    const R = radarNow();
    const hit = findBelt(q, A.list) || A.list.find(x => /Kalyan/.test(x.name || ''));
    let s = `Rain areas are drifting from about ${Math.round(A.fromDeg)}° at roughly `
          + `${A.speedKmh} km/h (the three models ${A.agreement === 'tight' ? 'agree closely' : 'differ a bit'} on that).`;
    if (hit) s += `\n\n**${hit.name}**: ${hit.sentence}`;
    const soon = A.list.filter(x => x !== hit && (x.now || (x.eta && x.eta > 0)));
    if (soon.length) s += `\n\nElsewhere: ` + soon.slice(0, 4).map(x =>
      `${x.name.replace(/ belt$/, '')} ${x.now ? 'now' : 'in ~' + x.eta + ' h'}`).join(', ') + '.';
    s += `\n\nThat's distance divided by the steering wind, so it assumes the rain keeps going — cells grow and die on the way.`;
    if (R) s += ` For what's falling right now, ask me about the radar.`;
    return s;
  }
  function trackAnswer(){
    const T = pick('track');
    const k = kbById('accuracy');
    if (!T || !T.available) return k ? k.a : "No scorecard on this page.";
    return T.summary + (k ? `\n\n${k.a}` : '');
  }
  function modelsAnswer(){
    const M = pick('models') || [];
    if (!M.length){ const k = kbById('no_average'); return k ? k.a : "No model breakdown on this page."; }
    let s = `For today at Kalyan West: ` + M.map(m => `${m.name} ${m.mm} mm (${m.band.toLowerCase()})`).join(', ') + '.';
    const sw = pick('spreadWarning');
    if (sw) s += `\n\n${sw}`;
    s += `\n\nI never average them — when they disagree it usually means the outcome hinges on something small, like exactly where a storm fires. Trust what they agree on more than what they don't.`;
    return s;
  }
  function confidenceAnswer(){
    const c = pick('confidence');
    if (!c) { const k = kbById('confidence'); return k ? k.a : "No confidence breakdown on this page."; }
    return `Today: **${c.occurrence}** confidence it rains, **${c.amount}** on how much, **${c.timing}** on when.\n\n${c.rationale || ''}`;
  }
  function regionHit(q){
    const R = pick('regions');
    if (!R || !R.list) return null;
    const words = q.split(/[^a-z]+/).filter(w => w.length >= 4);
    return R.list.find(r => words.some(w => (r.name || '').toLowerCase().includes(w))) || null;
  }
  function regionAnswer(r){
    const R = pick('regions');
    let s = `**${r.name}**: ${r.wet ? `${r.band.toLowerCase()}, about ${Math.round(r.totalMm)} mm over the week` : 'mostly dry this week'}`;
    if (r.wet && r.peakDay) s += `, wettest on ${r.peakDay} (${r.peakLo}–${r.peakHi} mm)`;
    s += '.';
    if (r.perModel) s += ` Models for that day: ` + Object.entries(r.perModel).map(([k, v]) => `${k} ${v}`).join(', ') + ' mm.';
    if (r.note) s += `\n\n${r.note}`;
    if (R && R.lead && R.lead.headline) s += `\n\nThe system driving it: ${R.lead.headline}.`;
    return s;
  }
  function driversAnswer(){
    const Dv = pick('drivers');
    const k = kbById('climate_drivers');
    if (!Dv) return k ? k.a : "The climate drivers are on the MMR week view.";
    // First two real sentences; skip lead-ins like "Here is why."
    const first = t => ((t || '').match(/[^.]+(\.|$)/g) || [])
      .filter(x => x.trim().length > 24).slice(0, 2).join('').trim();
    const parts = [];
    for (const key of ['enso', 'iod', 'mjo', 'miso']){
      const x = Dv[key];
      if (x && x.text) parts.push(`**${key.toUpperCase()}**: ${first(x.text)}`);
    }
    return (parts.length ? parts.join('\n\n') : (k ? k.a : ''))
         + "\n\nThey tilt the odds over weeks, not any single day.";
  }
  function upstreamAnswer(){
    const U = pick('upstream');
    const k = kbById('upstream');
    if (!U || !U.available) return k ? k.a : "No upstream read on this page.";
    return (U.reading || `The moisture-carrying jet is ${U.jet}: ${U.jetNote}. Mid-levels: ${U.dryNote}.`)
         + (k ? `\n\n${k.a}` : '');
  }
  /* ---- the elements added after rain ---- */
  function monsoonAnswer(){
    const M = pick('monsoonState');
    if (!M) return "This view doesn't carry the monsoon-state read — it's on "
