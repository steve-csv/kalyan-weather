      <div class="quote">At 3–5 days give the trend and risk window only — avoid exact hourly or
        suburb-level claims at this range.</div></div>`;
  }

  /* ---- when in the day does it rain (donut + heatmap) ---- */
  // `windows` carries the same per-daypart totals and has been in the payload
  // all along, so the donut works on older builds too rather than waiting for
  // the next full run.
  D.dayparts = D.dayparts
    || (D.windows || []).map(w => ({label: w.label, mm: w.mm}));

  if (D.dayparts && D.dayparts.some(p => p.mm > 0)){
    const ramp = ['var(--seq-250)','var(--seq-350)','var(--seq-450)',
                  'var(--seq-550)','var(--seq-650)'];
    const rows = D.dayparts.map((p, i) => ({
      label: p.label, v: p.mm, fill: ramp[i % ramp.length]
    }));
    const total = rows.reduce((a,b) => a + b.v, 0);
    h += `<div class="card"><h2>When it rains today</h2>
      <p class="sub" style="margin:-6px 0 10px">Share of the day's rain by time
        of day. Shade runs pre-dawn → night.</p>
      ${donut(rows, {aria:"Share of today's rain by time of day"})}
      <div class="scroll"><table><thead><tr><th>Time of day</th>
        <th class="num">Rain</th><th class="num">Share</th></tr></thead><tbody>
        ${rows.map(r => `<tr><td>${esc(r.label)}</td>
          <td class="num">${r.v.toFixed(1)} mm</td>
          <td class="num">${total ? (r.v/total*100).toFixed(0) : 0}%</td></tr>`).join('')}
      </tbody></table></div></div>`;
  }

  if (D.heatmap && D.heatmap.cells && D.heatmap.cells.length){
    const hm = D.heatmap;
    h += `<div class="card"><h2>The week, hour block by hour block</h2>
      <p class="sub" style="margin:-6px 0 12px">Darker means more rain. The
        empty cells are your dry windows.</p>
      ${heatmap(hm.days, hm.parts, hm.cells, {aria:'Rainfall by day and time of day'})}
      <div class="quote">Read the columns for "which day", the rows for "what
        time". A row that stays dark all week is a time of day worth avoiding
        for anything outdoors.</div></div>`;
  }

  /* ---- nowcast + live radar ---- */
  if (D.nowcast && D.nowcast.radar){
    const nc = D.nowcast;
    h += `<div class="card"><h2>Now — next few hours</h2>
      <p class="sub" style="margin:-6px 0 12px">For the next 0–3 hours, radar
        outranks every model on this page.</p>
      ${nc.verdict ? `<p style="margin:0 0 14px">${esc(nc.verdict)}</p>` : ''}
      ${nc.hours && nc.hours.length ? columns(nc.hours.map(x => ({
          v:x.mm, label:x.t.slice(0,2),
          tip:`<b>${esc(x.t)}</b> — ${x.mm.toFixed(1)} mm/h`
        })), {unit:' mm/h', aria:'Next hours of modelled rainfall'}) : ''}
      <div class="radarbar">
        <span class="rdot" id="rdot"></span>
        <span id="rstamp">Radar — loading…</span>
        <button class="sk-chip" type="button" id="rnow">Refresh now</button>
      </div>
      <div class="radar" id="radarWrap">
        ${nc.radar.slice(0,2).map(r => `<figure>
          <img data-radar="${esc(r.url.split('?')[0])}" alt="${esc(r.name)}">
          <figcaption><b>${esc(r.name)}</b><br>${esc(r.why)}</figcaption>
        </figure>`).join('')}
      </div>
      ${radarExplainHtml(D)}
      <div style="margin-top:12px">
        ${nc.radar.slice(2).map(r => `<a class="lk" href="${esc(r.url)}" target="_blank" rel="noopener">
          <b>${esc(r.name)}</b><span>${esc(r.why)}</span></a>`).join('')}
        <a class="lk" href="${esc(nc.radarPage)}" target="_blank" rel="noopener">
          <b>IMD radar page (animated)</b><span>The sequence — which is the one that actually matters.</span></a>
        <a class="lk" href="${esc(nc.rainviewer)}" target="_blank" rel="noopener">
          <b>RainViewer animation</b><span>About 2 h of frames, easier to loop.</span></a>
      </div>
      <h2 style="margin-top:20px">The five-question scan${nc.scanAt ? ` — answered ${esc(nc.scanAt)}` : ''}</h2>
      ${nc.scan && nc.scan.length
        ? `<ol class="qs qa">${nc.scan.map(x =>
             `<li><b>${esc(x.q)}</b><div class="qaa">${mdBold(x.a)}</div></li>`
           ).join('')}</ol>
           <div class="quote">Answered from the gridded analysis, not radar.
             The analysis lags and smooths, so it misses a cell that has just
             fired and understates an intense core. Inside three hours the
             radar loop above is still the authority — use these to know
             <i>what to look for</i> on it.</div>`
        : `<ol class="qs">${nc.questions.map(q => `<li>${esc(q)}</li>`).join('')}</ol>`}
      <div class="quote"><b>What radar will not tell you.</b>
        ${nc.limits.map(esc).join(' ')}
        This page reads the latest scan for what is falling now, but does not
        extrapolate it into arrival times — one frame gives position, not
        motion, and a straight line projected from it produces a number that
        looks precise and is not. Use IMD's own nowcasts for anything
        safety-critical.</div>
    </div>`;
  }


  h += trackHtml(D);

  /* ---- upstream drivers (Somali jet, mid-level dry air) ---- */
  if (D.upstream && D.upstream.available){
    const u = D.upstream;
    const jetTone = /very strong|strong/.test(u.jet) ? 'good'
                  : /weak/.test(u.jet) ? 'bad' : 'neu';
    const dryTone = /very dry|dry/.test(u.dry) ? 'bad'
                  : /moist/.test(u.dry) ? 'good' : 'neu';
    const advBad = u.advection === 'steered onto us' && /dry/.test(u.dry);
    h += `<div class="card"><h2>Upstream drivers</h2>
      <p class="sub" style="margin:-6px 0 14px">The Somali jet decides how much
        moisture is being delivered. The mid-level airmass decides whether it can
        become deep cloud once it gets here.</p>
      <div class="dgrid">
        <div class="dtile d-${jetTone}">
          <div class="dname">SOMALI JET</div>
          <div class="dval">${u.jetSpeed != null ? u.jetSpeed + ' m/s' : '—'}</div>
          <div class="dsub"><b>${esc(u.jet)}</b>${u.jetDir ? ' from ' + esc(u.jetDir) : ''}
            ${u.sourceSupports === false ? ' · source slackening behind it' : ''}</div>
        </div>
        <div class="dtile d-${dryTone}">
          <div class="dname">MID-LEVEL AIR</div>
          <div class="dval">${u.midRh != null ? u.midRh + '%' : '—'}</div>
          <div class="dsub"><b>${esc(u.dry)}</b>${u.advection ? ' · ' + esc(u.advection) : ''}</div>
        </div>
      </div>
      ${u.reading ? `<div class="dtext">${mdBold(u.reading)}</div>` : ''}
      ${advBad ? `<div class="quote">Dry mid-level air is being steered onto the
        region. Low levels can look humid while cloud still fails to grow — this
        is the setup where model rain most often fails to verify.</div>` : ''}`;
    if (u.week && u.week.length > 1){
      h += `<div class="ustrip">` + u.week.map(d => {
        const t = /very strong|strong/.test(d.jet) ? 'good'
                : /weak/.test(d.jet) ? 'bad' : 'neu';
        return `<div class="uday">
          <div class="ubar u-${t}" style="height:${Math.max(6, Math.min(46, (d.jetSpeed||0) * 2))}px"
            title="${esc(d.jet)} — ${d.jetSpeed != null ? d.jetSpeed + ' m/s' : ''}"></div>
          <div class="uval">${d.jetSpeed != null ? d.jetSpeed : '—'}</div>
          <div class="ulab">${esc(dayShort(d.day))}</div>
        </div>`;
      }).join('') + `</div>
      <div class="sub" style="margin-top:6px">Corridor jet strength through the
        week, m/s. Read against the mid-level airmass: a strong jet under dry
        mid-levels delivers less than its speed suggests.</div>`;
    }
    h += `</div>`;
  }

  /* ---- systems ---- */
  if (D.systems){
    const sy = D.systems;
    h += `<div class="card"><h2>Low pressure systems, troughs and storms</h2>
      <p style="margin:0 0 12px">${esc(sy.trough)}</p>`;
    if (sy.list && sy.list.length){
      h += sy.list.map(s => `<div class="sysrow">
        <div class="at"><span class="tag t-${esc(s.relevance)}">${esc(s.relevance)}</span> ${esc(s.headline)}</div>
        <div class="ab">${esc(s.reasoning)}${subList(s.points)}</div>
        <div class="pc">Closest approach ~${s.distanceKm} km · minimum ${s.pressure} hPa · ${s.motion==='unresolved' ? `resolved over ${s.durationH} h — too short to say if it is moving` : s.motion==='slow' ? `moves under one grid cell in ${s.durationH} h` : `moves ${s.movedKm} km in ${s.durationH} h`}</div>
      </div>`).join('');
    } else {
      h += `<p class="sub">No significant low pressure area or depression tracked
        within range this week. Rain will be driven by the broad monsoon flow and
        terrain rather than by an organised system.</p>`;
    }
    if (sy.cycloneWindow){
      h += `<div class="quote"><b>Cyclone season.</b> This month falls in an
        Arabian Sea cyclone window. For anything beyond casual tracking, IMD's
        official cyclone bulletins are authoritative and this tool is not.</div>`;
    }
    h += `</div>`;
  }

  /* ---- who gets this system, and when ----
     The regional forecasters people actually follow answer a question this
     page did not: a low is crossing the country, so which regions get rain
     and on which dates. Ordered wettest-first over the week. */
  if (D.regions && D.regions.list && D.regions.list.length){
    const rg = D.regions;
    h += `<div class="card"><h2>Who gets this system, and when</h2>
      <p class="sub" style="margin:-6px 0 12px">The rest of this page answers
        what happens at Kalyan. This answers who else gets wet, and on which
        days. Ordered by the week's total, wettest first.</p>`;
    if (rg.lead){
      h += `<p class="bline" style="margin:0 0 12px">
        <b>The system driving it.</b> ${esc(rg.lead.headline)} &mdash; minimum
        ${rg.lead.pressure} hPa, closest about ${rg.lead.closestKm.toLocaleString()} km
        from Kalyan. Every window below is downstream of that track: if the low
        runs further north or south, or falls apart early, the dates move with
        it.</p>`;
    }
    h += `<div class="regs">` + rg.list.map(r => {
      if (!r.wet){
        return `<div class="reg reg-dry">
          <div class="rgn">${esc(r.short)}</div>
          <div class="rgw">No meaningful spell this week.</div></div>`;
      }
      const models = Object.keys(r.perModel)
        .map(k => `${esc(k)} ${r.perModel[k]}`).join(' · ');
      const span = r.windowFrom === r.windowTo
        ? esc(r.windowFrom)
        : esc(r.windowFrom) + '–' + esc(r.windowTo);
      const agree = r.agreement === 'close'
        ? 'models close'
        : (r.agreement === 'loose' ? 'models differ' : 'models disagree badly');
      return `<div class="reg reg-${esc(r.agreement)}">
        <div class="rgn">${esc(r.short)}</div>
        <div class="rgw"><b>${span}</b></div>
        <div class="rgp">Heaviest ${esc(r.peakDay)} &middot;
          <b>${r.peakLo}–${r.peakHi} mm</b></div>
        <div class="rgm">${models} &middot; ${agree}</div>
      </div>`;
    }).join('') + `</div>`;
    h += `<div class="quote">Seven-day model totals over large areas, so a
      region here is not a place &mdash; Nagpur and Akola are 200 km apart and
      share a tile. Read this for the <b>sequence and the dates</b>: who gets it
      first, who gets it worst, who misses out. For what to do tomorrow, use the
      Kalyan sections.</div>`;
    h += `</div>`;
  }

  /* ---- heat & cold ---- */
  if (D.thermal && D.thermal.days && D.thermal.days.length){
    const th = D.thermal;
    h += `<div class="card"><h2>Heat and cold — next 7 days</h2>
      <p style="margin:0 0 12px"><b>${esc(th.headline)}.</b></p>
      <div class="scroll"><table><thead><tr><th>Day</th><th class="num">Max</th>
        <th class="num">vs normal</th><th class="num">Min</th>
        <th class="num">Feels like</th><th>Flag</th></tr></thead><tbody>
      ${th.days.map(d => {
        let flag = '';
        if (d.heatFlag === 'severe-criteria') flag = '<span class="tag t-critical">severe heat</span>';
        else if (d.heatFlag === 'heatwave-criteria') flag = '<span class="tag t-warning">heatwave criteria</span>';
        else if (d.coldFlag) flag = '<span class="tag t-watch">cold criteria</span>';
        else if (d.heatIndex >= 41) flag = '<span class="tag t-warning">danger (feels-like)</span>';
        else if (d.heatIndex >= 32) flag = '<span class="tag t-watch">extreme caution</span>';
        return `<tr><td>${esc(d.day)}</td>
          <td class="num">${d.tmax === null ? '--' : d.tmax.toFixed(0)+'°'}</td>
          <td class="num">${d.depMax === null ? '--' : (d.depMax>=0?'+':'')+d.depMax.toFixed(1)}</td>
          <td class="num">${d.tmin === null ? '--' : d.tmin.toFixed(0)+'°'}</td>
          <td class="num">${d.heatIndex === null ? '--' : d.heatIndex.toFixed(0)+'°'}</td>
          <td>${flag}</td></tr>`;
      }).join('')}
      </tbody></table></div>
      <div class="quote">${esc(th.caveat)}</div></div>`;
  }

  /* ingredients */
  h += `<div class="card"><h2>Ingredients — checked before the rain layer</h2><div class="scroll"><table>
    <thead><tr><th>Ingredient</th><th class="num">Value</th><th>Reading</th></tr></thead><tbody>
    <tr><td>Dew point</td><td class="num">${nn(ing.dewPoint)} °C</td><td>Temp − dew point spread ${nn(ing.spread)} °C</td></tr>
    <tr><td>RH 925 / 850 / 700 hPa</td><td class="num">${nn(ing.rh925)} / ${nn(ing.rh850)} / ${nn(ing.rh700)} %</td><td>Moisture depth: <b>${esc(ing.depthClass)}</b></td></tr>
    <tr><td>Precipitable water</td><td class="num">${nn(ing.pwat)} mm</td><td>${esc(ing.moistureNote)}</td></tr>
    <tr><td>850 hPa wind</td><td class="num">${esc(ing.wind850Dir)} ${nn(ing.wind850Speed)} m/s</td><td>The moisture-transport layer</td></tr>
    <tr><td>Terrain-normal component</td><td class="num">${nn(ing.orographic)} m/s</td><td>Orographic forcing: <b>${esc(ing.forcingClass)}</b> — ${esc(ing.liftNote)}</td></tr>
    <tr><td>CAPE (peak)</td><td class="num">${nn(ing.capePeak)} J/kg</td><td><b>${esc(ing.capeClass)}</b> — potential, not certainty</td></tr>
    <tr><td>Bulk shear 925→500</td><td class="num">${nn(ing.shear)} m/s</td><td><b>${esc(ing.shearClass)}</b> — ${esc(ing.stormMode)}</td></tr>
    </tbody></table></div></div>`;

  /* synoptic */
  if (D.synoptic){
    h += `<div class="card"><h2>Synoptic setting</h2>
      <div style="color:var(--text-secondary);font-size:13.5px;line-height:1.65">${D.synoptic}</div></div>`;
  }

  /* links */
  h += `<div class="grid g2">
    <div class="card"><h2>Check it on Windy</h2>
      <p class="sub" style="margin-bottom:8px">Pressure first, rain last — the morning-routine order.</p>
      ${LINKS.map(l => `<a class="lk" href="${esc(l.url)}" target="_blank" rel="noopener">
        <b>${esc(l.title)}</b><span>${esc(l.why)}</span></a>`).join('')}</div>
    <div class="card"><h2>Compare the models</h2>
      <p class="sub" style="margin-bottom:8px">Same layer, same place, one model at a time.</p>
      ${MLINKS.map(l => `<a class="lk" href="${esc(l.url)}" target="_blank" rel="noopener">
        <b>${esc(l.title)}</b><span>${esc(l.why)}</span></a>`).join('')}
      <h2 style="margin-top:18px">Official sources</h2>
      ${Object.entries(D.imdUrls).map(([k,v]) => `<a class="lk" href="${esc(v)}" target="_blank" rel="noopener"><b>${esc(k)}</b></a>`).join('')}
      <a class="lk" href="${esc(D.tideUrl)}" target="_blank" rel="noopener"><b>Tide tables</b>
        <span>Heavy rain near high tide is a materially worse flooding scenario — this page never
        synthesises tide times, so check them here.</span></a>
    </div></div>`;

  h += `<footer>An unofficial forecast for Kalyan West, Mumbai and the wider MMR —
    rain, temperature, heat and cold, monsoon onset and withdrawal — written the way an
    independent regional forecaster writes: naming the mechanism, saying which way it could
    go, and publishing its own score.<br>
    It is <b>not</b> an IMD product and carries no authority. Where this page and IMD differ,
    IMD is the official position. Heatwave, cold-wave, cyclone and withdrawal calls here are
    unofficial readings of the criteria, never declarations.<br>
    For flooding, lightning, transport and emergency decisions, follow IMD nowcasts, warnings and
    local authority instructions.</footer>`;

  document.getElementById('app').innerHTML = h;

  document.querySelectorAll('.hit').forEach(el => {
    el.addEventListener('mousemove', e => showTip(e, el.dataset.tip));
    el.addEventListener('mouseleave', hideTip);
  });
  bindAll();
  skodaGreet();
}

/* All interactive wiring in one place, re-run after every render. Nothing here
   relies on inline on* attributes, so the page behaves the same under a strict
   Content-Security-Policy as it does opened from disk. */
/* ---------- live radar ------------------------------------------------
   IMD overwrites these images in place roughly every 10 minutes, always at the
   same URL. A page built once therefore shows whatever frame existed at build
   time unless the browser is told to re-fetch, which is what the cache-busting
   timestamp does here.

   The published artifact runs under a CSP that blocks requests to external
   hosts, so these images cannot load there at all. Rather than leave two
   broken image boxes, the failure is detected and replaced with links that do
   work. */
const RADAR_MS = 5 * 60 * 1000;
let radarTimer = null, radarFailed = false;

function radarRefresh(manual){
  const imgs = document.querySelectorAll('#radarWrap img[data-radar]');
  if (!imgs.length) return;
  const stamp = document.getElementById('rstamp');
  const dot = document.getElementById('rdot');
  const t = Date.now();
  let pending = imgs.length, failed = 0;

  imgs.forEach(img => {
    const base = img.dataset.radar;
    const probe = new Image();
    probe.onload = () => {
      img.src = probe.src;
      if (--pending === 0) settle();
    };
    probe.onerror = () => { failed++; if (--pending === 0) settle(); };
    probe.src = base + '?t=' + t;
  });

  function settle(){
    if (failed === imgs.length){
      radarFailed = true;
      if (dot) dot.className = 'rdot dead';
      if (stamp) stamp.textContent = 'Radar images blocked here';
      showRadarFallback();
      clearInterval(radarTimer);
      return;
    }
    if (dot) dot.className = 'rdot live';
    if (stamp){
      stamp.textContent = 'Radar updated ' +
        new Date().toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'}) +
        ' · auto-refreshes every 5 min';
    }
  }
}

function showRadarFallback(){
  const wrap = document.getElementById('radarWrap');
  if (!wrap || wrap.dataset.fallback) return;
  wrap.dataset.fallback = '1';
  const nc = (DAILY && DAILY.nowcast) || {};
  wrap.innerHTML = `<div class="radar-fallback">
    <b>Live radar can't display on this shared page.</b><br>
    It's hosted on claude.ai, which blocks images loaded from other sites —
    IMD's radar server is one of those. The links still work:
    <div style="margin-top:10px">
      ${(nc.radar || []).map(r => `<a class="lk" href="${esc(r.url)}" target="_blank" rel="noopener"><b>${esc(r.name)}</b></a>`).join('')}
      ${nc.radarPage ? `<a class="lk" href="${esc(nc.radarPage)}" target="_blank" rel="noopener"><b>IMD radar page (animated)</b></a>` : ''}
    </div>
    <div style="margin-top:10px"><b>Or open the public page instead</b> —
      the radar displays inline there and refreshes itself:<br>
      <a class="lk" href="https://${REPO.split('/')[0]}.github.io/${REPO.split('/')[1]}/"
         target="_blank" rel="noopener"><b>steve-csv.github.io/kalyan-weather</b></a>
    </div></div>`;
}

function startRadar(){
  if (!document.getElementById('radarWrap')) return;
  radarRefresh(false);
  clearInterval(radarTimer);
  radarTimer = setInterval(() => { if (!radarFailed) radarRefresh(false); },
                           RADAR_MS);
  const btn = document.getElementById('rnow');
  if (btn && !btn.dataset.bound){
    btn.dataset.bound = '1';
    btn.addEventListener('click', () => radarRefresh(true));
  }
}

function bindAll(){
  applyMood();
  buildSky();
  bindWindy();
  bindDrivers();
  skodaBind();
  startRadar();

  const theme = document.getElementById('themeBtn');
  if (theme && !theme.dataset.bound){
    theme.dataset.bound = '1';
    theme.addEventListener('click', toggleTheme);
  }

  const tabs = document.getElementById('viewTabs');
  if (tabs && !tabs.dataset.bound){
    tabs.dataset.bound = '1';
    tabs.addEventListener('click', (ev) => {
      const btn = ev.target.closest('button[data-view]');
      if (btn) showView(btn.dataset.view);
    });
  }

  const rbtn = document.getElementById('rbtn');
  if (rbtn && !rbtn.dataset.bound){
    rbtn.dataset.bound = '1';
    rbtn.addEventListener('click', doRefresh);
  }
}

/* ---------- the animated sky -----------------------------------------
   Density is driven by the actual forecast, so the animation is a reading of
   the data rather than decoration: a light-rain day gets a few drops, a
   very-heavy day gets a downpour and the occasional flash. */
/* A cloud silhouette built from overlapping lobes on a flat base — the shape
   people actually read as "cloud". Three variants so a sky with several does
   not look like one asset repeated. */
function cloudSvg(seed){
  const shapes = [
    'M18 62 Q18 44 34 42 Q39 25 58 26 Q74 20 84 34 Q104 33 106 50 '
      + 'Q120 52 118 62 Z',
    'M12 62 Q12 47 27 45 Q31 30 48 31 Q60 20 74 30 Q92 28 95 44 '
      + 'Q112 46 110 62 Z',
    'M20 62 Q16 46 33 44 Q36 28 55 29 Q70 22 80 36 Q99 36 100 50 '
      + 'Q116 54 112 62 Z',
  ];
  return `<svg viewBox="0 0 130 66" aria-hidden="true">
    <path d="${shapes[seed % shapes.length]}" fill="currentColor"/></svg>`;
}

function buildSky(){
  const sky = document.getElementById('sky');
  if (!sky) return;
  if (matchMedia('(prefers-reduced-motion: reduce)').matches){
    sky.innerHTML = '';
    return;
  }

  const mood = document.documentElement.getAttribute('data-wx') || 'light';
  // Sun stays visible on light-rain days too - that is what a Konkan monsoon
  // day actually looks like between spells, and it reads better than an
  // unbroken grey field.
  const spec = {
    sunny:  {drops:0,   clouds:2, sun:true,  flash:false},
    light:  {drops:30,  clouds:4, sun:true,  flash:false},
    wet:    {drops:65,  clouds:5, sun:false, flash:false},
    heavy:  {drops:115, clouds:7, sun:false, flash:false},
    severe: {drops:165, clouds:8, sun:false, flash:true},
  }[mood] || {drops:30, clouds:4, sun:false, flash:false};

  let html = '';
  if (spec.sun){
    // Disc plus a corona of tapered rays, drawn once and rotated slowly.
    let rays = '';
    for (let a = 0; a < 360; a += 30){
      rays += `<rect x="49.2" y="6" width="1.6" height="13" rx="0.8"
        fill="currentColor" opacity=".55"
        transform="rotate(${a} 50 50)"/>`;
    }
    html += `<div class="sunwrap"><div class="glow"></div>
      <svg viewBox="0 0 100 100" aria-hidden="true">
        ${rays}<circle cx="50" cy="50" r="19" fill="currentColor" opacity=".38"/>
      </svg></div>`;
  }

  for (let i = 0; i < spec.clouds; i++){
    const w = 200 + Math.random() * 280;
    const top = 3 + Math.random() * 54;
    const dur = 80 + Math.random() * 90;
    const op = (0.10 + Math.random() * 0.13).toFixed(2);
    html += `<div class="cloud" style="width:${w}px;top:${top}vh;
      opacity:${op};animation-duration:${dur}s;
      animation-delay:-${(Math.random() * dur).toFixed(1)}s">
      ${cloudSvg(i)}</div>`;
  }

  if (spec.drops){
    let drops = '';
    for (let i = 0; i < spec.drops; i++){
      const dur = 0.55 + Math.random() * 0.75;
      drops += `<i style="left:${Math.random() * 100}%;
        height:${9 + Math.random() * 18}px;
        animation-duration:${dur}s;
        animation-delay:-${(Math.random() * dur).toFixed(2)}s;
        opacity:${(0.18 + Math.random() * 0.32).toFixed(2)}"></i>`;
    }
    html += `<div class="rainlayer" style="opacity:1">${drops}</div>`;
  }

  html += '<div class="flash" id="flash"></div>';
  sky.innerHTML = html;

  if (spec.flash) scheduleFlash();
}

let flashTimer = null;
function scheduleFlash(){
  clearTimeout(flashTimer);
  const next = 7000 + Math.random() * 16000;
  flashTimer = setTimeout(() => {
    const f = document.getElementById('flash');
    if (f){
      f.classList.remove('on');
      void f.offsetWidth;              // restart the animation
      f.classList.add('on');
    }
    scheduleFlash();
  }, next);
}

function skodaGreet(){
  const log = document.getElementById('skLog');
  if (!log || log.childElementCount) return;
  if (SK_LOG){                        // back from the other tab
    log.innerHTML = SK_LOG;
    log.scrollTop = log.scrollHeight;
    return;
  }
  const days = (DAILY && DAILY.plainWeek) || (WEEKLY && WEEKLY.plainWeek) || [];
  const hour = new Date().getHours();
  const greet = hour < 12 ? "Morning" : hour < 17 ? "Afternoon" : "Evening";
  let opener = `${greet}! I'm Sam. Ask me anything about the weather here.`;
  if (days.length){
    const wet = days.filter(d => !/^(dry|mostly dry)/i.test(d.headline || '')).length;
    const R = (DAILY && DAILY.radarNow) || null;
    opener = `${greet}! I'm Sam. I've got the radar`
           + (R && R.at ? ` (last scan ${R.at})` : '')
           + ` and the next ${days.length} days in front of me`
           + (wet ? ` — ${wet} of them with rain in` : '')
           + ". Ask me whatever you like, in English, Hindi or Marathi.";
  }
  skPush(opener, 'a');
}

SamAI.start();
render();
</script>
