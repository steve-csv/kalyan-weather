<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rain forecast — Kalyan West</title>
<style>
/* Ethnocentric is a commercial Typodermic face. It is not on any font CDN
   this page is permitted to load from, and shipping a copy we have no licence
   for is not an option, so the display role uses ORBITRON - the closest
   freely-licensed match for Ethnocentric's wide, squared, technical letter -
   with Rajdhani carrying that squared feel down into labels and figures.
   Long explanatory prose deliberately stays on a neutral humanist stack: a
   squared display face at reading size turns the paragraphs this page exists
   to be read for into a wall of blocks. */
@import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@500;600;700;800;900&family=Rajdhani:wght@500;600;700&display=swap');

:root{
  color-scheme: light;

  --font-display:"Orbitron",ui-sans-serif,system-ui,"Segoe UI",sans-serif;
  --font-ui:"Rajdhani","Orbitron",ui-sans-serif,system-ui,sans-serif;
  --font-body:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,
              "Helvetica Neue",Arial,sans-serif;

  /* YELLOW, GREY, BLACK on a light ground.
     Yellow is a FILL and an EDGE, never body text. At the brightness that
     makes it read as yellow it cannot reach 4.5:1 against a light surface,
     so wherever yellow has to carry words the words are BLACK ON YELLOW, and
     wherever yellow-family text is genuinely needed the token is --amber-ink,
     which is measured rather than eyeballed (5.9:1 on --surface-1).
     Everything else is ink and grey, which is what keeps a page this
     saturated legible. */
  --yellow:#ffc400; --yellow-hi:#ffd84d; --yellow-deep:#e0a800;
  --amber-ink:#7a5600;
  --ease:cubic-bezier(.22,.61,.36,1);

  --surface-1:#fffef9; --plane:#eceade;
  --text-primary:#0d0d0c; --text-secondary:#3b3a36;
  --muted:#5c5a53;                        /* 7.0:1 on --surface-1 */
  --grid:#e2e0d6; --axis:#b2afa2; --border:rgba(13,13,12,0.13);
  --series-1:#e0a800;

  /* Ordinal ramp: pale straw to near-black, so magnitude always reads as
     MORE INK on the page. Every step is declared - a missing custom property
     resolves to nothing and the mark renders solid black, which is how two
     donut slices came out black on an early build. */
  --seq-100:#fdf2c4; --seq-250:#fbe291; --seq-350:#f8cd4e;
  --seq-400:#eab308; --seq-450:#c08f04; --seq-550:#8a6603; --seq-650:#4a3701;

  /* Semantics stay their own hues - a severity scale rendered in shades of
     the brand colour is a severity scale nobody can read at a glance. All
     four are measured at 4.5:1 or better on --surface-1. */
  --good:#2e7d32; --warning:#9a6a00; --serious:#b85009; --critical:#c0271f;
  --radius:12px;
}

@media (prefers-color-scheme: dark){
  :root:where(:not([data-theme="light"])){
    color-scheme: dark;
    --yellow:#ffd23d; --yellow-hi:#ffe480; --yellow-deep:#f0b400;
    --amber-ink:#ffd23d;
    --surface-1:#17170f; --plane:#0c0c08;
    --text-primary:#f4f2e6; --text-secondary:#c0bdac; --muted:#908d7e;
    --grid:#2a2a1e; --axis:#45422f; --border:rgba(244,242,230,0.14);
    --series-1:#ffc400;
    /* Ramp reversed for the dark ground: lighter as the value grows, so
       magnitude is still "more ink against the page". */
    --seq-100:#4a3701; --seq-250:#6b5002; --seq-350:#8a6603;
    --seq-400:#c08f04; --seq-450:#eab308; --seq-550:#f8cd4e; --seq-650:#fde68a;
    --good:#62c168; --warning:#e5b93a; --serious:#ef8a4a; --critical:#ef5f52;
  }
}
:root[data-theme="dark"]{
  color-scheme: dark;
  --yellow:#ffd23d; --yellow-hi:#ffe480; --yellow-deep:#f0b400;
  --amber-ink:#ffd23d;
  --surface-1:#17170f; --plane:#0c0c08;
  --text-primary:#f4f2e6; --text-secondary:#c0bdac; --muted:#908d7e;
  --grid:#2a2a1e; --axis:#45422f; --border:rgba(244,242,230,0.14);
  --series-1:#ffc400;
  --seq-100:#4a3701; --seq-250:#6b5002; --seq-350:#8a6603;
  --seq-400:#c08f04; --seq-450:#eab308; --seq-550:#f8cd4e; --seq-650:#fde68a;
  --good:#62c168; --warning:#e5b93a; --serious:#ef8a4a; --critical:#ef5f52;
}

/* Motion: one easing curve for the whole page, and a single global stop.
   Scattered durations and mismatched curves are most of what makes a page
   feel improvised rather than made. */
@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{
    animation-duration:.001ms !important; animation-iteration-count:1 !important;
    transition-duration:.001ms !important; scroll-behavior:auto !important;
  }
}

/* ---- weather mood -------------------------------------------------------
   The page takes its ground from the day being forecast: bright yellow when
   it is dry, draining through straw to grey and then charcoal as the rain
   gets heavier. That progression is the whole reason the palette is yellow
   and grey - they are the two ends of the weather, and the page moves along
   the axis between them instead of swapping unrelated hues.

   The tint is applied to the PAGE PLANE only, never to a card surface or a
   mark. Charts keep their validated palette against an unchanged surface, so
   tinting the page can never quietly break a contrast ratio. */
:root[data-wx="sunny"]  { --plane:#faf0cf; --g1:#fff8e0; --g2:#f3e2a6;
                          --mood:#c98a00; --sky:#ffc400; }
:root[data-wx="light"]  { --plane:#f2efe2; --g1:#faf7ec; --g2:#e6e1cc;
                          --mood:#a8801a; --sky:#ecc95f; }
:root[data-wx="wet"]    { --plane:#e7e6df; --g1:#f2f1ea; --g2:#d3d2c8;
                          --mood:#6d6a5d; --sky:#b9b6a6; }
:root[data-wx="heavy"]  { --plane:#d9d8d1; --g1:#e6e5df; --g2:#c1c0b8;
                          --mood:#46443d; --sky:#8f8d83; }
:root[data-wx="severe"] { --plane:#d7cfc8; --g1:#e3ddd6; --g2:#bdb3aa;
                          --mood:#a33b1e; --sky:#c2604a; }

@media (prefers-color-scheme: dark){
  :root:where(:not([data-theme="light"]))[data-wx="sunny"]  { --plane:#241c04; --g1:#33280a; --g2:#140f02; --mood:#ffc400; --sky:#e0a800; }
  :root:where(:not([data-theme="light"]))[data-wx="light"]  { --plane:#1f1c0c; --g1:#2c2812; --g2:#110f06; --mood:#ecc95f; --sky:#c9a63f; }
  :root:where(:not([data-theme="light"]))[data-wx="wet"]    { --plane:#16160f; --g1:#202016; --g2:#0b0b07; --mood:#b9b6a6; --sky:#8f8d83; }
  :root:where(:not([data-theme="light"]))[data-wx="heavy"]  { --plane:#121210; --g1:#1b1b18; --g2:#080808; --mood:#9c9a91; --sky:#6d6b63; }
  :root:where(:not([data-theme="light"]))[data-wx="severe"] { --plane:#210f08; --g1:#31170d; --g2:#120703; --mood:#ef7a54; --sky:#a33b1e; }
}
:root[data-theme="dark"][data-wx="sunny"]  { --plane:#241c04; --g1:#33280a; --g2:#140f02; --mood:#ffc400; --sky:#e0a800; }
:root[data-theme="dark"][data-wx="light"]  { --plane:#1f1c0c; --g1:#2c2812; --g2:#110f06; --mood:#ecc95f; --sky:#c9a63f; }
:root[data-theme="dark"][data-wx="wet"]    { --plane:#16160f; --g1:#202016; --g2:#0b0b07; --mood:#b9b6a6; --sky:#8f8d83; }
:root[data-theme="dark"][data-wx="heavy"]  { --plane:#121210; --g1:#1b1b18; --g2:#080808; --mood:#9c9a91; --sky:#6d6b63; }
:root[data-theme="dark"][data-wx="severe"] { --plane:#210f08; --g1:#31170d; --g2:#120703; --mood:#ef7a54; --sky:#a33b1e; }

*{box-sizing:border-box}
body{
  margin:0; color:var(--text-primary);
  font:15.5px/1.68 var(--font-body);
  -webkit-font-smoothing:antialiased; text-rendering:optimizeLegibility;
  padding:0 0 72px;
  /* Sky gradient: light at the horizon, deeper overhead. `fixed` keeps it
     still while the content scrolls, so it behaves like a sky rather than a
     long painted strip. --plane remains the flat fallback and is what the
     translucent header mixes against. */
  background:var(--plane);
  background-image:linear-gradient(180deg,var(--g2) 0%,var(--g1) 46%,var(--plane) 100%);
  background-attachment:fixed;
  transition:background-color .7s var(--ease);
}
.wrap{max-width:1080px;margin:0 auto;padding:0 16px}

/* Keyboard focus. Every interactive thing on this page was reachable by tab
   and invisible while focused, which makes it unusable without a mouse. One
   ring, in the accent, on the token system so it works on both grounds. */
:where(a,button,[tabindex]):focus-visible{
  outline:2px solid var(--series-1); outline-offset:2px; border-radius:8px;
}
.navbtn,.tabs button,.sk-chip{transition:color .18s var(--ease),
  background-color .18s var(--ease),border-color .18s var(--ease)}

/* ---- animated weather scene ------------------------------------------
   Drawn in CSS against the page, behind the content, so it costs no network
   request and cannot be blocked by a CSP. It sits at low opacity and never
   takes pointer events - the forecast has to stay readable over it.
   Everything here is disabled under prefers-reduced-motion: a full-screen
   field of falling streaks is a genuine vestibular problem for some readers,
   and the page must work without it. */
.sky{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}
.sky>*{position:absolute}

/* Sun: a disc with a slowly turning ray corona, not a blurred blob. */
.sunwrap{top:-60px;right:-30px;width:330px;height:330px;opacity:.95}
.sunwrap .glow{position:absolute;inset:-40%;border-radius:50%;
  background:radial-gradient(circle,var(--sky) 0%,transparent 58%);
  opacity:.55;animation:sunpulse 11s ease-in-out infinite}
.sunwrap svg{position:absolute;inset:0;width:100%;height:100%;
  color:var(--sky);animation:spin 140s linear infinite}
@keyframes sunpulse{0%,100%{transform:scale(1);opacity:.55}
                    50%{transform:scale(1.06);opacity:.75}}
@keyframes spin{to{transform:rotate(360deg)}}

/* Clouds: actual silhouettes, drawn as overlapping lobes in SVG. */
.cloud{animation:drift linear infinite;color:var(--sky)}
.cloud svg{display:block;width:100%;height:auto}
@keyframes drift{from{transform:translateX(-38vw)}to{transform:translateX(138vw)}}

.rainlayer{inset:0;opacity:0}
.rainlayer i{position:absolute;top:-14%;width:1.4px;border-radius:1px;
  background:linear-gradient(to bottom,transparent,var(--sky));
  animation:fall linear infinite}
@keyframes fall{to{transform:translateY(118vh)}}

.flash{inset:0;background:#fff;opacity:0}
.flash.on{animation:zap 1.5s ease-out}
@keyframes zap{0%{opacity:0}4%{opacity:.30}9%{opacity:0}
               14%{opacity:.18}20%{opacity:0}100%{opacity:0}}

@media (prefers-reduced-motion: reduce){
  .sun,.cloud,.rainlayer i,.flash{animation:none!important}
  .rainlayer{display:none}
}

/* ---- app shell -------------------------------------------------------- */
header{
  position:sticky;top:0;z-index:20;
  background:color-mix(in srgb,var(--plane) 88%,transparent);
  backdrop-filter:saturate(1.4) blur(12px);
  -webkit-backdrop-filter:saturate(1.4) blur(12px);
  border-bottom:2px solid var(--mood);
  padding:14px 16px;margin:0 0 18px;
  display:flex;justify-content:space-between;align-items:center;gap:14px;
  flex-wrap:wrap;
}
.hero .fig{color:var(--mood)}

/* Cards float above the coloured sky. A slightly translucent surface lets a
   hint of the weather colour through while keeping text on a near-neutral
   background, so contrast never depends on the mood. */
.card,.skoda,.rbar{position:relative;z-index:1}
.card,.skoda{
  box-shadow:0 1px 2px rgba(0,0,0,.06),0 14px 34px -22px rgba(0,0,0,.5);
}
.skoda{background:color-mix(in srgb, var(--surface-1) 97%, var(--mood))}
.card>h2:first-child{
  display:flex;align-items:center;gap:9px;
}
.card>h2:first-child::before{
  content:'';width:3px;height:16px;border-radius:2px;background:var(--mood);
  flex:none;
}
.wrap{max-width:1080px;margin:0 auto}
/* One type scale, used everywhere: 11.5 / 12.5 / 13.5 / 15 / 17 / 22 / 27.
   Display sizes get negative tracking because system grotesques set loose at
   large sizes; small labels get positive tracking for the opposite reason. */
/* Orbitron is a WIDE face. Every size here is a step or two below what the
   same level would take in a normal grotesque, and the tracking is positive
   rather than negative, because a squared display letter needs air between
   the forms instead of the tightening a humanist face wants. Uppercase on
   headings only - Orbitron's lowercase is where it looks most like a sci-fi
   prop and least like an instrument. */
h1{font-family:var(--font-display);font-size:20px;margin:0 0 5px;
   font-weight:800;letter-spacing:.028em;line-height:1.24;text-wrap:balance;
   text-transform:uppercase}
h2{font-family:var(--font-display);font-size:13.5px;margin:0 0 15px;
   font-weight:700;letter-spacing:.075em;line-height:1.38;text-wrap:balance;
   text-transform:uppercase}
h3{font-family:var(--font-ui);font-size:13px;margin:0 0 9px;font-weight:700;
   letter-spacing:.055em;text-transform:uppercase}

/* Figures, labels and anything that sits in a column get the squared UI face
   so the technical register carries past the headings, while paragraphs stay
   on the body stack. */
.tile .val,.dval,.tstat b,.sval,.uval,.hero .fig,.av,.rgw,.rgp,
.tile .lab,.dname,.tkey,.rname span,.slab,.ulab,.tlab,.hlab,.bstat,
th,.pill,.tag,.navbtn,.tabs button,.rbtn,.sk-chip{
  font-family:var(--font-ui);
}
.tile .lab,.dname,.tkey,.rname span,.bstat,th{
  text-transform:uppercase;letter-spacing:.07em;font-weight:700;
}
p{text-wrap:pretty}
.sub{color:var(--text-secondary);font-size:13px;margin:0;line-height:1.55}

/* Figures line up in columns all over this page - totals, rain rates, scores.
   Proportional digits make those columns ragged, so every numeric surface
   gets tabular figures. */
.tile .val,.dval,.tstat b,.sval,.uval,.tlab,.hero .fig,td,th,
.belt .bsent,.rcard li,.tick{font-variant-numeric:tabular-nums}

/* Small caps-style labels need air between letters to stay legible. */
.dname,.tkey,.rname span{font-feature-settings:"cv05" 1}
.muted{color:var(--muted)}
.card{
  /* Mixed with a trace of the weather colour so cards sit in the scene rather
     than on top of it. The proportion is small on purpose: text and charts
     must keep a near-neutral background whatever the mood. */
  background:color-mix(in srgb, var(--surface-1) 97%, var(--mood));
  border:1px solid var(--border);
  border-radius:var(--radius); padding:20px; margin-bottom:16px;
}
.grid{display:grid;gap:16px}
@media(min-width:820px){ .g2{grid-template-columns:1fr 1fr} .g3{grid-template-columns:repeat(3,1fr)} }

/* header */
header{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;margin-bottom:18px;flex-wrap:wrap}
.navbtn{
  background:var(--surface-1);color:var(--text-secondary);border:1px solid var(--border);
  border-radius:999px;padding:7px 14px;cursor:pointer;font:inherit;font-size:13px;
  text-decoration:none;display:inline-block;
}
.navbtn:hover{color:var(--text-primary)}
.nav{display:flex;gap:8px}
.tabs{display:inline-flex;gap:4px;background:var(--surface-1);border:1px solid var(--border);
  border-radius:999px;padding:4px}
.tabs button{
  background:transparent;color:var(--text-secondary);border:0;border-radius:999px;
  padding:7px 16px;cursor:pointer;font:inherit;font-size:13px;font-weight:550;
}
.tabs button[aria-selected="true"]{background:var(--series-1);color:#fff}
.tabs button:hover:not([aria-selected="true"]){color:var(--text-primary)}

/* hero */
.hero{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap}
.hero .fig{font-family:var(--font-display);font-size:46px;font-weight:900;line-height:1;letter-spacing:.01em}
.hero .cap{color:var(--text-secondary);font-size:14px;max-width:34ch}
.headline{margin:14px 0 0;font-size:17px;font-weight:600;line-height:1.45}

/* status pill: color NEVER alone - always icon + text */
.pill{
  display:inline-flex;align-items:center;gap:7px;border-radius:999px;
  padding:5px 13px;font-size:13px;font-weight:600;
  border:1px solid var(--border);background:var(--plane);color:var(--text-primary);
}
.pill .dot{width:9px;height:9px;border-radius:50%;flex:none}
.s-none .dot{background:var(--muted)} .s-good .dot{background:var(--good)}
.s-warning .dot{background:var(--warning)} .s-serious .dot{background:var(--serious)}
.s-critical .dot{background:var(--critical)}

/* stat tiles */
.tiles{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
.tile{background:var(--plane);border:1px solid var(--border);border-radius:11px;padding:13px 15px}
.tile .lab{font-size:12px;color:var(--muted);margin-bottom:5px}
.tile .val{font-size:24px;font-weight:640;line-height:1.15;letter-spacing:-0.01em}
.tile .note{font-size:12px;color:var(--text-secondary);margin-top:3px}

/* meter (confidence) */
.meter{display:flex;gap:3px;margin-top:7px}
.meter i{height:6px;flex:1;border-radius:2px;background:var(--grid)}
.meter i.on{background:var(--series-1)}

svg{display:block;width:100%;height:auto;overflow:visible}
.tick{font-size:11px;fill:var(--muted);font-variant-numeric:tabular-nums}
.vlab{font-size:11px;fill:var(--text-secondary);font-weight:600}
.gl{stroke:var(--grid);stroke-width:1}
.base{stroke:var(--axis);stroke-width:1}

table{width:100%;border-collapse:collapse;font-size:13.5px}
th{text-align:left;font-weight:600;color:var(--muted);font-size:12px;padding:7px 9px;border-bottom:1px solid var(--border)}
td{padding:8px 9px;border-bottom:1px solid var(--border);vertical-align:top}
tr:last-child td{border-bottom:none}
td.num{text-align:right;font-variant-numeric:tabular-nums}
.scroll{overflow-x:auto}

a{color:var(--series-1)}
.lk{display:block;padding:11px 0;border-bottom:1px solid var(--border);text-decoration:none;color:inherit}
.lk:last-child{border-bottom:none}
.lk b{color:var(--series-1);font-weight:600;font-size:14px}
.lk span{display:block;color:var(--text-secondary);font-size:12.5px;margin-top:3px;line-height:1.5}
.lk:hover b{text-decoration:underline}

.quote{
  border-left:2px solid var(--axis); padding:2px 0 2px 14px; margin:14px 0 0;
  color:var(--text-secondary); font-size:13px; line-height:1.6;
}
.warn{
  border-left:2px solid var(--warning); padding:10px 0 10px 14px; margin:14px 0 0;
  color:var(--text-secondary); font-size:13px; line-height:1.6;
}
footer{color:var(--muted);font-size:12px;line-height:1.65;margin-top:26px;text-align:center}

/* windy embed */
.windybox{background:var(--plane);border:1px solid var(--border);border-radius:11px;
  padding:18px;text-align:center}
.wmsg{font-size:13px;color:var(--text-secondary);margin-top:10px;line-height:1.6}
#windy{width:100%;height:420px;border-radius:10px;overflow:hidden;margin-top:12px}
@media(max-width:640px){#windy{height:320px}}

/* climate driver tiles */
.dgrid{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
.dtile{text-align:left;background:var(--plane);border:1px solid var(--border);
  border-left:3px solid var(--muted);border-radius:11px;padding:12px 13px;
  cursor:pointer;font:inherit;color:var(--text-primary);min-height:44px}
.dtile:hover{border-color:var(--series-1)}
.dtile.sel{outline:2px solid var(--series-1);outline-offset:-2px}
.dtile.d-good{border-left-color:var(--good)}
.dtile.d-bad{border-left-color:var(--critical)}
.dtile.d-neu{border-left-color:var(--muted)}
.dname{font-size:11px;letter-spacing:.06em;color:var(--muted);font-weight:700}
.dval{font-size:19px;font-weight:650;margin:3px 0 1px;letter-spacing:-.01em}
.dsub{font-size:11.5px;color:var(--text-secondary);line-height:1.4}
.dspark{width:100%;height:22px;margin-top:7px;color:var(--series-1)}
.dtext{margin-top:12px;padding:12px 14px;background:var(--plane);
  border:1px solid var(--border);border-radius:10px;
  font-size:13.5px;line-height:1.65;color:var(--text-secondary);min-height:46px}

/* per-region arrival times */
.arrs{display:grid;gap:8px}
@media(min-width:620px){ .arrs{grid-template-columns:1fr 1fr} }
.arr{background:var(--plane);border:1px solid var(--border);border-left:3px solid var(--muted);
  border-radius:9px;padding:9px 11px;display:flex;flex-wrap:wrap;align-items:baseline;gap:8px}
.arr.a-now{border-left-color:var(--critical)}
.arr.a-soon{border-left-color:var(--warning)}
.arr.a-mid{border-left-color:var(--series-1)}
.arr.a-later{border-left-color:var(--series-1);opacity:.85}
.arr.a-clear{border-left-color:var(--good);opacity:.75}
.an{font-size:12px;font-weight:700;flex:1 1 100%}
.av{font-size:13.5px;font-weight:650;font-variant-numeric:tabular-nums}
.aw{font-size:11px;color:var(--muted);font-weight:500;margin-left:4px}
.ad{font-size:11.5px;color:var(--text-secondary);font-variant-numeric:tabular-nums}
.amods{display:block;font-size:11.5px;color:var(--muted);margin-top:3px;
  font-variant-numeric:tabular-nums}

/* scan-vs-belts disagreement */
.beltsnote{margin:12px 0 0;padding:12px 14px;border-radius:11px;
  border:1px solid var(--critical);
  background:color-mix(in srgb,var(--critical) 10%,var(--surface-1));
  font-size:13px;line-height:1.62}

/* convective burst warning */
.burst{margin:14px 0 4px;padding:12px 14px;border-radius:11px;
  border:1px solid var(--warning);
  background:color-mix(in srgb,var(--warning) 12%,var(--surface-1));
  font-size:13px;line-height:1.62}
.burst.b-likely{border-left:3px solid var(--warning)}
.burst.b-possible{opacity:.92}

/* next-three-hours strip inside a belt card */
.hstrip{display:flex;align-items:center;gap:5px;margin-top:9px;flex-wrap:wrap}
.hcell{min-width:44px;text-align:center;border-radius:7px;padding:5px 6px;
  border:1px solid var(--border);background:var(--surface-1)}
.hval{font-size:13px;font-weight:650;font-variant-numeric:tabular-nums;
  line-height:1.15}
.hlab{font-size:9.5px;color:var(--muted);letter-spacing:.03em;margin-top:1px}
.harrow{color:var(--muted);font-size:12px}
.hunit{font-size:10px;color:var(--muted);margin-left:2px}
/* Rain-rate tint, on the same thresholds the sentences use. */
.hcell.hz{opacity:.6}
.hcell.h0{border-color:color-mix(in srgb,var(--series-1) 35%,var(--border))}
.hcell.h1{background:color-mix(in srgb,var(--series-1) 12%,var(--surface-1));
  border-color:color-mix(in srgb,var(--series-1) 45%,var(--border))}
.hcell.h2{background:color-mix(in srgb,var(--series-1) 24%,var(--surface-1));
  border-color:var(--series-1)}
.hcell.h3{background:color-mix(in srgb,var(--warning) 26%,var(--surface-1));
  border-color:var(--warning)}
.hcell.h4{background:color-mix(in srgb,var(--critical) 28%,var(--surface-1));
  border-color:var(--critical)}

/* radar picture */
.radimg{margin:10px 0 14px}
.radimg img{display:block;width:100%;max-width:640px;height:auto;
  border-radius:12px;border:1px solid var(--border)}
.radimg figcaption{font-size:12.5px;color:var(--text-secondary);margin-top:6px}
.dbzbar{height:10px;max-width:640px;border-radius:5px;margin-top:8px;
  border:1px solid var(--border)}
.dbzticks{display:flex;justify-content:space-between;max-width:640px;
  font-size:11px;line-height:1.25;color:var(--text-secondary);margin-top:3px}

/* rain-source card */
.srcline{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.srctag{display:inline-block;font-size:11.5px;font-weight:700;
  letter-spacing:.05em;text-transform:uppercase;padding:4px 10px;
  border-radius:999px;background:var(--plane);border:1px solid var(--border)}
.src-sw_monsoon{background:var(--yellow);color:#0d0d0c;border-color:transparent}
.src-easterly{background:var(--serious);color:#fff;border-color:transparent}
.src-system{background:var(--critical);color:#fff;border-color:transparent}
.src-thunderstorm{background:var(--warning);color:#0d0d0c;border-color:transparent}
.src-northerly{background:var(--good);color:#fff;border-color:transparent}
.src-thunder{background:var(--critical);color:#fff;border-color:transparent}
.srcwind{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}

/* Sub-points under an alert or a system row: the possibilities for ONE
   event. Indented and rule-marked so they read as belonging to the entry
   above rather than as further entries. */
.apts{margin:9px 0 0;padding:0 0 0 15px;list-style:none;
  border-left:2px solid var(--yellow);}
.apts li{position:relative;font-size:12.5px;line-height:1.6;
  color:var(--text-secondary);margin-bottom:6px}
.apts li:last-child{margin-bottom:0}
.apts li::before{content:'';position:absolute;left:-19px;top:.62em;
  width:6px;height:2px;background:var(--yellow-deep)}
.apts b{color:var(--text-primary);font-weight:700}

/* regional outlook - who gets this system, and when */
.regs{display:grid;gap:9px;grid-template-columns:repeat(auto-fit,minmax(190px,1fr))}
.reg{background:var(--plane);border:1px solid var(--border);
  border-left:3px solid var(--series-1);border-radius:10px;padding:10px 12px}
/* The left edge carries model agreement, because a 13-69 mm bracket and a
   25-40 mm one are not the same forecast and should not look the same. */
.reg-close{border-left-color:var(--good)}
.reg-loose{border-left-color:var(--warning)}
.reg-wide{border-left-color:var(--critical)}
.reg-dry{border-left-color:var(--muted);opacity:.7}
.rgn{font-size:12px;font-weight:700;letter-spacing:.02em;margin-bottom:3px}
.rgw{font-size:13.5px;line-height:1.4;font-variant-numeric:tabular-nums}
.rgp{font-size:12.5px;color:var(--text-secondary);margin-top:2px;
  font-variant-numeric:tabular-nums}
.rgm{font-size:11px;color:var(--muted);margin-top:4px;
  font-variant-numeric:tabular-nums}

/* basin outlook */
.bas{display:grid;gap:12px}
@media(min-width:820px){ .bas{grid-template-columns:1fr 1fr} }
.basin{background:var(--plane);border:1px solid var(--border);
  border-left:3px solid var(--muted);border-radius:11px;padding:13px 14px}
.basin.s-active{border-left-color:var(--critical)}
.basin.s-developing{border-left-color:var(--warning)}
.basin.s-watch{border-left-color:var(--series-1)}
.basin.s-quiet{border-left-color:var(--good)}
.bhead{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.bpin{display:inline-flex;align-items:center;justify-content:center;
  width:20px;height:20px;border-radius:50%;background:var(--series-1);
  color:#fff;font-size:11px;font-weight:700}
.bname2{font-weight:700;font-size:13.5px;letter-spacing:-.01em}
.bstat{margin-left:auto;font-size:11px;text-transform:uppercase;
  letter-spacing:.06em;color:var(--muted);font-weight:700}
.bline{font-size:13.5px;line-height:1.5;margin-bottom:6px}
.bdet{font-size:12.5px;line-height:1.62;color:var(--text-secondary)}
.bfacts{display:flex;gap:14px;flex-wrap:wrap;margin-top:9px;font-size:12px;
  color:var(--text-secondary);font-variant-numeric:tabular-nums}
.bfacts b{color:var(--muted);font-weight:600}
.blinks{margin-top:9px}

/* track record */
.tkey{display:flex;gap:15px;font-size:11.5px;color:var(--muted);margin-bottom:8px}
.tkey i{display:inline-block;width:10px;height:10px;border-radius:3px;
  margin-right:5px;vertical-align:-1px}
.tkey .k-f{background:var(--series-1)}
.tkey .k-o{background:var(--good)}
.tkey .k-p{background:var(--muted);opacity:.5}
.tstrip{display:flex;gap:5px;align-items:flex-end;margin:4px 0 10px;
  overflow-x:auto;padding-bottom:4px}
.tday{flex:1 0 26px;text-align:center;min-width:26px}
.tbars{height:58px;display:flex;align-items:flex-end;justify-content:center;gap:2px}
.tb{width:8px;border-radius:3px 3px 0 0}
.tb.tf{background:var(--series-1)}
.tb.to{background:var(--good)}
.tb.to.tp{background:var(--muted);opacity:.45}
.tday.bad .tb.to{background:var(--critical)}
.tlab{font-size:10px;color:var(--muted);margin-top:5px}
.tstats{display:flex;gap:10px;flex-wrap:wrap;margin:2px 0 12px}
.tstat{background:var(--plane);border:1px solid var(--border);border-radius:9px;
  padding:8px 11px;flex:1 1 100px}
.tstat b{display:block;font-size:17px;font-weight:650;letter-spacing:-.01em}
.tstat span{font-size:11px;color:var(--muted)}

/* radar explainer + belts + animation */
.rexp{margin-top:16px;border-top:1px solid var(--border);padding-top:16px}
.rexp h3{font-size:14px;margin:0 0 10px;letter-spacing:-.01em}
.rexp h3~h3{margin-top:22px}
.rgrid{display:grid;gap:12px}
@media(min-width:700px){ .rgrid{grid-template-columns:1fr 1fr} }
.rcard{background:var(--plane);border:1px solid var(--border);border-radius:11px;
  padding:13px 14px}
.rname{font-weight:700;font-size:13.5px;margin-bottom:7px}
.rname span{font-weight:500;color:var(--muted);font-size:11.5px;
  letter-spacing:.04em;text-transform:uppercase;margin-left:5px}
.rcard p{margin:0 0 8px;font-size:13px;line-height:1.6;color:var(--text-secondary)}
.rcard ul{margin:0 0 8px;padding-left:17px;font-size:12.5px;line-height:1.75;
  color:var(--text-secondary)}
.rwarn{font-size:12.5px;line-height:1.6;color:var(--text-secondary);
  border-left:2px solid var(--muted);padding-left:9px;margin:0}
.rhow{margin:12px 0 0;font-size:13px;line-height:1.65;color:var(--text-secondary)}
.rhead{font-size:13.5px;line-height:1.6;margin:0 0 11px}
.belts{display:grid;gap:8px}
@media(min-width:620px){ .belts{grid-template-columns:1fr 1fr} }
.belt{background:var(--plane);border:1px solid var(--border);
  border-left:3px solid var(--muted);border-radius:9px;padding:9px 11px}
.belt.b-raining{border-left-color:var(--critical)}
.belt.b-arriving{border-left-color:var(--warning)}
.belt.b-drizzling{border-left-color:var(--series-1)}
.belt.b-later{border-left-color:var(--series-1);opacity:.9}
.belt.b-dry{border-left-color:var(--good);opacity:.75}
.bname{font-size:12px;font-weight:700;letter-spacing:.01em;margin-bottom:2px}
.bsent{font-size:12.5px;line-height:1.55;color:var(--text-secondary)}
.ranim{margin:10px 0 0}
.ranim svg{width:100%;height:auto;max-width:100%;color:var(--text-primary)}
.ranim figcaption{font-size:12px;color:var(--text-secondary);margin-top:7px;
  line-height:1.55}
/* Label size is in SVG user units, so its on-screen size depends on how far
   the drawing has been scaled. At 720 units wide rendered into a 300px phone
   column, an 11-unit label lands at ~4.6 real pixels - invisible. These two
   sizes both land near 11 real px at their respective render widths. */
.ral{font-size:13px;fill:currentColor;opacity:.7}
@media(max-width:700px){ .ral{font-size:26px} }
.rbelt{opacity:.55}
.rbelt.lit{opacity:1}
.rbelt.lit text{font-weight:700}
.rcell ellipse{fill:var(--series-1);opacity:.55}
.rcell{animation-name:rdrift;animation-timing-function:linear;
  animation-iteration-count:infinite;
  /* Without these, transform-origin on an SVG group defaults to the canvas
     origin (0 0), so scaleY grows the cell downward from the top of the
     drawing and the blobs sink straight through the ground line at their
     tallest. fill-box scales each cell about its own centre instead. */
  transform-box:fill-box;transform-origin:50% 50%}
.rcell.rc2{animation-delay:-2.4s}
.rcell.rc2 ellipse{fill:var(--critical);opacity:.42}
.rcell.rc3{animation-delay:-4.9s}
@keyframes rdrift{
  0%   {transform:translateX(20px) scaleY(.75); opacity:0}
  12%  {opacity:.95}
  62%  {transform:translateX(430px) scaleY(1.05); opacity:.95}
  86%  {transform:translateX(560px) scaleY(1.7); opacity:.8}
  100% {transform:translateX(650px) scaleY(.5); opacity:0}
}
@media (prefers-reduced-motion: reduce){
  .rcell{animation:none;transform:translateX(300px)}
}

/* upstream driver strip */
.ustrip{display:flex;gap:6px;align-items:flex-end;margin:14px 0 2px}
.uday{flex:1;text-align:center;min-width:0}
.ubar{width:100%;max-width:30px;margin:0 auto;border-radius:5px 5px 0 0;
  background:var(--series-1)}
.ubar.u-good{background:var(--good)}
.ubar.u-bad{background:var(--critical)}
.ubar.u-neu{background:var(--muted)}
.uval{font-size:11.5px;font-weight:600;margin-top:4px;font-variant-numeric:tabular-nums}
.ulab{font-size:10.5px;color:var(--muted);white-space:nowrap;overflow:hidden;
  text-overflow:ellipsis}

/* week summary */
.summary .sbig{font-size:17px;font-weight:620;margin:0 0 6px;line-height:1.45}
.sstrip{display:flex;gap:6px;align-items:flex-end;margin:16px 0 8px}
.sday{flex:1;text-align:center;min-width:0}
.sbarwrap{height:78px;display:flex;align-items:flex-end;justify-content:center}
.sbar{width:100%;max-width:34px;border-radius:5px 5px 0 0;background:var(--series-1)}
.sday.obs .sbar{background:var(--muted)}
.sval{font-size:12px;font-weight:600;margin-top:5px;font-variant-numeric:tabular-nums}
.slab{font-size:10.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.skey{display:flex;gap:16px;font-size:11.5px;color:var(--muted);margin-bottom:6px}
.skey i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.skey .kobs{background:var(--muted)} .skey .kfc{background:var(--series-1)}
.sdet{border-top:1px solid var(--border);padding-top:10px;margin-top:12px}
.sdet>summary{cursor:pointer;font-weight:620;font-size:14px;padding:4px 0;list-style:none}
.sdet>summary::-webkit-details-marker{display:none}
.sdet>summary::before{content:'▸ ';color:var(--muted)}
.sdet[open]>summary::before{content:'▾ '}
.sdet p{color:var(--text-secondary);font-size:13.5px;line-height:1.65;margin:8px 0}

/* Sam - the forecast assistant */
.skoda{background:var(--surface-1);border:1px solid var(--border);
  border-radius:var(--radius);padding:20px;margin-bottom:16px}
.sk-head{display:flex;align-items:center;gap:11px;margin-bottom:4px}
.sk-av{width:38px;height:38px;border-radius:50%;background:var(--series-1);
  color:#fff;display:grid;place-items:center;font-size:19px;flex:none}
.sk-name{font-weight:650;font-size:15px}
.sk-role{font-size:12px;color:var(--muted)}
.sk-log{max-height:340px;overflow-y:auto;margin:14px 0 12px;
  display:flex;flex-direction:column;gap:10px;scroll-behavior:smooth}
.sk-msg{max-width:88%;padding:10px 13px;border-radius:13px;font-size:13.5px;
  line-height:1.6;white-space:pre-wrap;overflow-wrap:anywhere}
.sk-q{align-self:flex-end;background:var(--series-1);color:#fff;
  border-bottom-right-radius:4px}
.sk-a{align-self:flex-start;background:var(--plane);
  border:1px solid var(--border);border-bottom-left-radius:4px}
.sk-a b{font-weight:640}
.sk-form{display:flex;gap:8px}
.sk-in{flex:1;background:var(--plane);color:var(--text-primary);
  border:1px solid var(--border);border-radius:999px;padding:12px 16px;
  font:inherit;font-size:14px;min-height:44px}
.sk-in:focus{outline:2px solid var(--series-1);outline-offset:-1px}
.sk-send{background:var(--series-1);color:#fff;border:0;border-radius:999px;
  padding:0 20px;font:inherit;font-size:14px;font-weight:600;cursor:pointer;
  min-height:44px}
.sk-chips{display:flex;gap:7px;flex-wrap:wrap;margin-top:11px}
.sk-chip{background:var(--plane);border:1px solid var(--border);
  color:var(--text-secondary);border-radius:999px;padding:7px 13px;
  font:inherit;font-size:12.5px;cursor:pointer}
.sk-chip:hover{color:var(--text-primary);border-color:var(--series-1)}

/* refresh bar - only rendered when served over http, never in the file build */
.rbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;
  background:var(--surface-1);border:1px solid var(--border);
  border-radius:var(--radius);padding:12px 16px;margin-bottom:16px}
.rbtn,a.rbtn{text-decoration:none;display:inline-flex;align-items:center;justify-content:center;background:var(--series-1);color:#fff;border:0;border-radius:999px;
  padding:10px 20px;font:inherit;font-size:14px;font-weight:600;cursor:pointer;
  min-height:44px}
.rbtn:disabled{opacity:.5;cursor:default}
.rbtn:active{transform:scale(.98)}
.rmsg{font-size:13px;color:var(--text-secondary);flex:1;min-width:180px}

/* alerts */
:root{ --alert-edge:rgba(11,11,11,0.18) }
:root[data-theme="dark"]{ --alert-edge:rgba(255,255,255,0.18) }
@media (prefers-color-scheme: dark){ :root:where(:not([data-theme="light"])){ --alert-edge:rgba(255,255,255,0.18) } }
.alert{display:flex;gap:12px;padding:13px 0;border-bottom:1px solid var(--border)}
.alert:last-child{border-bottom:none}
.ai{font-size:20px;line-height:1.2;flex:none}
.at{font-weight:620;font-size:14.5px;margin-bottom:4px}
.ab{color:var(--text-secondary);font-size:13.5px;line-height:1.6}
.tag{display:inline-block;font-size:10.5px;font-weight:700;letter-spacing:.05em;
  padding:2px 7px;border-radius:5px;vertical-align:2px;margin-right:6px;
  background:var(--plane);border:1px solid var(--border);color:var(--text-secondary)}
.a-critical .tag,.t-critical{background:var(--critical);color:#fff;border-color:transparent}
.a-warning  .tag,.t-warning {background:var(--serious); color:#111;border-color:transparent}
.a-watch    .tag,.t-watch   {background:var(--warning); color:#111;border-color:transparent}
.t-high{background:var(--critical);color:#fff;border-color:transparent}
.t-moderate{background:var(--warning);color:#111;border-color:transparent}

/* plain day */
.pday{display:flex;gap:13px;padding:13px 0;border-bottom:1px solid var(--border)}
.pday:last-child{border-bottom:none}
.pic{font-size:22px;flex:none;line-height:1.1}
.pd{font-size:12px;color:var(--muted);margin-bottom:2px}
.ph{font-weight:620;font-size:15px;margin-bottom:3px}
.pt{color:var(--text-secondary);font-size:13.5px;line-height:1.6}
.pa{font-size:13px;color:var(--text-primary);margin-top:4px;font-style:italic}
.pc{font-size:12px;color:var(--muted);margin-top:4px}

/* radar */
.radarbar{display:flex;align-items:center;gap:10px;margin-top:16px;
  font-size:12.5px;color:var(--text-secondary);flex-wrap:wrap}
.rdot{width:8px;height:8px;border-radius:50%;background:var(--muted);flex:none}
.rdot.live{background:var(--good);animation:rpulse 2.4s ease-in-out infinite}
.rdot.dead{background:var(--critical);animation:none}
@keyframes rpulse{0%,100%{opacity:1}50%{opacity:.35}}
.radar-fallback{background:var(--plane);border:1px solid var(--border);
  border-radius:10px;padding:16px;font-size:13px;color:var(--text-secondary);
  line-height:1.6}
.radar{display:grid;gap:14px;margin-top:14px}
@media(min-width:700px){ .radar{grid-template-columns:1fr 1fr} }
.radar figure{margin:0}
.radar img{width:100%;border-radius:10px;border:1px solid var(--border);background:#000}
.radar figcaption{font-size:12px;color:var(--text-secondary);margin-top:6px;line-height:1.5}
.qs{margin:0 0 4px;padding-left:20px;color:var(--text-secondary);font-size:13.5px;line-height:1.8}
.qs.qa{line-height:1.5}
.qs.qa>li{margin-bottom:12px;color:var(--text-primary)}
.qaa{color:var(--text-secondary);font-size:13.5px;line-height:1.65;margin-top:3px}
.sysrow{padding:12px 0;border-bottom:1px solid var(--border)}
.sysrow:last-child{border-bottom:none}

#tip{
  position:fixed;pointer-events:none;opacity:0;transition:opacity .1s;
  background:var(--text-primary);color:var(--surface-1);border-radius:8px;
  padding:7px 10px;font-size:12.5px;line-height:1.45;z-index:50;white-space:nowrap;
  box-shadow:0 4px 14px rgba(0,0,0,.18);
}
.hit{fill:transparent;cursor:pointer}
/* ---- finish -----------------------------------------------------------
   Placed last on purpose: everything here is meant to win on source order
   over the component rules above it.

   The page had the right structure and not enough resolution - flat card
   edges, no entrance, and one accent doing every job at once. */

/* A hairline of the brand colour across the top of every card. One
   pseudo-element, and it is most of what separates a panel from a box.
   It carries its own radius rather than relying on overflow:hidden, because
   clipping the card would cut the SVG labels that legitimately sit outside
   their viewBox. */
.card::before,.skoda::before{
  content:'';position:absolute;inset:0 0 auto 0;height:2px;
  border-radius:var(--radius) var(--radius) 0 0;
  background:linear-gradient(90deg,var(--yellow) 0%,var(--yellow-deep) 22%,
             var(--mood) 44%,transparent 80%);
}

/* Entrance. Cards are injected by script, so this fires as each is inserted
   and the page assembles itself rather than appearing all at once. The
   stagger stops after five steps: a long stagger on a long page just makes
   the reader wait for content they can already see the top of. */
@keyframes cardin{
  from{opacity:0;transform:translateY(10px)}
  to{opacity:1;transform:none}
}
.card,.skoda,.rbar{animation:cardin .5s var(--ease) both}
#app>*:nth-child(2){animation-delay:.05s}
#app>*:nth-child(3){animation-delay:.10s}
#app>*:nth-child(4){animation-delay:.15s}
#app>*:nth-child(5){animation-delay:.20s}
#app>*:nth-child(n+6){animation-delay:.25s}

/* Hover lift. Pointer-only, so it never sticks as a stuck state on touch. */
@media (hover:hover){
  .card{transition:transform .22s var(--ease),box-shadow .22s var(--ease),
        border-color .22s var(--ease)}
  .card:hover{transform:translateY(-2px);border-color:var(--yellow-deep);
    box-shadow:0 2px 4px rgba(0,0,0,.07),0 22px 44px -26px rgba(0,0,0,.55)}
}

/* The heading marker becomes a yellow-to-mood gradient, so the accent still
   tracks the forecast while the brand colour stays constant at the top. */
.card>h2:first-child::before{
  width:4px;height:15px;border-radius:1px;
  background:linear-gradient(180deg,var(--yellow) 0%,var(--mood) 100%);
}

/* Header: a highlight that travels the bottom rule once, then waits. Long
   pause on purpose - a continuous sweep is a marquee, an occasional one
   reads as a live instrument. */
header{position:relative;border-bottom:2px solid var(--border)}
header::after{
  content:'';position:absolute;left:0;right:0;bottom:-2px;height:2px;
  background:linear-gradient(90deg,transparent 0%,var(--yellow) 16%,
             var(--yellow-hi) 27%,transparent 46%);
  background-size:240% 100%;
  animation:sweep 9s var(--ease) infinite;
}
@keyframes sweep{
  0%{background-position:-70% 0}
  36%{background-position:170% 0}
  100%{background-position:170% 0}
}

/* Most of the page's extra colour now lives on edges rather than in fills,
   which is how a saturated accent stays usable behind this much text. */
.tile{border-left:3px solid var(--yellow)}
.tstat{border-left:3px solid var(--series-1)}
.dtile.d-neu{border-left-color:var(--yellow-deep)}

/* Links. Ink text with a yellow underline is the accessible way to use a
   colour that cannot carry text weight on a light ground - the old
   a{color:var(--series-1)} put #e0a800 text on near-white at 2.1:1. */
a{color:var(--text-primary);text-decoration-color:var(--yellow-deep);
  text-decoration-thickness:2px;text-underline-offset:3px;
  transition:text-decoration-color .18s var(--ease)}
a:hover{text-decoration-color:var(--yellow)}
.lk b{color:var(--amber-ink)}
.tabs button[aria-selected="true"]{background:var(--yellow);color:#0d0d0c;
  font-weight:700}
.rbtn,a.rbtn{background:var(--yellow);color:#0d0d0c;font-weight:700;
  letter-spacing:.04em}
.sk-av,.bpin{background:var(--yellow);color:#0d0d0c}
.sk-q{background:var(--yellow);color:#0d0d0c}
.sk-send{background:var(--yellow);color:#0d0d0c;font-weight:700}

/* Tables: the header row earns a tinted ground now that it is set in the
   squared face, and rows respond to the pointer. */
thead th{background:color-mix(in srgb,var(--yellow) 14%,transparent)}
tbody tr{transition:background-color .15s var(--ease)}
@media (hover:hover){
  tbody tr:hover{background:color-mix(in srgb,var(--yellow) 8%,transparent)}
}
</style>

/* ---------- theme ---------- */
/* localStorage throws outright on an opaque origin (data: URLs, some file://
   setups, private browsing). Unguarded, that exception kills the whole script
   before anything renders and the page comes up blank - so every access is
   wrapped and the theme simply falls back to the OS setting. */
function storeGet(k){ try { return localStorage.getItem(k); } catch (e) { return null; } }
function storeSet(k, v){ try { localStorage.setItem(k, v); } catch (e) { /* no-op */ } }

const saved = storeGet('wx-theme');
if (saved) document.documentElement.setAttribute('data-theme', saved);

/* Tint the page from the day being shown. Derived from the IMD band, so it
   tracks the actual forecast rather than a guess at "nice weather". */
function applyMood(){
  const days = (DAILY && DAILY.plainWeek) || (WEEKLY && WEEKLY.plainWeek) || [];
  const head = (days[0] && days[0].headline || '').toLowerCase();
  let mood = 'light';
  if (/^(dry|mostly dry)/.test(head)) mood = 'sunny';
  else if (/very heavy|extremely heavy/.test(head)) mood = 'severe';
  else if (/heavy/.test(head)) mood = 'heavy';
  else if (/moderate/.test(head)) mood = 'wet';
  else if (/light/.test(head)) mood = 'light';
  document.documentElement.setAttribute('data-wx', mood);
}
function toggleTheme(){
  const cur = document.documentElement.getAttribute('data-theme')
    || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
  const next = cur === 'dark' ? 'light' : 'dark';
  document.documentElement.setAttribute('data-theme', next);
  storeSet('wx-theme', next);
}

  const steps = 4;
  for (let i = 0; i <= steps; i++){
    const v = max * i / steps, yy = y(v);
    g += `<line class="gl" x1="${PL}" x2="${W-PR}" y1="${yy}" y2="${yy}"/>`;
    g += `<text class="tick" x="${PL-7}" y="${yy+3.5}" text-anchor="end">${
      v >= 10 ? v.toFixed(0) : v.toFixed(1)}</text>`;
  }
  g += `<line class="base" x1="${PL}" x2="${W-PR}" y1="${H-PB}" y2="${H-PB}"/>`;

  rows.forEach((r, i) => {
    const cx = PL + band * i + band / 2;
    const x = cx - bw / 2;
    const hh = Math.max(0, H - PB - y(r.v));
    if (r.v > 0){
      // 4px rounded data-end, square at the baseline
      const rr = Math.min(4, bw / 2, hh);
      const fill = r.fill || 'var(--series-1)';
      g += `<path d="M${x},${H-PB} L${x},${H-PB-hh+rr} Q${x},${H-PB-hh} ${x+rr},${H-PB-hh}
        L${x+bw-rr},${H-PB-hh} Q${x+bw},${H-PB-hh} ${x+bw},${H-PB-hh+rr}
        L${x+bw},${H-PB} Z" fill="${fill}"/>`;
    }
    if (r.label) g += `<text class="tick" x="${cx}" y="${H-PB+15}" text-anchor="middle">${esc(r.label)}</text>`;
    g += `<rect class="hit" x="${PL+band*i}" y="${PT-10}" width="${band}" height="${H-PT-PB+20}"
      data-tip="${esc(r.tip)}"/>`;
  });

  // label only the extreme, never every bar
  const peak = rows.reduce((a,b) => b.v > a.v ? b : a, rows[0] || {v:0});
  if (peak && peak.v > 0){
    const pi = rows.indexOf(peak);
    const cx = PL + band * pi + band / 2;
    g += `<text class="vlab" x="${cx}" y="${y(peak.v)-7}" text-anchor="middle">${
      peak.v >= 10 ? peak.v.toFixed(0) : peak.v.toFixed(1)}${opts.unit||''}</text>`;
  }
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(opts.aria||'')}">${g}</svg>`;
}

/* ---------- donut: share of a day's rain by time of day ----------------
   A pie/donut is only defensible for part-to-whole, at a glance, with few
   segments - which is exactly this: five ordered slices of one day's rain.
   It is NOT used for the nine-area comparison, where the values are close and
   numerous and a bar chart reads far better.
   The slices are an ORDERED ramp (dawn -> night), not categorical hues, and
   every value is repeated in the table beneath so nothing is gated behind
   colour or a hover. */
function donut(rows, opts){
  const W = 460, H = 260, cx = 130, cy = 130, r = 96, inner = 58;
  const total = rows.reduce((a, b) => a + b.v, 0);
  if (total <= 0){
    return `<p class="sub">No rain to break down for this day.</p>`;
  }

  let a0 = -Math.PI / 2, g = '';
  const GAP = 0.016;                       // surface gap between slices, in rad

  rows.forEach((r0, i) => {
    const frac = r0.v / total;
    if (frac <= 0) return;
    const a1 = a0 + frac * Math.PI * 2;
    const s = a0 + GAP / 2, e = Math.max(s, a1 - GAP / 2);
    const large = (e - s) > Math.PI ? 1 : 0;
    const p = (rad, radius) => [cx + radius * Math.cos(rad), cy + radius * Math.sin(rad)];
    const [x1, y1] = p(s, r), [x2, y2] = p(e, r);
    const [x3, y3] = p(e, inner), [x4, y4] = p(s, inner);
    g += `<path d="M${x1},${y1} A${r},${r} 0 ${large} 1 ${x2},${y2}
      L${x3},${y3} A${inner},${inner} 0 ${large} 0 ${x4},${y4} Z"
      fill="${r0.fill}"/>`;
    g += `<rect class="hit" x="0" y="0" width="${W}" height="${H}"
      style="pointer-events:none"/>`;
    a0 = a1;
  });

  // Hero figure in the hole - the number the chart is actually about.
  g += `<text x="${cx}" y="${cy - 4}" text-anchor="middle"
     style="font-size:26px;font-weight:660;fill:var(--text-primary)">${total.toFixed(0)}</text>`;
  g += `<text x="${cx}" y="${cy + 15}" text-anchor="middle"
     style="font-size:11px;fill:var(--muted)">mm total</text>`;

  // Legend: identity never rests on colour alone.
  rows.forEach((r0, i) => {
    const y = 26 + i * 21;
    const pct = total ? (r0.v / total * 100) : 0;
    g += `<rect x="266" y="${y - 9}" width="11" height="11" rx="3" fill="${r0.fill}"/>`;
    g += `<text x="284" y="${y}" style="font-size:12px;fill:var(--text-primary)">${esc(r0.label)}</text>`;
    g += `<text x="${W - 6}" y="${y}" text-anchor="end"
       style="font-size:12px;fill:var(--text-secondary);font-variant-numeric:tabular-nums">${r0.v.toFixed(1)} mm · ${pct.toFixed(0)}%</text>`;
  });

  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(opts.aria || '')}">${g}</svg>`;
}

/* ---------- heatmap: week x time of day -------------------------------- */
function heatmap(days, parts, cells, opts){
  const W = 980, LEFT = 96, TOP = 26, CH = 34, PAD = 4;
  const H = TOP + parts.length * CH + 16;
  const colW = (W - LEFT - 8) / days.length;
  const max = Math.max(...cells.flat(), 0.1);
  let g = '';

  days.forEach((d, i) => {
    g += `<text class="tick" x="${LEFT + colW * i + colW / 2}" y="${TOP - 10}"
       text-anchor="middle">${esc(d)}</text>`;
  });

  parts.forEach((p, r) => {
    const y = TOP + r * CH;
    g += `<text class="tick" x="${LEFT - 10}" y="${y + CH / 2 + 4}"
       text-anchor="end">${esc(p)}</text>`;
    days.forEach((d, c) => {
      const v = cells[r][c] || 0;
      const t = Math.min(1, v / max);
      // One hue, light->dark. Opacity carries magnitude against the surface,
      // so it reads correctly in both themes without a second palette.
      const op = v <= 0.05 ? 0 : 0.14 + t * 0.86;
      const x = LEFT + colW * c;
      g += `<rect x="${x + PAD / 2}" y="${y + PAD / 2}"
         width="${colW - PAD}" height="${CH - PAD}" rx="5"
         fill="var(--series-1)" fill-opacity="${op.toFixed(3)}"/>`;
      if (v <= 0.05){
        g += `<rect x="${x + PAD / 2}" y="${y + PAD / 2}"
           width="${colW - PAD}" height="${CH - PAD}" rx="5"
           fill="none" stroke="var(--grid)"/>`;
      }
      g += `<rect class="hit" x="${x}" y="${y}" width="${colW}" height="${CH}"
         data-tip="${esc(d + ' ' + p + ' — ' + v.toFixed(1) + ' mm')}"/>`;
    });
  });

  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(opts.aria || '')}">${g}</svg>`;
}

/* ---------- horizontal bars ---------- */
function hbars(rows, opts){
  const W = 980, RH = 34, PL = opts.labelWidth || 168, PR = 62;
  const H = rows.length * RH + 12;
  const max = Math.max(...rows.map(r => r.v), 0.1);
  let g = '';
  rows.forEach((r, i) => {
    const y = i * RH + 6;
    const bh = Math.min(24, RH - 12);
    const len = Math.max(0, (r.v / max) * (W - PL - PR));
    const rr = Math.min(4, bh / 2, len);
    g += `<text class="tick" x="0" y="${y+bh/2+4}" style="fill:var(--text-primary);font-size:12.5px">${esc(r.label)}</text>`;
    if (r.sub) g += `<text class="tick" x="${PL-10}" y="${y+bh/2+4}" text-anchor="end">${esc(r.sub)}</text>`;
    if (len > 0){
      g += `<path d="M${PL},${y} L${PL+len-rr},${y} Q${PL+len},${y} ${PL+len},${y+rr}
        L${PL+len},${y+bh-rr} Q${PL+len},${y+bh} ${PL+len-rr},${y+bh} L${PL},${y+bh} Z"
        fill="${r.fill || 'var(--series-1)'}"/>`;
    }
    g += `<text class="vlab" x="${PL+len+9}" y="${y+bh/2+4}">${esc(r.valLabel)}</text>`;
    g += `<rect class="hit" x="0" y="${y-4}" width="${W}" height="${RH}" data-tip="${esc(r.tip)}"/>`;
  });
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(opts.aria||'')}">${g}</svg>`;
}

function meter(rank){
  let s = '<div class="meter">';
  for (let i = 1; i <= 5; i++) s += `<i class="${i <= rank ? 'on' : ''}"></i>`;
  return s + '</div>';
}

/* ---------- weekly layout ---------- */
function renderWeekly(){
  const T = D.thresholds;
  let h = '';
  h += `<header>
    <div>
      <h1>Mumbai MMR — week ahead</h1>

  /* ---- area by area across the MMR ---- */

    h += `<div class="card"><h2>Across the MMR — area by area</h2>
      <p class="sub" style="margin:-6px 0 14px">The MMR is not one forecast.

      })), {labelWidth:230, aria:'Weekly rainfall by MMR area'})}

      ${D.areas.map(a => `<tr><td>${esc(a.name)}${a.home ? ' ★' : ''}</td>
        <td class="num">~${a.weekMm.toFixed(0)} mm</td><td>${esc(a.wettestDay)}</td>
        <td>${esc(a.plain)}</td></tr>`).join('')}
      </tbody></table></div>
      <div class="quote"><b>${esc(D.areas[0].name)}</b> takes about
        ${D.areas[0].weekMm.toFixed(0)} mm this week against
        ${D.areas[D.areas.length-1].weekMm.toFixed(0)} mm for
        <b>${esc(D.areas[D.areas.length-1].name)}</b> — across a region you can
        drive over in two hours. A single "Mumbai" number hides all of that.</div>
    </div>`;
  }


  h += trackHtml(D);

  /* ---- upstream drivers (Somali jet, mid-level dry air) ---- */
  if (D.upstream && D.upstream.available){
    const u = D.upstream;
    const jetTone = /very strong|strong/.test(u.jet) ? 'good'
                  : /weak/.test(u.jet) ? 'bad' : 'neu';
    const dryTone = /very dry|dry/.test(u.dry) ? 'bad'

    h += `<div class="card"><h2>Upstream drivers</h2>
      <p class="sub" style="margin:-6px 0 14px">The Somali jet decides how much

      <div class="dgrid">

      ${u.reading ? `<div class="dtext">${mdBold(u.reading)}</div>` : ''}

      if (!r.wet){

  h += `<div class="card"><h2>Orographic forcing — the spine of this outlook</h2>
